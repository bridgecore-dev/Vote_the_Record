caption: |-
  A bill on the U.S. House of Representatives schedule this week would move about 557 acres of Forest Service land in Shasta County, California, known as Four Corners.

  Before: the Forest Service runs it. After: the U.S. would hold it in trust for the Pit River Tribe, as part of the tribe's reservation, with no gaming. About 87 acres of roads, highways and rights-of-way are left out.

  The U.S. Senate committee report says about 100 people occupied the land in 1970, and the tribe has sought it since 2012. The CBO estimate wasn't in yet.

  Should Congress move federal land this way?
hashtags: [congress, publiclands, tribalnations, california]
notes: >-
  Split from the three-bill post (2026-11-16-federal-land-transfers-three-bills) at the owner's request: one
  bill per post, so similar bills aren't mistaken for each other. H.R. 8483 and H.R. 10136 get their own Reels.
  H.R. 2400's floor text is the Senate amendment (the House would agree to it); 557 is the Senate version, down
  from 583.79 in the House-passed version. The 87 acres left out, the 180-day survey, the 1970 occupation (about
  100 people, 26 arrested, 4 hospitalized) and "since 2012" are from S. Rept. 119-147. Interior and USDA testimony
  (S. Rept. 119-147) was on the companion S. 2871: Interior supported its goals, USDA supported it. CBO: S. Rept.
  119-147 says the estimate was requested but not received; congress.gov lists a 2025 CBO estimate for the
  earlier House version (cbo.gov blocked this run, not opened). Sponsor's party and state as the report lists
  them. Check for a House vote before 12:00 p.m. Nov. 16 (unlikely; votes usually start 6:30 p.m. Monday).
