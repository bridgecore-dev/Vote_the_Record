slides:
- kicker: 2027 Texas session · Filed Nov. 18, 2026
  big: 50%
  head: A Texas House of Representatives bill would cap city property tax breaks for data centers at half.
- chip: The law today
  head: A Texas city can agree to take part of a property's value off its tax bill, for up to 10 years, if the owner improves the property.
  quote: {label: Texas Tax Code 312.204(a), text: "to exempt from taxation a portion of the value of the real property or of tangible personal property located on the real property, or both, for a period not to exceed 10 years"}
  text: The property must be in a reinvestment zone. The section sets no top percentage.
- chip: What would change
  head: For data centers, a new limit.
  rows:
  - [Before, "A city's agreement sets the portion; no top percentage in 312.204"]
  - [After, "No more than 50% of the value that could otherwise be abated, in any year of the deal"]
  - [Data center, "A facility mainly for servers that process, store and send data, plus its equipment and land"]
- chip: Who it covers
  head: Only new deals, and only cities, as written.
  rows:
  - [New deals only, "Agreements made on or after the law takes effect"]
  - [Cities, "The limit is on a city's governing body (Sec. 312.204)"]
  text: Deals already signed would keep their terms.
- chip: Who gains, who pays
  head: A data center couldn't get more than half off under a new city deal. No cost estimate is posted yet.
  text: No fiscal note is listed on the bill's page, and the bill doesn't say how much tax money is involved.
- chip: What you can do
  head: Cities set their abatement rules in public.
  rows:
  - [Public hearing, "Required before a city adopts or changes its abatement guidelines (312.002)"]
  - [Online, "A city with a website must post its current guidelines"]
- chip: What's next
  big: Sept. 1, 2027
  head: If passed as filed, the bill takes effect on this date.
  text: "How we picked: every bill filed Nov. 18, 2026 whose caption is about data centers. HB 1225 was the only one. Should there be a cap?"
caption: |-
  Today, a Texas city can agree to take part of a property's value off its tax bill for up to 10 years, if the owner improves the property in a reinvestment zone. The section of law that allows it sets no top percentage.

  HB 1225, filed in the Texas House of Representatives for the 2027 session, would add a limit for data centers: a city could exempt no more than 50% of the value that could otherwise be abated, in any year of the deal. It applies only to new agreements, and as written, to cities.

  No cost estimate is posted yet. If passed as filed, it takes effect Sept. 1, 2027.

  Cities must hold a public hearing before adopting or changing their abatement guidelines, and post them online if they have a website.

  Should there be a cap?
