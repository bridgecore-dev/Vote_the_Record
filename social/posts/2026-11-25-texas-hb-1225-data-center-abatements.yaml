notes: >-
  New: filed Nov. 18, 2026; no earlier post covers it (the Nov. 14 data center post is about sales tax repeal bills, a
  different law, and isn't referenced). Rule: the Nov. 18 filing report's captions; HB 1225 is the only one naming data
  centers (TLO subjects: Data Centers; Taxation--City; Taxation--Property-Exemptions). Records opened 2026-11-19: the
  filing report, the bill history (filed, no other action; author listed only as "Herbert"), the introduced PDF (sha256
  0c716e9c8b21c97903451baa6ffb655955f7e7eb5e04e3639ce3e71d83e21575; adds 312.204(a-1), applies only to agreements on or
  after the effective date, effective Sept. 1, 2027), and Tax Code Chapter 312 (rendered from statutes.capitol.texas.gov:
  312.002, 312.204, 312.402). Please check: (1) "No top percentage in 312.204" is our reading of 312.204(a) ("a portion
  of the value"); other sections have their own limits (e.g., 312.211's 100/75/50/25% for voluntary cleanup property),
  not mentioned. (2) Counties: the new subsection names only "the governing body of a municipality", but 312.402(a-2)
  says county agreements' "execution, duration, and other terms" are governed by 312.204's provisions applicable to a
  municipality; whether the cap would reach county deals isn't stated, so the slide says "as written, cities" and
  doesn't claim counties are excluded. (3) "Who gains, who pays" restates the cap; no source states amounts or names who
  gains or loses, and no official statement for or against was found, so the post asks. Takes Nov. 25 9:00 a.m. (Nov. 19-23 base slots are full; Nov. 24 9:00 p.m. was skipped so this
  post's schedule check doesn't depend on another open pull request).
