bills:
- id: HB 1225
  does: Would bar a city from exempting more than half of a data center's abatable property value from taxes in any year.
  affects: Texas cities that make tax abatement deals, and owners or lessees of data centers seeking new ones.
  where: Filed Nov. 18, 2026 by Rep. Herbert; no other action yet.
  summary:
    text: >-
      the governing body of a municipality may not enter into an agreement under this section with the owner or lessee
      of property that is a data center to exempt from taxation more than 50 percent of the portion of the value of the
      property that is otherwise subject to abatement
    title: HB 1225 as filed (Sec. 1, Tax Code 312.204(a-1))
