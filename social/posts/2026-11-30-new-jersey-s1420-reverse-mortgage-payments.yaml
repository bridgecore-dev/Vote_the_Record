notes: >-
  News-first: an official action from the last three days (the Legislature's bill history, read through its own
  api/billDetail/billHistory/S1420/2026 feed on 2026-11-23: "11/20/2026 Approved P.L.2026, c.108."). Found through
  Open States' action feed (a tip only, not a source). It is the fourth of the four New Jersey laws approved Nov. 20;
  the other three (c.107, c.109, c.110) already have posts. Takes Nov. 30 3:00 a.m., the earliest post slot held by
  an evergreen post (every post slot Nov. 23-28 holds an action from Nov. 16-20); this pull request moves the
  prefiled Texas HB 1178 post to Dec. 18 3:00 a.m., the first post slot after the last queued post (Dec. 17 3:00 a.m.).
  The passed text is the technical-review version (T1; HTML sha256
  3bf9178d465db64bedc43c803d48b59fb7692cd203c7c1e0211de674db4fa9bf; PDF
  0f092f59db4db1041536efc099ac77c0ed3dad9dcd1f1d6393efb845c4410460); no reprint (R1) or fiscal estimate (E1) is
  posted (both 404). The bill cites "15 U.S.C. s.1602" without a subsection; the definition is now subsection (cc)
  (it was (bb) before Pub. L. 111-203 relettered it). "Before" quotes sec. 28(b) of P.L.2009, c.53 as printed in the
  bill; "what stays the same" is sec. 28(a), (c) and (d), which the bill leaves unchanged. The "affects" line
  restates the statute's scope (an instrument evidencing a secondary mortgage loan); the definition of "secondary
  mortgage loan" (17:11C-51) wasn't opened, so the slides say "second mortgage" as the committee statements do.
  The bill was substituted for an identical Assembly bill, which isn't named (one bill per post). Sponsors are listed
  by district, not party, so no party is shown. The P.L. chapter text isn't on pub.njleg yet (PL26/108 returned
  404). The governor isn't named because the record says only "Approved". Please check the "Your turn" question
  reads as neutral.
