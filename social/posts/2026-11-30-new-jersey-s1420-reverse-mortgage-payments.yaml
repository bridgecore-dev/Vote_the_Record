  head: A second-mortgage loan had to be paid off in equal installments, on equal periods of weeks or months.
  quote: {label: "N.J.S.A. 17:11C-78(b), before", text: "substantially equal payment periods, measured in terms of weeks or months, and, except as otherwise permitted, substantially equal installment payment amounts"}
- chip: What a reverse mortgage is
  head: A home loan that, unless the borrower defaults, isn't due until the home is sold, the owner moves out, or the owner dies.
  quote: {label: "15 U.S.C. 1602(cc)", text: "due and payable (other than in the case of default) only after— (A) the transfer of the dwelling; (B) the consumer ceases to occupy the dwelling as a principal dwelling; or (C) the death of the consumer"}
