caption: |-
  New Jersey dropped its equal-payments rule for reverse mortgages. S. 1420 was approved Nov. 20, 2026 as P.L.2026, c.108, and took effect right away.

  Before: state law said a second-mortgage loan had to be paid off in substantially equal installments, on substantially equal periods of weeks or months.
  Now: reverse mortgages are exempt from that rule. Federal law defines a reverse mortgage as a home loan that, unless the borrower defaults, comes due only when the home is sold, the owner moves out, or the owner dies.

  Other second mortgages still follow the rule, and every second-mortgage note still needs the same title and warning to the borrower.

  The committee statements give no cost estimate and no reason for or against. The New Jersey Senate passed it 35-0 and the General Assembly 76-0-0.

  Which side convinces you?
