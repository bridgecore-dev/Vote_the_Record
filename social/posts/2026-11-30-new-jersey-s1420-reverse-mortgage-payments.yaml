bills:
- id: S. 1420
  does: Exempts reverse mortgages from New Jersey's rule that second-mortgage loans be repaid in equal payments on a set schedule.
  affects: People taking out a reverse mortgage that is a secondary mortgage loan under New Jersey law, and their lenders.
  where: Approved Nov. 20, 2026 as P.L.2026, c.108; it took effect immediately.
  summary:
    text: >-
      This bill exempts reverse mortgage transactions from the requirement that secondary mortgage loan payments be
      made in equal amounts and payment periods.
    title: New Jersey Assembly Housing Committee statement to S1420, Oct. 5, 2026
    url: https://pub.njleg.state.nj.us/Bills/2026/S1500/1420_S2.PDF
    retrieved: '2026-11-23'
