notes: >-
  New: filed Nov. 20, 2026; the only bill on that day's filing report whose caption is about public employee collective
  bargaining. Records opened 2026-11-21: the filing report, the bill history (filed, no other action; subjects include
  City/County Government--Employees, State Employees, Labor--General), the introduced text (90R8006 MXM-F), Government
  Code ch. 617 and Local Government Code ch. 174 (both from tcss.legis.texas.gov). Before/after is read straight from the
  bill's bracketed (struck) words in 617.002, 617.003 and 617.005. "If the employer agrees" restates the bill's "may"
  (permissive, not required). The bill doesn't amend ch. 174, so the post says only that 174.202 is unchanged; it
  doesn't say how a court would read the two laws together. 617.004 (right to work) is untouched by the bill. "Who it
  affects" rows are our plain reading of the text; no fiscal note, analysis or statement for or against exists yet, so
  there's no case for/against slide and the post asks instead. Rep. Simmons as TLO lists the author, no party shown.
  Evergreen (a prefiled bill): Nov. 30 9:00 a.m. is the first post slot that keeps the Reel/post turn (Nov. 27-29 have
  no gap with a Reel on both sides).
