bills:
- id: H.Con.Res. 93
  does: "Directs the President to remove U.S. forces from hostilities against Iran unless Congress declares war or authorizes force."
  affects: "U.S. Armed Forces in hostilities against Iran. Forces needed to defend against imminent attack aren't covered."
  where: "Passed the U.S. House of Representatives 220-204 on Sept. 15, 2026. U.S. Senate vote set by Nov. 20."
  summary:
    text: >-
      This concurrent resolution directs the President to remove U.S. Armed Forces from hostilities against Iran
      unless explicitly authorized by a declaration of war or a congressional authorization for use of military
      force against Iran.
    title: Congressional Research Service summary of H.Con.Res. 93
    url: https://www.congress.gov/bill/119th-congress/house-concurrent-resolution/93
    retrieved: '2026-11-16'
slides:
- chip: "U.S. House of Representatives · Roll call 307"
  kicker: "Sept. 15, 2026 · On agreeing to the resolution"
  head: "The U.S. House of Representatives passed H.Con.Res. 93, directing the President to remove U.S. forces from hostilities against Iran."
  vote: {yea: 220, nay: 204, not_voting: 9}
  text: "It applies to U.S. Armed Forces in hostilities against Iran. The U.S. Senate is set to vote on it by Nov. 20."
- chip: How they voted
  head: By party, as the House Clerk records it
  rows:
  - [Republican, "7 Yea · 203 Nay · 8 didn't vote"]
  - [Democratic, "213 Yea · 0 Nay · 1 didn't vote"]
  - [Independent, "0 Yea · 1 Nay · 0 didn't vote"]
  text: "The smaller side, 204 Nay votes, is too long to list here. Every name is in roll call 307 on clerk.house.gov."
- chip: Before → after
  head: What would change if the U.S. Senate agrees
  rows:
  - [Now, "The President must end unauthorized hostilities after 60 days unless Congress authorizes them."]
  - [After, "Congress would direct the President to remove U.S. forces from hostilities against Iran."]
  - [Still allowed, "Forces needed to defend the U.S. or an ally or partner from imminent attack."]
  - [Cost, "Congress.gov lists no cost estimate for it."]
  by: "\"Now\" is the Congressional Research Service's reading of Section 5(b); the rest is the resolution's text."
- chip: The case for
  head: "The sponsor said the forces are going toward a war that has failed."
  quote: {label: "Rep. Moulton (D-MA), sponsor, Sept. 14, 2026 (Congressional Record, H5610)", text: "We should remove the troops and materiel that are going towards a war that has not only failed but backfired."}
- chip: The case against
  head: "Rep. Mast, who led the time against it, said Iran is an ongoing threat."
  quote: {label: "Rep. Mast (R-FL), Sept. 14, 2026 (Congressional Record, H5611)", text: "This is the continual threat, the imminent threat that Iran is and has been."}
- chip: Does it bind the President?
  head: "It's a concurrent resolution, so it isn't sent to the President to sign."
  quote: {label: "U.S. Senate, Types of Legislation", text: "they do not require the signature of the president and do not have the force of law"}
  text: "The Congressional Research Service notes a Supreme Court decision \"called into question\" whether the War Powers Resolution's concurrent-resolution section is constitutional."
- chip: Check it yourself
  head: "Look up how your representative voted, then watch the U.S. Senate."
  rows:
  - ["U.S. House of Representatives", "clerk.house.gov: Roll Call 307 (2026)"]
  - ["U.S. Senate", "senate.gov: roll call votes, 119th Congress, 2nd session"]
  text: "Which side convinces you?"
caption: |-
  How the U.S. House of Representatives voted on H.Con.Res. 93, the Iran war powers resolution, as the House Clerk records it.

  Sept. 15, 2026, roll call 307: passed 220-204, 9 not voting.
  Republican: 7 Yea, 203 Nay, 8 didn't vote.
  Democratic: 213 Yea, 0 Nay, 1 didn't vote.
  Independent: 0 Yea, 1 Nay.

  For: the sponsor, Rep. Moulton (D-MA). Against: Rep. Mast (R-FL). Their words are on the slides.

  It's a concurrent resolution, which the U.S. Senate's guide says doesn't need the President's signature and doesn't have the force of law. The U.S. Senate is set to vote on it by Nov. 20.

  Which side convinces you?
