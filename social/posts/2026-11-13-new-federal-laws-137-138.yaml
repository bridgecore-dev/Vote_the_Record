caption: |-
  Two new federal laws, both approved Nov. 3. Public Law 119-137 extends the authorization of the U.S. Commission on International Religious Freedom through Dec. 31, 2028. Public Law 119-138 reauthorizes the Accelerating Access to Critical Therapies for ALS Act through fiscal year 2031.

  Each law's purpose is quoted from its official text on GovInfo.
