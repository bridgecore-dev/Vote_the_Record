caption: |-
  Dec. 11, 2026: the new federal definition of hemp takes full effect, unless Congress changes it first.

  Before: under the 2018 farm bill, hemp is cannabis with no more than 0.3% delta-9 THC by dry weight. CRS says some read that to allow products with "significant amounts of other psychoactive compounds."

  After: the 0.3% limit counts total THC, including THCA. A product sold to consumers with more than 0.4 milligrams per container of THC and similar cannabinoids isn't hemp. Neither are cannabinoids made outside the plant. Those products are treated as marijuana under the Controlled Substances Act. Industrial hemp (fiber, grain, seed oil, microgreens, research) stays hemp.

  Timing: Public Law 119-37 made the change on Nov. 12, 2025. Public Law 119-103 kept only the ban on cannabinoids not found in the plant for Nov. 12, 2026, and put the rest off to Dec. 11.

  For: CRS says some, including attorneys general in several states, support the new definition and have aligned state laws with it. Against: CRS says some hemp industry groups oppose it and prefer regulation through agencies like FDA.

  Keep the date, delay it, or regulate another way? Tell us below.
