notes: >-
  Dated event (Dec. 11, 18 days out); no post or open pull request covers hemp. Not news-first (not within 3 days),
  so it takes the first free post slot, Nov. 28 3:00 p.m. (after the Nov. 28 noon Reel), and bumps nothing.
  Law text read this run on GovInfo: P.L. 119-37 div. B sec. 781 ("Effective 365 days after the enactment of this
  Act", enacted Nov. 12, 2025) and P.L. 119-103 sec. 2019 ("Until December 11, 2026, the amendments made by section 781
  ... shall only apply with respect to products described in paragraphs (1)(C)(ii)(I) and (1)(C)(iv)(I)", the
  not-naturally-produced cannabinoids). Slide 3's row labels paraphrase (1)(C)(i)-(iv); "In-between products" is our
  plain word for "intermediate hemp-derived cannabinoid products" (powder, liquid, tablet, oil, per new (3)(B)).
  The seeds row has no date because sec. 2019 doesn't keep it on Nov. 12; it starts Dec. 11 with the rest. "Before" and
  the case for/against are from CRS IF13136 version 5 (Sept. 28, 2026); both sides are CRS describing stakeholders, no
  named speaker. GovInfo's plaw feed (read this run) lists no law after P.L. 119-142, none on hemp, so the Dec. 11
  date stands today. api.congress.gov (this run): the two-year-delay and repeal bills CRS lists are all still at
  committee referral; not named (one bill per post). Please recheck before the slot that no law has moved Dec. 11
  again (a new funding law before Dec. 11 could carry one). FDA's cannabinoid lists (due 90 days after enactment;
  unpublished as of CRS's Sept. 28 update) are left off the slides because that status may have changed.
  "Who gains, who loses" is our plain reading of the exclusions; no source gives a cost. Found via a news story on
  bevnet.com; every claim rests on the laws and CRS.
