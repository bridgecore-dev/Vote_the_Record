slides:
- kicker: "Federal law · Dec. 11, 2026"
  big: "0.4 mg"
  head: "From Dec. 11, a hemp product with more than 0.4 milligrams of THC per container stops counting as hemp under federal law."
  text: "Congress changed the definition in Public Law 119-37 (Nov. 12, 2025). Public Law 119-103 put most of it off until Dec. 11, 2026."
- chip: "The THC test: before → after"
  head: "Hemp is cannabis with no more than 0.3% THC by dry weight. Which THC counts is what changes."
  rows:
  - [Before (2018 farm bill), "Counts only delta-9 THC"]
  - [After, "Counts total THC, including THCA (tetrahydrocannabinolic acid)"]
  quote: {label: "Congressional Research Service, IF13136", text: "products containing 0.3% delta-9 THC or less, and that may contain significant amounts of other psychoactive compounds, would not be considered marijuana and would legally be considered hemp"}
  by: "Public Law 119-37, sec. 781; CRS IF13136"
- chip: "No longer hemp"
  head: "The new definition leaves out these products:"
  rows:
  - [Cannabinoids not found in the plant, "Out since Nov. 12, 2026"]
  - [Plant cannabinoids made outside the plant, "Out from Dec. 11"]
  - [Products sold to consumers, "Out from Dec. 11 if over 0.4 mg per container"]
  - ["In-between products (oils, powders)", "Out from Dec. 11 if over 0.3%, or if sold to consumers"]
  - [Seeds, "Out from Dec. 11 if the plant tests over 0.3% total THC"]
  text: "The 0.4 mg counts THC plus cannabinoids with similar effects. A container is the package touching the product: a jar, can, packet or cartridge."
  by: "Public Law 119-37, sec. 781; Public Law 119-103, sec. 2019"
- chip: "What that means"
  head: "Products left out of the definition are treated as marijuana under federal drug law."
  quote: {label: "Congressional Research Service, IF13136", text: "products excluded by these provisions are not to be deemed hemp products and would instead be subject to regulation under the CSA as marijuana"}
  text: "The CSA is the Controlled Substances Act, the federal drug law. CRS gives gummies, drinks and candies as examples of the products sold today."
- chip: "Still hemp"
  head: "Industrial hemp stays hemp under the new definition."
  rows:
  - [Fiber and stalks, "Hemp grown for the stalk or its fiber"]
  - [Grain and seed oil, "Whole grain, oil, cake, nut and hull"]
  - [Microgreens, "Edible leaves from young plants"]
  - [Research, "Plants kept out of commerce at colleges and research institutes"]
  by: "Public Law 119-37, sec. 781, new 7 U.S.C. 1639o(2)"
- chip: "Who gains, who loses"
  head: "Products over the limits lose their legal status as hemp. That falls on the people who make, sell and buy them. Industrial hemp keeps its status."
  text: "None of the sources we read gives a cost figure for this change. CRS says it may affect hemp growers and the U.S. Department of Agriculture."
  by: "CRS IF13136"
- chip: "The case for"
  head: "CRS says some, including attorneys general in several states, want the new definition to start on time."
  quote: {label: "Congressional Research Service, IF13136", text: "stating general support for the new definition and that states have altered or aligned their laws and regulations with the new definition"}
- chip: "The case against"
  head: "CRS says some hemp industry groups oppose the change and want another approach."
  quote: {label: "Congressional Research Service, IF13136", text: "prefer regulation of hemp-derived consumer products through agencies like FDA"}
  text: "FDA is the Food and Drug Administration."
- chip: "Can it still change?"
  head: "Yes. Congress can change the date or the definition before Dec. 11."
  text: "Bills have been filed to delay it two more years or to repeal it (CRS). Dec. 11 is also the day temporary federal funding under Public Law 119-103 runs out."
