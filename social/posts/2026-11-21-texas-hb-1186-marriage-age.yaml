  "As Received" on page 2 (it looks like a refiled earlier bill); the slides rest only on the bill's text, and the
  author is Wooten as the history lists it. "Who loses" restates the bill's effect on minors with general emancipation
  orders (31.001's ages and self-support test); the sources don't give how many such marriages happen, so no number is
  given. "Sets no new fee or spending" restates the text, which has none. Today's Family Code doesn't say whether a minor
  in a void marriage can seek property division; the slide only says the bill adds that right. Takes Nov. 21 3:00 p.m.
  (post, after the 1:30 p.m. Reel), which leaves 7:30 p.m. (Reel) and 9:00 p.m. (post) open.
