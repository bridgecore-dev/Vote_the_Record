caption: |-
  Today, Texas voters show one of seven kinds of photo ID. A Texas driver's license, election ID certificate, personal ID card, U.S. military ID, handgun license or U.S. passport still counts up to 4 years after it expires. Voters 70 and older can use an expired one if it's otherwise valid.

  SB 444, filed in the Texas Senate for the 2027 session, would cut that to 1 year for everything except the passport, which stays at 4. A Texas driver's license, ID card or handgun license also wouldn't count if, when it was issued, the person wasn't a U.S. citizen, national, permanent resident, refugee or asylee.

  The rule for voters 70 and older doesn't change. No cost estimate is posted yet. If passed as filed, it takes effect Sept. 1, 2027, or right away with a two-thirds vote in each chamber.

  How long should an expired ID still count?
