  New: filed Nov. 19, 2026; no earlier post covers it. Rule: the Nov. 19 filing report has three election bills (SB 443,
  election clerks; SB 444; SB 445, county election officers' training); SB 444 is the only one about what a voter must
  show, and the other two could get their own posts. Records opened 2026-11-19: the filing report, the bill history
  (filed, no other action; author "Hall"; subjects include Elections--Registration & Suffrage), the introduced PDF
  (HTML not posted; 90R1388 JDK-D; sha256 f9311444c3d94643288ff91fc05fef3fb5ba16866b10dc78d9ea00e21468fbe9), and
  Election Code 63.0101 (rendered from statutes.capitol.texas.gov). The PDF text extraction loses underlining, so
  please check the "before/after" against the PDF: current (a)(1)-(5) all say "four years"; the bill's (a)(1), (2) and
  (5) say "one year" with "[four years]" bracketed as struck, and (4) (passport) keeps "four years". The noncitizen
  exclusion is written into (1)(A) driver's license, (1)(C) personal ID card and (5) handgun license, not the election
  ID certificate or military ID. "Seven photo IDs" counts the IDs named in current 63.0101(a). The bill doesn't amend
  (b)-(d). Takes Nov. 26's 9:00 a.m. post slot (Nov. 19-25 post slots are full).
