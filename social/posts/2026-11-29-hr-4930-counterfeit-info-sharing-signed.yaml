notes: >-
  New this run: the White House statement dated Nov. 23, 2026 (read 2026-11-24 UTC) says the President signed
  H.R. 4930 that day; congress.gov actions (API, read this run) end at "Presented to President." on Nov. 17, and
  GovInfo lists no Public Law yet (newest P.L. 119-142). No post or open pull request covers H.R. 4930. Before/after is
  from the enrolled text's amendments to 19 U.S.C. 1628a (sec. 1: "suspects" to "has a reasonable suspicion";
  packing materials and containers added; new (a)(3) nonpublic data from marketplaces, express consignment operators
  ("couriers" is our plain word), freight forwarders and others; (a)(4) notice "in accordance with such regulations as
  the Secretary may prescribe"; new (b)(5) "any other party with an interest"). The notice goes "to the person"
  receiving the data; the slide says only "give notice of what it sent". Cost: H. Rept. 119-415 sec. IV says no CBO
  estimate was made available in time and the bill "involved no new or increased budget authority"; congress.gov lists
  no CBO estimate. "Loses" is our plain reading that importers' data is shared more widely (no source states a loss);
  please check that wording. Committee vote 40-0 (report sec. III; no party totals given). Moore's quote is his own
  floor words; Schneider (the only other speaker) also supported it, so there is no official case against to quote.
  "Reasonable suspicion" quote is the committee report's sec. I.B. Party and state for Moore (sponsor) and Schneider
  (first cosponsor) as congress.gov lists them (6 cosponsors: 4 R, 2 D; not on a slide). Moore's "counterfeit notification act" is
  his name for it, not an official short title, so it isn't on a slide. Slot: Nov. 29 midnight, the first free Reel
  slot (Nov. 28 ends with a 9:00 p.m. post in pull request #294; Nov. 29's 3:00 a.m. post follows), not a design-trial
  slot, so no design change. It bumps nothing: every earlier Reel is news or a trial.
