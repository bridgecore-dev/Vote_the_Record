caption: |-
  On Nov. 23, the President signed H.R. 4930, on suspected fake and pirated imports.

  Before: when U.S. Customs and Border Protection suspected an import broke trademark or copyright law, it could share what appeared on the item, its packaging and labels. After: with a "reasonable suspicion," it can also share packing materials, containers, and nonpublic data from marketplaces, couriers and freight forwarders, with any other party with an interest, as Customs decides. It must give notice of the nonpublic data it sends.

  Gains: brand owners, marketplaces and shippers. Gives up: importers of suspected fakes, whose data is shared more widely. The committee report says no new budget authority; no CBO estimate was ready.

  Sponsor: Rep. Blake Moore (R-UT), with Rep. Brad Schneider (D-IL). Voice vote in the U.S. House of Representatives, unanimous consent in the U.S. Senate.

  Should Customs share this data when it only suspects fakes?

  Voice: computer-generated (Kokoro text-to-speech).
