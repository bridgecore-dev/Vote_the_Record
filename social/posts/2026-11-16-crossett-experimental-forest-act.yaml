caption: |-
  A bill on the U.S. House of Representatives schedule this week would give Arkansas the 1,685-acre Crossett Experimental Forest, in Ashley County, at no charge.

  Before: the Forest Service runs it; it has been a forest research site since 1934. After: Arkansas runs it as the Crossett Experimental State Forest, for research, education and demonstration, with the University of Arkansas. Arkansas pays the transfer costs, and the land can go back to the U.S. if it isn't kept for research.

  The committee report says Forest Service research there has dropped. The only Forest Service scientist there died in 2023, and the role hasn't been filled. The CBO estimate wasn't in yet.

  Should Congress move federal land this way?

  Voice: computer-generated (Kokoro text-to-speech).
