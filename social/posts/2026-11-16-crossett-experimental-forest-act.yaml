notes: >-
  Split from the three-bill post (2026-11-16-federal-land-transfers-three-bills) at the owner's request: one
  bill per post, so similar bills aren't mistaken for each other. H.R. 2400 gets a carousel, H.R. 8483 a Reel.
  1,685 acres, 1934, Ashley County, the staffing history, the 180-day request window, transfer costs, research
  records and the reversion clause are from H. Rept. 119-864 (reported text). CBO: the report says the estimate
  was requested but not received. Sponsor's party, state and "Chairman" as the report lists them. Check for a
  House vote before 4:30 p.m. Nov. 17; if it passed, the last slide needs the tally.
