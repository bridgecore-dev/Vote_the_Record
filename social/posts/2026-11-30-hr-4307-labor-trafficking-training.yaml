  title: Enhancing Detection of Human Trafficking Act
  does: "Requires the Labor Department to train its staff to spot human trafficking and refer cases, and to report yearly to Congress."
  affects: "Labor Department employees picked by the Secretary of Labor based on their official duties."
  where: "Signed into law Oct. 20, 2026 as Public Law 119-131."
