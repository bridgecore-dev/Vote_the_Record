notes: >-
  New this run: GovInfo's public-law feed posted P.L. 119-131 on Nov. 23, 2026 (approved Oct. 20, 2026, [H.R. 4307]);
  no post or open pull request covers it. Evergreen (signed more than a week ago), so it takes the empty Nov. 30
  9:00 p.m. post slot (after the 6:00 p.m. Reel; no bump). Facts: law text secs. 3-4; congress.gov actions (committee
  36-0 Jan. 8, House voice vote under suspension Mar. 3, Senate UC without amendment Sept. 30, signed Oct. 20);
  "44 human trafficking cases" (WHD, FY 2023), "cannot confirm ... annual basis", "does not directly provide
  information to Congress or the public", the six red flags and "not authorized by statute to undertake criminal
  prosecutions" are as H. Rept. 119-507 states them (it cites the DOJ FY 2023 trafficking report and a DOL page,
  neither opened this run). CBO (printed in the report, as ordered reported Jan. 8): training "would not affect the
  federal budget" because DOL already provides it; report "less than $500,000 ... over the 2026-2030 period",
  subject to appropriations. The CRS summary is of the reported bill and matches the enacted text. Rep. Adams's
  withdrawn amendment (a $10 million National Human Trafficking Emphasis Program) is not on a slide. No opposing
  view in the record (36-0, voice vote, UC), so no case against is invented; the "no recorded vote against" line
  rests on those three actions. Parties and states as congress.gov lists them.
