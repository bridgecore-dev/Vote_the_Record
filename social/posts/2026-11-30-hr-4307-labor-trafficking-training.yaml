caption: |-
  The U.S. Department of Labor has 180 days to start a human trafficking training program for its staff. The President signed H.R. 4307, the Enhancing Detection of Human Trafficking Act, on Oct. 20, 2026; GovInfo posted it as Public Law 119-131 on Nov. 23.

  Why Labor: its investigators go into workplaces. They can't prosecute, but they refer cases to the Justice Department. The Wage and Hour Division alone worked on 44 trafficking cases with law enforcement in fiscal year 2023, the U.S. House committee report says.

  Before: the division already trained its enforcement staff, but no law required it, and the department didn't report to Congress on the cases it referred.

  After: training is required for the staff the Secretary of Labor picks, covering how to spot victims and suspects and how to refer cases. Each year the department reports how many people were trained, how well it worked, and how many cases it referred.

  Cost: the Congressional Budget Office said the training adds no cost, since the department already does it, and the yearly report would cost under $500,000 over 2026-2030.

  It passed committee 36-0, the U.S. House of Representatives by voice vote, and the U.S. Senate by unanimous consent. Sponsor: Rep. Tim Walberg (R-MI).

  Should other agencies have to do the same?
