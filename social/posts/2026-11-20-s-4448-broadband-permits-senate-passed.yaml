caption: |-
  On Nov. 19, the U.S. Senate passed S. 4448, the Accelerating Broadband Permits Act, by unanimous consent.

  Today: BEAD is a $42.45 billion grant program for high-speed internet. States report to the Commerce Department every six months.

  After: those reports go online within 90 days, plus a public dashboard of each state's progress and a tool to track each project's federal permits. Broadband projects over $5 million that need an environmental review could get FAST Act permitting coordination (today the general bar is over $200 million).

  Who gives: states must use the permit tool; Commerce builds the tools. No CBO figure here (we couldn't open it).

  Sponsor: Sen. John Thune (R-SD). Cosponsors: Sen. John Barrasso (R-WY), Sen. Ben Ray Luján (D-NM).

  Would a dashboard help you check on projects near you?
