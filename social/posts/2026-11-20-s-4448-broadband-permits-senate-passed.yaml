notes: >-
  New this run: the Senate floor activity page for Nov. 19 lists S. 4448 "Passed Senate with an amendment by
  Unanimous Consent" with no floor S.Amdt., and congress.gov's actions (api, read 2026-11-20) show it was reported
  with a substitute (S. Rept. 119-158). The slides follow the engrossed text on GovInfo ("Passed the Senate November
  19, 2026"). No CRS summary yet, so the explainer quotes sec. 2(a). S. Rept. 119-158 isn't on GovInfo yet, and
  cbo.gov returned 403 (estimate: cbo.gov/publication/62861, as ordered reported July 22, 2026; not retried), so no
  cost figure and no committee "why" are on a slide. Current law is from GPO's 2024 U.S. Code: $42,450,000,000
  "authorized to be appropriated" (1702(b)(2)); semiannual state reports (1702(j)(1)(B)); "eligible entity" means a
  State (1702(a)); 270-day grant-or-deny rule for "an easement, right-of-way, or lease" (1455(b)(3)(A); "use federal
  property" is our plain wording); FAST Act covered project over $200,000,000 (4370m(6)(A)(i)). Please confirm no
  law since the 2024 edition changed these. We didn't claim the reports aren't public today: only that the bill
  adds a rule to post them. Unanimous consent, no roll call, and no statement against was found, so no case-against
  slide. Sponsor and cosponsor party and state as congress.gov lists them, cosponsors alphabetical. News first:
  takes the Nov. 20 3:00 p.m. post slot and moves the evergreen 2026-11-19-obbba-medicaid-renewals-retro-coverage
  to 2026-11-29T03:00:00-06:00 (Nov. 28's only post is at 3:00 a.m., so a later Nov. 28 post slot would put two
  posts in a row).
