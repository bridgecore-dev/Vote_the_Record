- id: S. 4448
  title: Accelerating Broadband Permits Act of 2026
  does: "Puts each state's BEAD broadband grant progress on a public website and adds tools to track federal permits for projects."
  affects: "States that get BEAD grants, their subgrantees, the Commerce Department, and federal agencies that handle permits."
