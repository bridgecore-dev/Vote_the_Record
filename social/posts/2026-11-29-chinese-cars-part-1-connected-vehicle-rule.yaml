caption: |-
  Part 1 of 3: what federal rules say about cars from China.

  A U.S. Commerce Department rule, in effect since March 17, 2025, covers "connected vehicles": cars that talk to networks over cellular, satellite or other wireless links. Most new cars do.

  Before: no federal ban like this. After: starting with model year 2027, connectivity and self-driving software from China or Russia is banned, and carmakers owned or controlled from China or Russia can't sell connected cars in the U.S. at all. Connectivity hardware follows with model year 2030.

  Every carmaker selling connected cars here has to check its suppliers and file a signed Declaration of Conformity. The department estimates the yearly checks cost $24,200 to $48,400 per company.

  Should the government decide where your car's software comes from?

