notes: >-
  Owner idea (part 1 of 3; parts 2 and 3 are their own pull requests and are meant to be merged together). Rests only
  on official records opened this run: the current rule text on eCFR (15 CFR 791.300-.308, Title 15 up to date as of
  Nov. 20, 2026; read through the eCFR API) and the final rule as published (GovInfo copy of 2025-00592; the
  federalregister.gov full text returned its "request access" page and was not retried). The Federal Register API
  lists no later amendment of subpart D. Effective March 17, 2025 (the rule's DATES). Bans: 791.303 (covered software,
  import and sale), 791.304 (carmakers "owned by, controlled by, or subject to the jurisdiction or direction of the PRC
  or Russia" can't sell connected cars with VCS hardware or covered software), 791.302 (VCS hardware import); dates
  from 791.308 exemptions (software and 791.304: vehicles before model year 2027; hardware: model year before 2030, or
  Jan. 1, 2029 for parts with no model year). "Owned or controlled from" shortens the rule's phrase; "tied to China or
  Russia" on slide 1 is the same shorthand; please check that wording. Covered software is VCS or ADS software
  ("self-driving" is our plain word for ADS). Examples: the rule's VCS hardware list and its VCS exclusions; the 10,000
  pound limit is in the connected vehicle definition. "Most new cars connect this way" restates the rule's intro
  ("Today's vehicles contain a myriad of connected components ... Wi-Fi, Bluetooth, cellular, and satellite
  connectivity"); please check it. Cost: the rule's yearly estimate per connected vehicle manufacturer or VCS hardware
  importer ($24,200 to $48,400). "Before: no ban like this" is our reading that the rule created subpart D. No brand
  is named: no official source opened names one, and the post doesn't say which brands are or aren't sold now. Slot: Nov. 29 noon, a free Reel slot after the 3:00 a.m. post;
  bumps nothing.
