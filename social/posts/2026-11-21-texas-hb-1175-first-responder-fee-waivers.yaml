bills:
- id: HB 1175
  does: Would waive state park entrance and hunting and fishing license fees for some long-serving or disabled first responders.
  affects: Texas resident firefighters, EMS, city police, sheriffs and constables with 20+ years' service or a duty disability.
  where: Filed Nov. 16, 2026 by Rep. Cortez; no other action yet.
  summary:
    text: >-
      The department shall waive the park entrance fee for a resident who is a first responder who: (1) has completed at
      least 20 years of continuous service as a first responder; or (2) has a disability connected to service as a first
      responder
    title: HB 1175 as filed, Sec. 1 (Parks and Wildlife Code 13.015(a-2))
    url: https://capitol.texas.gov/tlodocs/90R/billtext/html/HB01175I.htm
    retrieved: '2026-11-16'
slides:
- kicker: 2027 Texas session · Filed Nov. 16, 2026
  big: HB 1175
  head: A Texas House of Representatives bill would waive state park entrance and hunting and fishing license fees for some first responders.
- chip: The law today
  head: Texas must waive hunting and fishing license fees for two groups. First responders aren't one of them.
  rows:
  - [Must waive, "Veterans with a qualifying service-connected disability, and residents on active military or Guard duty"]
  - [May waive (park entrance), "People 70 or older, fifth graders, and 11-year-olds"]
  text: Parks and Wildlife Code 42.012, 46.004 and 13.015.
- chip: What would change
  head: The state would have to waive four fees for a resident first responder who qualifies.
  rows:
  - State park entrance fee
  - Resident hunting license fee
  - Resident fishing license fee
  - Annual resident combination hunting and fishing license fee
- chip: Who qualifies
  big: 20 years
  head: "A first responder with at least 20 years of continuous service, or a disability from that service: loss of use of a leg or foot, or a disability rating of 50% or more."
  text: "First responder, as the bill defines it: a certified firefighter, certified EMS personnel, a city police officer, a sheriff or deputy (including reserve), or a constable or deputy (including reserve)."
- chip: Who pays
  head: The state would collect these fees from fewer people. The bill doesn't say how much less.
  text: "Park entrance fees go to the state parks account (Parks and Wildlife Code 13.015(c)). No fiscal note (cost estimate) is posted yet. Licenses bought before the bill takes effect wouldn't be refunded."
- chip: What's next
  big: Sept. 1, 2027
  head: If passed as filed, the bill takes effect on this date.
  text: "How we picked: every bill filed Nov. 16, 2026 that would waive a state fee for a group of people (each gets its own post). Should first responders get the same waivers as disabled veterans?"
caption: |-
  Today, Texas must waive hunting and fishing license fees for veterans with a qualifying service-connected disability and for residents on active military or Guard duty. First responders aren't on that list.

  HB 1175, filed in the Texas House of Representatives for the 2027 session, would add resident firefighters, EMS personnel, city police officers, sheriffs and constables (and their deputies) who have served at least 20 years in a row, or have a qualifying disability from that service. The state would have to waive their state park entrance fee and their hunting, fishing and combination license fees.

  The state would collect less in fees; no cost estimate is posted yet. If passed, it takes effect Sept. 1, 2027.

  Should first responders get the same waivers as disabled veterans?
