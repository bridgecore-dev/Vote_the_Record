notes: >-
  New: filed Nov. 16, 2026. Rule: bills on the Nov. 16 filing report that would waive a state fee for a group of people;
  the bill on free birth records for homeless individuals (filed the same day) also fits and is left for its own post. Records opened 2026-11-16:
  the filing report, the bill history (filed, no other action; the Text page lists no fiscal note), the introduced text
  (90R4737 BEE-D), and Parks and Wildlife Code 13.015, 42.012, 46.004 and 50.002 (rendered from
  statutes.capitol.texas.gov). The current 42.012(b) and 46.004(c) waivers for veterans and active duty are "shall"; 13.015(a-1)
  for 70+, fifth graders and 11-year-olds is "may". The bill text replaces current 13.015(a-2) (promote visits and
  revenue) and re-adds it as (a-3)/(a-4) unchanged; the post doesn't mention that. "City police officer" is our plain word
  for the bill's "municipal police officer"; "leg or foot" for "lower extremity". No fee amounts are given: the statute
  sets minimums and the commission sets the actual fees. Rep. Cortez as TLO lists the author, no party shown. Takes the
  Nov. 21 9:00 a.m. post slot: Nov. 20's 9:00 p.m. slot would fail the alternation test until the HB 1177 Reel (#134) merges.
