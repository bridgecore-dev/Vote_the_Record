notes: >-
  Picked by the stated rule; H.R. 9269 gets a matching post. Other suspension bills this week are about one
  place, tribe, trail, forest or species, or set up something new (cormorant frameworks), so they don't fit the
  rule. "$84 million for 2027-2031" and the contractor rules are in the floor text (RH version, same as the
  report). These are authorization ceilings, not money spent; the slide says "the most Congress can spend".
  The report says the 2021 money was "in addition to annual appropriations". Cost: the committee had not
  received CBO's estimate; congress.gov lists one (https://www.cbo.gov/publication/62857), not opened because
  cbo.gov has blocked earlier runs. Cosponsor party counts are from congress.gov; Wittman's party and state as
  the report lists them.
