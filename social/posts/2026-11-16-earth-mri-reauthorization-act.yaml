caption: |-
  The U.S. Geological Survey runs a program called Earth MRI. It maps what's under the ground: rock, minerals like lithium, and water.

  Congress set it up in 2021 with up to $320 million for 2022 through 2026. H.R. 9640, on the House schedule this week, renews it through 2031 with up to $84 million. It also tells USGS to favor U.S.-owned contractors where it can, and makes every bidder disclose who owns it.

  The committee report says renewing the program matters for the country's supply of critical minerals. Rep. Jared Huffman, the committee's ranking member, backs the bill but writes that it renews "substantially less funding" than before, and points to a Senate bill that would keep $320 million.

  How much should this mapping get? Tell us below.

  Voice: computer-generated (Kokoro text-to-speech).
