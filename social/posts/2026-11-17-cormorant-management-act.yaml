notes: >-
  Picked by the stated rule; H.R. 9785 and H.R. 7254 get matching posts. The suspension text (dated Nov. 13)
  matches the reported text except it adds a definition of "State" that includes D.C. and the territories.
  Population, the 121,504 limit, the 2021 permit system, 1 lb/day and the $64.7M study are as H. Rept. 119-857
  states them (it cites FWS and a 2021 journal study). "Ends Jan. 1, 2034" is the bill's sunset subsection; the
  additional views call it a seven-year sunset. The report says the committee requested but did not receive a
  CBO estimate. Cosponsor parties from congress.gov. If the House passes it Nov. 16, the last slide needs the tally.
