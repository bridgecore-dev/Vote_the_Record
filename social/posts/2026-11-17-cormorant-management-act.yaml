  title: Responsible Cormorant Management and Control Act of 2026
  does: "Would have the Fish and Wildlife Service set regional rules for when and how cormorants may be killed or removed."
  affects: "Fish farms, lake and pond managers, state and tribal wildlife agencies, and the birds."
