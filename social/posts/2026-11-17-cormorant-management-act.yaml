caption: |-
  A cormorant eats about a pound of fish a day, a House committee report says. H.R. 8195, on the House schedule this week, would change how they are managed.

  Before: the birds are protected under the Migratory Bird Treaty Act. People apply each year for a federal permit to remove them; up to 121,504 may be taken a year.

  After: the Fish and Wildlife Service writes regional rules with the four flyway councils: methods, seasons, who may act (state and tribal agencies, licensed lake and pond managers), non-lethal steps, and a public yearly count. It must report on whether hunting licenses could work. The rules end Jan. 1, 2034.

  The report cites a 2021 study estimating $64.7 million a year in fish farm losses. Rep. Jared Huffman, the ranking member, wrote it "remains unclear" whether the birds are a significant threat in every region, and that the bill does not authorize hunting them.

  Federal or state officials: who should decide? Tell us.
