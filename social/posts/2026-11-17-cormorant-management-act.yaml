caption: |-
  A cormorant eats about a pound of fish a day, a committee report says. H.R. 8195, which the U.S. House of Representatives passed by voice vote Nov. 17, would change how they're managed.

  Before: they're protected under the Migratory Bird Treaty Act. People apply yearly for a federal permit to remove them; up to 121,504 may be taken a year.

  After: the Fish and Wildlife Service writes regional rules with the four flyway councils: methods, seasons, who may act (state and tribal agencies, licensed lake and pond managers), non-lethal steps, and a public yearly count of birds taken. The rules end Jan. 1, 2034.

  The report cites a 2021 study estimating $64.7 million in yearly fish farm losses. Rep. Jared Huffman (D-CA), the ranking member, wrote it "remains unclear" whether the birds are a significant threat in every region.

  Voice: computer-generated (Kokoro text-to-speech).
