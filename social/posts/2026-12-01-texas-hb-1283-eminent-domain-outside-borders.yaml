notes: >-
  New: filed Nov. 24, 2026; the only bill on that day's filing report (now 6 bills: HB 1282-1287; HB 1287 was added
  after the earlier run) whose caption names eminent domain. Records opened 2026-11-24: the filing report, the bill
  history (filed, no other action, no fiscal note; author listed as "Money", no party shown; subjects include Property
  Interests--Eminent Domain and CONDEMNATION), the introduced PDF (PDF sha256
  1b86281bd756351b2a8f87465013eadc1b6f38f652e4e40a9997a428cbc4d49e; 73 sections), Local Government Code 251.001(a) on
  tcss (today: "whether located inside or outside the municipality"; the bill's strike-through text reads "[, whether]
  located inside [or outside] the corporate boundaries", so its base text differs slightly from the tcss copy; please
  confirm), and Texas Constitution Art. 1, Sec. 17(a). "Still allowed by purchase or gift" rests on Sec. 16 (5010.0307(b)(1)
  keeps "by gift or purchase ... inside or outside") and Sec. 50 (8506.107(a) keeps purchase, lease, gift outside), plus
  Sec. 17 ("by means other than the exercise of the power of eminent domain"); the bill doesn't change every
  non-condemnation path, so the slide says "for example". "Reservoirs, pipelines and wells" are from Secs. 13, 14,
  18-21 and 45. "Dozens": about 65 sections amend specific laws, plus Sec. 71's repeals. The new
  limit names political subdivisions only; the post doesn't say anything about the State or private entities with
  eminent domain. No fiscal note or official statement for or against was found, so the post gives the record and
  asks. Source titles shortened after the first preview clipped the footer on slide 5. Evergreen (a prefiled bill): Dec. 1 9:00 a.m. is the first free post slot that keeps the Reel/post turn
  (Nov. 29 9:00 a.m. and Nov. 30 9:00 p.m. would put two posts in a row with the Reel slot before them empty).
