- kicker: 2027 Texas session · Filed Nov. 24, 2026
  big: Outside the lines
  head: Can a Texas city take your land if you don't live in that city? A Texas House of Representatives bill would say no.
  text: HB 1283 is about eminent domain.
- chip: Eminent domain
  head: Eminent domain is the government's power to take private property for a public use. The owner must be paid.
  quote:
    label: Texas Constitution, Art. 1, Sec. 17(a)
    text: No person's property shall be taken, damaged, or destroyed for or applied to public use without adequate compensation being made
- chip: The law today
  head: Texas law lets a city take property outside its city limits for a long list of uses.
  quote:
    label: Texas Local Government Code 251.001(a), today
    text: the municipality may exercise the right of eminent domain for a public use to acquire public or private property, whether located inside or outside the municipality
  text: The list includes city halls, fire stations, parks, streets, water works and sewage systems.
- chip: What would change
  head: HB 1283 adds one rule for every political subdivision in Texas.
  quote:
    label: HB 1283, Sec. 3 (new Government Code 2206.003)
    text: may not take through the use of eminent domain public or private property located outside the political subdivision’s boundaries
  text: It also rewrites dozens of city, county, airport and water district laws that now say "inside or outside".
- chip: What stays the same
  head: Some things wouldn't change.
  rows:
  - [Buying land outside, "Still allowed by purchase or gift, for example Secs. 16 and 50"]
  - [Taking land inside, "Still allowed, with pay"]
  - [Cases already filed, "The old law still applies (Sec. 72)"]
- chip: Who it affects
  head: Who gains a protection, and who loses a power.
  rows:
  - [Owners outside a border, "That city, county or district couldn't take their property"]
  - [Local governments, "Couldn't take property past their borders, including for reservoirs, pipelines and wells"]
