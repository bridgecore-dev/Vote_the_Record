bills:
- id: HB 1283
  does: Would bar Texas cities, counties and districts from using eminent domain to take property outside their own borders.
  affects: Owners of property outside a city's, county's or district's borders, and the local governments that can take it now.
  where: Filed Nov. 24, 2026 by Rep. Money; no other action yet. Would take effect Sept. 1, 2027.
  summary:
    text: >-
      Notwithstanding any other law, a political subdivision of this state may not take through the use of eminent
      domain public or private property located outside the political subdivision’s boundaries.
    title: HB 1283 as filed, Sec. 3
    url: https://capitol.texas.gov/tlodocs/90R/billtext/pdf/HB01283I.pdf
    retrieved: '2026-11-24'
