caption: |-
  Eminent domain is the government's power to take private property for a public use, with pay. Today, Texas law lets a city use it on property outside its city limits for a long list of uses, from fire stations and parks to water works.

  HB 1283, filed Nov. 24 in the Texas House of Representatives for the 2027 session, would end that. Cities, counties and districts could take property only inside their own borders. They could still buy land outside them.

  The bill rewrites dozens of city, county, airport and water district laws that now say "inside or outside", including ones for reservoirs, pipelines and wells. Condemnation cases filed before Sept. 1, 2027, the date it would take effect, would follow the old law.

  No fiscal note is posted yet. Should a Texas city or district be able to take land outside its own borders?
