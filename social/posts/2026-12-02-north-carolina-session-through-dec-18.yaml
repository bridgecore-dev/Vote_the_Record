caption: |-
  North Carolina's General Assembly is in its last scheduled stretch of the 2025 session. Under the adjournment resolution, both chambers were set to return at noon on Nov. 30, and the session is set to adjourn sine die, with no date set to return, on Dec. 18.

  The resolution limits what they can take up: veto overrides, election laws and district maps, proposed constitutional amendments, appointments, lawsuits over state laws, impeachment, and deals already in conference by Aug. 6.

  Overriding a veto takes three-fifths of the members present and voting in each chamber. A proposed constitutional amendment skips the governor and goes to the voters.

  Watch both chambers live from the Legislative Calendar on ncleg.gov. Which of these would you watch for?

  Voice: computer-generated (Kokoro text-to-speech).
