notes: >-
  Timely while the session runs: the ratified adjournment resolution (Resolution 2026-6, S1091v2.pdf, sha256
  26c7544156d02b5f20a31e821d298d65303e35f654ea934aa8fa1e112cdf2190), re-opened 2026-11-26: Section 5(a)
  reconvene Nov. 30 at noon, 5(b)(1)-(6) the allowed matters, Section 6 sine die Dec. 18. ncleg.gov's
  resolutions list shows 2026-6 as the latest adjournment resolution, and the Legislative Calendar (read
  2026-11-26) shows "Monday, November 30, 2026 12:00 PM House: Session Convenes House Stream ... Senate: Session
  Convenes Senate Stream". Written on Nov. 26, so slide 2 says the chambers "were set to return", not that they
  did. Slide 3 paraphrases 5(b): "Election laws and district maps" for 5(b)(2)d; "Leftovers" for 5(b)(4)
  conference reports (conferees appointed by Aug. 6) and 5(b)(5) bills returned for concurrence by Aug. 6; it
  leaves out 5(b)(3) organizational resolutions and 5(b)(6) further adjournment resolutions. The override and
  amendment slides are from N.C. Const. Art. II, Sec. 22(1) and (2), opened this run; the post doesn't say what
  majority an amendment needs (Art. XIII, not opened). No bill is named (one bill per post). A news search
  summary (Carolina Journal) pointed here. Slot: Dec. 2 6:00 a.m. Reel, the first slot that keeps the Reel/post
  turn on its own (Nov. 29's 6:00 and 9:00 a.m. slots only work if both are filled; Nov. 30 and Dec. 1 are full),
  so nothing is bumped. Trial look: palette forest, the only change from the baseline. BEFORE IT POSTS, check
  ncleg.gov for a later adjournment resolution that moved Dec. 18 (if the session already adjourned, delete the
  post).
