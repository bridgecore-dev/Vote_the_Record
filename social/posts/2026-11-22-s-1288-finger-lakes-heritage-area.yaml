notes: >-
  New this run: the Senate floor activity page for Nov. 19 lists S. 1288 "Passed Senate without amendment by
  Unanimous Consent"; the engrossed text on GovInfo matches the introduced text word for word. No CRS summary, so the
  explainer quotes sec. 2(a). The bill adds paragraph (14) to Dingell Act sec. 6001(a), so the rules in sec. 6001
  apply (P.L. 116-9, as opened on GovInfo): (b)(3) no federal funds to buy real property; (e) property owners not
  required to participate or allow public access, land use rules unaltered, no regulatory authority to the entity,
  state fish and wildlife authority not diminished; (g)(1) "$10,000,000, of which not more than $1,000,000 may be made
  available in any fiscal year" (authorized, "if Congress provides it"); (g)(3) federal share "not more than 50
  percent", and in-kind contributions count toward the rest. "Not a national park" is 54 U.S.C. 120102(c)(2)(A) (P.L.
  117-339): a heritage area "shall not be considered to be a System unit". P.L. 117-339 added paragraphs (7)-(13) to
  sec. 6001(a) and changed the (c)(1) plan deadline to 5 years for the original areas; this bill sets 3 years itself.
  I found no later change to sec. 6001(g); please confirm. cbo.gov returned 403 (estimate: cbo.gov/publication/62797),
  not retried. Reported without a written report; no statement for or against was found, and it passed by unanimous
  consent, so no case-against slide. Paired with the S. 4238 (Endless Mountains, Pennsylvania) Reel, same layout;
  meant to be merged together. News first: takes the Nov. 22 12:00 p.m. Reel slot from the evergreen
  2026-11-14-super-pacs-explained, which moves to 2026-11-30T06:00:00-06:00 (after the last queued post, Nov. 30 3:00
  a.m., if the S. 580 pull request merges; on its own, still a Reel after Nov. 29's 3:00 a.m. post on another day).
