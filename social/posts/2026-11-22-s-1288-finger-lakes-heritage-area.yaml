caption: |-
  On Nov. 19, the U.S. Senate passed S. 1288, the Finger Lakes National Heritage Area Act, by unanimous consent.

  Before: the Finger Lakes region isn't a National Heritage Area. A heritage area isn't a national park: a local group runs it, with help from the Interior Department.

  After: Cayuga, Chemung, Cortland, Livingston, Monroe, Onondaga, Ontario, Schuyler, Seneca, Steuben, Tioga, Tompkins, Wayne and Yates counties become one, run by the Finger Lakes Tourism Alliance. Up to $10 million in federal money in all, at most $1 million a year, if Congress provides it. Federal money pays at most half of any project and can't buy land. Property owners don't have to take part, and local land rules stay the same.

  Sponsor: Sen. Kirsten E. Gillibrand (D-NY). No cosponsors listed.

  Should Congress name more heritage areas?

  Voice: computer-generated (Kokoro text-to-speech).
