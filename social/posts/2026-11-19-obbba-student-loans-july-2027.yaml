bills:
- id: H.R. 1
  title: One Big Beautiful Bill Act
  does: "A 2025 budget law. For federal Direct Loans made on or after July 1, 2027, it ends two deferments and caps forbearance."
  affects: "People who take out federal Direct Loans on or after July 1, 2027, and borrowers with loans in default."
  where: "Signed into law July 4, 2025, as Public Law 119-21."
  summary:
    text: >-
      For Direct Loans made on or after July 1, 2027, P.L. 119-21 eliminates economic hardship deferment and
      unemployment deferment and limits the receipt of discretionary forbearance on such loans to no more than 9
      months during a 24-month period.
    title: "Congressional Research Service, R48727 (updated Jan. 8, 2026)"
    url: https://www.congress.gov/crs_external_products/R/HTML/R48727.html
    retrieved: '2026-11-15'
  say: "H.R. 1, the One Big Beautiful Bill Act, was signed into law July 4, 2025, as Public Law 119-21. For federal Direct Loans made on or after July 1, 2027, it ends two deferments and caps forbearance."
