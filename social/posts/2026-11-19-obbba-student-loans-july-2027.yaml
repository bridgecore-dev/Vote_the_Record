notes: >-
  Part of the "what changes in 2027" series on the One Big Beautiful Bill Act, the owner's request (2026-11-15).
  Please double-check: (1) The committee quotes (H. Rept. 119-106, Book 1) are about the House version (May 2025),
  which ended the deferments for loans disbursed on or after July 1, 2025; the law moved that to July 1, 2027. Both
  labels say "House version". (2) The minority's "less generous" quote is about the bill's new repayment options in
  general (sec. 82001 area), not the deferment section; it is the minority's strongest on-point line in the sheet.
  The "duplicative and unnecessary" words are from the same report's account of an amendment by Rep. Ilhan Omar
  (D-MN-05) to keep the deferments, defeated 14 ayes, 21 nays; the amendment is not on a slide. (3) CBO figures
  come from CRS R48727 (cbo.gov showed a captcha and was not used). CRS text gives FY2025-FY2034, but its Table 1
  header says FY2025-FY2035; check. CRS gives no reason the deferment cut raises outlays, so the slide gives none.
  (4) 82002 applies to loans "made under this part" (Direct Loans); the second rehabilitation (82003(a)) applies to
  "any loan made, insured, or guaranteed under title IV" from July 1, 2027, so slide 4 and the caption say "any
  federal student loan". The $10 minimum is for Direct Loans made on or after July 1, 2027. (5) No official count of
  affected borrowers was found. studentaid.gov is offered as where to ask about your loans; no studentaid.gov page
  on the 2027 changes was found, and it is not listed as a source. (6) The Education Department now calls the law the
  "Working Families Tax Cuts Act" (91 FR 23768); the post uses the enacted short title. Scott's party and state are
  as the report lists them ("D- VA-03").
