caption: |-
  One Big Beautiful Bill Act: what changes in 2027. On July 1, 2027, three student loan rules change for new federal Direct Loans made on or after that date. The second rehabilitation covers any federal student loan.

  Before: unemployment and economic hardship deferments, up to 3 years each; forbearance up to 12 months at a time; one rehabilitation, with payments as low as $5.
  After, for new loans: no unemployment or hardship deferment, forbearance capped at 9 months in any 24, and a $10 minimum rehabilitation payment.

  Cost (CBO, as CRS reports it): $280 million for deferment and forbearance, $115 million for rehabilitation, 2025-2034.

  For: the committee majority in the U.S. House of Representatives said it cuts complexity and protects borrowers and taxpayers. Against: Rep. Ilhan Omar (D-MN) moved to keep both deferments, and the committee voted it down 14-21; committee Democrats, led by Rep. Robert C. "Bobby" Scott (D-VA), also called the new repayment options less generous.

  Older loans keep both deferments. Questions: studentaid.gov

  Voice: computer-generated (Kokoro text-to-speech).
