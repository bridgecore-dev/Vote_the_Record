caption: |-
  Three House bills this week would move about 3,089 acres of federal land now run by the Forest Service or the Bureau of Land Management.

  Two would put land in trust for a tribe, as part of its reservation, with no gaming: about 557 acres for the Pit River Tribe and 847 for the Barona Band, both in California. The third gives Arkansas the 1,685-acre Crossett forest at no charge, if it stays a research forest. CBO estimates weren't in yet.

  Should Congress move federal land this way?
hashtags: [congress, publiclands, tribalnations, arkansas, california]
notes: >-
  Picked by the stated rule; H.R. 7954 and H.R. 9600 get their own posts. 3,089 = 557 (S. amendment) + 847 (CRS,
  H.R. 8483 as reported) + 1,685 (H. Rept. 119-864); all three are "approximately" in the sources, so the caption
  says "about". H.R. 2400's floor text is the Senate amendment (the House would agree to it); 557 is the Senate
  version, down from 583.79 in the House-passed version. Interior and USDA testimony (S. Rept. 119-147) was on the
  companion S. 2871 and supported its goals. CBO: H. Repts. 119-858 and 119-864 and S. Rept. 119-147 each say the
  estimate was requested but not received; congress.gov lists a 2025 CBO estimate for the earlier House version of
  H.R. 2400 (cbo.gov blocked this run, not opened). Sponsors' party and state as the reports list them. Check for a
  House vote before 7:30 a.m. Nov. 16 (unlikely; votes usually start 6:30 p.m. Monday).
