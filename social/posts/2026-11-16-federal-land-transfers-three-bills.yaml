bills:
- id: H.R. 2400
  title: Pit River Land Transfer Act of 2026
  does: "Would have the U.S. hold about 557 acres of Forest Service land in trust for the Pit River Tribe. No gaming allowed."
  affects: "The Pit River Tribe and the Forest Service land known as Four Corners, in Shasta County, California."
  where: "Passed the House Dec. 15, 2025, and the Senate, changed, Sept. 30. The House takes it up week of Nov. 16."
  summary:
    text: >-
      This bill takes approximately 557 acres of specified federal land in Shasta County, California, into trust
      for the benefit of the Pit River Tribe. The land, known as the Four Corners Property, is currently
      administered and managed by the Forest Service.
    title: Congressional Research Service summary of H.R. 2400 (as passed by the Senate)
    url: https://api.congress.gov/v3/bill/119/hr/2400/summaries
    retrieved: '2026-11-15'
- id: H.R. 8483
  title: Barona Group of Capitan Grande Band of Mission Indians Land Transfer Act of 2026
  does: "Would have the U.S. hold about 847 acres of federal land in trust for the Barona Band. Public access stays. No gaming."
  affects: "The Barona Band of Mission Indians and three parcels in San Diego County, California."
  where: "Approved by the House Natural Resources Committee by unanimous consent. On the House schedule week of Nov. 16."
  summary:
    text: >-
      This bill takes three parcels of specified federal land (approximately 847 acres) in San Diego County,
      California, into trust for the benefit of the Barona Group of Capitan Grande Band of Mission Indians of the
      Barona Reservation, California.
    title: Congressional Research Service summary of H.R. 8483
    url: https://api.congress.gov/v3/bill/119/hr/8483/summaries
    retrieved: '2026-11-15'
- id: H.R. 10136
  title: Crossett Experimental Forest Act of 2026
  does: "Would give the Crossett Experimental Forest to Arkansas at no charge, if it asks, to be kept for forest research."
  affects: "The State of Arkansas, the University of Arkansas at Monticello and the Forest Service."
  where: "Approved by the House Natural Resources Committee by unanimous consent. On the House schedule week of Nov. 16."
  summary:
    text: >-
      This bill directs the Forest Service, upon the request of the State of Arkansas, to convey the Crossett
      Experimental Forest, the R.R. Reynolds Research Natural Area, and associated facilities to the state.
    title: Congressional Research Service summary of H.R. 10136
    url: https://api.congress.gov/v3/bill/119/hr/10136/summaries
    retrieved: '2026-11-15'
