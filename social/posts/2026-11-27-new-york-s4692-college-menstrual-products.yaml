notes: >-
  News-first: an official action from the last three days (nysenate.gov and nyassembly.gov actions, read 2026-11-22:
  "11/20/2026 SIGNED CHAP.400"). Found through Open States' action feed (a tip only, not a source). Takes Nov. 27
  3:00 a.m., the earliest carousel slot held by an evergreen post that no other pending pull request takes (Nov. 26
  9:00 a.m. goes to the New Jersey A4835 post in its own pull request); this pull request moves the prefiled Texas HB
  427 post to Dec. 14 3:00 a.m. (Dec. 13 3:00 a.m. is taken by the SB 444 move in the A4835 pull request). The bill
  text is the only print (no amendments; "take effect immediately"). The memo's "before" (grades 6-12, public and
  private schools) is the sponsor's own description, so the slide says "the sponsor's memo says"; it wasn't checked in
  the statute. The memo calls the new section 267-b; the bill text adds 267-c (not shown). Senate vote (56-5, 2
  excused) from nysenate.gov; Assembly vote ("YEA/NAY: 123/17", 10 ER) from nyassembly.gov's floor votes, 17 No names
  as printed there. Neither record lists party, so none is shown. The Assembly companion bill it was substituted for
  isn't named (one bill per post). "The law gives no state money for it" means the text has no appropriation. Topic
  is Education; no case against was found in the records opened.
