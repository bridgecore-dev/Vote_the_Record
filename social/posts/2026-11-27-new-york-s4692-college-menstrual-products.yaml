caption: |-
  Private colleges and universities in New York must now provide free menstrual products in their restrooms. S. 4692 was signed Nov. 20, 2026 as Chapter 400 and took effect right away.

  Before: the sponsor's memo says state law already required free products in public and private school bathrooms for grades 6 to 12.
  Now: private colleges and universities too, at no charge to students.

  Who pays: the colleges. The law gives no state money for it, and the sponsor's memo lists the cost to the state as none. The records we opened don't say what public colleges must do.

  The New York State Senate passed it 56-5 and the New York State Assembly 123-17.

  Should private colleges have to provide these for free? Which side convinces you?
