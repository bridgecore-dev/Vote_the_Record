caption: |-
  The U.S. Senate voted 70-27 on Nov. 16 to end debate on a substitute for H.R. 2347, the Bipartisan American Affordability and Jobs Act of 2026 (vote 264). It needed 60 votes.

  Republican: 49 Yea, 2 Nay, 2 didn't vote.
  Democratic: 20 Yea, 24 Nay, 1 didn't vote.
  Independent: 1 Yea, 1 Nay.

  H.R. 2347 passed the U.S. House of Representatives as a tax bill. The substitute replaces its text with changes to federal permits and reviews, and keeps the tax change.

  For: Sen. Capito (R-WV). Against: Sen. Alsobrooks (D-MD).

  Which side convinces you?
hashtags: [ussenate, permitting, energy, rollcall, votetherecord]
rule: The 27 Nay votes are the smaller side, so every one is listed. For and against are the substitute's sponsor and the first Nay voter in the U.S. Senate's alphabetical list who published a statement on the bill.
notes: >-
