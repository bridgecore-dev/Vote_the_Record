caption: |-
  The U.S. Senate voted 70-27 on Nov. 16 to end debate on a substitute for H.R. 2347, the Bipartisan American Affordability and Jobs Act of 2026. It needed 60 votes.

  Republican: 49 Yea, 2 Nay, 2 didn't vote.
  Democratic: 20 Yea, 24 Nay, 1 didn't vote.
  Independent: 1 Yea, 1 Nay.

  H.R. 2347 passed the U.S. House of Representatives as a tax bill. The substitute replaces its text with changes to federal permits and reviews, and keeps the tax change.

  For: Sen. Capito (R-WV). Against: Sen. Alsobrooks (D-MD).

  Which side convinces you?
