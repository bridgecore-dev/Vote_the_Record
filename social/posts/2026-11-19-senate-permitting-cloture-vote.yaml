  smaller side is listed). The substitute's text and contents are from SA 6883 as printed in the Nov. 10 Record
  (S5471-S5600-ish, in the S5417 "Text of Amendments" granule); "kept as its last part" = Division C, sec. 3001.
  The House passage (voice vote, Apr. 27, 2026) is from the bill status XML. Capito's and Alsobrooks's words are
  from Nov. 9 (before the 73-25 motion-to-proceed vote), on the same bill; both voted the same way on vote 264.
  cbo.gov returned 403, so the CBO letter (listed in the bill status) is linked, not quoted. congress.gov returned
