notes: >-
  New this run: the White House statement dated Nov. 23, 2026 (whitehouse.gov, read 2026-11-24 UTC / Nov. 23 Central)
  says the President signed H.R. 1550 on Monday, Nov. 23; the two other bills in that statement (H.R. 4930, H.R. 8552)
  already have posts, and no post or open pull request covers H.R. 1550. congress.gov actions (API, this run) end at
  "Presented to President." on Nov. 12; no Public Law yet (GovInfo's newest posted Nov. 23 are lower-numbered laws).
  House: suspension, voice vote, May 13, 2025 (CR H1974); Senate: reported by ENR without written report, passed
  without amendment by unanimous consent Sept. 29, 2026 (CR S5140-5144, not read). Before/after and "changes nothing
  else" are from the two-section enrolled text. The 1927/1938 history and "turning point" are the floor speakers'
  words (Hoyle: "began efforts to preserve the battlefield in 1927, establishing a park known as the Saratoga
  Battlefield Park ... the site's name changed ... in 1938"; Westerman said the same), not an NPS page. "In 1777 ...
  defeated a British invasion force ... Burgoyne surrendered" restates Westerman's and Stefanik's floor words. CBO:
  congress.gov lists cbo.gov/publication/62172 (as ordered reported by Senate ENR, Feb. 4, 2026); cbo.gov returned
  403 (not retried), so no cost figure is on a slide. Every floor speaker (Westerman, Hoyle, Stefanik) supported it,
  so there is no case against to quote. Parties and states: Stefanik and Hoyle as the House Clerk's roll 327 XML lists
  them, names from congress.gov member records; Tonko (D-NY-20), the only cosponsor, from the bill record. News first:
  takes the Nov. 25 9:00 p.m. post slot, the first post slot at least 3 hours away held by an evergreen post (every
  earlier post slot holds this week's actions; the Nov. 25 3:00 a.m. H.R. 8454 post's Senate passage, Nov. 17, isn't
  yet a week old), and moves 2026-11-22-safe-cloud-storage-act (H.R. 7834, Senate passage Nov. 16, still not
  presented per congress.gov actions read this run) to 2026-12-21T03:00:00-06:00, the first post slot after the last
  queued post (Dec. 20 3:00 a.m.) that keeps each day's turns.
