caption: |-
  On Nov. 23, the President signed H.R. 1550, the Strengthening America's Turning Point Act.

  Before: the national park at the Saratoga battle site in Stillwater, New York, was Saratoga National Historical Park. After: it's Saratoga National Battlefield Park, and every U.S. law, map and record that uses the old name now means the new one. The law's text changes nothing else.

  New York State first called the site Saratoga Battlefield Park; members said in the House debate that the word was dropped when it became a national park in 1938.

  The U.S. House of Representatives passed it by voice vote on May 13, 2025, and the U.S. Senate by unanimous consent on Sept. 29, 2026, so there's no list of how each member voted.

  Sponsor: Rep. Elise Stefanik (R-NY), with Rep. Paul Tonko (D-NY).

  Does a name change how you see a place?
