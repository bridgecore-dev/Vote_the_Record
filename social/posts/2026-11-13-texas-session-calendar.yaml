caption: |-
  The Texas Legislature's 2027 regular session starts at noon on Tuesday, Jan. 12. Its last day is May 31.

  One big job in those months: writing the state budget for the next two years, which starts Sept. 1, 2027.

  Want to know who speaks for you in Austin? Enter your address at Who Represents Me on capitol.texas.gov. Lawmakers have been able to file bills for this session since Nov. 9.
