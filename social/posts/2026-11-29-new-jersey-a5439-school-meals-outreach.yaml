- kicker: New Jersey · New law, Nov. 20, 2026
  big: $375,000
  head: New Jersey now requires part of its free school meal money to go to telling families they may qualify.
  text: The law, P.L.2026, c.110, took effect right away. It applies to the state Department of Agriculture, which runs the program.
- chip: The program
  head: The Working Class Families State Supplement pays for free school breakfast and lunch for more families.
  text: It covers households earning between 186% and 224% of the federal poverty level, which the committee calls working class and middle-income families.
  quote: {label: Senate Budget and Appropriations Committee, text: "supports expanded eligibility for the free school breakfast and lunch program for working class and middle-income families"}
