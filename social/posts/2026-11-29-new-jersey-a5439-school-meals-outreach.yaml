caption: |-
  New Jersey now requires $375,000 of its free school meal supplement to go to outreach. The law, P.L.2026, c.110, was approved Nov. 20, 2026 and took effect right away.

  The Working Class Families State Supplement pays for free school breakfast and lunch for households earning between 186% and 224% of the federal poverty level.

  Before: the 2027 budget law gave the program $15 million.
  After: 2.5% of that, $375,000, must pay for information and outreach "to increase awareness of the program." No new money is added, so $14,625,000 is left for the rest.

  Cost: the Legislature's records say the bill needed no fiscal note.

  The New Jersey General Assembly passed it 58-16 (1 abstain) and the Senate 36-2.

  Should program money pay to tell people the program exists? Which side convinces you?
