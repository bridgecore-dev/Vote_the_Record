notes: >-
  News-first: an official action from the last three days (the Legislature's bill history page, rendered on
  2026-11-22: "11/20/2026 Approved P.L.2026, c.110."). Found through Open States' action feed (a tip only, not a
  source). Takes Nov. 29 3:00 a.m., the earliest post slot held by an evergreen post (Nov. 23-28 post slots all hold
  news from Nov. 16-20); this pull request moves 2026-11-18-criminal-history-access-act (presented Nov. 12, more than a
  week old) to Dec. 17 3:00 a.m., the first post slot after the last queued post (Dec. 16 3:00 a.m.) that keeps the
  Reel/post turn. The bill passed as introduced (no reprint; the history lists no amendments), so the introduced text
  is the enacted text (HTML sha256 c99c1ca0303b5ed1dba9f48ae18c6c3fd531d7a40a667a1886657f1503ae7a60; PDF
  221851279fa1c6930290509eb550172ab14670b53c45d03c2432054c24d77744). $15 million, $375,000, 2.5% and 186%-224% are from
  both committee statements; $14,625,000 is $15 million minus $375,000 (our arithmetic). "No new money" rests on the
  bill's "Of the amount hereinabove appropriated". "Before" says only what the budget gave, not that no outreach was
  done before. The builder's bill-number check doesn't take New Jersey Assembly
  numbers (A5439), so, like the A4835 post, the slides name the chapter and say what it does, who it affects and where
  it stands. It has an identical Senate bill, which isn't named (one bill per post). Votes as the bill history
  prints them; NJ roll calls don't list party, so none is shown. No floor statements or testimony were opened, and no
  official case for or against was found. The P.L. chapter text isn't on pub.njleg yet (PL26/110 returned 404).
  The governor isn't named because the record says only "Approved".
