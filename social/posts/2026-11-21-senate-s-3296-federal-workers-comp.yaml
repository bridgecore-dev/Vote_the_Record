caption: |-
  Today, a federal worker hurt on the job gets workers' comp care that a "physician" orders, and the claim comes with a physician's certificate. The law's list of who counts as a physician doesn't include nurse practitioners or physician assistants.

  S. 3296, which passed the U.S. Senate by unanimous consent on Nov. 16, 2026, would change that. Nurse practitioners and physician assistants could prescribe care and sign the injury certificate, within what state law lets them do.

  The sponsor, Sen. Susan Collins (R-ME), said injured workers in rural areas wait to see a physician first, and that the Congressional Budget Office found "an insignificant net effect on direct spending." The U.S. House of Representatives would have to pass it too.

  Should workers' comp follow state rules on who can treat you?

