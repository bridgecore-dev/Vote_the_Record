notes: >-
  New: the Senate Press Gallery's Nov. 16 wrap-up lists S. 3296 "passed by unanimous consent"; GovInfo has the
  engrossed text ("Passed the Senate November 16, 2026"); congress.gov's actions don't show the passage yet. Same rule
  as the Nov. 19 H.R. 2302 story (that post's notes leave H.R. 7834 for the owner's call on wording). No CRS summary
  exists, so the bill's summary quotes the engrossed long title. "Today" is the 2024 U.S. Code edition (8101(2) list,
  8103(a) "prescribed or recommended by a qualified physician", 8121(6) certificate, 8123(a) exams), and the bill amends
  each of those places. "Why" and the CBO line are Sen. Collins's words in her introductory statement; cbo.gov returned
  403 (CBO estimate: cbo.gov/publication/62726, as ordered reported Aug. 6, 2026), so its numbers aren't on a slide.
  Who loses isn't stated in any source opened; the slide says we found no statement against it (unanimous consent).
  Sponsor and cosponsor parties as congress.gov lists them (10 cosponsors: 8 D, 2 R; not on a slide). Takes the free
  Nov. 21 1:30 p.m. Reel slot (after the 9:00 a.m. post). Nov 17 fix: shortened source titles so the cover's
  source footer fits (the first preview clipped it).
