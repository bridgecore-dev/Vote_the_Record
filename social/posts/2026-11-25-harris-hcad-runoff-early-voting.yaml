caption: |-
  Harris County has one more election this year: a runoff for Harris Central Appraisal District Director, At-Large, Place 3.

  The Dec. 12 ballot lists Ericka McCrutcheon and Jesus Nieto. Early voting runs Nov. 30 to Dec. 8. The deadline to apply for a ballot by mail is Dec. 1. Election Day is Dec. 12, 7 a.m. to 7 p.m.

  The appraisal district sets the value of property for property taxes. Under the Texas Tax Code, three of its nine directors are elected countywide by majority vote. The board appoints the chief appraiser.

  Hours and vote centers: harrisvotes.com.
