notes: >-
  New: filed Nov. 16, 2026. Same rule as the HB 1175 post (2026-11-21-texas-hb-1175-first-responder-fee-waivers), whose
  notes flagged this bill as fitting and left for its own post. Records opened 2026-11-17: the Nov. 16 filing report, the
  bill history (filed, no other action; the Text page lists no fiscal note file), the introduced text, Health and Safety
  Code 191.0049 and Transportation Code 521.1015, 521.1811, 521.422, 521.4265 and 521.008 (rendered from
  statutes.capitol.texas.gov). Today's waivers use "homeless child or youth" as defined in 42 U.S.C. 11434a, which wasn't
  opened, so the post gives no ages for it. "Who counts" paraphrases the bill's new 191.00495(a); "local police agency" is
  our plain word for "a law enforcement agency of a political subdivision"; the proof list also includes HUD-funded
  emergency shelters and transitional housing. The account (521.4265) is funded by grants and donations, including $1
  donations on license applications (521.008); the bill adds 521.184 to the waivers paid from it and to the "no money, no
  exemption" rule in (c)(2). The bill's birth-record waiver has no funding source, so "doesn't replace them" restates that
  it adds none. Today's ID waivers also cover victims of dating or family violence (521.1016, 521.1811), hence "a few groups, including". The no-address rule for licenses and IDs (new 521.184(d)) applies "to the extent permitted under federal law". The driver's-license fee is left off because it varies by license type. Rep. Bhojani as TLO lists the
  author, no party shown, the same as other Texas filing posts. Takes Nov. 21 7:30 a.m. (Reel, before the 9:00 a.m. HB 1175 post). Nov 17 fix: shortened source titles so the cover's source footer fits (the first preview clipped it).
