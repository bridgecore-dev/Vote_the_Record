caption: |-
  Today, Texas gives free birth certificates and state IDs to a few groups, including a homeless child or youth and foster youth. Most people pay: a state ID card is $15 under age 60.

  HB 1162, filed in the Texas House of Representatives for the 2027 session, would make a birth certificate, driver's license or state ID free for any person who is homeless, as the bill defines it, with no age limit. A letter from a shelter, a transitional living program or a local police agency could prove it, and no home address would be required (for licenses and IDs, as far as federal law allows).

  The free licenses and IDs would be paid from a state account of grants and donations, as today's waivers are; if the account runs dry, the waiver stops. Birth certificate offices would collect fewer fees. No cost estimate is posted yet. If passed, it takes effect Sept. 1, 2027.

  Should adults get the same free IDs as homeless youth?

