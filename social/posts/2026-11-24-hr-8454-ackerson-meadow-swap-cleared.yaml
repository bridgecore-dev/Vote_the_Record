caption: |-
  Congress has passed H.R. 8454. On Nov. 17 the U.S. Senate passed the House's bill without changes, by unanimous consent. The U.S. House of Representatives passed it by voice vote Sept. 14.

  Before: Yosemite National Park and Stanislaus National Forest own land in a checkerboard across Ackerson Meadow, in Tuolumne County, California. Cattle graze land the Park Service now manages.

  After: about 160 acres of national forest join Yosemite, and about 170 acres of Yosemite join the national forest, which allows grazing under its multiple-use plan. All of it stays federal, and existing rights and permits stay. The House report says the CBO estimate wasn't in yet.

  Sponsor: Rep. Tom McClintock (R-CA). Next it goes to the President (status as of Nov. 19).

  Should Congress redraw park and forest lines this way?
