notes: >-
  New this run: the Clerk's Nov. 18 floor log (4:27 p.m.) says "The Senate passed H.R. 5254 and H.R. 8454";
  congress.gov actions (API, read 2026-11-19): "Passed Senate without amendment by Unanimous Consent.
  (consideration: CR S5709)" on Nov. 17. The Senate passed the placed-on-calendar text, which is the House
  engrossed text. No presentment is listed yet; if it is signed or vetoed before the slot, update the last slide
  or delete this file. Acres (160, 170, "roughly 330"), Tuolumne County and the map name are from the engrossed
  text and H. Rept. 119-777; "largest intact meadow systems", the grazing permit (Erickson Cattle Company, not
  named on a slide), the checkerboard reason and "does not increase the federal estate" are as the report states
  them. The grazing / multiple-use line is from the CRS summary's background. The CRS summary is of the
  introduced bill; the House-passed substitute dropped the introduced bill's hazardous-substances subsection,
  but the quoted sentence still describes the passed text. Sponsor's party and state as congress.gov lists them;
  congress.gov lists no cosponsors. No opposing view in the record (committee unanimous consent, no recorded
  votes). Pairs with the 10:30 a.m. Reel (2026-11-24-hr-5254-gateway-arch-events-cleared).
