- id: H.R. 8454
  does: "Swaps about 160 acres of national forest into Yosemite and about 170 acres of Yosemite into Stanislaus National Forest."
  affects: "Ackerson Meadow in Tuolumne County, California, the two agencies, and the ranch that grazes cattle there."
  where: "Passed the U.S. House of Representatives Sept. 14; the U.S. Senate, unchanged, Nov. 17. Next: the President."
  summary:
    text: >-
      This bill exchanges administrative jurisdiction over specified parcels of federal land between Yosemite
      National Park and Stanislaus National Forest in California.
