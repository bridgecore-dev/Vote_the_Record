caption: |-
  The U.S. Senate passed H.R. 2302 by unanimous consent on Nov. 16, 2026. The U.S. House of Representatives passed it by voice vote on Dec. 9, 2025.

  Before: about 80 acres in El Dorado County, California, are federal land run by the Bureau of Land Management, and about 185 acres, Indian Creek Ranch, belong to the Shingle Springs Band of Miwok Indians. After: the U.S. would hold all of it in trust for the tribe, as part of its reservation. Gaming would not be allowed there.

  The Senate committee report says the tribe is short of land for housing. CBO estimates it would cost under $500,000 to carry out over 2026-2031, and that state and local governments would lose under $100,000 a year in taxes they could no longer collect on the land.

  Should Congress put land in trust this way?
