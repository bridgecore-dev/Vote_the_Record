notes: >-
  New this run: the Senate Press Gallery's Nov. 16 wrap-up lists H.R. 2302 "passed by unanimous consent";
  congress.gov's actions don't show it yet (latest: Sept. 22 calendar). The Senate report recommends passing it
  without amendment, but the Nov. 16 Record wasn't on GovInfo yet, so the post doesn't claim it went to the
  President: please check the Nov. 16 Record or congress.gov for "without amendment" before the slot; if so, the
  last slide can say it goes to the President. The CRS summary on congress.gov is of the introduced bill (204.14
  acres); the House passed it amended (80 + 185 = about 265 acres in the engrossed text), so the summary quoted is
  the Senate report's, which matches the passed text. CBO's "approximately 200 acres" in the report is left off.
  Cost, lost taxes, 582 members, 160 acres and the housing plan are as S. Rept. 119-150 states them (the last three
  from the chairwoman's testimony it cites). Sponsor's party and state as the report lists them. H.R. 7834 (same
  rule) isn't written yet: its subject (cloud storage of child sexual abuse material for law enforcement) needs
  the owner's call on wording for Instagram.
