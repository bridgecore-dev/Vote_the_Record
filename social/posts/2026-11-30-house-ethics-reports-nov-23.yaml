caption: |-
  On Nov. 23, 2026, the House Ethics Committee released reports on three members of the U.S. House of Representatives. It adopted all three on Nov. 19.

  Rep. Mike Collins (R-GA): the committee found his office improperly paid a woman $10,000 as an intern and accepted unpaid work from her. Collins said it was a classification issue, "not fictitious employment." $2,880 goes back to the U.S. Treasury, and the matter is closed. The committee also recommends the House hold his former chief of staff, Brandon Phillips, in contempt of Congress for not answering a subpoena.

  Rep. Jimmy Gomez (D-CA): the committee found substantial evidence of unwelcome sexual advances and sexual contact toward a House staffer. Gomez admitted the contact and said it was consensual. He lost his re-election bid; the committee left any sanction to the full House.

  Rep. Troy Nehls (R-TX): the committee found he improperly used a company he owned as a political committee. Nehls disputes parts of the report. The report is a reproval, and the matter is closed.

  These are every report the committee released that day, in alphabetical order. Party and state as the House Clerk lists them.
