notes: >-
  New this run: the Congressional Record Daily Digest for Nov. 24 (read 2026-11-25) lists four Ethics Committee reports filed that day:
  H. Rept. 119-896 (Gomez), 119-897 (contempt report, Brandon Phillips), 119-898 (Nehls), 119-899 (Collins). The committee's site posted
  all four on Nov. 23; the reports say they were adopted Nov. 19. No post or open pull request covers them. Rule: every report released
  that day, alphabetical by surname, same layout (finding, the member's response, result) for each. PDF sha256: Collins
  3a3be13571c7c1ab47106b4b94c73b48c5d9a7bc4bea048b8597b5de443f22b5, Gomez 5488f45600d7ca069cba6dde8c040ea25df4b2bccb2348ccbf9c875273dcaafd,
  Nehls fae6d6c9fc43b2e47f46b4dd332b5aaeabb777818c931339b4bdb92968db25d1 (the PDFs print "119-_"; the numbers are from the Daily Digest).
  Please check: (1) Collins "He said" shortens counsel's "an issue of employment classification and administration, not fictitious
  employment"; "Also found" restates "did not exercise sufficient oversight over Mr. Phillips"; the romantic-relationship and
  not-directly-involved lines are from the report's introduction and conclusion; $2,880 is from the conclusion. Phillips: the
  committee's Nov. 23 statement ("recommends the House of Representatives adopt a resolution holding Brandon Phillips in contempt").
  (2) Gomez: "admitted to making 'sexual contact' with her but insisted this encounter was consensual" (intro); "lost his bid for
  re-election" and "not enough time for it to pursue an adequate House sanction ... so that the House may determine, in its judgment,
  whether to sanction" (sec. V). Kept to the committee's general words; no details of the incidents. (3) Nehls: finding from the
  introduction; "disputes certain other suggestions in the report on both factual and legal grounds" from his counsel's response
  quoted in the procedural history; "did not find ... knowing or willful errors" on disclosures (intro); "this Report ... will serve
  as a Reproval ... the Committee considers this matter closed." (4) "How it works" restates Committee Rule 24(c)-(g) and House Rule
  XI cl. 3(a)(1) (printed in the committee's rules). Party and state from the Clerk's MemberData.xml. No House vote on the contempt
  resolution was checked for after Nov. 24; recheck before the slot. News first: takes the Nov. 30 9:00 p.m. post slot from the
  evergreen H.R. 4307 post (signed Oct. 20), moved to Dec. 25 3:00 a.m., the first free post slot after the last queued post (Dec. 24
  3:00 a.m.). Every earlier post slot holds news from Nov. 17-24 or a dated event (hemp, Dec. 11).
