notes: >-
  New: filed Nov. 23, 2026 (TN bill page: "Filed for introduction 11/23/2026", no other action; "No fiscal note
  for this bill"; "Summary not complete"; sponsor "*Baum"). First Tennessee post. Rule: the official 2027-2028
  index lists HB 1-20 and SB 1-8 (plus HJR 1-3); captions were scanned through Open States (a tip, mirroring the
  official captions) and HB 18 is the only one naming TennCare. Records opened 2026-11-27: the bill page, the bill
  index, the introduced PDF (capitol.tn.gov/Bills/115/Bill/HB0018.pdf, 4 pages, sha256
  9fb07b8b4f4c4d2f34a612495169b04092942d1ca830623c2071021fd41f84f9), and ASPE's 2026 poverty guidelines ($15,960
  for one, $33,000 for four; x1.38 = $22,025 and $45,540, rounded on the slide and labeled our math; the program
  wouldn't start before 2028, when guidelines will differ). "Today ... no TennCare coverage" restates the bill's
  definition ("otherwise ineligible on the basis of income"); please confirm the wording. Section 2 also says TCA
  71-5-126(a) "does not apply to actions by the governor that are necessary to establish" the program; I could not
  open 71-5-126 from an official source (the Secretary of State's acts site returned 403, not retried; the code is
  hosted by LexisNexis), so no slide says what it is. The 2014 TennCare Fiscal Responsibility Act (Pub. Ch. 662,
  HB 937) bars the governor from expanding optional enrollment without a joint resolution, but I couldn't confirm
  it is 71-5-126, so it is left out. The 60-month resets at 21 (sec. 1(c)(3)(D)). Case for is the bill's preamble;
  no statement against exists yet. No party shown, the same as the Texas filing posts. Evergreen (a prefiled bill):
  Dec. 2 9:00 a.m. is the first free post slot that keeps the Reel/post turn on its own (Nov. 29 6:00 and 9:00 a.m.
  only work filled together). Tennessee has no Highlight; none needed (not a story).
