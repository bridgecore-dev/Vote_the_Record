caption: |-
  Today, a Tennessean who doesn't qualify for TennCare (or, under 21, CoverKids) gets no TennCare coverage.

  HB 18, filed Nov. 23 in the Tennessee House of Representatives for the 2027 session, would create a "temporary TennCare benefits program" for people at or under 138% of the federal poverty level who can't get TennCare now. Coverage would last at most 12 months in any 24, with 60 months in total before age 21 and 60 more after.

  TennCare would first have to ask the federal government for a waiver, by Dec. 31, 2027. Enrollment would start six months after approval. The bill says the program would be paid 90% with federal money and 10% with state money, and that it "does not constitute an entitlement": it depends on what the Legislature funds each year. No fiscal note is posted yet.

  The bill's preamble says help should be given in a way that "does not foster long-term, chronic dependency on government assistance."

  Should Tennessee offer time-limited coverage like this?
