caption: |-
  A new law gives identity theft victims one point of contact at the Social Security Administration. The President signed H.R. 5345, the Improving Social Security's Service to Victims of Identity Theft Act, on Oct. 7, 2026; GovInfo posted it as Public Law 119-119 on Nov. 23.

  Before: no law required one contact. The Ways and Means Committee report says SSA policies may send a victim to several offices or employees.

  After: if your Social Security number was misused, or your card was lost in the mail, a team of specially trained employees tracks your case until it's resolved. It takes effect 180 days after it was signed.

  The House committee approved it 39 to 1. The one no, Rep. John B. Larson (D-CT), said he backed the idea but couldn't vote for it over staffing cuts at Social Security; his amendment to delay it until staffing was restored failed, 14 to 24. The committee said the bill adds no new budget authority; no CBO estimate is listed.

  It passed the U.S. House of Representatives by voice vote and the U.S. Senate by unanimous consent. Sponsor: Rep. David Kustoff (R-TN).

  Would one contact person help you?
