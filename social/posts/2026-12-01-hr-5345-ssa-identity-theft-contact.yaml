notes: >-
  New this run: GovInfo's public-law feed posted P.L. 119-119 on Nov. 23, 2026 (approved Oct. 7, 2026, [H.R. 5345]);
  no post or open pull request covers it. Evergreen (signed more than a week ago), so it takes the first free post
  slot that keeps the Reel/post turn: Dec. 1 3:00 p.m. Facts: law text (sec. 714 (a)-(b), effective date sec. 2(b));
  congress.gov actions (committee 39-1 Sept. 17, 2025; House voice vote under suspension Dec. 1, 2025; Senate Finance
  discharged, passed without amendment by UC Sept. 17, 2026; signed Oct. 7, 2026). "Before", the reasons and both
  committee roll calls (39-1 on reporting; Larson amendment 14-24, its text "not take effect until the staffing ...
  is restored to at least the level on January 19, 2025") are from H. Rept. 119-360. Larson's co-lead history, "I
  cannot vote for this bill as it stands" (paraphrased on the slide as "voted no ... over staffing") and the quoted
  chatbot line are from his additional views; the report's DOGE and whistleblower allegations are not repeated
  (allegations, and about other matters than this bill). 180 days from Oct. 7 is April 5, 2027 by our count; the
  slide says "180 days after Oct. 7, 2026" rather than a date. The committee roll calls list no party; Larson's
  party and state, and the sponsor's and cosponsor's, are from congress.gov member records. Larson's slide reads
  "voted no in committee over Social Security staffing", our summary of his views (they also cite data security);
  please check. Same Ways and Means committee as the Nov. 27 H.R. 5284 post, a different bill.
