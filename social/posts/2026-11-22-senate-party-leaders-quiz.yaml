- kicker: Quiz · U.S. Senate
  head: Who picks each party's leader in the U.S. Senate, like the Majority Leader?
  quiz:
    choices: ["Voters, in a national election", "All 100 senators, in a floor vote", "The senators in that party's conference"]
    answer: 2
    explain: Senators in each of the two major parties are organized into a party conference, and each conference elects its own leaders.
    quote: {label: U.S. Senate, text: "both party conferences in the Senate elected leaders to speak for their members, coordinate action on the Senate floor"}
- kicker: What the leaders do
  head: Party conferences and their leaders help run the U.S. Senate day to day.
  rows:
  - [Agenda, Setting legislative agendas]
  - [Committees, Organizing committees]
  - [The floor, How action proceeds on the Senate floor]
  quote: {label: U.S. Senate, text: "The conferences (also referred to as caucuses) and their leaders play an important role in the daily functions of the Senate, including setting legislative agendas, organizing committees, and determining how action proceeds on the Senate floor."}
- kicker: Independents too
  head: Senators outside the two major parties usually work within one of the two conferences.
  quote: {label: U.S. Senate, text: "they typically work within the two established party conferences to gain committee assignments or manage legislation."}
- kicker: Your turn
  head: Want to know who your senators will back for leader? Ask their offices.
