caption: |-
  Who picks the U.S. Senate's party leaders, like the Majority Leader? Tap through for the answer.

  Senators in each of the two major parties are organized into a party conference, and each conference elects its own leaders. Those leaders help set the Senate's agenda, organize committees and run the floor. Senators outside the two major parties usually work within one of the conferences.

  Want to know who your senators will back? Their contact details are at senate.gov/senators. Should senators tell voters how they'll vote for their party's leader?
