notes: >-
  Review because 1,457 is our sum (1,262 + 116 + 0 + 79), not a figure TLO prints. All four reports opened
  2026-11-13 (report date 11/13/2026). TLO labels every item "Bills"; the lists include HJR, HCR, HR, SJR, SCR.
  Nov. 13 is left out because filing that day was still under way (24 so far at retrieval).
