caption: |-
  Texas lawmakers filed 1,457 bills and resolutions for the 2027 session from Nov. 9 to Nov. 12. Most came on day one: 1,262. Then 116 on Nov. 10, none on Nov. 11, and 79 on Nov. 12.

  Every count is from Texas Legislature Online's Bills By Filing Date report.
