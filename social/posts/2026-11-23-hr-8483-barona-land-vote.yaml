caption: |-
  On Nov. 17, the U.S. House of Representatives passed H.R. 8483, 398-0, with 35 members not voting.

  Before: the Bureau of Land Management runs 164 acres and the Forest Service runs 683 acres in San Diego County, California. After: the U.S. would hold all of it in trust for the Barona Band, as part of the band's reservation. No gaming; the public keeps access to recreation, roads and trails; the band maintains the fuel break.

  By party, per the House Clerk: Republicans 199 Yea, 0 Nay; Democrats 199 Yea, 0 Nay; the one Independent didn't vote. The committee report says the CBO cost estimate was requested but not received.

  Next it goes to the U.S. Senate. Should Congress move federal land this way?

  Voice: computer-generated (Kokoro text-to-speech).
