  "requested but not received" CBO line are from H. Rept. 119-858, reopened this run; it lists no dissenting views.
  The passed text is the reported version ("as amended" on docs.house.gov). Congress.gov's actions hadn't shown the
  vote yet when checked. Sponsor's party and state as the bill record lists them. No Nay votes, so no names slide.
  cbo.gov was not tried (it has refused earlier runs); check it for a later estimate. Nov. 18-22 regular slots are
  full, so this takes Nov. 23 7:30 a.m., the first free Reel slot (before the 9:00 a.m. post on H.R. 9600).
