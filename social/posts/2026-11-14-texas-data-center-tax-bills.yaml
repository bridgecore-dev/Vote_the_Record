caption: |-
  Five bills filed for the 2027 Texas session would repeal the sales tax breaks Texas gives certified data centers. They differ on what happens to breaks already granted.
hashtags: [txlege, texaslegislature, datacenters, texas, votetherecord]
notes: >-
  All records opened 2026-11-14: both filing reports, five bill histories, five introduced texts, the
  Comptroller's data-center page. HB 167/408/681 are the same council draft (90R 1509, TLO lists them as
  duplicates); SB 293 and HB 1139 share the other wording (HB 1139's PDF carries "S.B. No. 293" marks).
  "20 jobs / $200 million / 10 or 15 years / 6.25% state tax" are the Comptroller's terms for a qualifying data
  center; a large data center project (Sec. 151.3595) has its own terms (40 jobs, state and local tax). HB 750
  and HB 851 also touch the data-center sales tax break but have different captions, so the rule leaves them
  out. "Rep. Jessica González" distinguishes her from Rep. Mary González (TLO: "González, Jessica").
