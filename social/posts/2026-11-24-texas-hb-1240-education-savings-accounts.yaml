caption: |-
  Today, Texas Education Freedom Accounts, run by the state comptroller, pay for private school or other education costs outside public school: $10,474 per child in private school for 2026-27, up to $30,000 for a child with a disability, and $2,000 a year for homeschool. The program's funding is $1 billion. The comptroller says more than 100,000 students got funding by Aug. 13, 2026, and more than 100,000 more were on the waitlist.

  HB 1240, filed in the Texas House of Representatives for the 2027 session, would repeal the program. Its fund would close and the unspent money would go to the state's general revenue fund. Money already in accounts for the 2026-27 school year would stay under today's rules.

  No cost estimate is posted yet. If passed as filed, it takes effect Sept. 1, 2027, or right away with a two-thirds vote in each chamber.

  Keep the accounts, or end them?

  Voice: computer-generated (Kokoro text-to-speech).
