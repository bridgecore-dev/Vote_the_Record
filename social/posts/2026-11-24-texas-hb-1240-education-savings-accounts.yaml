notes: >-
  New: filed Nov. 18, 2026; no earlier post covers it. Rule: the Nov. 18 filing report's captions; HB 1240 ("Relating to
  repealing the education savings account program") is the only one about the program. Records opened 2026-11-19: the
  Nov. 18 filing report, the bill history (filed, no other action; author listed only as "Ezeonu"), the introduced PDF
  (the HTML version wasn't posted yet; sha256 e4b086321c167a82265ea3b36496fcccd9e5b8416a422ef1a901bec6d4c225da), the
  Comptroller's program page (comptroller.texas.gov/programs/education/esa/faq.php redirects to
  educationfreedom.texas.gov; source of $10,474, $30,000, $2,000 and "$1 billion in funding"), and the Comptroller's
  Aug. 13, 2026 release (100,000+ funded, 100,000+ waitlisted). The $1 billion is the 2025-27 biennium cap (the
  enrolled 2025 law, Education Code 29.3521(c-1), expires Sept. 1, 2027); the slide says only "Program funding: $1
  billion" as the Comptroller's page does. The 2025 law isn't named (one bill per post). "No new accounts" is our
  reading of the repeal of Subchapter J plus Sec. 10 (only 2026-27 money is continued); please confirm. The bill also
  removes the program's misconduct-reporting and criminal-history provisions for providers (Secs. 2-8); left out for
  space. No source states who gains or loses money beyond who is covered, and no official statement for or against the
  bill was found, so the post gives the record and asks. Takes Nov. 24 7:30 a.m. (Reel before the 9:00 a.m. carousel).
