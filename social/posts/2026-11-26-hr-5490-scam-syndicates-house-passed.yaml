notes: 'New this run: the House passed H.R. 5490 on Nov. 18 (Clerk floor log, 2:21:59 p.m.: "On motion to suspend the rules
  and pass the bill, as amended Agreed to by voice vote"); the earlier post (2026-11-15) covered only its floor schedule. Fills
  the Nov. 26 12:00 p.m. Reel slot (the next free slot that keeps the Reel/post turn; Nov. 20-25 are full). The engrossed
  text isn''t on GovInfo yet, so the passed text is the version printed in the Record (H6262-H6264); the $10 billion finding,
  30 and 240 days, 5-year sunset, IEEPA sec. 202 override, visa bar, 15-day waiver notice and sec. 481 funding were all checked
  in it. No case against: every speaker (Mast, Olszewski, Shreve, Meuser) supported it and no member spoke against; the members''
  own loss figures ($15B, $17.7B, $260B) are left off. CBO''s estimate (cbo.gov/publication/61971) returned 403 once and wasn''t
  retried, so no cost figure. Sponsor party/state and 74 cosponsors from the Congress.gov API; Mast and Olszewski party/state
  from Congress.gov member records. If the U.S. Senate acts before the slot, update "where" and the last slide.'
