caption: |-
  The U.S. House of Representatives passed the Dismantle Foreign Scam Syndicates Act (H.R. 5490) by voice vote on Nov. 18. Its findings cite a Treasury figure: Americans lost at least $10 billion to overseas scam centers in 2024.

  Before: to block a foreign person's U.S. assets under the emergency powers law, the President must first declare a national emergency.
  After: the President could block the assets of scam operators, their backers and officials who knowingly enable them without that step, and bar them from U.S. visas. A State-led task force would send Congress a strategy within 240 days and end after 5 years.

  No new money: the bill uses funds already authorized. It passed under suspension of the rules, which needs two-thirds, so there's no member-by-member tally. Next: the U.S. Senate.

  Lost money to a scam? Report it at ic3.gov.

  Voice: computer-generated (Kokoro text-to-speech).
