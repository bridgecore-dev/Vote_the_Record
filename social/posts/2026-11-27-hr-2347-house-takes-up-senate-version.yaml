caption: |-
  The U.S. House of Representatives takes up the U.S. Senate's version of H.R. 2347 the week of Nov. 30. Its Rules Committee meets on it Monday, 4 p.m. Eastern.

  The U.S. Senate replaced the House's one-change tax bill with a rewrite of federal permits and reviews, kept the tax change, and passed it 62-33 on Nov. 19.

  Before → after: water permits up to 5 years → 10; species reviews 90 days → 60; lawsuits over a review within 150 days; data centers pay the full cost of power lines built for them.

  If the House agrees to the Senate text, it goes to the President. If not, a conference can settle one text.

  For: Sen. Capito (R-WV). Against: Sen. Alsobrooks (D-MD). Which side convinces you?

  Voice: computer-generated (Kokoro text-to-speech).
