notes: >-
  News first: a dated event in the next three days (House Rules Committee meeting on the Senate amendment to H.R. 2347,
  Mon. Nov. 30, 4:00 p.m. ET, announcement created Nov. 23 at rules.house.gov/media/announcement/meeting-announcement-november-30-2026, also shown on the bill's Rules page, which is the cited source; docs.house.gov lists it "pursuant to a rule" for the week of
  Nov. 30, added Nov. 25). Bill status (GPO, updated Nov. 25) lists "Message on Senate action sent to the House" on Nov. 24
  and no House action since. Takes the Nov. 27 6:00 p.m. Reel slot, the earliest Reel slot at least 3 hours away (12:00
  p.m. is under 3 hours away), held by the prefiled Texas HB 1184 Reel (filed Nov. 16, no design, so not a design
  trial). This pull request moves HB 1184 to Dec. 26 6:00 a.m., the first Reel slot after the last queued post (Dec. 26
  3:00 a.m. carousel). Earlier H.R. 2347 posts cover Senate votes 264, 267 and 270 and SA 6883; this one covers only the
  House floor schedule. Their open CHECK (did managers' amendment 7030 change the four rows?) is now answered: the
  engrossed Senate amendment on GovInfo (BILLS-119hr2347eas, XML sha256
  2c8fbb620f6db94517a8dd41abe0bd7874889afe94b176b9b70cff2b03748007; PDF f7419bfc8b526e7f65f8c21a3f8d9a2b0193813cda1b1a635ae779b55afc519c)
  still has sec. 1203 "striking five years and inserting 10 years", sec. 1302 90 → 60 days, sec. 1110's 150-day limit
  ("unless a shorter deadline is specified under Federal law"), and sec. 2107(a)(1)(A)'s finding that "computational
  load owners and computational load operators bear the full cost ... so that such costs are not borne by other
  customers, including residential customers". "Data centers" is our plain word for "computational load site" (buildings
  that "primarily contain information technology infrastructure"), and the row is a finding of policy, so it says
  "Policy". Division C is the House bill's tax change (sec. 3001). The House's choices are from How Our Laws Are Made
  (House Parliamentarian, H. Doc. 110-49), part XV: agree to the Senate amendments ("the bill is ready to be enrolled
  for presentation to the President"), or disagree and request a conference; a rule from the Rules Committee is one way
  to do it. It doesn't list amending the Senate amendment, so the slide doesn't either; which motion the rule will make
  in order isn't known until Nov. 30. Vote 270 XML re-opened (62-33-5 absent, "1/2"; Capito Yea, Alsobrooks Nay; its
  sha256 now 3b61b1e4514833caf6926b5cc43356d6d8cbc5c0df0d1ce9013211620b1bd711, and it prints 09:30 PM). Capito's page
  moved to epw.senate.gov/press/rep/...; quote re-opened. Alsobrooks' Nov. 9 statement is about her vote on the
  Senate's own bill number for the same act (not named: one bill per post); same quote the Nov. 26 post used. cbo.gov
  returned 403, not retried; the estimate is linked, not quoted, and it's of SA 6883, so the caption says "Senate
  substitute". If the House votes before this posts (it can't: the Rules meeting is Nov. 30), the last slide needs the
  tally. Preview fix: shortened the source titles after the first preview clipped the sources footer.
