caption: |-
  Today, if a fire completely destroys your Texas homestead, you owe no property tax on the house for the rest of that year. The home has to stay unlivable for at least 30 days, and you apply within 180 days.

  HB 1198, filed in the Texas House of Representatives for the 2027 session, would give the same break when a flood or windstorm destroys the home. It works only if voters also approve a constitutional amendment allowing it.

  Owners of destroyed homes would owe less; cities, counties and school districts would collect less. No cost estimate is posted yet. If passed and approved, it takes effect Jan. 1, 2028.

  Should a flood count the same as a fire?

  Voice: computer-generated (Kokoro text-to-speech).
