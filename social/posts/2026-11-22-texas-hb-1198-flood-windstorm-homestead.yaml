notes: >-
  New: filed Nov. 17, 2026; no earlier post covers it. Rule: the Nov. 17 filing report's captions; HB 1198 is the only one
  about tax relief for disaster-destroyed homes. Records opened 2026-11-17: the Nov. 17 filing report, the bill history
  (filed, no other action; no fiscal note listed), the introduced text (90R 2852 LHC-D), and Tax Code 11.351 (rendered
  from statutes.capitol.texas.gov; added in 2025, eff. Jan. 1, 2026). The bill depends on a constitutional amendment
  "proposed by the 90th Legislature"; no joint resolution was on the Nov. 17 filing report, so the post doesn't name
  one. "No tax on the house for the rest of that year" restates 11.351(d)'s day-fraction of the improvement's value (the
  land stays taxable; "the house" is our plain word for "improvement"). Who gains and who loses is our plain reading of an
  exemption (no source states amounts). Author as TLO lists him, no party. Takes Nov. 22 1:30 p.m. (Reel, after the
  9:00 a.m. post).
