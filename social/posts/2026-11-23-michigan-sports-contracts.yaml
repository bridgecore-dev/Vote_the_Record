notes: >-
  From an owner idea (Michigan "ban" on sports betting apps, and whether other states can do the same). Not a
  legislature item: it rests on the MGCB release (Oct. 28), the Lawful Sports Betting Act (MCL 432.402, 432.411:
  21 and older), the Sixth Circuit's opinion (26a0272p.06; the official PDF's sha256 is 70d44317...4a28) and the
  Supreme Court docket 26-299 (response due Dec. 7, 2026, after a second extension granted Oct. 30). The circuit split
  is footnote 3 of the Sixth Circuit opinion, as of Sept. 25: Third Circuit (Flaherty) affirmed Kalshi's preliminary
  injunction; Ninth Circuit (Assad) affirmed dissolving it; Fourth Circuit (Maryland) was pending and is left off the
  slide because it may have changed. All are preliminary-injunction rulings, which slide 6 says. Kalshi's side is
  given as the court describes it (p. 3 and p. 47 quote). The Kalshi state-court order is named only as the MGCB
  release does ("a state-court preliminary injunction"); the $500,000-a-day fine and the 18-vs-21 age point appear in
  news only and are left out. Recheck the docket and the MGCB news page before Nov. 23.
