caption: |-
  Did Michigan ban sports betting apps? No. Licensed sports betting apps are still legal there for people 21 and older, under the Lawful Sports Betting Act of 2019.

  What Michigan stopped: sports "event contracts" on prediction markets, which the state says are sports wagering without a Michigan license. A state court ordered Kalshi to stop; Robinhood, Coinbase and Polymarket US agreed to. Polymarket US will close Michigan customers' open sports contracts by the end of Nov. 25 (Michigan Gaming Control Board).

  Michigan's side: "If you want to offer sports wagering to Michigan residents, you need a Michigan license." (Henry Williams, MGCB)
  The companies' side: a federal law gives the Commodity Futures Trading Commission "exclusive jurisdiction" over these contracts, so state gambling laws don't apply (Kalshi's argument, as the Sixth Circuit describes it).

  Can other states do it? Appeals courts have split in early rulings: the Third Circuit sided with Kalshi in New Jersey; the Sixth (Ohio, Tennessee) and Ninth (Nevada) sided with the states. New Jersey has asked the U.S. Supreme Court to step in; Kalshi's response is due Dec. 7.

  Which side convinces you?

