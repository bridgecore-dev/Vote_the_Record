notes: >-
  New today: filed Nov. 16, 2026 (Nov. 16 filing report, 26 bills). Rule: the one bill on that report that would put a
  new tax to a local vote; HB 1179 (hotel tax cap in certain cities) raises a rate cap without an election, so it doesn't
  fit. Records opened 2026-11-16: the filing report, the bill history (filed, no other action; the Text page lists no fiscal
  note), the introduced text (90R5587 RDS-D), and Tax Code 151.051, 321.101, 323.101 and 26.041 (rendered from
  statutes.capitol.texas.gov). Please double-check slide 4's "Half" row: the bill treats 50% as "additional sales and use
  tax revenue ... for purposes of Section 26.041", and 26.041 subtracts that revenue (as a rate) in the no-new-revenue and
  voter-approval rate formulas; the post says only that it lowers the rate a unit may set without an election, not that
  bills go down. The post doesn't add 6.25 + 2 + 1, since a city and its county could each hold an election under the bill.
  Rep. Barry as TLO lists the author; no party is shown, the same as other Texas filing posts.
