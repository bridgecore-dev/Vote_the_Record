slides:
- kicker: 2027 Texas session · Filed Nov. 16, 2026
  big: Up to 1%
  head: A Texas House of Representatives bill would let city or county voters add a sales tax of up to 1%, outside today's local limit.
  say: A Texas House of Representatives bill filed November 16 would let city or county voters add a sales tax of up to 1%,
    outside today's local limit.
- chip: The law today
  big: 6.25% + 2%
  head: Texas charges a 6.25% state sales tax. Cities, counties and other local bodies together may add no more than 2% at any spot.
  quote: {label: Tax Code 321.101(f), text: "would exceed two percent at any location in the municipality."}
  text: Local sales taxes already need voter approval (Tax Code 321.101 and 323.101).
  say: 'The law today: Texas charges a 6.25% state sales tax. Cities, counties and other local bodies together may add no
    more than 2% at any spot, and local sales taxes need voter approval.'
- chip: What would change
  head: A city or county council could call an election on a new "supplemental" sales tax of up to 1%.
  quote: {label: HB 1177, new Tax Code 328.0003, text: "The rate of a supplemental local sales and use tax may not be considered for purposes of determining the combined local tax rate in any area."}
  text: So it wouldn't count toward the 2% local limit. The vote would be on the next uniform election date, and voters could later abolish the tax the same way.
  say: 'What would change: a city or county council could call an election on a new supplemental sales tax of up to 1%. Its
    rate would not count toward the 2% local limit. Voters could later abolish it.'
- chip: Where the money goes
  head: The bill splits the money in two.
  rows:
  - [Half, "Lowers the property tax rate it may set without an election"]
  - [The other half, "Anything its general fund may pay for"]
  text: The half works like today's voter-approved property tax relief sales tax (Tax Code 26.041). Property tax bills would show how much more property tax there would have been without it.
  say: 'Where the money goes: half lowers the property tax rate a city or county may set without another election. The other
    half can pay for anything the general fund covers. Tax bills would show how much more property tax there would have been without it.'
- chip: Who pays, who gains
  head: Shoppers would pay up to 1% more on taxable purchases there. Property taxpayers would see half of it used to lower the rate limit.
  quote: {label: Ballot wording in HB 1177, text: "The adoption of a local sales and use tax in (name of municipality or county) at (rate of tax) to reduce the property tax rate and provide additional revenue for general governmental purposes."}
  text: No fiscal note (cost estimate) is posted yet.
  say: 'Who pays and who gains: shoppers would pay up to 1% more on taxable purchases there, and half the money would be used
    to lower the property tax rate limit. No cost estimate is posted yet.'
- chip: What's next
  big: Sept. 1, 2027
  head: If passed as filed, the bill takes effect on this date. A tax voters approve starts the next Jan. 1 at least six months after the state is told the result.
  text: "How we picked: every bill filed Nov. 16, 2026 that would put a new tax to a local vote. Would you trade a higher sales tax for a lower property tax rate?"
  say: If passed as filed, the bill takes effect September 1, 2027. How we picked, every bill filed November 16 that would put
    a new tax to a local vote. Would you trade a higher sales tax for a lower property tax rate?
caption: |-
  Today, Texas adds a 6.25% state sales tax to taxable purchases, and cities, counties and other local bodies together can add no more than 2% at any spot.

  HB 1177, filed in the Texas House of Representatives for the 2027 session, would let a city or county ask its voters for a new sales tax of up to 1% that doesn't count toward that 2% limit. Half the money would lower the property tax rate the city or county may set without another election; the other half could pay for anything its general fund pays for.

  Shoppers would pay more at the register. Property taxpayers would see half of it go to a lower rate limit. No cost estimate is posted yet.

  Would you vote for that trade?

  Voice: computer-generated (Kokoro text-to-speech).
