bills:
- id: S. 4035
  title: DEATH BETS Act
  does: "Bans CFTC-registered exchanges from listing event contracts that expressly reference war, terrorism, assassination or a death."
  affects: "Exchanges and clearinghouses registered with the Commodity Futures Trading Commission, and people who trade on them."
  where: "Passed the U.S. Senate by voice vote on Nov. 19, 2026. Next: the U.S. House of Representatives."
  summary:
    text: "(1) An agreement, contract, transaction, or swap based on an excluded commodity described in section 1a(19)(iv) that expressly references-- (A) terrorism; (B) assassination; (C) war;"
    title: S. 4035 as passed by the Senate, new CEA sec. 5c(d)(1) (no CRS summary is posted yet)
    url: https://www.govinfo.gov/content/pkg/BILLS-119s4035es/html/BILLS-119s4035es.htm
    retrieved: '2026-11-20'
  say: "S. 4035, the DEATH BETS Act, bans exchanges registered with the Commodity Futures Trading Commission from listing event contracts that expressly reference war, terrorism, assassination or a death. It passed the United States Senate by voice vote on November 19, 2026."
