notes: >-
  New this run: the Senate Press Gallery's Nov. 19 log says "Senator Schiff achieved passage of S.4035, DEATH BETS Act,
  along with the Schiff/Curtis amendment, by voice vote" (6:47 p.m.); congress.gov actions (read 2026-11-20) say
  "Passed Senate with an amendment by Voice Vote", and GovInfo has the engrossed text. No CRS summary, committee report
  or CBO estimate (congress.gov's record lists none), so the explainer quotes the engrossed sec. 2. Before/after:
  current law quoted from GPO's 2024 U.S. Code 7 U.S.C. 7a-2(c)(5)(C)(i)-(ii); after, from the engrossed text. The
  "Changed on the floor" slide compares the introduced and engrossed texts (both opened). "Sponsor's case" paraphrases
  Schiff's March 10 release ("insiders can profit off of classified information ... and violence is encouraged"); it
  was about the introduced version. No statement against was found in the sources opened (no recorded vote, no
  report); the Nov. 19 Congressional Record (Schiff and Curtis spoke) wasn't opened. Party and state as congress.gov
  lists sponsor and cosponsor. H.R. 7942 is listed by CRS as identical to the introduced version, not the passed one,
  so it isn't named. The rule of construction (sec. 3) is the "other contract types keep today's rules" line: it
  keeps the CFTC's existing discretion over the other activities in 5c(c)(5)(C)(i), such as gaming; check the
  wording. Takes the free Nov. 26 6:00 p.m. Reel slot (after the 3:00 p.m. carousel). Nov 20 fix: shortened source titles so the cover's source footer fits (the first preview clipped it).
