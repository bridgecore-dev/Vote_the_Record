caption: |-
  On Nov. 19, the U.S. Senate passed S. 4035, the DEATH BETS Act, by voice vote.

  Before: the Commodity Futures Trading Commission (CFTC) may block event contracts on terrorism, assassination, war or gaming. It's the CFTC's call.

  After: CFTC-registered exchanges could not list contracts that expressly reference terrorism, assassination, war or U.S. military operations, or that resolve mainly on a death. Gaming contracts keep today's rules. The Senate narrowed the wording before passing it.

  Who gives: exchanges and their traders. No statement against it was found; no CBO estimate is listed.

  Sponsor: Sen. Adam B. Schiff (D-CA). Cosponsor: Sen. John R. Curtis (R-UT).

  Ban these bets, or leave it to the regulator?

  Voice: computer-generated (Kokoro text-to-speech).
