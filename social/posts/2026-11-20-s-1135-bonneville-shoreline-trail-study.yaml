notes: >-
  New this run: the Senate floor activity page for Nov. 19 lists S. 1135 "Passed Senate with an amendment and an
  amendment to the Title by Unanimous Consent"; the slides follow the engrossed text on GovInfo ("Passed the Senate
  November 19, 2026"). No CRS summary yet, so the explainer quotes sec. 1. The rest is NTSA sec. 5 in GPO's 2024 U.S.
  Code: 5(a) "authorized and designated only by Act of Congress"; 5(b) feasibility = "physically possible to develop a
  trail" and "financially feasible", report "not later than three complete fiscal years from the date of enactment",
  consultation list, and the report contents (route, land ownership, development and maintenance cost). "3 full
  fiscal years" counts from the date it becomes law; please confirm no later law changed 5(b). The bill says
  "national trail" nowhere; 5(b) studies are for "national scenic or national historic trails", which is why the
  slides say "a national trail". Both S. 1135 and S. 4538 add a paragraph "(50)" to 5(c); not raised on a slide.
  cbo.gov returned 403 this run (estimate: cbo.gov/publication/62333, as ordered reported March 4, 2026), not
  retried. The hearing (S.Hrg. 119-238) wasn't opened. No statement for or against was found; unanimous consent, so
  no case-against slide. Sponsor and cosponsor party and state as congress.gov lists them. News first: takes the Nov.
  20 6:00 p.m. Reel slot from the evergreen 2026-11-17-bay-area-ridge-trail-study (a bill reported Oct. 29 with no
  vote), which moves to 2026-12-02T00:00:00-06:00 (Dec. 1 06:00 would put two Reels in a row on main unless the
  Bennett post pull request merges). Paired with the S. 4538 Reel, same layout.
