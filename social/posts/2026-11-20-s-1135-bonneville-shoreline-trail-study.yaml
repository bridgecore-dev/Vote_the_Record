caption: |-
  On Nov. 19, the U.S. Senate passed S. 1135 by unanimous consent. It orders a study of the Bonneville Shoreline Trail, a system of trails about 280 miles long from the Idaho-Utah border to Nephi, Utah, along the old shoreline of Lake Bonneville.

  Before: the trail isn't on the National Trails System Act's list of routes to study.

  After: it is. The Secretary of Agriculture studies whether a trail can be built along the route and whether it can be paid for, and reports to Congress within three full fiscal years. The study covers the route, land ownership, and the cost to build and maintain it.

  A study isn't a designation. The law says national scenic and historic trails are made only by an act of Congress.

  Sponsor: Sen. John Curtis (R-UT). Cosponsor: Sen. Mike Lee (R-UT).

  Should Congress study more trails like this?

  Voice: computer-generated (Kokoro text-to-speech).
