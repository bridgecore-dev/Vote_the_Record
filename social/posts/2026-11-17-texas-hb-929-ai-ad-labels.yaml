slides:
- kicker: 2027 Texas session · Filed Nov. 9, 2026
  big: HB 929
  head: A Texas House of Representatives bill would require political ads with major AI content to say so.
- chip: The law today
  big: 30 days
  head: "Texas makes it a crime to create a deep fake video and publish it within 30 days of an election, to hurt a candidate or sway the result."
  quote: {label: "Election Code 255.004(e): a deep fake video", text: "means a video, created with the intent to deceive, that appears to depict a real person performing an action that did not occur in reality."}
  text: "Video only. A Class A misdemeanor: up to $4,000, a year in jail, or both (Penal Code 12.21)."
- chip: The label
  head: "Ads in Texas state and local races and ballot measures with major AI content would have to carry a set line."
  rows: [[Print or static, "On the face of the ad, in clear, contrasting text"],
         [Video, "Starts within the first 5 seconds, stays at least 3"],
         [Audio, "Spoken clearly at or near the start"]]
  text: "It applies when someone pays to place the ad, or a candidate, a candidate's agent, or a reporting political committee authorizes it."
- chip: What counts
  head: "\"Material AI content\": AI-made or AI-altered content that is a substantial part of the ad's message or a depiction in it."
  text: "Not counted: routine work like spelling fixes, formatting, cropping, color and sound cleanup, and accurate captions or translations, if they don't change the message or fake a real person's voice or likeness."
- chip: The penalty
  head: "A civil fine, not a crime: the Texas Ethics Commission could fine up to $4,000 per ad."
  text: "Copies of the same ad by the same person in the same election count as one. The commission must weigh a prompt, good-faith fix. Exempt: satire and parody, unpaid news and commentary, and publishers and other go-betweens. No fiscal note (cost estimate) is posted yet."
- chip: What's next
  head: The Legislature convenes Jan. 12, 2027.
  text: "If passed as filed, it takes effect Sept. 1, 2027. Should political ads have to label AI content? Is a fine the right way to enforce it?"
caption: |-
  Today, Texas law makes one kind of election deep fake a crime: a fake video, published within 30 days of an election to hurt a candidate or sway the result.

  HB 929, filed in the Texas House of Representatives for the 2027 session, takes a different route: a label. Paid or candidate-approved ads in Texas state and local races and ballot measures with major AI content would have to say "This ad contains AI-generated or AI-altered content."

  An ad without it could draw a civil fine from the Texas Ethics Commission of up to $4,000 per ad. Satire, parody and unpaid news are exempt.

  If passed, it takes effect Sept. 1, 2027. Should AI in political ads need a label?
