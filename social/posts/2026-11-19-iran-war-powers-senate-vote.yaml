caption: |-
  The U.S. Senate is set to vote by Friday, Nov. 20, on H.Con.Res. 93. It directs the President to remove U.S. Armed Forces from hostilities against Iran, unless Congress declares war or authorizes force. Forces needed to defend the U.S. or an ally from imminent attack aren't covered.

  The U.S. House of Representatives passed it 220-204 on Sept. 15 (roll call 307).

  The catch: it's a concurrent resolution. The U.S. Senate's own guide says those "do not require the signature of the president and do not have the force of law." The War Powers Resolution of 1973 lets Congress use one here, but the Congressional Research Service notes a Supreme Court decision "called into question" whether that part is constitutional.

  Should Congress or the President decide? Tell your senators.

