caption: |-
  Rep. Al Green (D-TX) announced on Nov. 12 that he intends to force a House vote on articles of impeachment against President Trump "as early as next week."

  How one member can do that: an impeachment resolution offered on the floor is a "question of privilege." After notice, the Speaker has to schedule it within two legislative days.

  Last time, on Sept. 15, Rep. Fry (R-SC) moved to table Green's H.Res. 1486. The House agreed 232-147, with 47 Present and 7 not voting. By party, per the House Clerk: Republicans 213 Yea, 0 Nay, 1 Present; Democrats 18 Yea, 147 Nay, 46 Present; the one Independent, Yea. Tabling ended it without a vote on impeachment itself.

  If a new resolution comes up, roll calls post at clerk.house.gov/Votes. How will your representative vote?

  Part 1 of 2. Part 2: what the House and the Senate each do in an impeachment.

