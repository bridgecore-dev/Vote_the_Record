notes: >-
  Part 1 of 2 from an owner idea (part 2 is the impeachment-process carousel at 6:00 p.m.); they fill the
  Nov. 16 4:30/6:00 p.m. pair, since the House is in session that week and the vote could come any day. Rests on Rep.
  Green's Nov. 12 release (it gives no grounds, and no new resolution is filed under his name on congress.gov as of
  Nov. 15, so the slides name none), roll call 298, congress.gov actions (Green gave notice Sept. 14, offered it
  Sept. 15; Mr. Fry moved to table), and House Practice. The congress.gov actions and CRS summary were read through
  api.congress.gov (the web pages refuse automated requests); the summary quote ends before its last clause, "while
  undermining judicial oversight," to fit 300 characters. No arguments for or against are quoted: the release
  gives no reasons in text, and the motion to table is not debatable. If the vote happens before 4:30 p.m. on
  Nov. 16, the first slide is out of date: delete the file or hold it.
