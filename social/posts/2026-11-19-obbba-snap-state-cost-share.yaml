- chip: "The case for"
  head: "The committee's report says full federal funding gives states little reason to hold down costs."
  quote: {label: "U.S. House of Representatives Agriculture Committee, Chairman Glenn \"GT\" Thompson (R-PA), H. Rept. 119-106", text: "Because the SNAP benefit is 100 percent funded by the Federal government, there is minimal incentive for States to control costs, enhance efficiencies, and improve outcomes for recipients."}
  text: "Written about the U.S. House of Representatives' version, where the state share went up to 25%."
  say: "The case for: the United States House Agriculture Committee report, sent by Chairman Glenn Thompson, Republican of Pennsylvania, said that because SNAP benefits are 100 percent federally funded, states have minimal incentive to control costs."
