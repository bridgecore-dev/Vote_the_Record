  head: "Committee members who dissented say states can't carry the new costs."
  quote: {label: "Dissenting views, Ranking Member Angie Craig (D-MN) and other members, U.S. House of Representatives Agriculture Committee, May 16, 2025", text: "Increasing the current administrative cost-shift for states to 75 percent and creating an unfunded mandate that attempts to force states to pay for SNAP benefits will create a death spiral for federal food assistance in America."}
  text: "Written about the U.S. House of Representatives' version, where the state share went up to 25%."
  say: "The case against: dissenting views from Ranking Member Angie Craig, Democrat of Minnesota, and other committee members said shifting 75 percent of running costs to states, and making them pay for benefits, will create a death spiral for federal food assistance."
caption: |-
  One Big Beautiful Bill Act: what changes in 2027.

  Already started, Oct. 1, 2026: states pay 75% of the cost of running SNAP, up from 50%.

  Next, Oct. 1, 2027. Before: the federal government pays 100% of SNAP food benefits. After: states with payment error rates of 6% or more pay 5% to 15%, depending on the rate.

  CBO estimates about $41 billion less federal SNAP spending over 10 years, and that it may end benefits for 300,000 people in an average month.

  A farm bill reported by the U.S. Senate Agriculture Committee would delay the benefit share a year, to Oct. 1, 2028. As far as the records we checked show, the full U.S. Senate hasn't voted on it.

  For and against: the U.S. House of Representatives Agriculture Committee's report and its dissenting views. Which side convinces you?

  Voice: computer-generated (Kokoro text-to-speech).
