notes: >-
  Party and state for Thompson (R-PA) and Craig (D-MN) are from House roll call 145's member list, and for Boozman (R-AR) from Senate roll call 372's, since the report and draft print none.
  Part of the "One Big Beautiful Bill Act: what changes in 2027" series, the owner's request (2026-11-15). Please
  double-check: (1) The farm bill draft: CRS IN12723 (Aug. 4, 2026) says Chairman Boozman's July 31, 2026 draft would
  delay the benefit share to Oct. 1, 2028, was scheduled for committee consideration Aug. 6, 2026, and would not change
  the admin share. Whether it was marked up, passed either chamber, or became law is unconfirmed; the slide says only
  that the records we checked show no passage. Re-check before the slot. The House-passed farm bill's number is in the
  CRS Insight but is not named here (one bill per post); CRS says it has no such provision. Boozman is named without
  party because the CRS source lists none. (2) The $41 billion and $35 billion are from CRS R48552's text ("about $35
  billion of the $41 billion"), which summarizes CBO's Aug. 11, 2025 estimate; the sheet's -$40.8 billion and the
  admin -$24.7 billion come from a CRS table whose text layout is scrambled, so neither is used. The admin dollar figure
  used is USDA's own ($16.9 billion over FY2027-2031) from the June 24, 2026 proposed rule; USDA also assumes "a
  negligible impact on SNAP benefit spending or SNAP participation." Final rule status: unconfirmed. The admin change
  itself is in the law (FY2027 on), so it applies regardless of the rule. (3) No state's error rate or expected share
  (including Texas's) is on a slide: CRS's figure didn't extract, so it's unconfirmed. (4) Both for/against quotes are
  from H. Rept. 119-106 pt. 1 and discuss the House-passed version (state benefit share 5-25%); each slide says so.
  The dissent is signed by Ranking Member Craig and 23 other members (the fact sheet said 12; the report lists 24
  names in all), so the slide says "and other members". The report prints no party for Thompson or Craig, so neither
  gets one. The dissent's "$155 billion" and "3 million" figures are for the House version and are left out. (5) No
  official SNAP "what you can do" page was reachable (the FNA state directory blocked access), so the post ends with
  a question instead. Quotes were checked word for word against the downloaded govinfo and CRS text.
  Nov. 19 update (before the slot): CRS updated IN12723 (version 6, "Updated October 5, 2026"): "The Senate Agriculture
  Committee reported legislation (S. 5526) to the full Senate"; it would still delay the benefit share to Oct. 1, 2028,
  raise the top share to 20% from FY2031, and "would not amend" the 75% admin share. api.congress.gov actions for that
  bill (read 2026-11-19) end Sept. 24, 2026: reported by Senator Boozman, placed on the Senate calendar (Calendar No.
  683); no floor vote. The "This could change" slide, its source and the caption now say so; the bill number isn't
  named (one bill per post). The bill summary's quote still cites version 1 (Aug. 4), which is what it was checked
  against. Version 6 sha256: cb98e5023d1013c79c78ca23d31dd031c7f5bfc1f1cbff9e64e2a43415810edc.
