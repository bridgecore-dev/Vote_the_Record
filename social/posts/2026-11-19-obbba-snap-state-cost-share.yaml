bills:
- id: H.R. 1
  title: One Big Beautiful Bill Act
  does: "Among many changes, it makes states with SNAP payment error rates of 6% or more pay 5% to 15% of benefit costs."
  affects: "States that run SNAP, and the people who get SNAP food benefits."
  where: "Signed into law July 4, 2025, as Public Law 119-21. The benefit share starts Oct. 1, 2027."
  summary:
    text: >-
      The FY2025 budget reconciliation law (P.L. 119-21) newly requires a state that has a payment error rate of 6%
      or more to pay a share of SNAP benefits in the state.
    title: "CRS Insight IN12723, Senate Committee Chairman's New Farm Bill Draft Would Change the Upcoming State Sharing of SNAP Benefit Costs (Aug. 4, 2026)"
    url: https://www.congress.gov/crs_external_products/IN/PDF/IN12723/IN12723.1.pdf
    retrieved: '2026-11-15'
  say: "H.R. 1, the One Big Beautiful Bill Act, was signed into law July 4, 2025, as Public Law 119-21. Among many changes, it makes states with SNAP payment error rates of 6% or more pay 5% to 15% of benefit costs."
