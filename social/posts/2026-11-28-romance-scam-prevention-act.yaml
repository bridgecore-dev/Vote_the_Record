notes: >-
  New this run: GovInfo's public-law feed added P.L. 119-129 on Nov. 23, 2026; no post covers it. Signed Oct. 20, 2026
  (congress.gov actions via api.congress.gov, read this run), so this is evergreen: it takes the first free Reel slot,
  Nov. 28 6:00 p.m., after the Nov. 28 3:00 p.m. carousel, and bumps nothing. Everything about the law is from the
  enacted text on GovInfo: sec. 2(a)(2) contents, (a)(3) timing (24 hours; 3 days on the provider's judgment; law
  enforcement delay, then 3 days), (b) FTC and state AG enforcement, (c) "One National Standard" preemption (state
  contract and tort law not preempted), (e) effective one year after enactment. "No federal rule" before: the law adds
  a new 15 U.S.C. 45g and CBO calls it a new mandate; "some states require" and "most dating services have implemented
  the notification policy regardless of the consumer's location" are CBO's words in S. Rept. 119-58. The $4 million
  FTC cost and the small compliance cost are CBO's estimate for S. 841 as reported (the Senate companion, not named on
  a slide; one bill per post); CBO's estimate for H.R. 2481 itself is at cbo.gov/publication/61530, which returned 403
  this run (not retried); please check it if you can. The FTC numbers are the Senate report's, citing FTC data.
  "Expects the warnings to save fraud victims money" restates the report's regulatory impact statement. House: voice
  vote under suspension; Senate: unanimous consent; so no tally or names. No statement against was found (the Sept. 23
  and June 23, 2025 Congressional Record pages weren't read). Sponsor's party and state as congress.gov lists him;
  cosponsors (4 D, 5 R as congress.gov lists them) aren't on a slide. Trial design: changes one thing from the baseline,
  font sans (Nov. 28's 6:00 a.m. trial changes the palette).
