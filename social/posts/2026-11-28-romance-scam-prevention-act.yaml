caption: |-
  Starting Oct. 20, 2027, a dating app or site that bans someone for likely fraud has to warn everyone that person messaged there, within 24 hours (up to 3 days if the app decides it needs more time, or longer if law enforcement asks it to wait).

  Today there's no federal rule; some states require these warnings, and the Congressional Budget Office said most dating services already send them everywhere because of that. The new law sets one rule for the whole country, and states can't keep their own rules on these warnings. The Federal Trade Commission and state attorneys general enforce it.

  The warning names the banned member, says they may have used a false identity or tried to defraud people, and says never to send cash or personal financial information to another member.

  A U.S. Senate committee report says over 59,000 people lost nearly $1.2 billion to romance scams in 2024, in reports to the FTC.

  Is a warning enough to stop a scam?

