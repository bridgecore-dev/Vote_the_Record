caption: |-
  A bill on the House floor schedule this week, H.R. 3495, would change who counts as an "employee" under the Fair Labor Standards Act, the federal minimum-wage and overtime law.

  Before: a real estate agent or direct seller who counts as an employee must get at least the minimum wage, and generally overtime.
  After: they would not count as employees under that law. The bill borrows the tax code's definitions, which since 1982 have treated them as non-employees for taxes. The definitions also cover newspaper delivery.

  CBO says workers it covers would lose the right to sue for FLSA violations. It puts the value of those lost settlements below $206 million, the threshold in federal mandate law. The budget would lose under $500,000 in penalties over 10 years.

  For: the committee report says these workers already work as independent contractors. Against: the minority views say the law already handles commission pay.

  Which side convinces you?
