  the report's and matches 26 U.S.C. 3508 (Pub. L. 97-248, 1982). Sponsor's party and state as the bill status
  lists them; cosponsor count (31) counted from the GovInfo bill status. Supporters and opponents are as the
  report names them. No CRS summary on the CRS site itself; the summary is from the GovInfo bill status file.
