bills:
- id: H.R. 10167
  title: Common Cents Act
  does: "Writes the end of new circulating pennies into law, lets cash totals round to 5 cents, and allows a zinc-core nickel."
  affects: "Anyone paying or getting paid in cash, stores and banks, the U.S. Mint, and the Federal Reserve."
  where: "Signed into law Nov. 20, 2026. A Public Law number wasn't posted yet when this was written."
  summary:
    text: "the Secretary shall cease production of one-cent coins for general circulation, but may continue to produce and issue one-cent coins for sale as numismatic items."
    title: "H.R. 10167 as enrolled, sec. 2 (new 31 U.S.C. 5112(bb)(1))"
    url: https://www.govinfo.gov/content/pkg/BILLS-119hr10167enr/html/BILLS-119hr10167enr.htm
