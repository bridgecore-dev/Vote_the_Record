caption: |-
  On Nov. 20, the President signed H.R. 10167, the Common Cents Act. It passed the U.S. House of Representatives by voice vote on Sept. 14 and the U.S. Senate by unanimous consent on Sept. 28.

  Before: the Treasury had already stopped making new pennies on its own authority, and left rounding to the states.

  After: federal law says no new pennies for circulation. Old pennies stay legal tender. When exact change can't be given, a cash total (taxes included) may be rounded to the nearest 5 cents: 1, 2, 6, 7 down; 3, 4, 8, 9 up. Cards, checks and gift cards stay exact. Nobody has to round. Cash wages can only be rounded up. Rounding this way doesn't break federal, state or tribal law.

  Who gains, who gives: the Treasury says a penny costs 3.69 cents to make and the Mint projects $56 million a year in savings. The Treasury also says cash rounds down as often as up. The law orders a study of effects on low-income, older and unbanked people. Congress.gov lists no CBO estimate.

  Do you still pay with cash?
