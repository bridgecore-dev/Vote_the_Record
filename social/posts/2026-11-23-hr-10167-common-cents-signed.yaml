notes: >-
  New this run: congress.gov's actions (api, read 2026-11-20) list "Signed by President." on Nov. 20, 2026 (presented
  Nov. 12; House voice vote Sept. 14, 7:27 p.m. ET; Senate passed without amendment by unanimous consent Sept. 28).
  No Public Law number yet. The CRS summary on congress.gov is for the introduced bill and says it "requires
  rounding"; the enrolled text (GovInfo, read this run) says a person "may ... round" (sec. 3(a)) and sec. 3(e) says
  nothing requires rounding. The long title also says "require". The post follows the enacted section text, so the
  explainer quotes sec. 2's new 5112(bb)(1) instead of the CRS summary. Please double-check that reading. "Before" is
  the Treasury's Penny Production Cessation FAQs (home.treasury.gov, opened this run): "has stopped manufacturing new
  pennies", "roughly 114 billion", 3.69 cents per penny, $56 million a year ("in reduced material costs"), "states
  will approach this issue differently", and rounding down "just as often as" up. The FAQ page names no date for the
  last penny, so no date is on a slide; usmint.gov returned 403 (not retried). The FAQ cites 31 U.S.C. 5111(a)(1) and
  5112(a)(6) as Treasury's authority; the nickel's 75/25 copper-nickel alloy is 5112(b) in GPO's 2024 U.S. Code.
  Congress.gov lists no CBO estimate and no committee report. Voice vote and unanimous consent, so no list of who
  voted which way; no statement against was opened (the Sept. 14 debate, CR H5599-5602, wasn't read). Sponsor and
  cosponsor party and state as congress.gov lists them. News first: takes the Nov. 23 9:00 p.m. post slot from the
  evergreen 2026-11-17-texas-sb-46-ai-political-ads (filed Nov. 9, more than a week ago), which moves to
  2026-12-05T03:00:00-06:00, the first post slot after the last queued post (Dec. 4's only post is at 3:00 a.m., so a
  later Dec. 4 post slot would put two posts in a row). Earlier post slots hold this week's news, and every Reel
  slot is news or a trial (#250), so no Reel was bumped.
