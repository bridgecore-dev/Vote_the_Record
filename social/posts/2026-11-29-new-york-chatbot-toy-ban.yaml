bills:
- id: S. 9408
  does: Bans making, selling or distributing toys for kids 12 and under that have a built-in AI companion in New York, for 5 years.
  affects: Makers and sellers of children's toys with AI companions, and families buying toys in New York.
  where: Signed Nov. 24, 2026 as Chapter 416. Starts 90 days later; ends 5 years after that.
  summary:
    text: Prohibits the manufacture, exchange, distribution and sale of chatbot toys in this state.
    title: New York State Assembly summary of S09408
    url: 'https://nyassembly.gov/leg/?default_fld=&leg_video=&bn=S09408&term=2025&Summary=Y'
