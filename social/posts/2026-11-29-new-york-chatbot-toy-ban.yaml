caption: |-
  New York is banning AI chatbot toys for kids 12 and under. S. 9408 was signed Nov. 24, 2026 as Chapter 416. From Feb. 22, 2027, no one may make, sell or distribute them in the state. The ban ends after 5 years unless lawmakers renew it.

  Before: these toys can be sold. The sponsor's memo says state law already makes AI companions detect self-harm talk and say they aren't human.
  After: a "chatbot toy" (a toy for a child 12 or younger with an AI companion built in) can't be sold in New York. The governor's office says the ban won't be in effect this holiday season.

  Who pays: toy makers and stores lose these sales in New York. The Attorney General can seek up to $15,000 a day for each violation. The sponsor's memo lists the fiscal implications as "TBD."

  The New York State Senate passed it 57-3 and the New York State Assembly 140-0.

  Should New York pause these toys? Which side convinces you?
