notes: >-
  News first: an official action from the last three days (nyassembly.gov actions for S09408, read 2026-11-25:
  "11/24/2026 SIGNED CHAP.416", "11/24/2026 APPROVAL MEMO.14"); found on the governor's newsroom (official), so no
  found_via. No post or open pull request covers it. Takes Nov. 29 9:00 p.m., the earliest post slot at least 3 hours
  away held by an evergreen post (every earlier post slot holds actions from Nov. 17-23, and the Nov. 28 3:00 p.m. hemp
  post is tied to its Dec. 11 date, so it isn't moved past it); this pull request moves the prefiled Texas SB 475 post
  to Dec. 23 3:00 a.m., the first post slot after the last queued post (Dec. 22 3:00 a.m.). Please check: (1) "APPROVAL
  MEMO.14": the governor's approval memo wasn't found where we looked; if it records an agreed chapter amendment, the
  rules may change before Feb. 22, 2027. (2) Feb. 22, 2027 is our count: "the ninetieth day after it shall have become
  a law" from Nov. 24, 2026; the end is "5 years after such effective date". (3) Senate tally 57-3 (Borrello, Gallivan,
  Martins; 1 absent, 2 excused) was read from nysenate.gov through a fetch tool (curl got 403) on two reads that
  agreed; the Assembly tally (140/0) is from nyassembly.gov's floor votes. (4) Text compared: S9408A and A11144B
  sections 1800-1802 and section 2 read the same on nyassembly.gov (HTML sha256 of the S09408 page:
  43847748e0bf90ef2c31c75b5ca0acdcf1dfdc4ebc743dbe106914cd4b7480a6). (5) The memo's justification mentions an
  interagency task force studying the toys; the bill text as passed doesn't create one, so no slide says so. (6)
  "Before" (GBL 1703) is the sponsor's memo's description, not checked in the statute. (7) "Makers call them learning
  tools" restates the memo's "touted as transformational educational tools by their manufacturers"; no maker's
  statement was opened. News reports mention business-group objections; none was opened, so none is quoted. The
  Assembly bill it was substituted for (A11144) isn't named on slides (one bill per post), but its ID is listed. No
  party: the records don't list it.
