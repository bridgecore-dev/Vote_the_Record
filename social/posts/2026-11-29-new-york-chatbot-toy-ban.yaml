  quote: {label: "Chapter 416, new General Business Law section 1801", text: "No person, firm, corporation, association, partnership, business entity, or agent, employee, affiliate, beneficial owner, or subsidiary thereof, shall manufacture, exchange, hold for sale, distribute, or sell any chatbot toy in this state."}
