caption: |-
  If your employer doesn't pay you, Texas law lets you file a wage claim with the Texas Workforce Commission. Today you have 180 days from the day the pay was due.

  HB 1232, filed in the Texas House of Representatives for the 2027 session, would change that to two years. Workers would get more time to file. Employers could face claims about pay that was due up to two years earlier.

  If passed as filed, it takes effect Sept. 1, 2027, for wages due on or after March 5, 2027. No cost estimate is posted yet.

  Owed pay now? The 180-day limit still applies. You can file online or on paper at twc.texas.gov.

  Is 180 days enough time?
