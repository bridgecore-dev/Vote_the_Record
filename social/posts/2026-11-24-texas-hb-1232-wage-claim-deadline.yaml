  statutes.capitol.texas.gov), and TWC's Payday Law wage claim page (180 days; "TWC uses the date the wage claim is
  RECEIVED"; online or paper; only the part within 180 days). "A late claim can't be heard" is our plain words for "The
  180-day deadline is a matter of jurisdiction"; please check the wording. "Who it affects" rows are our plain reading
  of the text: the bill itself names no one beyond employees filing claims. March 5, 2027 is the bill's own date (Sec.
  2). Rep. Hernandez as TLO lists the author, no party shown. Takes Nov. 24's 9:00 p.m. post slot (Nov. 20-21 are full;
