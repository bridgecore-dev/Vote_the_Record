bills:
- id: HB 1232
  does: Would give workers two years, instead of 180 days, to file a claim for unpaid wages with the Texas Workforce Commission.
  affects: Workers whose pay is late or missing, and the employers those claims are filed against.
  where: Filed Nov. 18, 2026 by Rep. Hernandez; no other action yet. Would take effect Sept. 1, 2027.
  summary:
    text: >-
      A wage claim must be filed not later than the second anniversary of [180th day after] the date the wages claimed
      became due for payment.
    title: HB 1232 as filed, Sec. 1 (Labor Code 61.051(c); bracketed words are removed)
    url: https://capitol.texas.gov/tlodocs/90R/billtext/html/HB01232I.htm
    retrieved: '2026-11-19'
