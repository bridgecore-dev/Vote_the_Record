caption: |-
  How does a group like AIPAC take part in federal elections? Its public FEC records show two different kinds of committees.

  AIPAC PAC (FEC ID C00797670) is a PAC connected to the American Israel Public Affairs Committee. A PAC like this can give a candidate up to $5,000 per election. It can also pass along "earmarked" contributions: a donor gives through the PAC and names the candidate, and the gift counts against the donor's own limit. In 2023-2024 the FEC shows $57.87 million in total receipts and $53.70 million in contributions to other committees.

  United Democracy Project (FEC ID C00799031) is a super PAC. AIPAC's website calls it "the AIPAC-backed super PAC." Super PACs can take unlimited contributions and spend on their own ads. In 2023-2024 the FEC shows $87.18 million in total receipts and $37.86 million in independent expenditures.

  Look up any committee at fec.gov/data.
