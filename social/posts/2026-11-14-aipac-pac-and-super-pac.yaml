notes: >-
  Owner idea (local video); the owner asked us to name the group. All numbers are from the fec.gov committee pages
  (financial summary, labels as shown: "Total receipts", "Total disbursements", "Contributions to other committees",
  "Independent expenditures"), 2023-2024 and 2025-2026 (coverage through Oct. 14, 2026, pre-general report).
  The FEC's UDP record (and its Form 1, FEC-1755377) lists no connected organization, so the link between AIPAC and
  UDP rests only on AIPAC's own site ("the AIPAC-backed super PAC"), quoted as AIPAC's words; drop slide 1's quote
  and the caption line if you want FEC-only. Left out: an Oct. 21, 2026 op-ed on aipac.org (by David-Seth Kirshner, marked republished) says AIPAC's PAC will stop endorsing, giving directly and being listed as an earmark; it isn't an AIPAC statement or a filing, so it's not on a slide. If AIPAC or the FEC confirms it, a follow-up post should cover it. The "Earmarked for" receipt type was seen in the FEC's itemized receipts
  for C00797670 (2023-2024); the count or total of earmarked receipts wasn't checked (API rate limit).
  UDP's "Contributions to other committees" ($3.55M / $13.13M) is left off: the page doesn't say to whom.
