caption: |-
  HB 1282 (Texas House of Representatives, filed Nov. 24) and SB 349 (Texas Senate, filed Nov. 12) have the same text. They would create an office of community violence intervention and prevention in the Department of State Health Services.

  The office would write a public health strategy, run an awareness campaign, post a county-by-county directory of services, and give grants to counties, cities and community groups in communities with a high incidence of violence. Counties and cities would pass at least 50% on to community groups, tribes or safety agencies.

  Cost: the bill sets no dollar amount; the office would seek gifts, grants and donations. No fiscal note is posted yet. If passed as filed, it takes effect Sept. 1, 2027.

  How we picked: every bill on the Nov. 24 filing report about violence prevention. HB 1282 was the only one. Should Texas have this office?

  Voice: computer-generated (Kokoro text-to-speech).
