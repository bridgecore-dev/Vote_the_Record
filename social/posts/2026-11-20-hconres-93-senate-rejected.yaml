notes: >-
  New this run: U.S. Senate vote 269 (Nov. 19, 2:01 p.m. ET), the result of the vote the Nov. 19 10:30 a.m. Reel
  (2026-11-19-iran-war-powers-senate-vote) said was coming. Tally, "1/2" majority requirement and party counts are
  counted from vote_119_2_00269.xml; party as the Senate lists it. The smaller side (48 Yea) is over 40, so no names.
  Congress.gov actions (read via api.congress.gov 2026-11-19) don't show the Senate vote yet; the Senate XML is the
  record. No for/against quotes: the Nov. 19 Congressional Record wasn't out yet; a case for/against could be a
  follow-up post once it is. "1983 law" = P.L. 98-164 sec. 1013 (50 U.S.C. 1546a), per CRS IF13134, which says it
  provides "expedited consideration of a joint resolution or bill, rather than a concurrent resolution". "Still the
  law" paraphrases CRS on Section 5(b) (the 30-day extension isn't on the slide). Not checked: whether a joint
  resolution on Iran is pending (one bill per post, so none is named).
