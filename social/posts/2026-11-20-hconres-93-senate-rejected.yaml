caption: |-
  On Nov. 19, the U.S. Senate rejected H.Con.Res. 93, the Iran war powers resolution, 48-51, with 1 senator not voting (vote 269). It needed a simple majority.

  Yea was a vote to direct the President to remove U.S. Armed Forces from hostilities against Iran unless Congress declares war or authorizes force. Nay was a vote not to.

  By party, as the U.S. Senate records it:
  Republican: 3 Yea, 50 Nay.
  Democratic: 43 Yea, 1 Nay, 1 didn't vote.
  Independent: 2 Yea.

  The U.S. House of Representatives had passed it 220-204 on Sept. 15. Both chambers had to agree, so nothing changes.

  It was a concurrent resolution, which the U.S. Senate's guide says doesn't need the President's signature. A joint resolution or bill would, and a 1983 law gives one on removing forces a fast track (Congressional Research Service).

  Every senator's vote is in vote 269 at senate.gov.

