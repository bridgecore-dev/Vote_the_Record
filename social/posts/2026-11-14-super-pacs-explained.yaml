caption: |-
  Until 2010, federal law barred corporations and unions from paying for ads for or against federal candidates out of their own treasuries. They could set up a PAC, which raised money from people within limits.

  Two rulings changed that. In Citizens United v. FEC (Jan. 21, 2010), the Supreme Court said corporations and unions may spend their own money on independent expenditures: ads for or against a candidate that aren't made with the candidate. In SpeechNow.org v. FEC (March 26, 2010), a federal appeals court said groups that only make those ads can take contributions of any size. Those groups are called super PACs.

  FEC tables show $388.6 million in independent expenditures in 2009-2010 and $4.43 billion in 2023-2024, not adjusted for inflation.

  Five justices said limits on this spending violate the First Amendment. Four disagreed, warning that it could cost the public's trust. We quote both sides in their own words. Which side convinces you?
