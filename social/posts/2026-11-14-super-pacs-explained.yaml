notes: >-
  Owner idea (local video). Opinion text read from the official U.S. Reports bound volume 558 (Citizens United begins
  at p. 310); quotes checked at 349, 357, 453, 466 and the syllabus. "5 justices / 4 justices": Kennedy's opinion was
  joined in full by Roberts, Scalia, Alito and by Thomas except Part IV; Stevens' dissent in part was joined by
  Ginsburg, Breyer, Sotomayor (syllabus). Part IV (disclosure) was 8-1, with Thomas dissenting; slide 6 says only that
  both sides kept the reporting rules. Numbers: FEC IE Table 1 (24-month) totals, "Total Independent Expenditures"
  (2010 and 2012 from the 2012 table's two columns). No pre-2010 total is used: the 2008 table on fec.gov is itemized
  rows only, not a summary, so the series starts in 2009-2010 (the first cycle after the ruling, which came Jan. 2010).
  The 2009-2010 row includes spending from before the ruling. Check that the 2023-2024 total includes hybrid PACs
  ($1.37 billion), as the table does.
