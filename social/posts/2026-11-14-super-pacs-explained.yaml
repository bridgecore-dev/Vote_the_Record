- kicker: Money in politics, before 2010
  head: Federal law barred corporations and unions from paying for ads for or against federal candidates out of their own treasuries.
  quote: {label: "Citizens United v. FEC, 558 U.S. 310, syllabus", text: "federal law prohibits corporations and unions from using their general treasury funds to make independent expenditures for speech that is an “electioneering communication” or for speech that expressly advocates the election or defeat of a candidate."}
  text: They could still set up a PAC, a separate committee that raised its own money from people, within contribution limits.
  seconds: 7
- kicker: What changed
  big: '2010'
  head: Two court rulings that year changed the rules for spending that isn't made with a candidate.
  rows:
  - [Jan. 21, "Citizens United v. FEC (Supreme Court): corporations and unions may spend on their own"]
  - [Mar. 26, "SpeechNow.org v. FEC (appeals court): no limit on what people give groups that only do that"]
  quote: {label: fec.gov, text: "Super PACs (independent expenditure only political committees) are committees that may receive unlimited contributions from individuals, corporations, labor unions and other PACs"}
  seconds: 7
- kicker: What the numbers show
  big: $4.43 billion
  head: Independent expenditures reported to the FEC in 2023-2024, up from $388.6 million in 2009-2010.
  rows:
  - ['2009-2010', '$388.6 million']
  - ['2011-2012', '$1.25 billion']
  - ['2015-2016', '$1.63 billion']
  - ['2019-2020', '$3.14 billion']
  - ['2023-2024', '$4.43 billion, $2.72 billion of it by super PACs']
  text: FEC totals for each two-year cycle, not adjusted for inflation. The tables don't say why spending rose.
  seconds: 7
- kicker: "The case for: 5 justices"
  head: The majority said the First Amendment bars limits on political speech because the speaker is a corporation.
  quote: {label: "Majority opinion, 558 U.S. at 349", text: "If the First Amendment has any force, it prohibits Congress from fining or jailing citizens, or associations of citizens, for simply engaging in political speech."}
  text: "“independent expenditures, including those made by corporations, do not give rise to corruption or the appearance of corruption.” (at 357)"
  seconds: 8
- kicker: "The case against: 4 justices"
  head: The dissent said Congress may limit corporate election spending to keep people's trust in government.
  quote: {label: "Dissent, 558 U.S. at 453", text: "A democracy cannot function effectively when its constituent members believe laws are being bought and sold."}
  text: "“corporations have no consciences, no beliefs, no feelings, no thoughts, no desires. … they are not themselves members of ‘We the People’ by whom and for whom our Constitution was established.” (at 466)"
  seconds: 8
- kicker: You decide
  head: More speech, or more influence? The Court split 5-4. Both sides kept one thing.
  quote: {label: "FEC summary of the ruling", text: "The Court upheld the reporting and disclaimer requirements for independent expenditures and electioneering communications."}
  text: That's why you can look up who funds these groups at fec.gov/data.
