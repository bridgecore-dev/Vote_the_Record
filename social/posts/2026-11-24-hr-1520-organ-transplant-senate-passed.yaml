bills:
- id: H.R. 1520
  title: Charlotte Woodward Organ Transplant Discrimination Prevention Act
  does: "Would bar transplant providers from denying organ transplants on the basis of a disability, with an exception."
  affects: "People with disabilities who need transplants, and the providers and programs that do transplants."
  where: "Passed the U.S. House June 2025. The U.S. Senate passed its own text Nov. 19, 2026. Back to the U.S. House."
  summary:
    text: >-
      An Act to prohibit discrimination on the basis of mental or physical disability in cases of organ
      transplants.
    title: "Title of H.R. 1520, Engrossed Amendment Senate (no CRS summary of the Senate text yet)"
    url: https://www.govinfo.gov/content/pkg/BILLS-119hr1520eas/html/BILLS-119hr1520eas.htm
    retrieved: '2026-11-24'
slides:
- kicker: "U.S. Senate · Nov. 19, 2026"
  big: H.R. 1520
  head: "The U.S. Senate passed its own version of a bill to bar denying organ transplants because of a disability."
- chip: "Before → after"
  head: "Federal disability laws already bar this. The House committee report says enforcement is limited."
  rows:
  - [Today, "The ADA, the Rehabilitation Act and the ACA bar transplant centers from disability discrimination"]
  - [Today, "House report: limited enforcement and no federal guidance"]
  - [After, "No denial, refusal to refer, or waitlist refusal on the basis of a disability"]
  - [After, "Organ allocation criteria can't discriminate on the basis of disability"]
  - [After, "HHS's Office for Civil Rights considers complaints for quick resolution and reports yearly"]
- chip: "What the U.S. Senate changed"
  head: "The U.S. Senate replaced the House text. The biggest change is the exception."
  rows:
  - [House text, "A disability counts only if a physician finds it medically significant"]
  - [Senate text, "After an individualized assessment, consistent with disability law and HHS's rule (45 CFR 84.56)"]
  - [House text, "A support network can make up for not following care rules alone"]
  - [Senate text, "Reasonable changes or aids and services can make up for it"]
- chip: "Who gains, who must change"
  head: "Patients with disabilities gain. Transplant providers must adjust their policies."
  rows:
  - [Gains, "People with disabilities who need an organ transplant"]
  - [Must change, "Transplant providers: reasonable changes to policies, practices or procedures"]
  - [Limit, "Not if a change would fundamentally alter the program"]
