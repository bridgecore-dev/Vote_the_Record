  head: "Sponsor: Rep. Kat Cammack (R-FL). The U.S. House of Representatives passed it by voice vote, June 23, 2025."
  text: "The U.S. Senate passed a different text by unanimous consent on Nov. 19, 2026, so it goes back to the U.S. House next. Should federal law spell this out? Tell us."
caption: |-
  The U.S. Senate passed H.R. 1520, the Charlotte Woodward Organ Transplant Discrimination Prevention Act, on Nov. 19, 2026, with a new text. The U.S. House of Representatives passed the original in 2025, so it goes back to the U.S. House.

  Before: federal disability laws already bar transplant discrimination; a House report says enforcement is limited. After: no denying a transplant, a referral or a waitlist spot on the basis of a disability.

  What changed: the House text let a disability count only if a physician found it medically significant. The Senate text allows it after an individualized assessment, consistent with disability law.

  Should federal law spell this out?
