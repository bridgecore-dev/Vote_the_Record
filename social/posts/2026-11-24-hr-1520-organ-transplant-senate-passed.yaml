bills:
- id: H.R. 1520
  title: Charlotte Woodward Organ Transplant Discrimination Prevention Act
  does: "Would bar transplant providers from denying an organ transplant solely because of a disability, with a medical exception."
  affects: "People with disabilities who need transplants, and health care providers and transplant hospitals."
  where: "Passed the U.S. House June 23, 2025, and the U.S. Senate by unanimous consent Nov. 19, 2026."
  summary:
    text: >-
      This bill expressly prohibits health care providers and other entities involved in matching donated organs
      with recipients from denying or restricting an individual's access to organ transplants solely on the basis
      of the individual's disability, except in limited circumstances.
    title: Congressional Research Service summary of H.R. 1520
    url: https://www.congress.gov/bill/119th-congress/house-bill/1520
    retrieved: '2026-11-19'
