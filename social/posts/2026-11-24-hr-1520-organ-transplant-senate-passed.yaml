notes: >-
  New this run: the Senate Press Gallery's Nov. 19 log (12:37-1:09 p.m. entries) says "Passed by unanimous
  consent- H.R. 1520-Charlotte Woodward Organ Transplant Discrimination Prevention Act". Congress.gov actions (read
  this run) end at the Senate referral (June 24, 2025), so whether the Senate changed the text isn't confirmed: the
  post says "if that's the same text". Please check congress.gov or the Nov. 19 Record for "without amendment"
  before the slot; if so, the last slide can say it goes to the President, and if the President has signed it by
  then, update "where". The CRS summary is of the introduced bill; the House report says the committee reported
  it without amendment and the House action is "pass the bill" (not "as amended"), and the engrossed text matches
  the summary's points (secs. 3-4). "Today" rows are the report's Background section; "After" and the exception
  are secs. 4(a), 4(b), 4(c) and 4(e) of the engrossed text. Cost line: the report's budget-authority finding and
  its note that CBO's estimate "was not available"; congress.gov lists no CBO estimate. Committee vote 46-1 from
  the report (April 29, 2025). Sponsor's party and state as congress.gov lists them. No case against was found:
  the report has no dissenting views and both chambers passed it without a recorded vote. S. 3321, also passed
  Nov. 19, is a Senate bill the House hasn't passed, so it's outside the rule.
