caption: |-
  The U.S. Senate passed H.R. 1520, the Charlotte Woodward Organ Transplant Discrimination Prevention Act, by unanimous consent on Nov. 19, 2026. The U.S. House of Representatives passed it by voice vote on June 23, 2025.

  Before: the Americans with Disabilities Act, the Rehabilitation Act and the Affordable Care Act already bar transplant centers from disability discrimination. The House committee report says there is limited enforcement and no federal guidance. After: providers and transplant hospitals couldn't deny a transplant, refuse a referral, or refuse to put someone on a waiting list solely because of a disability. A disability could count only if a physician, after an individualized evaluation, finds it medically significant. Complaints would go to the Office for Civil Rights at the Department of Health and Human Services.

  Cost: the committee found no new spending authority; CBO's estimate wasn't ready when it reported. The committee approved it 46-1.

  Should federal law spell this out?
