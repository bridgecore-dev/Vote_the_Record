notes: >-
  Nov. 24 update (step 2a recheck): congress.gov actions (API, read 2026-11-24) now say "Passed Senate with an
  amendment by Unanimous Consent" on Nov. 19 (S.Amdt. 7028, "In the nature of a substitute"), message sent to the
  House Nov. 20. The earlier version of this post described the House text and said "if that's the same text, it
  goes to the President next"; it isn't, so it goes back to the House. Changed: slide 1 head, the "After" rows
  (now from the Senate engrossed amendment, secs. 3, 4(a), 4(d), 4(e)), a new "What the U.S. Senate changed" slide
  (House sec. 4(b)(1)(A) and 4(b)(2) vs. Senate sec. 4(b)(1) and 4(b)(2)) in place of the old exception slide,
  "Who gains" rows (Senate sec. 4(c)(1): "fundamentally alter the nature of the program or activity"), the last
  slide, `where`, `does`, `affects`, and the caption. The CRS summary on congress.gov is still only for the
  introduced bill and says "solely", which the Senate text drops, so the bill's summary now quotes the Senate
  text's title. "Reports yearly" is sec. 4(e) (annual HHS report to Congress on complaints). 45 CFR 84.56 is HHS's
  "Medical treatment" section of its Section 504 rule (eCFR, read 2026-11-24); the bill names it in sec. 4(b)(1).
  Cost: the bill record lists no CBO estimate (API, cboCostEstimates empty); the House report's no-new-budget-
  authority finding was for the House text, and the slide says "House committee". "Today" rows are still the
  House report's Background section. Sponsor's party and state as congress.gov lists them. No case against was
  found: no dissenting views in the report and no recorded vote in either chamber. Slot unchanged.
