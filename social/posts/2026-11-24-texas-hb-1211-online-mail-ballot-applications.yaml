notes: >-
  New: filed Nov. 17, 2026; no earlier post or pull request names it. Rule: of the 41 bills on the Nov. 17 filing report,
  HB 1211 is the only one whose caption is about voting by mail (HB 1209, bond elections, is about what a vote
  decides, not how to vote; left for its own post). Records opened 2026-11-19: the filing report, the bill history
  (filed, no other action; subjects Aging, Elections--Early Voting, Internet, Secretary of State; author shown as
  "Ward Johnson"), the introduced text (90R4401 TSS-D), and Election Code 82.003, 84.001 and 84.007 (read from the
  tcss.legis.texas.gov copy of statutes.capitol.texas.gov). "Within 4 business days" is 84.007(b-1) ("not later than
  the fourth business day after the transmission"). "Voters under 65 would still use paper" is our reading: the new
  84.0091 covers only "a person 65 years of age or older" and 84.001(b) keeps ink-on-paper for everyone else; please
  confirm. The bill doesn't say whether the online application also needs the ID numbers 84.002(a)(1-a) already
  requires on a paper application; the slide lists only what 84.0091(b) says. No fiscal note on the bill's page and no
  official statement for or against was found, so the post gives the record and asks. Takes Nov. 24 1:30 p.m. (Reel
  after the 9:00 a.m. carousel; Nov. 19-23 base slots are full).
