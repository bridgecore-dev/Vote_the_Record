bills:
- id: HB 1211
  does: Would let Texas voters 65 or older apply for a mail ballot online and sign electronically, through a state program.
  affects: Texas voters 65 or older; county early voting clerks; the Texas secretary of state, who would run the program.
  where: Filed Nov. 17, 2026 by Rep. Ward Johnson; no other action yet.
  summary:
    text: >-
      The secretary of state shall implement a program to allow a person 65 years of age or older to complete an
      application for an early voting ballot by mail over the Internet from the official website of this state and
      from the Internet website of the county in which the person is registered to vote.
