caption: |-
  Today, Texans 65 or older can vote by mail, but the application has to be signed in ink on paper. Texas law says an electronic or photocopied signature is not permitted. A faxed or emailed scan counts only if the paper copy also reaches the clerk by mail within 4 business days.

  HB 1211, filed in the Texas House of Representatives for the 2027 session, would have the Texas secretary of state set up an online application for voters 65 or older, on the state's website and each county's. You could sign electronically, the application would go straight to your county's early voting clerk, and you could check its status. To apply, you would give your name and voter registration number or address, your Texas driver's license or ID card number, and the last 4 digits of your Social Security number. Voters under 65 who vote by mail for other reasons would still use paper.

  No cost estimate is posted yet. If passed as filed, it takes effect Sept. 1, 2027.

  Paper only, or online too?

