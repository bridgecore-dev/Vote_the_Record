caption: |-
  In 2022, Congress allowed a privately funded memorial to Thomas Paine in Washington, D.C. Paine wrote Common Sense, the 1776 pamphlet that argued for breaking from Britain.

  D.C. is split into areas for memorials. Area I is kept for subjects of "preeminent historical and lasting significance to the United States," and a memorial there needs Congress's own approval. H.R. 9600, on the House schedule this week, gives that approval and says the Paine memorial must be built in Area I.

  The committee approved it by unanimous consent. It had asked for, but not received, a cost estimate from CBO.

  Who belongs in Area I? Tell us below.
