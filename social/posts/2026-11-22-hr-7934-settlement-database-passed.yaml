notes: >-
  New: congress.gov actions (read this run) show H.R. 7934 "Passed/agreed to in House: On motion to suspend the rules
  and pass the bill Agreed to by voice vote" on Nov. 18 at 3:12 p.m. ET. The Nov. 15 carousel
  (2026-11-15-settlement-agreement-database-act) covered it only as a scheduled bill; the slides on what it does are
  kept from that post and rechecked word by word against the introduced text this run. The text passed is the
  introduced one: the action says "pass the bill" (not "as amended") and docs.house.gov's week list links the IH text,
  even though the committee had ordered it reported amended (40-0, March 18); no committee report or reported text is
  on GovInfo. "No recorded vote was taken": the actions list no yeas-and-nays demand and no roll call. "Chair judges which side is louder" paraphrases House Practice ch. 58 sec. 9 ("based on the volume
  of sound produced by Members"). No official case for or against was found (no report; the Nov. 18 debate in the
  Record wasn't opened). Cost: CBO publication 62441 (May 19) is listed on congress.gov; cbo.gov returned 403 this
  run, not retried. Sponsor's and cosponsor's party and state as the bill record lists them. Takes the Nov. 22 12:00
  p.m. post slot; pair with the 10:30 a.m. Reel on H.R. 4464 (meant to be merged together).
