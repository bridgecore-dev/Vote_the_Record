notes: >-
  New this run: the Senate Press Gallery's Nov. 18 log says Sen. Scott "asked unanimous consent to pass S. 4524;
  Senator Tillis objected" (5:42 p.m.). The post rests on the Nov. 18 Congressional Record (GPO daily PDF, pages
  S5750-S5751, "UNANIMOUS CONSENT REQUEST—S. 4524"); every quote was copied from it. Current law from GPO's 2024
  U.S. Code: 207(e)(1)(A) "within 2 years" for Senators, (B) "within 1 year" for House Members and elected House
  officers; please confirm no later law changed 207(e). Penalties from 216(a)(1)-(2) and (b). Bill text: sec. 2(a)
  "at any time after" is the long title's wording; the new 207(e)(1)(A) bars registering under LDA sec. 4, and
  sec. 2(d) applies it only to those who leave office on or after enactment. Sec. 2(b) (former members paid for
  lobbying activities count as "lobbyist") is not on a slide. No CRS summary or CBO estimate exists (api.congress.gov,
  read this run), so the explainer quotes the long title. CRS lists an identical House bill; not named (one bill per
  post). Tillis's reading of the bill is his quoted words; we don't say whether it is right. Party and state: Scott
  and Warren as congress.gov lists them; Tillis as the Senate's vote 272 XML lists him (R-NC). Nobody voted, so there
  is no tally. The Senate glossary page on unanimous consent redirected (moved), so slide 2's plain-words line rests
  on the request and "Is there an objection?" in the Record itself. News first: takes the Nov. 23 3:00 p.m. post
  slot (every earlier post slot holds this week's actions, and Nov. 23 9:00 a.m. is taken by the Coker pull
  request) and moves the evergreen 2026-11-21-texas-hb-1175-first-responder-fee-waivers (a prefiled bill) to
  2026-12-04T03:00:00-06:00, the first post slot after the last queued post that keeps each day's turns.
