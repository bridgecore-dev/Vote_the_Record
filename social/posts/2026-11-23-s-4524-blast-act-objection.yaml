caption: |-
  On Nov. 18, Sen. Rick Scott (R-FL) asked the U.S. Senate to pass S. 4524, the BLAST Act, by unanimous consent: on the spot, with no roll call, if no senator objects. Sen. Thom Tillis (R-NC) objected, so the bill stays in the Senate Judiciary Committee.

  Now: former senators can't lobby Congress for 2 years after leaving, and former House members for 1 year (18 U.S.C. 207(e)).
  After: the bill would make that ban permanent, and also bar registering as a lobbyist. It covers only people who leave office after it becomes law.

  For: Scott, who introduced it with Sen. Elizabeth Warren (D-MA), said former members shouldn't turn their position "into a lobbying business targeting your former colleagues."
  Against: Tillis said that under the bill, even an unpaid call for a cause like Alzheimer's research or for veterans would be "breaking the law."

  No cost estimate is listed. Which side convinces you?
