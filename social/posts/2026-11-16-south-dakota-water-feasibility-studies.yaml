caption: |-
  Should three new water projects on the Missouri River be built? H.R. 9785, on the House schedule this week, would order studies to find out.

  Before: no law directs these studies. After: the Interior Department studies three projects to bring Missouri River water to towns, farms and businesses in South Dakota, Iowa, Minnesota and Nebraska, working with the local water systems.

  The federal government would pay up to half of each study, and no more than $10 million each. The water systems pay the rest. Each report must say whether the project should be built, and the local share of building it would be at least 25%. CBO estimates the bill would cost $30 million over 2027-2031, if Congress funds it.

  Should Congress pay half of studies like these? Tell us below.
