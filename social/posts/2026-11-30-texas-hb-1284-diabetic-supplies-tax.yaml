caption: |-
  Texas already doesn't charge sales tax on insulin or blood glucose test strips. HB 1284, filed Nov. 24 in the Texas House of Representatives for the 2027 session, would add more diabetic supplies to that list.

  Added by name: glucose tablets, ketone urine test strips, lancets, insulin pens, blood glucose meters, continuous glucose monitors, insulin pumps, and replacement parts for them.

  Some of these may already be tax-free today when a licensed practitioner prescribes them. The bill's list doesn't say a prescription is needed.

  Buyers would pay less and the state would collect less. No fiscal note is posted yet, so there is no official estimate of how much. The bill would take effect Oct. 1, 2027.

  Should Texas stop charging sales tax on these supplies?
