notes: >-
  New: filed Nov. 24, 2026; the only bill on that day's filing report (5 bills: HB 1282-1286) whose caption names
  diabetes. Records opened 2026-11-24: the filing report, the bill history (filed, no other action, no fiscal note
  listed; author listed as "Ochoa"; subjects Taxation--Sales, DIABETES), the introduced PDF (the HTML version says
  "coming soon"; PDF sha256 b5a90c1f17858ee4068d85416df27b7cc9c575c35943220a5b457af6705c1ae5), and Tax Code ch. 151
  on tcss (151.051(b): "6-1/4 percent"; 151.313(a) as it reads today). The change was found by comparing the bill's
  151.313(a)(12) with the current statute: today it reads only "blood glucose monitoring test strips"; the bill adds the
  seven items and replacement parts. The bill's only other change to (a) is spelling ("signalling" to "signaling" in
  (a)(8)), left out. "May already be tax-free when prescribed" rests only on 151.313(a)(6)'s text; the post doesn't say
  which items qualify, since the Comptroller's rule (34 TAC 3.284) was only seen on unofficial copies this run; please
  confirm the wording. "The state would collect less" and "sellers would stop collecting" are our plain reading of an
  exemption; local sales taxes are left out. A 2025 bill (89R HB 3855) seen in search results listed similar items; its
  history wasn't opened, and it isn't named (one bill per post). No fiscal note or
  statement for or against exists yet, so the post asks. Rep. Ochoa as TLO lists the author, no party shown.
  Evergreen (a prefiled bill): Nov. 30 3:00 p.m. is the first free post slot that keeps the Reel/post turn (Nov. 29
  9:00 a.m. would follow the 3:00 a.m. carousel with the 6:00 a.m. Reel slot empty).
