caption: |-
  HB 1273, filed in the Texas House of Representatives for the 2027 session, would add a new chapter of state law for big data centers: 20 megawatts or more, or 50,000 square feet or more of computing space.

  For two years after it takes effect, no permits and no new power hookups for new or expanded projects. Centers already running could keep operating at their allowed size.

  After that, each project would need a majority of local voters (city and county voters both, inside a city), a state impact permit, and a yearly payment to county residents: 2% of gross receipts or $10,000 per megawatt, whichever is more, split equally per person.

  Today, certified data centers don't pay the 6.25% state sales tax on items like servers and cooling. The bill would end that break the day it takes effect.

  No fiscal note is posted yet. Should local voters decide on big data centers?
