notes: >-
  New: filed Nov. 20, 2026; no post or open pull request names it. Rule: the Nov. 20 filing report (35 bills) has three
  bills whose captions name data centers; HB 1273 is the only one naming a moratorium and local option elections (the
  others are a sales-tax-exemption repeal and a disclosure bill, left for their own posts). Records opened 2026-11-24:
  the filing report, the bill history (filed, no other action, no fiscal note; author listed only as "Castellano"), the
  introduced text (HTML and PDF; PDF sha256 282eb51c499b7a73bc3e8b40f2ad1d5ea5ac9ec3025d8698e14fa55dd1fd9015), and the
  Comptroller's data center page (6.25% state tax, servers and cooling, 10 or 15 years for a qualifying data center,
  20 years for a large project). Please check: (1) "No such pause in state law" is our reading that the bill creates a
  new chapter (Sec. 1 adds Chapter 398); we didn't search all of state law for another moratorium. (2) "No state or
  local permit, and no utility hookup" is 398.051(a) ("a state agency or political subdivision may not issue a permit
  ... and a utility may not energize"). (3) The yearly payment applies only to projects first permitted after the
  effective date (Sec. 7(c)); the moratorium ends on the second anniversary (Sec. 7(b)). (4) "Any county resident can
  ask" is 398.153(b) (a resident is an "affected person"). (5) The $1 million example is our arithmetic from
  398.202(a)(2). (6) Sec. 2 also removes the electricity exemption for certified data centers (151.317(a)(9)); left
  out for space. Section 6(a): existing exemptions expire on the effective date; 6(b): pending applications denied. No
  fiscal note or official statement for or against was found, so the post gives the record and asks. Evergreen (a
  prefiled bill): Dec. 2 3:00 a.m. is the first free post slot that keeps the Reel/post turn (Dec. 1 3:00 p.m. would
  follow the 9:00 a.m. post with the 12:00 p.m. Reel slot empty).
