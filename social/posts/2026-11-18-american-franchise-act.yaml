caption: |-
  A bill on the House floor schedule this week, H.R. 5267, the American Franchise Act, decides when a brand company (the franchisor) counts as a "joint employer" of the workers at a franchise it doesn't own.

  Before: the labor board's rule, reinstated in February, requires direct control. Under wage law, courts use different tests.
  After: one test, written into both laws, for franchisors only: they count as joint employers only if they regularly exercise direct and immediate control, such as hiring or firing workers directly. Setting a store's hours doesn't count.

  For: the committee report says the rule has changed with each administration. Against: the minority views say franchise owners would be left solely liable and workers without full access to justice. The committee report has no CBO cost estimate.

  Which side convinces you?
