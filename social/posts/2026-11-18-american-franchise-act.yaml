notes: >-
  Picked by rule: the two bills the House floor schedule (week of Nov. 16, as of Nov. 13 5:02 p.m.) lists under a
  rule; H.R. 3495 gets a matching post (PR #88). The schedule says items "may be considered"; if the House votes
  before Nov. 18 5:30 p.m., the first and last slides need the tally instead. CBO's estimate (Oct. 7, 2026,
  https://www.cbo.gov/publication/62842, listed in the GovInfo bill status) couldn't be opened (cbo.gov bot check,
  not retried), so the post gives no figure; add it if you can open it. The NLRA history (2020 rule, 2023 rule
  vacated by E.D. Tex. in 2024, 2020 rule reinstated Feb. 27, 2026) is from the committee report and the CRS
  summary. "Courts use different tests" restates the report ("Federal courts across the country have developed
  various tests"). Sponsor's party and state as the bill status lists them; 158 cosponsors counted from it. The
  15-18 amendment was offered by Ranking Member Scott; the post doesn't name him or give the committee's votes by
  party, which the report doesn't list.
