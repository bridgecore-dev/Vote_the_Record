  New this run: the Senate Press Gallery's Nov. 19 log (7:45 p.m.) lists "S.2479 Reserve Organization of America
  Charter Amendments Act of 2025, with Blackburn substitute amendment" among bills Sen. Moreno passed by unanimous
  consent; congress.gov actions read "Passed Senate with an amendment by Unanimous Consent" (Nov. 19) and "Held at
  the desk" in the House (Nov. 20). Not in any post. The engrossed text on GovInfo is the passed substitute (sha256 of
  the HTML: 2f4bce60c5b4d677a0d6371c17b409b7d0fa0dfda623f05feb7f2b8e5f6ce1fd). Before/after compares it with GPO's
  2023 U.S. Code chapter 1901: dropped are 190103(b) (one vote per active member), the detailed 190104 governing
  body, the D.C. headquarters (190108), state agents (190110(b)), and 190112 plus the dissolution exception in
  190107(d) (assets divided equally among officers and members). uscode.house.gov returned 404, so please confirm no
  law since 2023 changed chapter 1901. "The bill text spends no money": the text has no appropriation or
  authorization of funds; congress.gov lists no CBO estimate and no CRS summary. No committee report or floor
  statement for or against was found, so the post asks the reader. Identical-or-related House bill H.R. 10179 (CRS:
  "Related bill") isn't named (one bill per post). News first: takes the Nov. 25 3:00 p.m. post slot from the
  evergreen Texas HB 1232 post (prefiled bill), which moves to Dec. 11 3:00 a.m., the first free post slot after the
  last queued post that keeps the Reel/post turn.
