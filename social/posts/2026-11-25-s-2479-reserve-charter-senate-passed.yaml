caption: |-
  On Nov. 19, the U.S. Senate passed S. 2479 by unanimous consent. It rewrites the federal charter of the Reserve Officers Association of the United States, one of the nonprofits whose rules Congress writes into Title 36 of the U.S. Code.

  Before: the law names the group, puts its headquarters in D.C., lists its officers and executive committee, gives each active chapter member one vote, and splits leftover assets equally among officers and members if it closes.

  After: the name becomes Reserve Organization of America. Its governing body picks the headquarters, its own constitution defines its governing body, and the one-vote and asset-split rules are gone. The bans on profit, stock and political contributions stay.

  Who gains: the organization. Who gives: members lose protections written into law. Congress.gov lists no CBO estimate.

  Sponsor: Sen. Marsha Blackburn (R-TN). Cosponsor: Sen. Richard Blumenthal (D-CT). Next: the U.S. House of Representatives.

  Should Congress set a group's rules, or its members?
