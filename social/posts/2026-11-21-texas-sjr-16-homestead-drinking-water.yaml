caption: |-
  Today, a Texas city or county can exempt up to 20% of a home's value from its property tax. No homestead exemption in the Texas Constitution is tied to drinking water.

  SJR 16, filed in the Texas Senate for the 2027 session, proposes a constitutional amendment. It would let the Legislature allow a city or county to exempt a homestead with no access to drinkable water from that city's or county's property tax, on the home's total value. Each city or county would choose whether to adopt it, and the law could limit it to certain areas. That city or county would then collect no property tax on those homes. No cost estimate is posted yet.

  It needs two-thirds of all members of the Texas Senate and the Texas House of Representatives. Then voters would decide on Nov. 2, 2027.

  Should a home without drinking water pay property tax?

