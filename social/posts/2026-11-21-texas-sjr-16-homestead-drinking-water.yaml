bills:
- id: SJR 16
  does: Would let Texas allow cities and counties to fully exempt homes without drinking water from their property tax.
  affects: Owners of homesteads without access to drinkable water, and the cities and counties that tax them.
  where: Filed Nov. 16, 2026 by Sen. West; no other action yet.
  summary:
    text: >-
      The legislature by general law may provide that the owner of a residence homestead that does not have access to
      potable drinking water is entitled to an exemption from ad valorem taxation by a municipality or county of the
      total appraised value of the residence homestead
    title: SJR 16 as filed (Sec. 1, new Texas Constitution Art. VIII, Sec. 1-b(v))
    url: https://capitol.texas.gov/tlodocs/90R/billtext/html/SJ00016I.htm
    retrieved: '2026-11-17'
  say: SJR 16 would let Texas allow cities and counties to fully exempt homes without drinking water from their property
    tax. It was filed November 16 by Senator West, with no other action yet.
