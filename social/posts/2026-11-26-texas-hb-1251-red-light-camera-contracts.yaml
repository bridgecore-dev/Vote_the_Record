caption: |-
  Since 2019, Texas law has said a city or county may not run red-light cameras or ticket drivers from their photos.

  The 2019 law had an exception: a place that already had a camera ordinance and contract before May 7, 2019 could keep its cameras until that contract ran out, unless the contract let it end early if state law changed.

  HB 1251, filed in the Texas House of Representatives for the 2027 session, would repeal that exception and add one line to the law: "A contract that violates this chapter is void."

  No official count of how many of those contracts remain was found, and no cost estimate is posted yet. If passed as filed, it takes effect Sept. 1, 2027, or right away with a two-thirds vote in each chamber.

  Should old camera contracts run out on their own, or end now?

