notes: >-
  New: filed Nov. 19, 2026; no earlier post covers it. Rule: the Nov. 19 filing report; HB 1251 is the only bill whose
  TLO subjects include "PHOTOGRAPHIC TRAFFIC SIGNALS". Records opened 2026-11-19: the filing report, the bill history
  (filed, no other action; author "Cortez"), the introduced PDF (HTML not posted; 90R4754 AJZ-F; sha256
  d5f03906034d4f183fde6ddd66fa13d924aae7e8d06ecabbb06b38119f8feafa; 3 sections), Transportation Code 707.020 and
  707.021 (rendered from statutes.capitol.texas.gov), and the 2019 law's enrolled text (86R, Acts 2019 ch. 372), Section 7(a)-(c). The bill
  repeals 7(a) and (b), not 7(c) (vehicle registration can't be refused over unpaid camera penalties). "Places" is our
  plain word for "local authority" (Transportation Code 541.002). The 2019 exception also keeps the former law in effect
  for proceedings and penalties under those contracts; the slide doesn't go into that. No source states who gains or
  loses beyond the contracts' parties, and no official statement for or against was found, so the post asks. Takes
  Nov. 27's 12:00 a.m. Reel slot, before the 3:00 a.m. carousel (Nov. 26's noon slot would follow the 6:00 a.m. Reel on main).
