caption: |-
  On Nov. 19, the U.S. Senate passed S. 4538 by unanimous consent. It orders a study of Washington's Trail—1753, about 500 miles from Williamsburg, Virginia, to Fort LeBoeuf (now Waterford), Pennsylvania: the route George Washington took on a diplomatic mission to the French in 1753-54.

  Before: the route isn't on the National Trails System Act's list of routes to study.

  After: it is. The Secretary of the Interior studies whether a trail can be built along the route and whether it can be paid for, and reports to Congress within three full fiscal years. To be a national historic trail, a route must meet three tests in the law: historic use, national significance, and potential for public recreation or historical interest.

  A study isn't a designation. The law says national scenic and historic trails are made only by an act of Congress.

  Sponsor: Sen. John Fetterman (D-PA). Cosponsors: Sens. Capito (R-WV), Justice (R-WV), Kaine (D-VA), McCormick (R-PA), Warner (D-VA).

  Should Congress study more trails like this?

