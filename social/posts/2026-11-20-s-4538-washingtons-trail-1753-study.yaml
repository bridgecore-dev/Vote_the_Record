notes: >-
  New this run: the Senate floor activity page for Nov. 19 lists S. 4538 "Passed Senate without amendment by
  Unanimous Consent"; the slides follow the engrossed text on GovInfo ("Passed the Senate November 19, 2026"). No CRS
  summary yet, so the explainer quotes sec. 2. "The Secretary of the Interior" is from the bill's long title ("direct
  the Secretary of the Interior to conduct a study"); the text itself only adds the route to NTSA 5(c). The rest is
  NTSA sec. 5 in GPO's 2024 U.S. Code: 5(a) "only by Act of Congress"; 5(b) feasibility test, "three complete fiscal
  years" deadline, consultation list, report contents; 5(b)(11)(A)-(C) the three historic-trail criteria (slide 4 is
  our shortened wording; "real potential" in the say is the law's "significant potential"). Please confirm no later
  law changed 5(b). The route passes through Virginia and Pennsylvania per the bill's endpoints; any other states
  aren't named in the bill, so none are on a slide. Both S. 1135 and S. 4538 add a paragraph "(50)" to 5(c); not
  raised. cbo.gov returned 403 this run (estimate: cbo.gov/publication/62787, as reported Sept. 17, 2026), not
  retried. The July 21 subcommittee hearing testimony wasn't opened. No statement for or against was found;
  unanimous consent, so no case-against slide. Sponsor and cosponsors' party and state as congress.gov lists them,
  cosponsors alphabetical. News first: takes the Nov. 23 12:00 p.m. Reel slot from the evergreen prefiled-bill post
  2026-11-18-texas-contribution-limit-bills, which moves to 2026-12-03T00:00:00-06:00 (the S. 1135 pull request
  moves another evergreen Reel to Dec. 2 12:00 a.m., and a second Reel on Dec. 1 or Dec. 2 would put two Reels in a
  row). Paired with the S. 1135 Reel, same layout.
