bills:
- id: HB 473
  does: Would keep Medicaid going for at least 24 months after a pregnancy ends, instead of the 12 months in current law.
  affects: Women in Texas who are eligible for Medicaid for pregnant women.
  where: Filed in the Texas House on Nov. 9, 2026. That is its only action so far.
  summary:
    text: >-
      The commission shall continue to provide medical assistance to a woman who is eligible for medical
      assistance for pregnant women for a period of not less than 24 months following the last month of the
      woman's pregnancy.
    title: "HB 473 (90R), introduced bill text, Sec. 1, as amended (Texas Legislature Online)"
    url: https://capitol.texas.gov/tlodocs/90R/billtext/html/HB00473I.htm
    retrieved: '2026-11-14'
- id: HB 866
  does: Would keep Medicaid going for at least 24 months after a pregnancy ends, instead of the 12 months in current law.
  affects: Women in Texas who are eligible for Medicaid for pregnant women.
  where: Filed in the Texas House on Nov. 9, 2026. That is its only action so far.
  summary:
    text: >-
      The commission shall continue to provide medical assistance to a woman who is eligible for medical
      assistance for pregnant women for a period of not less than 24 months that begins on the last day of the
      woman's pregnancy and ends on the last day of the month in which the 24-month period ends.
    title: "HB 866 (90R), introduced bill text, Sec. 1, as amended (Texas Legislature Online)"
    url: https://capitol.texas.gov/tlodocs/90R/billtext/html/HB00866I.htm
    retrieved: '2026-11-14'
