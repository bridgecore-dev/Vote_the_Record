caption: |-
  Two bills filed in the Texas House on Nov. 9 would keep Medicaid going for at least 24 months after a pregnancy. Current law says 12 months.

  HB 473 and HB 866 have the same official caption and change the same section of the Texas Human Resources Code. Each would take effect Sept. 1, 2027, if passed.
hashtags: [txlege, texaslegislature, medicaid, texas, votetherecord]
notes: >-
  From an owner idea; built only on TLO records opened 2026-11-14 (filing report dated 11/13/2026, both bill
  histories, both introduced texts). "12 months in current law" reads the struck text: both bills strike
  "(2) 12 months that begins on the last day of the woman's pregnancy" (current 32.024(l-1) also lists six
  months after delivery). The summary quotes are Sec. 1 as it would read, with struck text removed and
  underlined text kept. "Keep Medicaid going" is our plain words for "continue to provide medical
  assistance"; please check.
