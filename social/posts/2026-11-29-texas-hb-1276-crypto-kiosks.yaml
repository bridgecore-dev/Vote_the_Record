  text: 'FBI Internet Crime Complaint Center, 2024: 10,956 complaints about crypto ATMs and kiosks.'
- chip: The law today
  head: Texas has a 2023 law for crypto companies that hold customers' money. It doesn't mention kiosks.
  quote:
    label: Texas Finance Code 160.004(a)(1)
    text: commingle customer funds with funds belonging to the digital asset service provider
  text: HB 1276 would add a new chapter, Chapter 161, only for virtual currency kiosks. The 2023 law says a provider may not
- chip: The warning
  head: Before a first purchase, the kiosk would have to show this warning in bold, and the customer would have to acknowledge it.
  quote:
    label: HB 1276 as filed, Finance Code 161.003(b)
    text: 'WARNING: LOSSES DUE TO FRAUDULENT OR ACCIDENTAL TRANSACTIONS ARE NOT RECOVERABLE AND TRANSACTIONS IN VIRTUAL CURRENCY ARE IRREVERSIBLE.'
  text: The same warning goes on to name scammers who impersonate loved ones or threaten jail time.
- chip: What would change
  head: What a kiosk would have to do, under the bill as filed
  rows:
  - [Risks, "Shown on screen before a first purchase, then acknowledged"]
  - [Each sale, "Dollar amount, fees, exchange rate, and markup shown first"]
  - [Receipt, "Paper, e-mail or text, with fees and transaction ID"]
  - [New customers, "$2,000 a day, for the first 72 hours"]
  - [Fraud, "Fees refunded if an agency reports the sale was induced by fraud"]
- chip: The fine print
  head: The refund in the bill covers the operator's fees. It doesn't mention returning the money sent.
  quote:
