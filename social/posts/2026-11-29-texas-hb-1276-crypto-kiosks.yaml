caption: |-
  People reported losing $246.7 million through crypto ATMs and kiosks in 2024, in 10,956 complaints to the FBI's Internet Crime Complaint Center. That's nationwide.

  HB 1276, filed in the Texas House of Representatives for the 2027 session, would set rules for kiosks in Texas. Before a first purchase, a kiosk would have to show risk warnings and a bold scam warning. Each sale would show its fees and markup, and come with a receipt. New customers would be limited to $2,000 a day for their first 72 hours.

  If a government agency finds a sale was a fraud, the operator would refund its fees. The bill doesn't mention returning the money sent.

  Operators would have until Sept. 1, 2028 to comply. No cost estimate is posted yet.

  Should Texas set rules like these for crypto kiosks?
