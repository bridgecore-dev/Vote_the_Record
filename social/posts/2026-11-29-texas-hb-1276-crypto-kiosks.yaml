bills:
- id: HB 1276
  does: Would require crypto kiosks in Texas to show risk and scam warnings, give receipts, and cap new customers at $2,000 a day.
  affects: Companies that run virtual currency kiosks in Texas and the people who use them.
  where: Filed Nov. 23, 2026 by Rep. Plesa; no other action yet. Would take effect Sept. 1, 2027.
  summary:
    text: >-
      A maximum daily transaction limit of $2,000 is established for each customer of a virtual currency kiosk located
      in this state for whom not more than 72 hours has elapsed from the time the person first signed up as a customer.
    title: HB 1276 as filed, Sec. 1 (Finance Code 161.008)
    url: https://capitol.texas.gov/tlodocs/90R/billtext/html/HB01276I.htm
    retrieved: '2026-11-24'
