notes: >-
  New: filed Nov. 23, 2026; the only bill on that day's filing report (8 bills) whose caption is about virtual currency.
  Records opened 2026-11-24 (UTC; Nov. 23 evening Central): the filing report, the bill history (filed, no other action,
  no fiscal note listed; author listed as "Plesa"), the introduced text (90R5349 PRL-F), Finance Code ch. 160 (tcss;
  added 2023 by H.B. 1666; the word "kiosk" doesn't appear in it), and the FBI IC3 2024 report (p. 36: "Cryptocurrency
  ATMs/Kiosks 10,956 Complaints; $246.7 Million in Losses"; PDF sha256
  ba494b0a1bd991c722cf65619eb518329175b898fb508e8c84fc7dd12e07cac0). The FBI figures are national and for 2024; the
  slide and caption say so. The post doesn't claim no other Texas law reaches kiosk operators (Chapter 151 money
  transmission licensing may), only that Chapter 160 doesn't mention kiosks. "Markup" restates 161.004(b)(6) ("the
  difference in the virtual currency's sale price compared to the current market price"); "transaction ID" restates
  "transaction hash". "Doesn't mention returning the money sent" is our reading of 161.007(c), which names only fees;
  please confirm. ftc.gov refused this run (403), so the FTC's kiosk data spotlight isn't used. No fiscal note or
  statement for or against exists yet, so the post asks instead. Rep. Plesa as TLO lists the author, no party shown.
  Evergreen (a prefiled bill): Nov. 29 3:00 p.m. is the first free post slot that keeps the Reel/post turn (after the
  Nov. 29 12:00 p.m. Reel; Nov. 29 9:00 a.m. would follow the 3:00 a.m. carousel with no Reel between).
