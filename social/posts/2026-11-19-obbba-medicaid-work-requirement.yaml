caption: |-
  One Big Beautiful Bill Act: what changes in 2027.

  Before: Medicaid law had no work requirement. After, from Jan. 1, 2027: many expansion adults 19 to 64 must show 80 hours a month of work, service, a work program, or school half-time, or $580 a month in income (the 2026 figure). Pregnant people and parents of a child 13 or under are among those excluded.

  New on Nov. 13: states may choose not to deny or remove anyone solely for missing it, through June 30, 2027.

  CMS projects 2.3 million fewer people on Medicaid in fiscal year 2027, and $350.3 billion less federal spending over 10 years.

  For: Sen. John Barrasso (R-WY). Against: Sen. Mazie Hirono (D-HI). Which side convinces you?

  Voice: computer-generated (Kokoro text-to-speech).
