notes: >-
  Part of the "One Big Beautiful Bill Act: what changes in 2027" series, the owner's request (2026-11-15). Please
  double-check: (1) Texas is not named: whether the requirement applies in Texas turns on expansion status and wasn't
  confirmed in an official source. The "43 states and the District of Columbia" line is from the CMS fact sheet
  (re-opened 2026-11-15: "To date, 43 states and the District of Columbia provide coverage to these populations and
  will be required to implement the new requirement"); it names no states. (2) Which states adopt CMS's optional
  hold harmless period, and which got good-faith exemptions (they expire by Dec. 31, 2028), is unconfirmed, so
  neither is on a slide; CMS's guidance letter SMD 26-006 was blocked (medicaid.gov) and wasn't read. (3) CMS
  figures (2.3 million; 3.1 to 3.3 million; 12% and 7%; $350.3 billion federal and $41.6 billion state) are quoted
  from the IFC's regulatory impact analysis in the Federal Register, checked against the downloaded text; CMS also
  says it did not estimate alternative coverage. The $325.6 billion is CBO's, as CRS R48633 reports it (cbo.gov
  returned 403, not retried). (4) "Georgia had a work requirement under a federal waiver" rests on CRS R48633's
  background for sec. 71119 (the IFC also says Nebraska began May 1, 2026; not on a slide). (5) Quotes were checked
  word for word against the govinfo PDF of the Record: Barrasso's quote is cut after "refuse to work" (it goes on
  "nor was it meant to cover illegal immigrants ..."); his numeric claims are left out. Hirono's Arkansas figure is
  her citation of KFF and isn't on a slide. Party and state are written in the "(R-WY)" form; the Record itself
  prints only "Mr. BARRASSO" / "Ms. HIRONO", so confirm against the Senate roster. (6) "$580 a month in 2026" is the
  IFC's "$7.25 per hour ... multiplied by 80 equals $580". The rule that people removed are treated as Medicaid-eligible
  for marketplace tax credits (sec. 71119, new 1902(xx)(7)(B)) is left out for space. (7) The law also funds
  implementation ($200 million to CMS, $200 million in state grants); not on a slide. No roll call is in this post.
