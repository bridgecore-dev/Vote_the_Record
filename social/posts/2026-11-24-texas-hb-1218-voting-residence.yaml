notes: >-
  New: filed Nov. 18, 2026; the only elections or candidate bill on that day's filing report (49 bills). Records opened
  2026-11-18: the filing report, the bill history (filed, no other action; subjects Elections--Candidates, Homestead,
  Residency Requirements), the introduced text (90R3533 TSS-F), and Election Code 1.015, 145.003, 172.023, 172.052,
  172.057 and 172.058 (rendered from statutes.capitol.texas.gov). "Doesn't say what lived in means": Chapter 1 uses
  "inhabited" only in 1.015(f) and doesn't define it; no other chapter was searched, please confirm. The bill also
  changes 145.003(a) so judicial eligibility actions go under the new Subchapter G (the slide says "a new court process");
  its 273.151(c) calls the subchapter the "exclusive remedy". Today's filing deadline is 6 p.m. on the second Monday in
  December of an odd-numbered year (172.023); the post doesn't compute how much later the 50th day before the primary is.
  The slide's "where the candidate is running" is our plain words for "the territory from which a candidate seeks to be
  elected". Rep. Vasut as TLO lists the author, no party shown. Takes Nov. 24's 9:00 a.m. post slot (Nov. 19-23 base
  slots are full).
