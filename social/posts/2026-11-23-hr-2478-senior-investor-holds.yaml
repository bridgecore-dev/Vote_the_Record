notes: >-
  New: the Senate Press Gallery's Nov. 18 log says "By unanimous consent, the Senate passed H.R. 2478 - Financial
  Exploitation Prevention Act of 2025." Congress.gov actions (via api.congress.gov) still end July 13 (referred to
  Senate Banking), and the Nov. 18 Record isn't on GovInfo yet, so the post doesn't say whether the Senate amended it
  or that it goes to the President. CHECK BEFORE IT POSTS: congress.gov actions for "without amendment" (then the
  last slide can say it goes to the President) or "with an amendment" (then it goes back to the House), and for
  presentment or signing. Numbers (7 days, 15 and 10 business days, demand deposit account, 65+/18+ impairment, opt-in
  by notifying the SEC, trusted contact request) are from the House-passed text and 15 U.S.C. 80a-22(e); the CRS
  summary is of the introduced bill and says "15 days", so only its first sentence is quoted. The 2018 SEC no-action
  position and the $2 million SEC cost (offset by fees; net effect "negligible") are from CBO's estimate as printed in
  the Record at H4222-H4223 (cbo.gov returned 403, not retried). Party totals and the 2 Nay names are the Clerk's
  roll 227 XML. Quotes are word for word from the Record (H4224-H4225); party/state from roll 227. The earlier House
  passages (H.R. 2265 by voice vote in 2021, H.R. 500 419-0 in 2023) are from H. Rept. 119-361; their numbers are
  left off (one bill per post). Nov. 21 recheck: congress.gov actions now read "Passed Senate without amendment by
  Unanimous Consent" (Nov. 18) and "Message on Senate action sent to the House" (Nov. 20), so the last slide, the
  caption and `where` now say it goes to the President; not yet presented or signed as of Nov. 21. Nov. 23 9:00 p.m. is the first free post slot that keeps the Reel/post turn.
