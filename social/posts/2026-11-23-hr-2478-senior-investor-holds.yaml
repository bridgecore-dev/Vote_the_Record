bills:
- id: H.R. 2478
  title: Financial Exploitation Prevention Act of 2025
  does: "Would let mutual funds that opt in hold a sale for up to 15 business days (25 with an extension) if they suspect a scam."
  affects: "People 65 and older, and adults with an impairment, who hold mutual fund shares directly with the fund."
  where: "Passed U.S. House of Representatives 414-2 (June 25); U.S. Senate, unchanged, by unanimous consent (Nov. 18)."
  summary:
    text: >-
      This bill establishes procedures for delaying the redemption of certain securities if an investment
      company or agent believes that an older individual or an individual with certain impairments has been
      financially exploited.
    title: Congressional Research Service summary of H.R. 2478
    url: https://api.congress.gov/v3/bill/119/hr/2478/summaries
    retrieved: '2026-11-18'
slides:
- kicker: "U.S. Senate · Nov. 18, 2026"
  head: "The U.S. Senate passed a bill letting mutual funds pause a senior's cash-out when they suspect a scam."
  vote: {yea: 414, nay: 2, not_voting: 14}
  text: "H.R. 2478. The U.S. House of Representatives vote is above; the U.S. Senate passed it by unanimous consent, with no roll call. It affects people 65 and older and adults with an impairment."
- chip: "Before → after"
  head: "Today, a fund generally has to pay within seven days of a sale request."
  rows:
  - [Now, "Funds can't wait more than 7 days to pay, with a few exceptions"]
  - [After, "A fund that opts in can hold it up to 15 business days"]
  - [Extension, "10 more business days if it still suspects a scam"]
  - [Longer, "A state regulator or a court can extend it"]
  - [The money, "Kept in a bank deposit account while on hold"]
  text: "Since 2018, the SEC has said it wouldn't take action against funds that delay these payments, CBO notes. The bill writes a rule into law."
- chip: "Who it affects"
  head: "Investors 65 and older, and adults 18 and older with an impairment that keeps them from protecting their own interests."
  rows:
  - [Gains, "A pause to check before savings go to a scammer"]
  - [Waits, "The account owner, whose own sale is on hold"]
  - [Contacts, "Funds that opt in ask you to name a trusted person"]
  - [Cost, "CBO: about $2 million to the SEC for a report, paid from SEC fees"]
- chip: How they voted
  head: "By party, as the House Clerk records it"
  rows:
  - [Republican, "206 Yea · 2 Nay · 9 didn't vote"]
  - [Democratic, "207 Yea · 0 Nay · 5 didn't vote"]
  - [Independent, "1 Yea · 0 Nay · 0 didn't vote"]
  text: "Voted Nay: Biggs (R-AZ), Brecheen (R-OK). It came up under \"suspension of the rules,\" so it needed two-thirds of those voting."
- chip: In their words
  head: "Both members who led the House debate supported it."
  quote:
    label: "Wagner (R-MO), the sponsor, Cong. Rec. H4224"
    text: "the bill creates a crucial window of up to 15 days with the possibility of a 10-day extension that will provide the time necessary to investigate the situation and notify the appropriate authorities."
  text: "Waters (D-CA) also backed it: \"This is a good bill. This is a bill to try and protect our seniors.\" No one spoke against it, and the roll call records no reasons."
- chip: What's next
  head: "The U.S. Senate passed it without amendment, so it goes to the President."
  text: "Both chambers passed the same text. The President can sign it or veto it. Earlier versions passed the House in 2021 and 2023 and stalled in the Senate. Would you name a trusted contact on your accounts?"
caption: |-
  A mutual fund generally has to pay you within seven days of a request to sell. H.R. 2478, the Financial Exploitation Prevention Act, would let funds that opt in hold that payment for up to 15 business days, plus 10 more, when they reasonably believe someone 65 or older, or an adult with an impairment, is being exploited.

  The U.S. House of Representatives passed it 414-2 on June 25. The U.S. Senate passed it unchanged by unanimous consent on Nov. 18. Next: the President.

  By party, per the House Clerk: Republicans 206 Yea, 2 Nay; Democrats 207 Yea, 0 Nay; Independent 1 Yea. Nay: Biggs (R-AZ), Brecheen (R-OK).

  The trade-off: a pause can stop a scam, and the owner's own sale waits. CBO: about $2 million in SEC costs, offset by SEC fees.

  Would you name a trusted contact on your accounts?
