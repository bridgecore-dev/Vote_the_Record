bills:
- id: HB 774
  does: Would cap contributions to statewide and legislative candidates at $5,000 a person and $10,000 a committee per election.
  affects: Donors and political committees giving to these candidates; statewide judicial candidates' PAC limit drops to $10,000.
  where: Filed Nov. 9, 2026 by Rep. Zwiener; no other action yet.
  summary:
    text: A person, other than a political committee, may not knowingly make or authorize the making of a campaign contribution
      to a candidate for statewide office or the legislature [...] in an amount that exceeds $5,000 for the election in which
      the candidate is involved.
    title: HB 774 as filed, Sec. 1 (new Election Code 253.008(a))
