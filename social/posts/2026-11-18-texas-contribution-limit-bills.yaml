caption: |-
  Texas caps campaign contributions to judicial candidates, but its Election Code sets no dollar limit for candidates for statewide office or the Legislature. Two bills filed for the 2027 session, HB 774 and SB 373, would add one: $5,000 per election from one person, $10,000 from one political committee. They would also lower the cap a statewide judicial candidate may take from one general-purpose committee from $25,000 to $10,000.

  Should Texas cap donations to these candidates?

