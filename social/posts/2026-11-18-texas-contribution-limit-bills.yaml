notes: 'All records opened 2026-11-15: the Nov. 9 and Nov. 13 filing reports, both bill histories (filed, no other action;
  no fiscal notes listed), both introduced texts (same council draft, 90R 2798), Election Code ch. 253, and the TEC''s 2026
  state candidate guide (its list of ch. 253 restrictions has no dollar cap for non-judicial candidates). Please double-check
  the "only for judicial candidates" line: it is my reading of ch. 253, where the dollar limits are in Subchapter F (judicial);
  253.032 limits out-of-state committee contributions by documentation, not amount. Not said on the slides: as a Subchapter
  A rule, a knowing excess contribution would fall under 253.003 (Class A misdemeanor); the bills don''t say so themselves.
  "Sen. Molly Cook" follows TLO ("Cook, Molly"). Fills a Nov. 18 Reel slot (Nov. 16-17 Reel slots are full).'
