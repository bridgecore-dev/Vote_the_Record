notes: >-
  Fills the empty story slot on Nov. 18 (every other Nov. 16-18 slot is taken). Dates, periods and filers are from
  the FEC's 2026 Pre- and Post-General page, opened this run: "Post-General: Congressional; All PACs and parties;
  10/15/2026 - 11/23/2026; 12/03/2026", and electronic reports "must be received and validated by the Commission by
  11:59 p.m. Eastern Time on the filing deadline". "Campaigns of candidates in the general election" restates "Campaign
  committees file a Pre- and Post-General Report for every general election their candidate runs in"; presidential
  committees aren't mentioned because there is no presidential race in 2026. The Browse Filings page renders by
  script; only its title was read. Review, not auto, because slide 2 restates the FEC page in our words. No person,
  party or bill is named.
