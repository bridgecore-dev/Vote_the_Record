caption: |-
  Campaigns for U.S. House and U.S. Senate, and every PAC and party committee, file one more report on the 2026 general election: the Post-General Report.

  It covers Oct. 15 to Nov. 23, 2026, through 20 days after the election. It's due at the Federal Election Commission on Dec. 3. Reports filed online must be in by 11:59 p.m. Eastern.

  The reports are public. Browse them at fec.gov/data/filings. What would you check first?
