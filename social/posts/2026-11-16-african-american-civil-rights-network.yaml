caption: |-
  In 2018, Congress created the African American Civil Rights Network: a National Park Service program that links places tied to the Civil Rights Movement, like Little Rock Central High School and the Brown v. Board of Education park in Topeka. The House committee report counts 213 sites.

  The 2018 law ended the program after seven years, and it expired on Jan. 8, 2025. H.R. 9269, on the House schedule this week, restarts it for seven years from the day it becomes law. Sites in the network can use its logo and get technical help from the Park Service.

  The committee approved it with no objection. It hadn't received a cost estimate from the Congressional Budget Office when it filed its report.

  Have you visited one of these sites? Tell us below.
