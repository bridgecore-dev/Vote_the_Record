bills:
- id: H.R. 9269
  title: Renewing the African American Civil Rights Network Act
  does: "Restarts a National Park Service program for civil rights history sites, which expired Jan. 8, 2025, for 7 years."
  affects: "Sites in the network, which can use its logo and get technical support from the Park Service."
  where: "Approved by the House Natural Resources Committee by unanimous consent. On the House schedule week of Nov. 16."
  summary:
    text: >-
      This bill reauthorizes for seven years the African American Civil Rights Network. The network is a
      National Park Service (NPS) program that designates historical sites and educational resources that are
      connected to the African American civil rights movement. The program expired on January 8, 2025.
    title: Congressional Research Service summary of H.R. 9269
    url: https://api.congress.gov/v3/bill/119/hr/9269/summaries
    retrieved: '2026-11-15'
