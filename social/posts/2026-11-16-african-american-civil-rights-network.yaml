notes: >-
  Picked by the stated rule; H.R. 9640 gets a matching post. "213 sites", the three examples, the 1939-1968
  span and the 2018 law (P.L. 115-104) are from H. Rept. 119-859; the expiry date and logo/technical support
  from the CRS summary. The report has no minority or additional views, so there is no official case against to
  quote, and the post gives none. Congress.gov lists no CBO estimate. Clyburn and Carey as "led by" and their
  party and state are as the report lists them; cosponsor party counts are from congress.gov. Nov 17 recheck:
  the Clerk's floor summary for Nov. 17 shows "On motion to suspend the rules and pass the bill, as amended Agreed
  to by voice vote" (5:19 p.m. ET), so the first slide, last slide, `where` and caption now say it passed by voice
  vote. Congress.gov's actions hadn't caught up yet when checked. The passed text is the reported version listed on
  docs.house.gov ("as amended").
