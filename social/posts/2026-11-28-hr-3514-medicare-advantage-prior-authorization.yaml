caption: |-
  Some Medicare Advantage plans must OK certain care before they pay for it: prior authorization. H.R. 3514 is on the U.S. House of Representatives schedule the week of Nov. 30.

  Before: federal law says plans must decide "on a timely basis." A 2024 CMS rule sets 72 hours for urgent requests and 7 days for others, plus yearly public numbers.

  After: from 2029, the law itself would require plans that use prior authorization to take requests electronically, report approvals, denials, appeals and decision times item by item, say how often AI or other software was used, and share their criteria with doctors and enrollees who ask.

  Plans would build the systems and do the reporting. Congress.gov lists no CBO estimate yet.

  Should plans have to post how often they approve or deny care?
