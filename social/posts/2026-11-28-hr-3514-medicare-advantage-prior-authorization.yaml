notes: >-
  Picked by the stated rule: the only bill on the Nov. 30 suspension list that changes Medicare (S. 1157, the lung cancer
  review, doesn't). Records opened 2026-11-27: the floor list, the suspension text (H3514_SUS, "as amended", dated Nov.
  19, 2026; sha256 fd9155724e950fb00bff397ea14706a1043572fd2989c5886c520e013d10eb62), congress.gov actions (Ways and
  Means ordered reported 42-0 July 15, 2026; Energy and Commerce hasn't acted), cosponsors (312, none withdrawn), the CRS
  summary (of the introduced text; the slides follow the suspension text), 42 U.S.C. 1395w-22 from GPO's 2024 Code (no
  subsection (o) yet; (g)(1)(A) "on a timely basis"), and CMS's Jan. 17, 2024 fact sheet for CMS-0057-F (72 hours/7 days
  and metrics from 2026, the Prior Authorization API from Jan. 1, 2027; MA organizations are "impacted payers"). The
  bill applies to "a plan year beginning on or after January 1, 2029"; "item by item" is subclauses (II) and (IV);
  "Medicare posts each plan's numbers" is (3)(D) ("on an individual plan level"); "7 days or fewer" is sec. 2(b), "if
  determined practicable by the Secretary". "Doctors" shortens "providers". Part D drugs are excluded ((o)(5)); not on
  the slides. The CMS rule's details come from the fact sheet, not the Federal Register text. No CBO estimate is listed
  on congress.gov (cbo.gov wasn't tried); no statement for or against was opened. Sponsor's party and state as
  congress.gov lists them. News first: a dated event in the next three days (the House's week of Nov. 30 begins
  Monday). Takes the Nov. 28 9:00 a.m. post slot. Nov. 27's post slots hold Nov. 20 signings, not yet more than a week
  old, and Nov. 28 3:00 a.m. is the North Carolina SB 177 post, whose 10-day sign-or-veto window ends this week, so it's
  treated as news. This pull request moves the New York Chapter 379 lobbying post (signed Nov. 20, more than a week
  ago by Nov. 28) to Dec. 26 3:00 a.m., the first post slot after the last queued post (Dec. 25 3:00 a.m.) that can't
  put two posts in a row. Shortened slide 4 and the source titles after the first preview clipped the sources
  footer. If the House votes before this posts, the last slide needs the tally.
