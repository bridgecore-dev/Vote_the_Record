caption: |-
  Less than a month to go. Public Law 119-103, the Continuing Appropriations and Extensions Act, 2027, provides continuing (temporary) funding for federal programs. Under Sec. 106 of the law, that funding lasts until Dec. 11, 2026, or until full-year 2027 funding for a program becomes law, whichever comes first.

  The law was approved Sept. 2, 2026. The date is quoted from its official text on GovInfo.
