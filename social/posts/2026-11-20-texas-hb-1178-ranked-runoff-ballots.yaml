bills:
- id: HB 1178
  does: Would mail military and overseas voters a ranked runoff ballot with their first ballot, to count if a runoff happens.
  affects: Texans who vote by mail with a federal postcard application, such as service members and Texans living abroad.
  where: Filed Nov. 16, 2026 by Rep. Cortez; no other action yet.
  summary:
    text: >-
      The voter's vote in the election is assigned to the runoff candidate whom the voter assigned the highest
      favorable ranking on the runoff election ballot under Subsection (b).
    title: HB 1178 as filed, Sec. 3 (new Election Code 101.151(c))
    url: https://capitol.texas.gov/tlodocs/90R/billtext/html/HB01178I.htm
    retrieved: '2026-11-16'
slides:
- kicker: 2027 Texas session · Filed Nov. 16, 2026
  big: HB 1178
  head: A Texas House of Representatives bill would let military and overseas voters rank runoff candidates ahead of time.
- chip: Who it's for
  head: "Texans who vote by mail with a federal postcard application."
  rows: [[Military, "Armed forces and merchant marine members, and their spouses or dependents"],
         [Guard and reserve, "Members on active duty or state orders, and their spouses or dependents"],
         [Abroad, "Texans living outside the U.S. for now"]]
  text: "Election Code 101.001 lists who qualifies."
- chip: The law today
  head: "Today, the application also counts as a request for a ballot in any runoff that follows."
  quote: {label: "Election Code 101.054(c)", text: "An application shall be treated as if it requests a ballot for a runoff election that results from an election for which a ballot is requested, including a runoff election that occurs in the next calendar year."}
- chip: The change
  head: "The bill: mail a ranked runoff ballot along with the first ballot."
  rows: [[In the mail, "A runoff ballot and a second return envelope"],
         [How to mark it, "Rank each candidate, most favored to least"],
         [Sending it back, "Same time and same way as the first ballot, or it isn't counted"]]
- chip: If a runoff happens
  head: "The second envelope is opened, and the vote goes to the runoff candidate the voter ranked highest."
  quote: {label: "HB 1178, new Election Code 101.151(c)", text: "The voter's vote in the election is assigned to the runoff candidate whom the voter assigned the highest favorable ranking on the runoff election ballot"}
- chip: Who does the work
  head: "The Texas Secretary of State would set the rules and write instructions; county clerks would post them online and mail them with each runoff ballot."
  text: "The bill doesn't say what this would cost. No fiscal note (cost estimate) is posted yet."
- chip: What's next
  head: The 90th Texas Legislature convenes at noon on Jan. 12, 2027.
  text: "If passed as filed, HB 1178 takes effect Jan. 1, 2028. Should voters far from home be able to rank runoff candidates in advance? Tell us why or why not."
caption: |-
  Texans serving in the military, their families and Texans living abroad can vote by mail with a federal postcard application. Today, that application also counts as a request for a ballot in any runoff that follows.

  HB 1178, filed Nov. 16 in the Texas House of Representatives for the 2027 session, would mail these voters a second, ranked runoff ballot along with their first one. They would rank each candidate, most favored to least, and send it back at the same time. If a runoff happens, their vote goes to the runoff candidate they ranked highest.

  The Texas Secretary of State would set the rules; county clerks would post and mail the instructions. No cost estimate is posted yet.

  If passed as filed, it takes effect Jan. 1, 2028. Should voters far from home be able to rank runoff candidates in advance?
