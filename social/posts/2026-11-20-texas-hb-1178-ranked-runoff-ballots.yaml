  opened 2026-11-16: the Nov. 16 filing report, the bill history (filed, no other action; the Text page lists
  only the bill text, no fiscal note), the introduced text (90R3824 JDK-D), Election Code ch. 101
  (statutes.capitol.texas.gov renders by script; the text was read from its tcss.legis.texas.gov copy) and
  TLC's Dates of Interest. Please check: (1) the bill leaves 101.054(c) in place, so it doesn't say what happens
  to the regular runoff ballot that the application also requests; the slides don't claim it replaces it.
  (2) The bill ties the ranked ballot to the voter's "general election ballot"; Election Code 1.005 defines
  "general election" apart from primaries, so whether it reaches primary runoffs isn't clear from the text. The
  slides say "the first ballot" and don't claim either way. (3) No source opened says who gains or loses, or
  gives arguments for or against, so the post states only what the text does and asks readers.
