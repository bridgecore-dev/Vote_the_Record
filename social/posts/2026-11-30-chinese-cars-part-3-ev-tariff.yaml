caption: |-
  Part 3 of 3: the tariff on electric cars made in China.

  Before: an imported electric car pays a 2.5% base tariff (a tax on imports), and before Sept. 27, 2024, one made in China paid 25% more under Section 301 of the Trade Act of 1974. After: 100% more. It covers electric and plug-in hybrid cars and electric vans and buses; e-bikes, motorcycles and golf carts aren't included. Other U.S. tariffs on imported cars can also apply, so this isn't a full total.

  The U.S. Trade Representative's reason: "China now produces 70 percent of the world's electric cars-- jeopardizing productive investments elsewhere." It says the tariff will "encourage diversification from Chinese sources."

  Commenters asked to narrow it, widen it, or exempt buses already under contract; the agency said no. The notice records no comment against the tariff itself.

  Is a 100% tariff the right call?

  Voice: computer-generated (Kokoro text-to-speech).
