notes: >-
  Owner idea (part 3 of 3; parts 1 and 2 are their own pull requests and are meant to be merged together). 100% and
  the Sept. 27, 2024 date: the USTR notice (GovInfo copy of FR doc 2024-21217; federalregister.gov's full text
  returned its "request access" page and was not retried) and the current HTS (USITC REST search, 2026 Revision 23,
  current since Nov. 10, 2026): 9903.91.03 "The duty provided in the applicable subheading + 100%" for note 31(d)
  products, which the notice ties to 9903.91.03. Base rate: HTS 8703.80.00 general 2.5% ("Other vehicles, with only
  electric motors for propulsion"). Before (25%): the archived White House fact sheet ("will increase from 25% to 100%
  in 2024"); the notice itself doesn't state the earlier rate. Coverage: the notice's Annex A lists eight subheadings
  (8702.40.31, .40.61, .90.31, .90.61 for 10 or more people; 8703.60.00 and .70.00 plug-in hybrids; 8703.80.00
  electric; 8703.90.01 other), so "vans and buses" is our plain word for 8702 and "other" motor vehicles aren't named
  on a slide; please check. E-bikes, motorcycles, golf carts excluded and the three comment requests (low-speed
  vehicles, broaden to 8711.60 and 8703.10.50, electric bus contracts) are the notice's EV section. "Leverage" restates
  "providing additional leverage with China". No case against the EV tariff itself is in the notice: the one comment
  that the tariffs "will slow U.S. efforts to boost domestic production and adoption of electric vehicles" is about
  the battery-parts line, so it isn't quoted here. The USITC's 2023 tariff study (usitc.gov) returned 403 and wasn't
  retried, so no economic case for or against is on a slide. Section 232 auto tariffs (HTS 9903.94.01, +25% on many
  passenger vehicles) are why the slide says other tariffs can apply; how they stack isn't stated. Slot: Nov. 30
  noon, a free Reel slot after the 9:00 a.m. post; bumps nothing.
