caption: |-
  When a federal agency settles a big case, can you look it up? H.R. 7934 is on the House schedule this week.

  Before: the bill writes a new section into federal law (5 U.S.C. 307); there is no such section today.
  After: every agency that signs a covered deal keeps a public, searchable database: settlements of $10 million or more, deals with a court-appointed monitor, and deals with a state or local government. Each entry lists the claims, the money, the dates and a copy of the agreement. Confidential terms and anything FOIA lets agencies withhold stay out, and agencies report how many they left out.

  It would apply, where practicable, to deals from 2015 on that are still in effect. CBO has published a cost estimate; we couldn't open it this time.

  Should every agency post these deals? Tell us below.
