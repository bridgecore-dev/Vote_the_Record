    text: "If any Bill shall not be returned by the President within ten Days (Sundays excepted) after it shall have been presented to him, the Same shall be a Law, in like Manner as if he had signed it, unless the Congress by their Adjournment prevent its Return, in which Case it shall not be a Law."
  text: Status as of Nov. 14. Should licensing agencies see FBI records on officer candidates? Tell us what you think.
caption: |-
  A bill on the President's desk: the Criminal History Access Act (H.R. 8352).

  Right now, the state agencies that license police officers aren't on the list of agencies that can get FBI criminal history records. This bill adds them, for background checks on people applying to be officers. In Texas, that's TCOLE.

  It passed the House by voice vote and the Senate by unanimous consent, so there is no roll call. It was presented to the President on Nov. 12 (status as of Nov. 14).

  Should licensing agencies see these records? Tell us below.
