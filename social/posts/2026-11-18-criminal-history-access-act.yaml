  text: Should licensing agencies see FBI records on officer candidates? Tell us what you think.
caption: |-
  Now law: the Criminal History Access Act (H.R. 8352), signed by the President on Nov. 20.

  Right now, the state agencies that license police officers aren't on the list of agencies that can get FBI criminal history records. This bill adds them, for background checks on people applying to be officers. In Texas, that's TCOLE.

  It passed the House by voice vote and the Senate by unanimous consent, so there is no roll call. The Attorney General has 180 days, until May 19, 2027, to update the federal rules.

  Should licensing agencies see these records? Tell us below.
