bills:
- id: H.R. 8352
  title: Criminal History Access Act of 2026
  does: Lets state agencies that license and certify police officers get criminal history records kept by the FBI.
  affects: State, D.C. and territory agencies that set hiring and training standards for police officers.
  where: Passed the House May 12 and the Senate Sept. 30, 2026; presented to the President Nov. 12.
  summary:
    text: "This bill authorizes a new type of entity—peace officer standards and training agencies—to access criminal history record information maintained by the Federal Bureau of Investigation."
    title: CRS summary, H.R. 8352
    url: https://api.congress.gov/v3/bill/119/hr/8352/summaries
    retrieved: '2026-11-14'
