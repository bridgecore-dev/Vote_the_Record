bills:
- id: H.R. 2347
  title: Bipartisan American Affordability and Jobs Act of 2026 (U.S. Senate substitute)
  does: "Rewrites federal environmental reviews and permits, power line planning and energy leasing; keeps the House bill's tax change."
  affects: "Builders of energy and other projects, agencies that review them, people who sue over them, and data centers."
  where: "Nov. 18: U.S. Senate adopted the substitute 69-27 and voted 65-31 to end debate. No passage vote yet."
  summary:
    text: "This Act may be cited as the \"Bipartisan American Affordability and Jobs Act of 2026\"."
    title: "SA 6883, sec. 1(a), Congressional Record, Nov. 10, 2026"
    url: https://www.govinfo.gov/content/pkg/CREC-2026-11-10/html/CREC-2026-11-10-pt1-PgS5417.htm
    retrieved: '2026-11-17'
  say: "H.R. 2347, in the United States Senate's new version. It rewrites federal environmental reviews and permits, power line planning and energy leasing, and keeps the House bill's tax change."
slides:
- kicker: "U.S. Senate · H.R. 2347"
  head: "The U.S. Senate is moving a bill that changes how the government approves energy and building projects. Here are 4 changes in its text."
  text: "One from each of four areas: water, wildlife, courts and power lines."
  say: "The United States Senate is moving a bill that changes how the government approves energy and building projects. Here are 4 changes in its text, one each on water, wildlife, courts and power lines."
- chip: "1. Water permits"
  head: "Clean Water Act discharge permits from states could last twice as long."
  rows:
  - [Before, "Fixed terms of up to 5 years"]
  - [After, "Up to 10 years"]
  by: "33 U.S.C. 1342(b)(1)(B); SA 6883, sec. 1203"
  say: "One: water permits. Today, Clean Water Act discharge permits from states have fixed terms of up to 5 years. The bill makes that up to 10 years."
- chip: "2. Endangered species reviews"
  head: "Reviews of federal projects that could affect listed species would have less time."
  rows:
  - [Before, "90 days to finish; past 150 days needs the applicant's OK"]
  - [After, "60 days to finish; past 100 days needs the applicant's OK"]
  by: "16 U.S.C. 1536(b)(1); SA 6883, sec. 1302"
  say: "Two: endangered species reviews. Today they must finish in 90 days, and going past 150 days needs the applicant's OK. The bill makes that 60 days, and 100 days."
- chip: "3. Lawsuits"
  head: "A new limit on court challenges to environmental reviews."
  rows:
  - [Deadline, "Filed within 150 days of the approval"]
  - [Who, "Someone who commented on the issue, if there was a comment period, and who claims direct harm"]
  by: "SA 6883, sec. 1110 (new NEPA sec. 111)"
  say: "Three: lawsuits. A challenge to an environmental review would have to be filed within 150 days of the approval, by someone who commented on the issue, if there was a comment period, and who claims direct harm."
- chip: "4. Data centers"
  head: "Data centers would pay the full cost of the power lines they need."
  quote: {label: "SA 6883, sec. 2107(a)(1)(A)", text: "so that such costs are not borne by other customers, including residential customers", key: "not borne by other customers"}
  text: "The bill has federal energy regulators rewrite their transmission pricing rules to do this."
  say: "Four: data centers. The bill says they should bear the full cost of the power lines they need, so other customers, including homes, don't pay it. Federal energy regulators would rewrite their pricing rules."
- chip: Cost
  head: "The Congressional Budget Office sent a preliminary estimate on Nov. 13."
  text: "Read it at cbo.gov/publication/62908."
  say: "What it costs: the Congressional Budget Office sent a preliminary estimate on November 13. It's linked in the caption."
- chip: The case for
  head: "The substitute's sponsor says reviews hold up projects."
  quote: {label: "Sen. Capito (R-WV), floor remarks, Nov. 9, 2026", text: "The environmental permitting and review processes should be tools for informed decision-making, not reasons that decisions can't be made."}
  say: "The case for: Senator Capito, Republican of West Virginia, the sponsor, said reviews should be tools for informed decisions, not reasons decisions can't be made."
- chip: The case against
  head: "A senator who voted Nay says parts of it weaken protections."
  quote: {label: "Sen. Blunt Rochester (D-DE), statement, Nov. 9, 2026", text: "I'm especially concerned about provisions in this package that will actively weaken environmental protections"}
  say: "The case against: Senator Blunt Rochester, Democrat of Delaware, who voted Nay, said she's especially concerned that provisions in the package will weaken environmental protections."
- chip: Where it stands
  head: "On Nov. 18, the U.S. Senate adopted this version 69-27, then voted 65-31 to end debate on the bill. Which side convinces you?"
  say: "Where it stands: on November 18, the United States Senate adopted this version 69 to 27, then voted 65 to 31 to end debate on the bill. Which side convinces you?"
caption: |-
  The U.S. Senate is moving a new version of H.R. 2347. Four changes in its text, before → after:

  Water: state discharge permits, up to 5 years → up to 10.
  Species reviews: 90 days → 60.
  Lawsuits: a new 150-day deadline to challenge an environmental review.
  Data centers: pay the full cost of the power lines they need.

  Cost: CBO's preliminary estimate, Nov. 13: cbo.gov/publication/62908

  For: Sen. Capito (R-WV). Against: Sen. Blunt Rochester (D-DE).

  Voice: computer-generated (Kokoro text-to-speech).
