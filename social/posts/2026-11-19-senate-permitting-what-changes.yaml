rule: "One change from each of four areas the bill covers: water permits, wildlife reviews, court challenges and power lines. For: the substitute's sponsor. Against: a Nay voter's published statement."
notes: >-
  Pair with the 6:00 p.m. carousel (2026-11-19-senate-permitting-cloture-vote), filling the Nov. 19 4:30/6:00
  pair; meant to be merged together. Before/after are quoted from the strike-and-insert text of SA 6883 (Nov. 10
  Record, S5417 granule) and checked against GPO's 2023 U.S. Code (33 U.S.C. 1342(b)(1)(B) "fixed terms not
  exceeding five years"; 16 U.S.C. 1536(b)(1)(A)-(B) 90/150 days). Please confirm no law since 2023 changed those
  numbers. Sec. 1110's 150-day limit applies "unless a shorter deadline is specified under Federal law"; no
  "before" is given because current NEPA's limit wasn't opened. The comment requirement applies only where a comment
  period occurs after enactment. Who gains/loses isn't stated beyond the text (sec. 2107's finding names residential
  customers). cbo.gov returned 403: CBO letter linked, not quoted. Capito and Blunt Rochester spoke Nov. 9 about the
  same bill; Blunt Rochester voted Nay on vote 264. CHECK BEFORE IT POSTS: if the Senate has adopted the substitute
  or passed the bill, update "where" and the last slide from senate.gov. Nov 17 fix: shortened source titles so the
  cover's source footer fits (the first preview clipped it). Nov 18 update: the U.S. Senate adopted SA 6883 69-27
  (vote 267, from its XML; Blunt Rochester voted Nay again) and invoked cloture on H.R. 2347 as amended 65-31 (vote
  268, from senate.gov's vote menu; its XML page wasn't posted yet). "where" and the last slide now say so. CHECK
  BEFORE IT POSTS: if the Senate has passed the bill, update "where" and the last slide with that vote.
