caption: |-
  The U.S. Senate confirmed Daniel Desmond Domenico, of Colorado, to the U.S. Court of Appeals for the Tenth Circuit on Nov. 16, 2026 (vote 263).

  Result: 51 Yea, 46 Nay, 3 didn't vote.
  Republican: 51 Yea, 0 Nay, 2 didn't vote.
  Democratic: 0 Yea, 44 Nay, 1 didn't vote.
  Independent: 0 Yea, 2 Nay.

  The Tenth Circuit hears federal appeals from Colorado, Kansas, New Mexico, Oklahoma, Utah and Wyoming. Most courts of appeals decisions are final. Circuit judges have no set term: federal law says they "hold office during good behavior."

  Should judges serve for life, or for a set term?
