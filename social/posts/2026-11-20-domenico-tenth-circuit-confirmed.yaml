notes: >-
  New this run: Senate vote 263 (Nov. 16, 5:27 p.m. ET), not in any post. Tally, party counts and the three
  not-voting names were counted from the vote's XML (vote_119_2_00263.xml); party as the Senate lists it (D, R, I).
  The 46 Nays are over the ~40-name limit, so the slide gives totals and points to senate.gov. Tenth Circuit states
  and the 12 judgeships are from 28 U.S.C. 41 and 44 in GPO's 2023 U.S. Code edition; please confirm no later law
  changed the count. No case for or against is quoted: the Nov. 16 Congressional Record (the floor debate on the
  nomination) wasn't on GovInfo yet when this was written. The congress.gov API's PN999 entry shows a different
  nominee (a Texas district judge), so the nomination's own congress.gov page wasn't used; the Senate's vote page
  names Domenico and PN999-2. Fills the Nov. 20 9:00 p.m. post slot (Nov. 17-19 regular slots are full).
