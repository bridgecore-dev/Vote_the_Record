caption: |-
  On Nov. 19, the U.S. Senate passed S. 580, the Combating CCP Labor Abuses Act of 2026, by unanimous consent.

  Background: the Senate Commerce Committee's report quotes the U.S. Secretary of State's 2021 determination that China's government "committed genocide against predominantly Muslim Uyghurs and other ethnic and religious minority groups."

  Today: the Commerce Department advises U.S. businesses, and in 2021 it joined five other agencies in a Xinjiang supply chain business advisory. Its staff already get human rights training.

  After: Commerce must train staff who counsel businesses dealing with China on that government's human rights abuses, including forced labor, and offer businesses guidance on warning signs, how to avoid those partners, and the risks. The guidance is advisory only.

  Cost: CBO estimated $2 million over 2025-2030 for the version the committee approved in 2025.

  Sponsor: Sen. Gary C. Peters (D-MI). Cosponsors: Sen. John R. Curtis (R-UT), Sen. Cynthia M. Lummis (R-WY).

  Should advice like this be required?
