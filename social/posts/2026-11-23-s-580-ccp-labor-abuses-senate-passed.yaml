notes: >-
  New this run: the Senate floor activity page for Nov. 19 lists S. 580 "Passed Senate with an amendment and an
  amendment to the Title by Unanimous Consent" (S.Amdt. 7033, a substitute, and 7034, the title). The slides follow
  the engrossed text on GovInfo ("Passed the Senate November 19, 2026"). No CRS summary yet, so the explainer quotes
  sec. 3(b)(1). Background, "today" and history are from S. Rept. 119-48 (July 28, 2025): the genocide quote is the
  report quoting the 2021 determination (the state.gov archive page returned "Technical Difficulties" this run, so it
  is labeled "as quoted in"); "mostly Muslim minority ... Xinjiang" paraphrases the report's "predominantly Muslim
  Uyghurs" and "Xinjiang Uyghur Autonomous Region"; the 2021 advisory "and five other agencies" and the 2023
  addendum; "build on existing human rights training". The report's "more than 1 million" figure cites the Council on
  Foreign Relations, not an official record, so it isn't used. The CBO estimate ($2 million over 2025-2030, training
  and guidance updated every three years) and "no paperwork" are for the reported 2025 version; the passed substitute
  narrows training to staff counseling businesses doing deals with or investing in China, adds consultation with the
  State Department and a "human rights" definition, and widens Xinjiang to all of China. The slide says which version
  the CBO figure is for. History: S. 4101 (117th, reported by voice vote) and S. 484 (118th, passed Senate by UC
  Dec. 19, 2023), both by Sen. Peters per the report; not named on slides (one bill per post). Unanimous consent, no
  roll call; no statement against was found, so no case-against slide. Party and state as congress.gov lists them,
  cosponsors alphabetical. News first: takes the Nov. 23 3:00 a.m. post slot (every earlier post slot holds this
  week's news or a bill waiting on the President) and moves the evergreen prefiled-bill post
  2026-11-20-texas-hb-1178-ranked-runoff-ballots to 2026-11-30T03:00:00-06:00 (Nov. 29's only post is at 3:00 a.m.,
  so a later Nov. 29 post slot would put two posts in a row).
