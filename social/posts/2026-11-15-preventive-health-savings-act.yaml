notes: >-
  Picked by the stated rule; H.R. 7934 gets a matching post. "Years 11 through 30" is the bill's definition of
  budgetary outyears ("2 consecutive 10-year periods beginning with the first fiscal year that is 10 years after
  the current fiscal year"); check that reading. "Both parties' leaders" = the chair and ranking minority member
  of the Budget Committee and of the committee of primary jurisdiction, in either chamber, per the text. No
  committee report is filed, so there is no case for/against from an official source; cbo.gov (CBO's estimate of
  this bill, publication 62871) returned a bot check and wasn't retried. Cosponsor party counts from congress.gov.
