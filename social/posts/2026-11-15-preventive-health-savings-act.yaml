bills:
- id: H.R. 4464
  title: Preventive Health Savings Act
  does: "On request, CBO would estimate savings from preventive health care up to 30 years out, not just the usual 10."
  affects: "Congress's budget office (CBO) and the committees that request its estimates on health bills."
  where: "Approved by the House Budget Committee 29-0 (Sept. 16, 2026). On the House schedule the week of Nov. 16."
  summary:
    text: >-
      This bill requires the Congressional Budget Office (CBO), upon receiving a request from Congress, to
      determine if proposed legislation would reduce spending outside of the 10-year budget window through the
      use of preventive health care.
    title: Congressional Research Service summary of H.R. 4464
    url: https://api.congress.gov/v3/bill/119/hr/4464/summaries
    retrieved: '2026-11-15'
