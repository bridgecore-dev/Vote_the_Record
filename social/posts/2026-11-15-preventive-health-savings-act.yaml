- chip: Where it stands
  head: "Sponsor: Rep. Jay Obernolte (R-CA), with 17 Republican and 8 Democratic cosponsors. Committee vote: 29-0."
  text: "It needs two-thirds of those voting to pass. Should long-term health savings count? Tell us."
caption: |-
  When Congress weighs a health bill, its budget office estimates the cost over 10 years. Savings that show up later aren't counted.

  H.R. 4464, on the House schedule this week, would change that for preventive health care. If both parties' leaders on the Budget Committee and the committee in charge of a bill ask, CBO would estimate whether the bill saves money in years 11 through 30, and explain why.

  That longer estimate is extra information only: it can't be used to meet budget rules.

  The House Budget Committee approved it 29-0. Should long-term health savings count? Tell us below.
