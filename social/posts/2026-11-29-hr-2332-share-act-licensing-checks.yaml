bills:
- id: H.R. 2332
  title: SHARE Act of 2026
  does: Would require the FBI to give state licensing boards in a licensing compact the criminal records the compact's background check needs.
  affects: Workers seeking a license or a compact privilege in a compact state, and the state boards that license them.
  where: "Approved 33-0 by House Education and Workforce June 25, 2026. On the House schedule for the week of Nov. 30."
  summary:
    text: >-
      This bill requires the Federal Bureau of Investigation to provide criminal history record information to a state
      occupational or professional licensing authority for the purpose of conducting background checks on individuals
      seeking a license to practice in an interstate compact member state.
    title: Congressional Research Service summary of H.R. 2332
    url: https://api.congress.gov/v3/bill/119/hr/2332/summaries
    retrieved: '2026-11-28'
