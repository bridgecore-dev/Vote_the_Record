notes: >-
  News first: a dated event in the next three days (the U.S. House's week of Nov. 30 starts Monday; docs.house.gov,
  last updated Nov. 27, lists H.R. 2332 under suspension). No post or open pull request covers H.R. 2332. Takes Nov. 29
  3:00 a.m., the earliest post slot at least 3 hours away held by an evergreen post: every earlier post slot holds news
  (H.R. 3514 on this week's schedule, the Nov. 23 H.R. 8552 signing) or the Nov. 28 3:00 p.m. hemp post, tied to Dec. 11.
  The Nov. 29 3:00 a.m. New Jersey A5439 post (approved Nov. 20, more than a week ago by Nov. 29) moves to Dec. 27 3:00
  a.m., the first post slot after the last queued post (Dec. 27 12:00 a.m. Reel), which keeps the Reel/post turn.
  Records opened 2026-11-28: the floor list, the scheduled text (H2332EW_RH, the Education and Workforce reported text;
  sha256 3a2c8d5f329ad3bf1d3244bba5f20361945dc55c1d01de5b7b4309d99a2007bc; it matches the amendment printed in the
  report), congress.gov actions (ordered reported 33-0 June 25, 2026; reported Sept. 28, H. Rept. 119-837 Part I;
  Judiciary discharged Sept. 28), sponsor and cosponsors (29: 21 R, 8 D as congress.gov lists them, none withdrawn; not
  on a slide), the CRS summary (reported version), H. Rept. 119-837 Part 1, and House Practice ch. 53 (two-thirds). The
  21 compacts and the 43/45/43 state counts are the report's, citing the Council of State Governments (compacts.csg.org,
  not opened). The 1972 line and "approved by the U.S. Attorney General" are the report's description of Pub. L. 92-544
  (34 U.S.C. 41101, not opened). "Inconsistent" and "improperly denied access" are the report relaying what stakeholders
  told committee staff; the slides say so. "Many of those compacts require" in the caption rests on the report's "the
  background check requirements that many compacts already impose".
  "Police agency" shortens "State law enforcement agency"; "pass or fail" restates the bill's "binary determination of
  whether or not the criminal history background check of an applicant was satisfactory". "States still decide what
  record disqualifies someone" is the report's "the bill does not dictate what is or is not disqualifying". The report
  has no minority views, the committee vote had no Nays, and no statement against was found, so there is no
  case-against slide; the post asks. If the House votes before this posts, the last slide needs the tally.
