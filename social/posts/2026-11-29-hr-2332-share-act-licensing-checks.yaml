caption: |-
  Many states have joined compacts that let a nurse, doctor, counselor or teacher licensed in one state practice in the others. Many of those compacts require a criminal background check. H.R. 2332, the SHARE Act, is on the U.S. House of Representatives schedule the week of Nov. 30.

  Before: since 1972 the FBI can share criminal records with states for licensing only under a state law the U.S. Attorney General approves. The House Education and Workforce Committee's report says compact groups told its staff the FBI "has been inconsistent" in granting that access.

  After: the FBI would have to give a compact state's licensing board the records its compact requires, through the state's police agency or identification bureau. The board could use them only for that worker's license and couldn't share them, except to tell the compact the check was done and whether it passed.

  States would still decide what makes someone ineligible. The committee's report says no CBO estimate had arrived.

  Should a license earned in one state count in another?
