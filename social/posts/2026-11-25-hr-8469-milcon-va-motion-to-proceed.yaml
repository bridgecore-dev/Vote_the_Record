caption: |-
  On Nov. 20, U.S. Senate Majority Leader John Thune moved to proceed to H.R. 8469, the 2027 spending bill for military construction and the VA. That's a request to start debate. No vote on it yet.

  Now these programs run on a temporary law, Public Law 119-103, at 2026 rates through Dec. 11. As the House committee wrote it, the bill gives $157 billion, $3.7 billion more than 2026.

  The U.S. House of Representatives passed it 400-15 on May 15. Per the House Clerk: Republicans 210-0, Democrats 189-15, the one Independent Yea. The Nay names are in the slides.

  Full-year funding by Dec. 11, or another temporary law? Tell us.
hashtags: [congress, senate, veterans, appropriations, votetherecord]
notes: >-
  New: the Nov. 20 Congressional Record (S5847) shows Thune's motion to proceed to Calendar No. 455, H.R. 8469; congress.gov
  actions (api, read Nov. 21) show it as the latest action, with no vote on it and no cloture motion on it in the Record pages
  opened. The orders for Nov. 24-30 (S5847) set pro forma sessions and a 5:30 p.m. Nov. 30 action on the Reardon nomination
  only; the Senate Press Gallery log says "There is one vote that evening at 5:30 p.m." Temporary funding: P.L. 119-103
  sec. 101(10) covers the 2026 MilCon-VA act (division D of P.L. 119-37); sec. 106(3) ends it Dec. 11, 2026. Amounts are
  the committee-reported bill (H. Rept. 119-622: "$157,000,000,000 for discretionary programs", "an increase of
  $3,721,804,000 above the fiscal year 2026 enacted level"); the House adopted floor amendments en gros on May 15, so the
  engrossed total wasn't checked and the slide says "as the House committee wrote it". The report's "$19,200,000 for
  military construction" looks like a typo and isn't used. The unanimous committee vote and the quote are from the
  minority views (DeLauro, Wasserman Schultz); the majority's report has no single for-or-against line to quote. Tally,
  party totals and 15 Nay names from the Clerk's roll 175 XML ("Johnson (GA)", "Lee (PA)", "Torres (NY)" drop the Clerk's
  state tag since the state is shown). News first: a Senate action from Nov. 20 takes the Nov. 25 9:00 a.m. post slot; the
  evergreen prefiled Texas HB 1218 post moves to Dec. 10 3:00 a.m. If the U.S. Senate votes on the motion before the slot,
  update slides 2 and 8 and `where`.
