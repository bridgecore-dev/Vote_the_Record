slides:
- kicker: New York · New law, Nov. 20, 2026
  big: Start over
  head: In New York civil trials, when a juror is replaced during deliberations, the jury must now start over.
  text: Signed as Chapter 388 of the Laws of 2026. It took effect right away, for cases already pending too.
- chip: What the law says
  head: The new words added to the court rules (CPLR 4106)
  quote: {label: "Chapter 388, section 1 (new words)", text: "After an alternate juror has been substituted, the jury shall deliberate anew on all of the issues that were submitted to the jury at the outset of deliberations."}
- chip: Plain words
  head: An alternate juror is a backup, picked with the jury, who steps in if a regular juror can't go on.
  text: This law is about civil trials, the kind where one side sues another, not criminal trials.
- chip: Before → after
  head: Courts could already seat an alternate after deliberations began. The rules didn't say what came next.
  rows:
  - [Before, "The rule was \"silent\" on whether the jury picks up where it left off or starts over, the sponsor's memo says"]
  - [After, "The jury starts over on every issue it was given"]
  - [Exception, "Issues already decided by a verdict stay decided"]
- chip: The case for
  head: Every juror in the box takes part in the whole verdict.
  quote: {label: "Sponsor's memo", text: "The parties will have the assurance that all six jurors in the jury box, including the substituted juror, participated in the deliberations leading to the verdict."}
- chip: The cost
  head: Starting over can make deliberations take longer.
  quote: {label: "Sponsor's memo", text: "Even though this procedure may prolong the length of deliberations, its virtues are several"}
  text: The memo lists the cost to state and local governments as "TBD."
- chip: Who asked for it
  head: The state's court system did.
  text: The memo says it was introduced at the request of the Acting Chief Administrative Judge, on her Advisory Committee on Civil Practice's recommendation. The sponsor is Assemblymember Rajkumar.
- chip: The votes
  head: No member voted no in the New York State Assembly.
  rows:
  - [New York State Assembly, "135 Yes, 0 No, May 4, 2026"]
  - [New York State Senate, "Passed June 3, 2026"]
  - [Governor, "Signed Nov. 20, 2026, Chapter 388"]
- chip: Your turn
  head: A full restart, or pick up where they left off?
  text: A restart means every juror decides everything; it can also mean a longer wait for a verdict. Which side convinces you?
caption: |-
  New York has a new rule for civil trials. If a juror is replaced by an alternate after deliberations begin, the jury must start over on every issue it was given. Issues already decided by a verdict stay decided. It was signed Nov. 20, 2026 as Chapter 388 of the Laws of 2026 and took effect right away, for pending cases too.

  Before: courts could already seat an alternate during deliberations, but the rule was silent on whether the jury starts over, the sponsor's memo says.
  Now: it starts over.

  For: every juror in the box takes part in the whole verdict. Against: the memo says starting over "may prolong the length of deliberations." It lists the cost to governments as TBD.

  The state's court system asked for the change. The New York State Assembly passed it 135-0, and the New York State Senate passed it June 3, 2026.

  A full restart, or pick up where they left off?
