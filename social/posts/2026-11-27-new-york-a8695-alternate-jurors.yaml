notes: >-
  News-first: an official action from the last three days (nyassembly.gov actions, read 2026-11-22: "11/20/2026
  signed chap.388"). Found through Open States' action feed (a tip only, not a source). Takes Nov. 27 9:00 p.m., a free
  post slot (Nov. 27 ends with the 6:00 p.m. Reel; Nov. 28 starts with a Reel), so no post is bumped; the Nov. 26 9:00
  p.m. slot goes to the New York A4591 post in its own pull request. New words are the underscored text in the bill
  (sec. 1, lines 20-25); the alternate-juror rules before that are existing law (as amended by chapter 204 of the laws
  of 2013). "Civil trials, where one side sues another" is our plain wording for the CPLR (the memo says "a civil
  trial"); "six jurors" is the memo's. "Silent" and the 2013 history are the memo's description, not checked in the
  statute. The memo calls it a request of "the Acting Chief Administrative Judge upon the recommendation of her
  Advisory Committee on Civil Practice". Assembly vote 135/0 from nyassembly.gov floor votes (several members
  excused). The Senate tally isn't on the Assembly page and nysenate.gov served a bot challenge, so the Senate line
  gives only the date ("06/03/2026 PASSED SENATE", substituted for S9770, not named: one bill per post). No party is
  shown; the records don't list it. The "cost" side is the memo's own caveat; no opposing statement was found. The
  builder's bill-number check doesn't take New York Assembly numbers (A8695), so, like the New Jersey A4835 post, the
  slides name the chapter instead.
