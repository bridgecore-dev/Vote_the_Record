caption: |-
  On Nov. 18, the U.S. House of Representatives passed H.R. 9640, the Earth MRI Reauthorization Act, 396-14, with 23 members not voting.

  Earth MRI is a U.S. Geological Survey program that maps what's under the ground: rock, minerals like lithium, and water. Congress authorized up to $320 million for it for 2022 through 2026. This bill adds up to $84 million for 2027 through 2031. USGS would have to favor U.S.-owned contractors where it can, and every bidder would have to say who owns it.

  Every member who spoke in the debate backed the bill. Rep. Melanie Stansbury (D-NM) said it "would reauthorize substantially less than the original $320 million."

  By party, per the House Clerk: Republicans 190 Yea, 14 Nay; Democrats 206 Yea, 0 Nay; the one Independent didn't vote. All 14 Nay names are in the slides. The roll call doesn't record reasons.

  Next it goes to the U.S. Senate. How much should this mapping get? Tell us below.
