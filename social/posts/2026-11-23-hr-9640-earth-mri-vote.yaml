notes: >-
  New: roll call 326 (Nov. 18, 12:54 p.m. ET) was not covered; the Nov. 16 Reel covered H.R. 9640 only as a scheduled
  bill. Tally, party totals and all 14 Nay names (party and state) are from the Clerk's roll XML; "Harris (MD)" and
  "Biggs (AZ)" drop the Clerk's state tag since the state is shown. The text passed (CR H6244-6245, "as amended") matches
  the reported text: "$84,000,000 for the period of fiscal years 2027 through 2031", the contractor preference and the
  ownership disclosure. The $84 million is added to the 2022-2026 $320 million line, not a replacement for it, so slide 2
  says "Adds". "No member spoke against it": the CR shows Westerman, Stansbury, Wittman, Stauber and Crank, all in
  support; the report has Huffman's additional views (also supportive, wanting more money) and no dissenting views.
  Cost: the report says CBO's estimate wasn't received in time; congress.gov lists one (cbo.gov/publication/62857), not
  opened because cbo.gov has blocked earlier runs. Takes Nov. 23 3:00 p.m., the first free post slot (Nov. 19-22 regular
  slots are full; optional pairs need both halves).
