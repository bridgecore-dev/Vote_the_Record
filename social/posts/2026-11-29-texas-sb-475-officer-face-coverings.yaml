slides:
- kicker: 2027 Texas session · Filed Nov. 23, 2026
  big: No masks
  head: A Texas Senate bill would bar officers from hiding their faces while dealing with the public, with exceptions.
- chip: What counts
  head: A "facial covering" is anything worn on the face or head that hides who you are.
  quote:
    label: SB 475, new Art. 2B.0351(1)
    text: including a balaclava, tactical mask, gaiter, or ski mask
  text: "Not covered: clear masks and face shields, medical masks against disease, gas masks, helmets, and anything worn for a religious purpose."
- chip: Who it covers
  head: The rule covers Texas peace officers and some federal agents.
  text: Federal agents count if they can carry guns and arrest without a warrant, and their job is enforcing criminal, customs or immigration laws.
- chip: Exceptions
  head: Officers could still cover their faces in three cases.
  rows:
  - [Undercover, An active undercover operation their agency authorized]
  - [SWAT, Duties of a SWAT team they are assigned to]
  - [Safety rules, To follow a health and safety law or regulation]
- chip: Before → after
  head: The bill doesn't rewrite an existing rule. It adds a new one, and a new right to sue.
  rows:
  - [Masks while dealing with the public, "No rule in the codes the bill amends → banned, with exceptions"]
  - [Detained by a masked officer, "No such lawsuit in those codes → the person could sue the officer"]
  - [Official immunity, "The bill says officers can't use it as a defense in these lawsuits"]
