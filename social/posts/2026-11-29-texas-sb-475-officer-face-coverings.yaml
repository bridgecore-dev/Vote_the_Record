  head: A person could sue an officer who detained them while wearing a banned covering.
  rows:
  - [They could win, "Damages, punitive damages, a court order, court costs and lawyer's fees"]
  - [Officer's defense, "Their name or other information was clearly shown on their uniform"]
  - [Applies to, "Detentions on or after the law takes effect"]
- chip: Who it affects
  head: People stopped by officers would gain a way to sue. Officers would face new limits and new lawsuits.
  rows:
