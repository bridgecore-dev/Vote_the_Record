caption: |-
  SB 475, filed in the Texas Senate for the 2027 session, would bar peace officers from wearing masks that hide who they are while dealing with the public.

  It would also cover federal agents who can carry guns and arrest without a warrant and who enforce criminal, customs or immigration laws.

  Exceptions: undercover work, SWAT duties, and health and safety rules. Clear masks, medical masks, gas masks, helmets and religious coverings don't count.

  A person detained by an officer in a banned mask could sue. The officer's defense: their name or other information was clearly shown on the uniform. The bill says officers can't claim official immunity in these suits.

  No cost estimate is posted yet. Should officers have to show their faces?
