notes: >-
  New: filed Nov. 23, 2026; the only bill on that day's filing report whose caption is about facial coverings in law
  enforcement. No earlier post or pull request names it. Records opened 2026-11-24: the Nov. 23 filing report, the bill
  history (filed and received by the Secretary of the Senate, no other action; subjects Civil Remedies & Liabilities,
  Law Enforcement, Peace Officers; council document 90R 1299 JDK-F) and the introduced text. Every rule, exception,
  remedy and date is read from the introduced text (Arts. 2B.0351-2B.0352; Civ. Prac. & Rem. Code 108A.001-.004;
  Secs. 3-4). "Doesn't rewrite an existing rule" and the "before" side rest on the bill adding new sections rather than amending
  existing ones; please confirm no other Texas statute already limits officers' face coverings. The bill reaches
  federal agents; whether a state can apply such a rule to federal officers is not addressed in any official record
  opened this run (justice.gov refused the request, 403, not retried), so the post doesn't say either way. No fiscal
  note, analysis, or official statement for or against was found, so there is no for/against slide and the post asks.
  Sen. Gutierrez as TLO lists the author, no party shown. Evergreen (a prefiled bill): Nov. 29 9:00 p.m. is the first
  free post slot that keeps the Reel/post turn (Nov. 29 9:00 a.m. would follow a post with the 6:00 a.m. Reel empty).
