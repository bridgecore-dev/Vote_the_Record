notes: >-
  New this run: Senate vote 265 (Nov. 17, 2:15 p.m. ET), not in any post; same layout and wording as the
  Domenico post (vote 263). Tally, party counts and the two not-voting names (Murphy, D-CT; Risch, R-ID) were
  counted from the vote's XML (vote_119_2_00265.xml); party as the Senate lists it (D, R, I). The 46 Nays are over
  the ~40-name limit, so the slide gives totals and points to senate.gov. "Of Louisiana" and PN1181-7 are from the
  vote record. 28 U.S.C. 41 also still lists the "District of the Canal Zone" in the Fifth Circuit (that court
  ended in 1982), so the post names only the three states; 17 judgeships are from 28 U.S.C. 44(a), GPO 2023 ed.,
  please confirm no later law changed the count. No case for or against is quoted: the Nov. 17 Congressional
  Record wasn't checked for floor debate. Fills the empty Nov. 21 story slot (Nov. 18-19 slots are all full).
