caption: |-
  The U.S. Senate confirmed Anna St. John, of Louisiana, to the U.S. Court of Appeals for the Fifth Circuit on Nov. 17, 2026 (vote 265).

  Result: 52 Yea, 46 Nay, 2 didn't vote.
  Republican: 52 Yea, 0 Nay, 1 didn't vote.
  Democratic: 0 Yea, 44 Nay, 1 didn't vote.
  Independent: 0 Yea, 2 Nay.

  The Fifth Circuit hears federal appeals from Louisiana, Mississippi and Texas. Most courts of appeals decisions are final. Circuit judges have no set term: federal law says they "hold office during good behavior."

  Should judges serve for life, or for a set term?
