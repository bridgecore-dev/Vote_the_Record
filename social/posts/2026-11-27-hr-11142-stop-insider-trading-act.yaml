  head: "A bill with the same name passed the U.S. House of Representatives 232-198 on July 22, 2026."
  text: "On Sept. 30, a U.S. Senate cloture vote, a vote to end debate on taking it up, failed 53-47. H.R. 11142 is a new bill, introduced Nov. 24 by Rep. Bryan Steil (R-WI)."
  say: A bill with the same name passed the United States House 232 to 198 in July. On September 30, a United States Senate
    cloture vote, a vote to end debate on taking it up, failed 53 to 47.
- chip: What's next
  big: Nov. 30
  head: The House Rules Committee meets on H.R. 11142 at 4 p.m. Then the full House can vote.
  text: Watch at live.house.gov. Should members of Congress be able to buy stocks?
  say: The United States House Rules Committee meets on the bill November 30 at 4 p.m. Then the full House can vote. Should members
