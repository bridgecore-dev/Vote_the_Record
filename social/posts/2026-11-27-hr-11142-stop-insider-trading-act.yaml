notes: >-
  News first: a dated event in the next three days (House Rules Committee meeting on H.R. 11142, Mon. Nov. 30, 4:00 p.m.,
  rules.house.gov; docs.house.gov lists it "pursuant to a rule" for the week of Nov. 30, added Nov. 25). Takes the Nov. 27
  6:00 a.m. Reel slot, the earliest Reel slot at least 3 hours away held by an evergreen post (Nov. 27 12:00 a.m. is less
  than 3 hours away), and moves the prefiled Texas HB 1177 Reel (no design, so not a design trial) to Dec. 25 6:00 a.m.,
  the first Reel slot after the last queued post (Dec. 25 3:00 a.m. carousel). No post or open pull request covers H.R.
  11142. Records opened 2026-11-27: the floor schedule, the Rules page, the introduced text, congress.gov actions,
  summary, cosponsors (none) and committees (House Administration), 5 U.S.C. 13105(l) from GPO's 2025 Code (paragraph (9)
  names Members of Congress), and the actions on the earlier bill with the same name (H.R. 7008, not named on the slides:
  one bill per post): House passage 232-198 (roll 280) July 22, 2026; cloture on the motion to proceed not invoked 53-47
  (record vote 253) Sept. 30. Whether H.R. 11142's text matches the earlier bill's was not checked, so the post says only
  "a bill with the same name". "The bill doesn't require selling stocks already owned" is our reading: the text bans
  purchases (13152(a)) and requires notice before sales (13152(b)) and nothing else requires a sale except for stock
  bought in violation (13153(a)(2)); please confirm. "Trusts the family can't direct, run by a non-relative" shortens
  13151(2)(B)(iv). No statement for or against H.R. 11142 itself was found (the sponsor's July release is about the
  earlier bill), so the post asks. No CBO estimate is listed on congress.gov. Steil's party and state as congress.gov
  lists them. Shortened the source titles after the first preview clipped the sources footer. If the House votes
  before this posts (unlikely; the Rules meeting is Nov. 30), the last slide needs the
  tally.
