bills:
- id: H.R. 11142
  title: Stop Insider Trading Act
  does: Would bar members of Congress and their spouses and dependent children from buying stocks, and require public notice before they sell.
  affects: Members of Congress, their spouses and dependent children.
  where: "Introduced Nov. 24, 2026. On the U.S. House floor schedule for the week of Nov. 30."
  summary:
    text: >-
      This bill generally prohibits Members of Congress and their spouses and dependent children from purchasing
      stocks and requires public notice before these individuals may sell stocks.
    title: Congressional Research Service summary of H.R. 11142
    url: https://api.congress.gov/v3/bill/119/hr/11142/summaries
    retrieved: '2026-11-27'
  say: H.R. 11142 would bar members of Congress, their spouses and dependent children from buying stocks, and require
    public notice before they sell. It was introduced November 24 and is on the United States House schedule for the week of November 30.
slides:
- kicker: "U.S. House · Week of Nov. 30"
  big: H.R. 11142
  head: The U.S. House of Representatives plans to take up a bill that would stop members of Congress from buying stocks.
  say: Next week, the United States House plans to take up H.R. 11142, the Stop Insider Trading Act. It would stop members
    of Congress from buying stocks.
- chip: The law today
  big: 45 days
  head: Today, federal law has members of Congress report their stock trades after they happen.
  quote: {label: 5 U.S.C. 13105(l), text: "in no case later than 45 days after such transaction", key: "45 days"}
  text: The report is due within 30 days of being notified of a trade, and no later than 45 days after it.
  say: The law today. Members of Congress report their stock trades after they happen, within 30 days of being notified,
    and no later than 45 days after the trade.
- chip: What would change
  head: "H.R. 11142 adds new rules for members, their spouses and dependent children."
  rows:
  - [Buying, "Not allowed: no new stocks of public companies"]
  - [Selling, "Public notice 7 to 14 days before each sale"]
  - [Notices, "Posted online by the House Clerk or Senate Secretary"]
  - [Starts, "180 days after it becomes law"]
  say: What would change. Members, spouses and dependent children could not buy stocks. Before a sale, a public notice
    goes up 7 to 14 days ahead. The rules start 180 days after the bill becomes law.
- chip: Still allowed
  head: The bill leaves some investments out.
  rows:
  - [Funds, "Widely held investment funds"]
  - [Small business, "A stake in a small business"]
  - [Trusts, "Ones the family can't direct, run by a non-relative"]
  - [Work, "A spouse's or child's trades for their job, or stock pay"]
  - [Stocks owned now, "The bill doesn't require selling them"]
  say: Still allowed. Widely held funds, a stake in a small business, trusts the family can't direct, and a spouse's
    trades for work. The bill doesn't require selling stocks already owned.
- chip: Breaking the rule
  big: $2,000
  head: A violation costs $2,000 or 10% of the trade, whichever is more, plus any gains.
  text: "A stock bought against the rule must be sold. Campaign money and office budgets can't pay the fee, which goes to the U.S. Treasury. No CBO cost estimate is listed yet."
  say: Breaking the rule costs 2,000 dollars or 10 percent of the trade, whichever is more, plus any gains. Campaign money
    can't pay the fee, and it goes to the Treasury.
