caption: |-
  Should members of Congress be able to buy stocks? The U.S. House of Representatives plans to take up H.R. 11142, the Stop Insider Trading Act, the week of Nov. 30.

  Before: members report each stock trade after it happens, within 45 days.
  After: members, spouses and dependent children couldn't buy stocks of public companies, and would post public notice 7 to 14 days before any sale.

  Still allowed: widely held funds, small business stakes, trusts the family can't direct. Stocks owned now don't have to be sold.

  A violation costs $2,000 or 10% of the trade, whichever is more, plus any gains. No CBO estimate is listed yet.

  A bill with the same name passed the U.S. House 232-198 in July; a U.S. Senate cloture vote failed 53-47 on Sept. 30.

  Voice: computer-generated (Kokoro text-to-speech).
