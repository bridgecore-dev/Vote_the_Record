caption: |-
  This week's House floor schedule lists 15 bills. 13 may come up under "suspension of the rules," and 2 under a rule from the Rules Committee.

  Under suspension, a bill gets 40 minutes of debate, split between a supporter and an opponent. No amendments can be offered from the floor. It passes only if two-thirds of the members present and voting say yes. A bill that falls short isn't dead: it can be scheduled again, or brought up under a rule.

  Bills under a rule start with a vote on the rule itself, which usually passes by a simple majority.

  Watch the floor at live.house.gov. Recorded votes are at clerk.house.gov/Votes. Should more bills get full debate, or does the fast track work?
