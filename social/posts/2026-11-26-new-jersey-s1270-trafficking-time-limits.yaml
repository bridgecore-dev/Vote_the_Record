notes: >-
  News-first: an official action from the last three days (the Legislature's bill history, read through its own
  api/billDetail/billHistory/S1270/2026 feed on 2026-11-22: "11/20/2026 Approved P.L.2026, c.107."). Found through Open
  States' action feed (a tip only, not a source). Takes Nov. 26 3:00 a.m., the earliest carousel slot held by an
  evergreen post (Nov. 22-25 carousels are all news from Nov. 16-20); this pull request moves the prefiled Texas HB 1225
  post to Dec. 12 3:00 a.m. (first post slot after the last queued post that keeps the Reel/post turn). The bill is a
  Senate Committee Substitute for S1270 and S2566; it was substituted for an identical Assembly bill, which isn't named
  (one bill per post). Before/after is from the second reprint (HTML sha256
  c06a3ab7c4692821908089461e9f5367314ce075a197272ca3e093353564c365; PDF
  ad324e72269a8221739121a2e65fbfdc2b887061a923268bb574794d38c103ea) and the OLS estimate/Assembly Appropriations
  statement. Please check: (1) the 10-year civil limit in the bill's markup was new text in the introduced bill that
  committee amendments struck, so current law was 5 years (2C:1-6g), as both statements say; (2) aggravated criminal
  sexual contact (2C:14-3a) moves to "any time"; plain criminal sexual contact (2C:14-3b) keeps the under-18 rule, so
  the slides name only "aggravated"; (3) "Before" for an adult victim of aggravated criminal sexual contact (the
  general 5-year crime limit, 2C:1-6b(1)) is left off because the statements don't describe it. The bill text lists
  sponsors by district, not party, so no party is shown. Votes are as the bill history prints them (Senate 40-0;
  Assembly 79-0-0). No floor statements or testimony were opened, and no official case for or against was found. P.L.
  chapter text isn't on pub.njleg yet (PL26/107 returned 404); the second reprint is the version both houses passed.
  The governor isn't named because the record says only "Approved".
