bills:
- id: S. 1270
  does: Ends the time limit to charge human trafficking or aggravated criminal sexual contact, or for a trafficking victim to sue.
  affects: People accused of these crimes, trafficking victims, and those who profit from trafficking or hold its victims.
  where: Approved Nov. 20, 2026 as P.L.2026, c.107; it took effect immediately.
  summary:
    text: >-
      the bill eliminates the statute of limitations for criminal prosecutions of human trafficking and aggravated
      criminal sexual contact and eliminates the statute of limitations under which a victim of human trafficking may
      bring a civil suit against the perpetrator.
    title: New Jersey Assembly Appropriations Committee statement to S1270/S2566 (2R) SCS, Oct. 22, 2026
    url: https://pub.njleg.state.nj.us/Bills/2026/S1500/1270_S5.PDF
    retrieved: '2026-11-22'
slides:
- kicker: New Jersey · New law, Nov. 20, 2026
  big: No deadline
  head: New Jersey ended the statute of limitations, the deadline to bring a case, for human trafficking.
  text: S. 1270 became law as P.L.2026, c.107. It covers criminal charges and victims' lawsuits.
- chip: Criminal charges
  head: Prosecutors can now charge these crimes at any time.
  rows:
  - [Human trafficking, "Before: within 5 years of the crime. Now: any time"]
  - [Aggravated criminal sexual contact, "Now: any time, whatever the victim's age"]
  text: Before, if the victim was under 18, charges had to come within 5 years of the victim turning 18, or 2 years after the victim discovered the offense, whichever was later.
- chip: Lawsuits
  big: 5 years → none
  head: A trafficking victim's civil lawsuit had to be filed within 5 years. Now it can be filed at any time.
  text: A civil lawsuit asks for money for the harm done. It can go ahead even if no one is convicted.
- chip: Who can be sued
  head: The law also widens who a victim can sue.
  rows:
  - [Before, "Those who knowingly profited from the trafficking, or knowingly kept a victim"]
  - [Now, "Also those who profited, directly or indirectly, or kept a victim, \"knowing or in reckless disregard\""]
  quote: {label: P.L.2026, c.107, sec. 2, text: "knowing or in reckless disregard that the pecuniary benefit they derived was from the human trafficking offense"}
- chip: Which cases
  head: It took effect right away, for cases whose deadline hadn't already passed.
  quote: {label: P.L.2026, c.107, sec. 3, text: "applicable to all offenses not yet barred from prosecution, and to all civil causes of action not yet barred from filing"}
- chip: Who gains, who loses
  head: Victims get more time. People accused lose a defense.
  rows:
  - [Victims, "No deadline to see charges filed or to sue"]
  - [People accused, "Can no longer say the time limit ran out, in cases not already barred"]
  - [Those who profit, "Can be sued if they knew, or recklessly ignored, where the money came from"]
- chip: What it costs
  head: No dollar figure. Legislative analysts expect more court cases and more prosecutions.
  text: The Office of Legislative Services says court costs rise with the caseload, and so do court filing fees. The Executive Branch sent no fiscal note.
  quote: {label: Office of Legislative Services, text: "annual indeterminate State expenditure and revenue increases"}
- chip: The votes
  head: No member of either chamber voted no.
  rows:
  - [New Jersey Senate, "40-0, June 30, 2026"]
  - [New Jersey General Assembly, "79-0-0, Oct. 29, 2026"]
  by: "Primary sponsors: Sens. Greenstein, Burgess, Gopal; Assembly members Stanley, Hutchison, Speight"
- chip: Your turn
  head: Should serious crimes ever have a deadline to charge them?
  text: The records we opened give no argument for or against. Which side convinces you?
caption: |-
  New Jersey ended the statute of limitations, the deadline to bring a case, for human trafficking. S. 1270 was approved Nov. 20, 2026 as P.L.2026, c.107, and took effect right away.

  Before: human trafficking charges had to come within 5 years of the crime, and a victim's lawsuit within 5 years. For aggravated criminal sexual contact with a victim under 18, charges had to come within 5 years of the victim turning 18, or 2 years after discovery.
  Now: charges for human trafficking or aggravated criminal sexual contact, at any age, and a trafficking victim's lawsuit can come at any time. Victims can also sue people who profited "knowing or in reckless disregard" that the money came from trafficking.

  It applies to cases whose deadline hadn't already passed. Cost: not counted; the Office of Legislative Services expects more court cases and prosecutions, and more filing fees.

  The New Jersey Senate passed it 40-0 and the General Assembly 79-0-0.

  Should serious crimes ever have a deadline? Which side convinces you?
