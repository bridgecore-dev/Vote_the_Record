notes: >-
  Owner asked for a separate Reel on H.R. 9237 (2026-11-15), so it isn't confused with H.R. 2102. The text as
  passed is the bill "as amended" by part B of H. Rept. 119-749, printed in the Congressional Record of July 16
  (H4548-H4613); on Nov. 11 the House resumed it as unfinished business and passed it by voice vote with no
  further amendment in the actions, but govinfo has no engrossed text yet, so check it when it appears. Note the
  passed text applies the ratings to claims filed on or after Oct. 1, 2026 (the introduced text said "after the
  date of the enactment"). Current ratings are from eCFR as of Nov. 12, 2026. Party and state for Bost, Takano
  and Deluzio come from roll call 249's member list. Takano is called "the top Democrat on the committee" because
  Bost calls him "Ranking Member Takano" in the Record. The motion to recommit was offered by Rep. Deluzio
  (D-PA), who said he would have changed the bill's offsets. No CBO estimate is listed in the bill status.
