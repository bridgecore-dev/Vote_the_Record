caption: |-
  The U.S. House of Representatives passed H.R. 9237, the Take Care of America's Veterans Act, by voice vote on Nov. 11. It's a different bill from the Major Richard Star Act, though it includes its own version of that act.

  Before: VA rates sleep apnea 50% if it needs a CPAP, and recurrent tinnitus 10% on its own.
  After: sleep apnea is rated by whether treatment works (0% if it removes symptoms), and tinnitus gets no separate rating unless it's tied to otherwise uncompensated hearing loss. This applies to claims filed on or after Oct. 1, 2026; the bill says existing ratings can't be cut because of it.

  For: the sponsor, Rep. Mike Bost (R-IL), says current ratings are protected and the savings fund new benefits. Against: Rep. Mark Takano (D-CA) says VA rating reviews can still cut current veterans.

  Next: the U.S. Senate.

  Voice: computer-generated (Kokoro text-to-speech).
