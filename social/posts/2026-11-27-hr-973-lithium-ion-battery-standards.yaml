caption: |-
  On Nov. 19, the U.S. Senate passed H.R. 973, the Setting Consumer Standards for Lithium-Ion Batteries Act, by unanimous consent. The U.S. House of Representatives passed it 365-42 on Apr. 28, 2025.

  Before: the House committee report said there is no federal safety standard for lithium-ion batteries.

  After: the Consumer Product Safety Commission must adopt three UL standards for e-bike and e-scooter batteries (UL 2271, 2849, 2272) as mandatory rules within 180 days.

  Who gains: riders. Who gives: makers and distributors, who must comply. Congress.gov lists no CBO estimate.

  House vote by party (Roll Call 103): Republican 163 Yea, 42 Nay; Democratic 202 Yea, 0 Nay.

  Should these batteries have to meet a federal standard?

  Voice: computer-generated (Kokoro text-to-speech).
