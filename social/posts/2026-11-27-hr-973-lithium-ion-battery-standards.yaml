bills:
- id: H.R. 973
  title: Setting Consumer Standards for Lithium-Ion Batteries Act
  does: "Makes the CPSC turn three UL safety standards for e-bike and e-scooter batteries into mandatory federal rules within 180 days."
  affects: "Makers and sellers of e-bikes, e-scooters and their rechargeable lithium-ion batteries, and the people who use them."
  where: "Passed the U.S. House 365-42 Apr. 28, 2025, and the U.S. Senate by unanimous consent Nov. 19, 2026."
  summary:
    text: "This bill requires the Consumer Product Safety Commission to issue a final consumer product safety rule for rechargeable lithium-ion batteries used in micromobility devices, such as electric bikes and electric scooters."
    title: Congressional Research Service summary of H.R. 973
    url: https://www.congress.gov/bill/119th-congress/house-bill/973
    retrieved: '2026-11-19'
  say: "H.R. 973 makes the Consumer Product Safety Commission turn three safety standards for e-bike and e-scooter batteries into mandatory federal rules within 180 days. It applies to makers and sellers of those batteries and devices."
