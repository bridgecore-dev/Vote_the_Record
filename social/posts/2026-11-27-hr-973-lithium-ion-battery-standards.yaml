notes: >-
  New this run: the Senate Press Gallery's Nov. 19 floor log says "Senator Gillibrand achieved unanimous consent to pass
  the following: ... H.R.973 - Setting Consumer Standards for Lithium-Ion Batteries Act" (3:34 p.m.). It names a
  substitute for the other bill in that entry (H.R. 4624) but not for H.R. 973; it doesn't say "without amendment", and
  api.congress.gov actions (read 2026-11-19) still end Apr. 29, 2025 ("Received in the Senate"). So the post doesn't say
  it goes to the President. PLEASE CHECK before the slot: if congress.gov shows "Passed Senate without amendment", the
  "How it passed" slide, `where` and the caption can say it goes to the President next; if amended, it goes back to the
  House and the before/after (from the engrossed text) may need changing. "No objection" is what unanimous consent
  means; the log doesn't name objectors. "No federal safety standard" is the committee report's April 2025 wording;
  please confirm the CPSC hasn't issued a mandatory standard since. Party totals and 365-42-25 are from roll103.xml; the
  42 Nays (all Republican) are linked, not listed (over about 40). The only House speakers in the debate granule are
  Bilirakis, Pallone and Torres, all in support; no member stated a reason for voting Nay, so there is no case-against
  quote. The FDNY numbers are the report's ("more than 400 fires, 300 injuries, and twelve deaths ... in New York City
  alone"). No CBO estimate is listed on the bill record; the report says CBO's estimate wasn't available when filed.
  "Gains/gives" rests on the CRS summary (manufacturers and distributors must comply) and the report's purpose
  ("protect consumers"). Sponsor's party and state from congress.gov.
  Slot: Nov. 27, 6:00 a.m. Reel, so the day still alternates whether or not the Nov. 26 9:00 a.m. post in PR 225 merges.
