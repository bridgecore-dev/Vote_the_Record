notes: >-
  Part of the "One Big Beautiful Bill Act: what changes in 2027" series, the owner's request (2026-11-15). Check:
  (1) Dates. The slides use the calendar dates from the bill status and the Clerk/Senate (House passage May 22,
  Senate July 1, House concurrence July 3, signed July 4, 2025). The law's own legislative history uses
  Congressional Record legislative days instead ("May 21, considered and passed House. June 28, 30, considered and
  passed Senate, amended. July 2, House concurred in Senate amendment."), so someone checking the public law may
  see May 21 and July 2. Senate roll 372 was taken July 1 at 11:56 AM, inside the June 30 legislative day. (2)
  Senate party totals are my count from the member list in vote_119_1_00372.xml (the Senate gives no party totals):
  R 50 Yea, 3 Nay; D 45 Nay; I 2 Nay. The Senate's result line is quoted exactly; Congress.gov and the bill status
  record it as "51 - 50", counting the Vice President, which slide 5 says. (3) House party rows, including the
  Independent row of zeros, are the Clerk's totals-by-party. The Clerk lists one member as "Harris (MD)"; shown as
  Harris (R-MD), the same form as everyone else. Roll 190 was a recorded vote, so the Clerk records Aye/No; the
  builder's vote labels say Yea/Nay. (4) For/against quotes come from the July 2 House debate on the rule for the
  concurrence vote (the rule's resolution number is left off so no other measure is named). McGovern's "$3
  trillion" and Barr's "$4.5 trillion" are their own claims; CBO's estimate wasn't used because cbo.gov showed a
  bot check, so the slides give no official cost figure. (5) "Fair, not silent": Republicans who broke with their
  party's majority are named; no Democrat broke with theirs on any of the three votes.
