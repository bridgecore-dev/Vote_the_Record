caption: |-
  Who voted for the One Big Beautiful Bill Act, as the official record shows it.

  Sponsor: Rep. Jodey C. Arrington (R-TX-19).
  U.S. House of Representatives, May 22, 2025: passed 215-214, 1 Present (roll call 145).
  U.S. Senate, July 1, 2025: 50-50, and the Vice President voted Yea, so it passed (roll call 372).
  U.S. House of Representatives, July 3, 2025: agreed to the U.S. Senate's changes, 218-214 (roll call 190).
  Signed July 4, 2025, as Public Law 119-21.

  Every member's Yea came from a Republican. No Democrat or independent voted Yea on any of the three. Some Republicans voted Nay or Present, or didn't vote; the slides name them as the Clerk and the Senate list them.

  For: Rep. Barr (R-KY). Against: Rep. McGovern (D-MA). Their words are on the slides.

  Next: what changes in 2027.
