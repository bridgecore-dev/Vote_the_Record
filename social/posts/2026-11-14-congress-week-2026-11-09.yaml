bills:
- id: H.R. 3978
  does: 'Would have the NRC license future spent-fuel recycling plants under rules with fewer steps'
  affects: 'Future U.S. plants that recycle spent nuclear fuel without isolating plutonium'
  where: 'House vote Nov. 9, 2026: Passed, 397-2.'
  summary:
    text: This bill directs the Nuclear Regulatory Commission (NRC) to license future recycling facilities that reprocess
      certain spent nuclear fuel (i.e., radioactive waste) under regulations for special nuclear material rather than regulations
      for production and utilization facilities.
    title: CRS summary of H.R. 3978
    url: https://www.congress.gov/bill/119th-congress/house-bill/3978
    retrieved: '2026-11-14'
- id: H.R. 9612
  does: 'Would allow building a uranium enrichment plant before the NRC issues its license'
  affects: 'Companies building uranium enrichment plants; the NRC must write rules within 180 days'
  where: 'House vote Nov. 9, 2026: Passed, 394-3.'
  summary:
    text: This bill allows for the construction of a uranium enrichment facility before a license is issued by the Nuclear
      Regulatory Commission (NRC). Under current law, a license is required from the NRC prior to the construction of a uranium
      enrichment facility.
    title: CRS summary of H.R. 9612
    url: https://www.congress.gov/bill/119th-congress/house-bill/9612
    retrieved: '2026-11-14'
