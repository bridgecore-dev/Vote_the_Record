  by: "NYC Mayor's Office, Oct. 1, 2026"
  say: "What New York City did for SNAP, as the city reports it: 10,000 doors knocked and 40,000 phone calls, help documenting medical and caregiver exemptions, and 100 plus community groups offering volunteer and training hours. About 26,500 people still lost SNAP."
- chip: "Lost SNAP? You can reapply"
