caption: |-
  New York City says it helped more than 220,000 people keep SNAP under H.R. 1's work rules.

  Before: SNAP's work rule covered ages 18 to 54; Medicaid had none. After: SNAP covers 18 to 64, and from Jan. 1, 2027, many Medicaid adults need 80 hours a month.

  The city knocked on 10,000 doors for SNAP, helps those cut off reapply, and funded a $3 million Medicaid team; it says up to 900,000 New Yorkers are at risk. The state plans a Bronx exception.

  Other states can do outreach and excuse high-unemployment counties. None can waive the Medicaid rule.

  For: Sen. John Barrasso of Wyoming. Against: NYC officials. Which side convinces you?

  Voice: computer-generated (Kokoro text-to-speech).
