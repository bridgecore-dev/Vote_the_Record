  say: "Can other states do this? Yes. Any state can go past the required notices; Maryland mailed 340,000 SNAP households. States can excuse counties with 8% unemployment or 1.5 times the national rate, pause Medicaid denials through June 30, 2027, and seek SNAP waivers above 10%."
