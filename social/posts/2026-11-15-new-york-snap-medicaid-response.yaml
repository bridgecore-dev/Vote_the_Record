  say: "For Medicaid, the city estimates up to 900,000 New Yorkers could be at risk. It funded a $3 million outreach team of community health workers who speak 13 languages, focused on those most likely affected, including people who lost SNAP. It also reached 35,000 providers."
- chip: "What New York State did"
  head: "New York State told the federal government it plans a Bronx exception, because of high unemployment."
  quote: {label: "NY State of Health", text: "If your current address is in the Bronx, you will not have to meet work requirements for Medicaid coverage.", key: "you will not have to meet work requirements"}
  text: "The state says this may change if Bronx unemployment goes down. It tries tax records first and asks for documents only if needed."
