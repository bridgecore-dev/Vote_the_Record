bills:
- id: H.R. 1
  title: One Big Beautiful Bill Act
  does: "Among many changes, it widens SNAP's work rule and adds a Medicaid work requirement: 80 hours a month."
  affects: "Many SNAP adults 18 to 64 and Medicaid expansion adults 19 to 64."
  where: "Law since July 4, 2025 (Public Law 119-21). Medicaid's rule starts Jan. 1, 2027."
  summary:
    text: >-
      the majority of the enacted SNAP provisions (Thrifty Food Plan, work requirements, and waivers, treatment of
      energy assistance and internet costs, noncitizen eligibility for SNAP) are effective immediately.
    title: "CRS Report R48552"
    url: https://www.congress.gov/crs_external_products/R/PDF/R48552/R48552.9.pdf
    retrieved: '2026-11-15'
  say: "H.R. 1, the One Big Beautiful Bill Act, was signed into law July 4, 2025, as Public Law 119-21. It widens SNAP's work rule, and it sets a Medicaid work requirement for some adults starting January 1, 2027."
