notes: >-
  Owner idea (priority). Every number from the idea was checked against official pages; one didn't match as
  described: the 10,000 doors knocked were the city's SNAP campaign "Since January" (Oct. 1 release), not Medicaid,
  so the post says SNAP. "More than 220,000" is from the Oct. 1 release (the June 1 release said 223,000).
  "Up to 900,000" is the city's own estimate (Oct. 19 release); it doesn't say how it was figured. The March 1, 2026
  SNAP start in NYC and the Oct. 1, 2026 time-limit reset are the city's statements (otda.ny.gov reset the connection
  once and wasn't retried). The Bronx exception is a plan New York "told the federal government" about, not a
  confirmed approval; the law's basis is sec. 71119's short-term hardship option (county unemployment at or above the
  lesser of 8% or 1.5 times the national rate). Whether New York adopts CMS's hold harmless option isn't stated on
  any page read, so it isn't claimed. The nyc.gov/workrules text was read from the page's script bundle (the page
  renders with JavaScript); quotes on slides match it exactly. Barrasso's quote is a separate sentence in the same
  speech (Record, July 30, 2025); his party/state form follows the queued Medicaid Reel. Prior SNAP age range (18-54),
  child age (under 18), the 10% waiver rule and the Alaska/Hawaii-only exemptions are from CRS R48552's prior-law vs.
  enacted table (USDA's Nov. 10, 2026 proposed rule says the same; dropped from sources to fit the 2,200-character
  caption, as were the CMS interim final rule, the NYC Health Department page and H. Rept. 119-106). "35,000 health care providers" is from the
  Oct. 19 release ("Reached more than 35,000 health care providers"). Maryland's 340,000 is from its Sept. 18, 2026
  release. Erin Dalton's title on the slide is shortened from "DSS Commissioner" (Department of Social Services).
