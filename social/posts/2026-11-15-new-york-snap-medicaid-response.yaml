  - [Nationwide, "2.4 million fewer people on SNAP in an average month (CBO, via CRS)"]
  by: "Public Law 119-21, sec. 10102; CRS R48552 (Aug. 15, 2025)"
  say: "H.R. 1 widened SNAP's work rule: 80 hours a month of work, training or volunteering, or SNAP stops after 3 months in any 3 years. It now covers ages 18 to 64, not 18 to 54. CBO estimates 2.4 million fewer people on SNAP nationwide."
- chip: "Before → after: Medicaid"
