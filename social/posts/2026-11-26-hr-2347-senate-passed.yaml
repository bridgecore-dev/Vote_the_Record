bills:
- id: H.R. 2347
  title: Bipartisan American Affordability and Jobs Act of 2026 (U.S. Senate substitute)
  does: "Rewrites federal environmental reviews and permits, power line planning and energy leasing; keeps the House bill's tax change."
  affects: "Builders of energy and other projects, agencies that review them, people who sue over them, and data centers."
  where: "Passed the U.S. Senate as amended, 62-33, Nov. 19 (vote 270). The U.S. House passed a different text."
  summary:
    text: "This Act may be cited as the \"Bipartisan American Affordability and Jobs Act of 2026\"."
    title: "SA 6883, sec. 1(a), Congressional Record, Nov. 10, 2026"
    url: https://www.govinfo.gov/content/pkg/CREC-2026-11-10/html/CREC-2026-11-10-pt1-PgS5417.htm
    retrieved: '2026-11-20'
