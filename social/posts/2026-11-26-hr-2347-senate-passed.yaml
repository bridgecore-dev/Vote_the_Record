notes: >-
  New this run: Senate vote 270 (final passage of H.R. 2347 as amended, Nov. 19), not in any post's record_ids
  (PR #231 mentions it only in the cloture post's "where"). Tally, party counts and every name were counted from
  vote_119_2_00270.xml (sha256 209b56e2a1c478b0dbdfa54bd742bf16829f23d18130df033d6525c52bd5099d), party as the
  Senate lists it; majority_requirement is "1/2". The XML prints the time as "09:30 AM", so no time is given.
  Before → after rows are from SA 6883's strike-and-insert text in the Nov. 10 Record (sec. 1203 "five years" →
  "10 years"; sec. 1302 "90-day"/"90 days" → "60"; sec. 1110's 150-day limit, "unless a shorter deadline is
  specified under Federal law"; sec. 2107's data-center finding), re-opened this run; same rows as the Nov. 19
  Reel. CHECK: the bill passed "as amended", and a managers' amendment (No. 7030) may have changed the text after
  SA 6883 was adopted; the Nov. 19 Record wasn't on GovInfo yet and the bill status XML ends Nov. 18. If 7030
  changed any of the four rows, fix the slide. Capito and Alsobrooks quotes re-opened this run (Capito's page uses
  a curly apostrophe in "can’t"); Capito voted Yea and Alsobrooks Nay on vote 270. "What's next" paraphrases
  house.gov's Legislative Process page (conference, final approval by both, 10 days to sign or veto). cbo.gov
  blocked earlier runs, so the CBO letter (listed in the bill status) is linked, not quoted. Earliest free post
  slot is Nov. 26, 3:00 p.m. (every post slot before it is taken). Before it posts, check congress.gov or the
  Clerk for any U.S. House action on the Senate amendment (the House is in a district work period Nov. 19-29).
