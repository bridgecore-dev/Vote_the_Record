caption: |-
  The U.S. Senate passed H.R. 2347 as amended, 62-33, on Nov. 19 (vote 270). It needed a simple majority.

  Republican: 47 Yea, 2 Nay, 4 didn't vote.
  Democratic: 14 Yea, 30 Nay, 1 didn't vote.
  Independent: 1 Yea, 1 Nay.

  The U.S. House of Representatives passed H.R. 2347 as a one-change tax bill. The U.S. Senate's version rewrites federal permits and environmental reviews and keeps that tax change. The two chambers still have to agree on one text before it can go to the President.

  For: Sen. Capito (R-WV). Against: Sen. Alsobrooks (D-MD).

  Which side convinces you?
