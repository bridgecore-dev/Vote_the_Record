slides:
- kicker: 2027 Texas session · Filed Nov. 24, 2026
  big: 15%
  head: If complaints about child abuse and neglect investigations reach 15% of them in a year, this Texas House of
    Representatives bill would bring in an outside auditor.
  text: The investigations are done by the Department of Family and Protective Services (DFPS).
- chip: The law today
  head: Today, Texas Family Code 261.309 has DFPS review complaints about its own investigations.
  rows:
  - [Complaint about staff or policy, "DFPS does an informal review within 14 days"]
  - [Disputed finding, "A DFPS employee not involved in the case reviews it, within 45 days"]
  text: That review must sustain, alter, or reverse the original findings.
- chip: What would change
  head: HB 1287 would add an outside audit, triggered by the number of complaints.
  quote:
    label: HB 1287 as filed, Family Code 261.3092(a)
    text: The external auditor shall be independent and not subject to direction from the department.
  text: The trigger is complaints about abuse or neglect investigations equal to 15% or more of that year's investigations.
- chip: What the audit would check
  head: The auditor would look at four randomly picked months from the past year.
  rows:
  - How many abuse or neglect reports came in
  - How many DFPS investigated, and why it skipped any
  - Failures to investigate when it was warranted
  - Whether DFPS followed its procedures
  - Fixes for procedures, staffing, and training
- chip: After the audit
  head: The report would go to DFPS, the Texas Legislature, and the governor.
  rows:
  - [90 days, "DFPS must make a plan to address every concern and recommendation"]
  - [30% rule, "An employee with complaints in 30% or more of their audited cases gets an employment review"]
  - [Second audit, "If the Legislature or governor finds DFPS hasn't acted within 15 working days of its plan"]
- chip: Who pays
  head: DFPS would pay for the audit from its existing budget. No fiscal note is posted yet.
  quote:
    label: HB 1287 as filed, Family Code 261.3092(c)
    text: The department shall pay the costs associated with an audit under this section using existing resources.
  text: So there is no official estimate of the cost. The bill would take effect Sept. 1, 2027.
- chip: Your view
  head: Should an outside auditor review DFPS investigations when complaints reach 15% of them?
  text: "How we picked: every bill filed Nov. 24 whose caption names DFPS. HB 1287 was the only one."
caption: |-
  When someone complains about a Texas child abuse or neglect investigation today, the Department of Family and Protective Services (DFPS) reviews it itself: an informal review within 14 days, or, for a disputed finding, a review by a DFPS employee who wasn't involved in the case (Family Code 261.309).

  HB 1287, filed Nov. 24 in the Texas House of Representatives for the 2027 session, would add an outside check. If complaints about investigations in a year equal 15% or more of that year's investigations, DFPS would have to hire an independent auditor "not subject to direction from the department."

  The auditor would study four random months: how many reports came in, how many were investigated, why any weren't, and whether procedures were followed. The report would go to DFPS, the Legislature and the governor. DFPS would have 90 days to make a plan. An employee with complaints in 30% or more of their audited cases would get an employment review.

  DFPS would pay "using existing resources." No fiscal note is posted yet. It would take effect Sept. 1, 2027.

  Should an outside auditor step in when complaints reach 15%?
