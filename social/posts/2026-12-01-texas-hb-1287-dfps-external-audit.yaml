  (HB 1282 names DSHS; HB 1286 a TDHCA study; HB 1288-1289 Travis County hospital districts). Records opened
  2026-11-25: the filing report, the bill history (filed, no other action, no fiscal note listed; author listed as
  "Gervin-Hawkins"; subjects Family--Child Protection, AUDITS & AUDITORS, FAMILY & PROTECTIVE SERVICES, DEPARTMENT
  OF), the introduced PDF (HTML not used; PDF sha256 5003915d03c244cb6c7f0babcd4759640c9cd979a832e585e5f00a7ba3f8b186),
  and Family Code ch. 261 on tcss (261.309 as it reads today: rules for complaints, informal review within 14 days,
  administrative review by an uninvolved employee within 45 days). "The law today" describes only 261.309; it doesn't
  claim no other outside review of DFPS exists (e.g., the State Auditor), which wasn't checked. Please check: the bill
  doesn't say who counts the complaints or which complaints count toward 15%, so the slides just restate its words;
  "skipped" and "fixes for procedures, staffing, and training" shorten 261.3092(b)(2) and (b)(5)-(6) ("workforce or
  organizational improvements or additional training"). No fiscal note or statement for or against exists yet, so
  the post asks. Rep. Gervin-Hawkins as TLO lists the author; no party shown. Evergreen (a prefiled bill): Dec. 1
  9:00 p.m. is the first free post slot that keeps the Reel/post turn on its own (Nov. 29 6:00 and 9:00 a.m. are both
  empty, so filling either alone would put two of a kind in a row).
