caption: |-
  On Nov. 20, Sen. Ron Wyden (D-OR) filed a public notice that he intends to object to the U.S. Senate taking up Michael LoSapio's nomination to be Director of the Cybersecurity and Infrastructure Security Agency (CISA). That's called a hold. The notice gives no reason.

  Without a hold: leaders can ask to move a nominee by unanimous consent, with no roll call.
  With a hold: that request draws an objection in Wyden's name. The Senate can still vote to limit debate (cloture) and then vote on the nominee.

  Holds have had to be public since 2011, under a standing order Wyden submitted.

  For: LoSapio, Palantir's chief information security officer, said CISA "should make the Nation harder to attack and faster to recover."
  Against: Sen. Gary Peters (D-MI) said the nominee "does not appear to meet the statutory requirements of this position."

  Should one senator be able to slow a nominee this way?
