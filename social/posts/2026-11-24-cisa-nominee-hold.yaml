  status from api.congress.gov: received Nov. 9, referred to HSGAC, hearing held Nov. 19; nothing later. News
  (Nextgov) says Wyden cited LoSapio's Jan. 6 remarks and Palantir background and that Sen. Tillis also plans a hold;
  neither is in an official record we opened (wyden.senate.gov's press releases have nothing on it; the notice has
  no reason), so the post says "The notice gives no reason" and leaves Tillis out. If Wyden posts a statement or
  Tillis's notice appears in the Record before the slot, consider adding them. S. Res. 28 (112th) text: Wyden "for
  himself" and 18 named cosponsors; recognition rule and 2-session-day limit from sec. 1(a)(2); the quoted form from
  sec. 1(a)(3); calendar listing from sec. 1(b). "Hold" and "unanimous consent" definitions from the Senate glossary;
  cloture from the same glossary. The case for is LoSapio's statement for the record and the case against is Peters's
  "as prepared for delivery" statement, both linked on the HSGAC hearing page; the hearing video (and the Jan. 6
  exchange news reports) was not reviewed. Wyden's and Peters's party and state as Senate vote 279's XML lists them;
  LoSapio is not a member, so no party. Senate schedule from the Nov. 20 Record (S5847). News first: takes the Nov. 24
