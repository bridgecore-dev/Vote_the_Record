caption: |-
  Today, Texas's consumer protection law lists the trade practices it calls deceptive, and personalized pricing isn't on that list.

  HB 1184, filed in the Texas House of Representatives for the 2027 session, would bar stores and online sellers doing business in Texas from using a pricing model that takes in a shopper's personal identifying information or other unique qualities and sets a price unique to that shopper.

  Sales, loyalty benefits and discounts offered to many shoppers on the same terms would still be allowed, as would price differences tied to identifiable costs and price changes for every customer at a store. A violation would be a deceptive trade practice under Texas law. No cost estimate is posted yet. If passed, it takes effect Sept. 1, 2027.

  Should a store be able to price by who you are?

