  statutes.capitol.texas.gov). "Not on that list" was checked by reading 17.46(b)'s list (the only price item is (11),
  false statements about price reductions); please confirm. Other Texas laws (e.g. the data privacy act, Business &
  Commerce Code ch. 541) were not opened, so the post doesn't say personalized pricing is unregulated, only that the
  DTPA list doesn't name it. "Could be taken to court" restates the bill's "actionable under that subchapter"; who may
  sue (the consumer protection division under 17.47, or consumers under 17.50) isn't spelled out, so the post doesn't
  say. No source states who gains or loses money, so the slides give only who is covered and what stays allowed. Takes Nov. 22 7:30 a.m. (Reel; Nov. 21 7:30 p.m. would
  put two Reels in a row until the Nov. 21 3:00 p.m. post merges).
