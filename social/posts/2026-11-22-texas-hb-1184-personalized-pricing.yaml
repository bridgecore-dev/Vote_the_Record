bills:
- id: HB 1184
  does: Would bar stores and online sellers from using personal information to set a price unique to one shopper.
  affects: Retailers with stores in Texas and online retailers doing business in Texas, and their customers.
  where: Filed Nov. 16, 2026 by Rep. Salinas; no other action yet.
  summary:
    text: >-
      A person may not use a dynamic pricing model to determine the price of a good or service if the model: (1) uses
      personal identifying information or other unique qualities of the consumer as an input; and (2) determines a price
      that is unique to the consumer.
