notes: >-
  Not covered by any earlier post (the Nov. 9 week recap lists final-passage votes only), so it is four days old by
  now but still the week's most consequential House roll call. Please check: (1) No CRS summary or bill text is
  on congress.gov yet, so the bill's "summary" quotes the resolving clause as read into the Congressional Record.
  (2) The slides give no argument for or against the motion: in the Record, Mr. Issa yielded back his hour
  without debate, and the only floor statements I found (Houlahan, Jacobs, McCollum) support impeachment, so
  quoting them alone would be one-sided. I didn't find an official response from Secretary Hegseth to cite.
  (3) The 8 article titles are quoted from the Record (Articles I-III differ only by WPR section: 2(c), 5(c), 5(b)). (4) Nov 16 audit: the Issa motion text and all 8 article titles were checked against the Record PDF (govinfo CREC-2026-11-10-pt1-PgH6126-3.pdf; the HTML is truncated at H6131), and congress.gov lists no H.Res. 1655 action after the Nov. 10 referral.
