caption: |-
  On Nov. 10, the House voted 211-204 to send H.Res. 1655, a resolution to impeach Defense Secretary Peter Brian Hegseth, to the Judiciary Committee. The House did not vote on impeaching him.

  Rep. Massie (R-KY) offered the resolution. Rep. Issa (R-CA) moved to refer it. By party, per the House Clerk: Republicans 210 Yea, 1 Nay; Democrats 0 Yea, 203 Nay; the one Independent, Yea. 18 members didn't vote.

  What's next: the committee chooses whether to pursue articles of impeachment and report them to the full House. The resolution's 8 articles are charges, not findings.

  How did your representative vote? Roll call 317 is on clerk.house.gov.

  Voice: computer-generated (Kokoro text-to-speech).
