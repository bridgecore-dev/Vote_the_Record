caption: |-
  On Nov. 19, the U.S. Senate passed S. 3321, the FAIR Leave Act, by voice vote.

  Before: under the Family and Medical Leave Act, if a married couple works for the same employer, the employer can limit them to 12 weeks of leave combined in a year for a new child, an adoption or foster placement, or a sick parent (26 weeks combined for caring for a servicemember).

  After: the bill repeals that section, so each spouse keeps their own 12 weeks. FMLA leave can still be unpaid.

  Who gains: spouses who work for the same employer. Who gives: that employer. Congress.gov lists no CBO estimate.

  Sponsor: Sen. Joni Ernst (R-IA). Cosponsor: Sen. Margaret Wood Hassan (D-NH). Next: the U.S. House of Representatives.

  Should married coworkers share one limit, or each get their own?

  Voice: computer-generated (Kokoro text-to-speech).
