notes: >-
  New this run: the Senate Press Gallery's Nov. 19 floor log says "By voice vote, the Senate passed S.3321 - The
  Fair Leave Act" (12:00 p.m.). Congress.gov actions (api.congress.gov, read 2026-11-19) still end at the Dec. 3, 2025
  referral, and no CRS summary or CBO estimate is posted. The Press Gallery doesn't say whether it passed with an
  amendment, and the Nov. 19 Record isn't out, so the explainer quotes the introduced text (one section: repeal of 29
  U.S.C. 2612(f)). PLEASE CHECK before the slot: congress.gov actions or the Nov. 19 Record for "without amendment";
  if it was amended, the before/after may need changing. Current law quoted from GPO's 2023 U.S. Code; confirm no law
  since then changed 2612(f). "Up to twice as much leave between them" = 24 weeks vs. a 12-week cap, from (a)(1) and
  (f)(1). The "26-week" row reads (f)(2), part of the repealed subsection (f). No recorded vote, no committee report,
  and no official statement for or against was found, so no case for/against slide; the post asks instead. Sponsor's
  and cosponsor's party and state as congress.gov lists them. Employer coverage and eligibility rules (sec. 101) not
  on the slides.
