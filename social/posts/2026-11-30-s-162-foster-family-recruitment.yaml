caption: |-
  S. 162, the Recruiting Families Using Data Act, is on the U.S. House of Representatives schedule the week of Nov. 30. The U.S. Senate passed it by unanimous consent on June 11, 2026.

  Before: federal law already says each state's child welfare plan must "provide for the diligent recruitment" of foster and adoptive families.

  After: each state would do that through a family partnership plan, written with birth, kinship, foster and adoptive families and young people who have been in foster care. It would include a recruitment plan for each child who needs a family. Every year the state would report how many foster families it has, how many have no child placed and why, and why parents stop fostering.

  It would start Oct. 1, 2027, or later in a state that needs a new state law. The bill text adds no new funding, and congress.gov lists no CBO estimate.

  What would help more families foster?
