  holds news (this week's House schedule, the Nov. 23 signings, the Nov. 23-24 Pennsylvania and New York signings) or
  the Nov. 28 3:00 p.m. hemp post, tied to Dec. 11, left alone as earlier runs did. The New York A10936 post (signed
  Nov. 20, more than a week ago by Nov. 30) moves to Dec. 29 3:00 a.m., the first post slot after the last queued post
  (Dec. 28 3:00 a.m.) that keeps the Reel/post turn. Records opened 2026-11-28: the floor list, the scheduled text,
  congress.gov actions (introduced Jan. 21, 2025; Finance discharged and passed with an amendment by unanimous consent
  June 11, 2026; held at the desk in the House June 15), sponsor and cosponsors (4: 3 D, 1 R as congress.gov lists
  them, none withdrawn; not on a slide), the CRS summary (introduced version only; the Congressional Record says the
  Grassley amendment's purpose was "To change effective dates", so the slides follow the engrossed text), 42 U.S.C.
  622(b)(7) from GPO's 2024 Code, the Congressional Record page (no floor statements), and House Practice ch. 53
  (two-thirds). Slide 3 rows shorten new subsection (d)(1)-(2); "group setting" is our plain words for "congregate
  care"; slide 4 shortens (d)(3)-(4) and sec. 3's new 479A(a)(8) ("fiscal year 2028 or any succeeding fiscal year").
  The plan's (d)(5) racial and ethnic barriers report isn't on a slide (the "before" quote names that existing
  requirement). "Adds no new funding" is our reading of the full text (no appropriation or authorization in it);
  please check. Start date: sec. 2(b), with the delay for states that need legislation. No statement for or against
  was found (no committee report, no floor remarks), so no case-against slide; the post asks. If the House votes
  before this posts, the last slide needs the tally.
