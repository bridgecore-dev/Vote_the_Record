caption: |-
  California's two-year legislative session ends at midnight on Monday, Nov. 30.

  One week later, at noon on Monday, Dec. 7, the 2027-28 session begins.

  Both dates come from the state constitution, Article IV, Section 3(a), as listed on the California Senate's calendar.
