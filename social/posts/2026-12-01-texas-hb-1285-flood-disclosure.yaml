notes: >-
  New: filed Nov. 24, 2026; the only bill on that day's filing report (5 bills: HB 1282-1286) whose caption is about
  flooding. Records opened 2026-11-24: the filing report, the bill history (filed, no other action, no fiscal note
  listed; author listed as "Ochoa"), the introduced PDF (HTML says "coming soon"; PDF sha256
  f30f31fc095a5c769e6862f6dc2d45288211978e07bcbddb21221f951ea110b8), and Property Code 5.008 on tcss as it reads today.
  The changes were found by comparing the bill's notice with the current 5.008(b): item 6 today lists three conditions
  (present flood insurance coverage; reservoir breach or release; water penetration due to a natural flood event); the
  bill expands the first and third and adds the rest, moves "Water Damage Not Due to a Flood Event" out of item 4 into
  item 6 (bracketed as deleted in item 4), adds the "how often / when / remedy" and premium lines, defines "wetlands"
  (Water Code 11.502), and in item 8 adds "or any other federal disaster flood assistance" (left off the slides for
  space). Only 5.008(b) is amended, so 5.008(a)'s scope (one dwelling unit) and (e)'s exemptions are unchanged; Sec. 2
  applies it to contracts executed on or after the effective date. The pdftotext copy loses underlining, so please
  confirm the additions against the PDF. No fiscal note or statement for or against exists yet, so the post asks.
  Rep. Ochoa as TLO lists the author, no party shown. Trial: palette amber, the one change from the dark baseline (amber
  hasn't been tried on a 6:00 a.m. Reel). Evergreen (a prefiled bill): Dec. 1 6:00 a.m. is the first free Reel slot
  that keeps the turn on its own (Nov. 29 6:00 a.m. would sit next to the Nov. 29 12:00 p.m. Reel with 9:00 a.m. empty;
  Nov. 30 6:00 p.m. needs the 3:00 p.m. post in another pull request).
