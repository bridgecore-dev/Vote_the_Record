caption: |-
  When you buy a home in Texas, the seller gives you a disclosure notice. Today its flood section asks about three things: flood insurance now, flooding from a reservoir, and water getting into a building in a natural flood. It also asks about floodplains, flood insurance claims, and FEMA or SBA help.

  HB 1285, filed Nov. 24 in the Texas House of Representatives for the 2027 session, would add more. Sellers would also say whether federal law requires flood insurance, and report water pooling, erosion from storms or rivers, flood repairs never filed with insurance, beach nourishment assessments, other water damage, wetlands, and whether a FEMA elevation certificate exists. For each yes, they'd say how often, about when, and what they did to fix it, plus the flood insurance premium they pay now.

  Buyers would get more answers. Sellers would fill out a longer form. It would apply to contracts signed on or after Sept. 1, 2027. No cost estimate is posted yet.

  Should sellers have to say more about flooding?

