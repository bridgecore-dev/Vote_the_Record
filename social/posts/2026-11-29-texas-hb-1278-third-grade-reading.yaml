caption: |-
  Today, each Texas school district decides who moves up a grade, weighing the teacher's recommendation, grades, the STAAR score and other academic information.

  HB 1278, filed in the Texas House of Representatives for the 2027 session, would change that for third grade. A third grader would move up only by passing the STAAR reading test, passing an approved reading retest after summer help, or qualifying for a good-cause exemption (some students learning English, in special education, with dyslexia, or already held back twice). Otherwise the district must hold the student back.

  A student held back would get 90 minutes of reading instruction each school day on top of other extra help, and could move up during the year by passing an approved reading test.

  In spring 2026, 73% of Texas third graders scored "Approaches Grade Level" or higher in reading on STAAR, and 49% scored "Meets Grade Level" or higher. The bill leaves the passing score to the state education commissioner.

  No cost estimate is posted yet. If passed as filed, it would first apply to third graders in 2028-29, in public and charter schools.

  Hold back, or move up with help?

  Voice: computer-generated (Kokoro text-to-speech).
