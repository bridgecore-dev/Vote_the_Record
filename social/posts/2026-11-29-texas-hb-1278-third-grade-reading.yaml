notes: >-
  New: filed Nov. 23, 2026; no earlier post covers it. Rule: the Nov. 23 filing report's captions (8 bills); HB 1278 is
  the only one about grade promotion. Records opened 2026-11-24: the Nov. 23 filing report, the bill history (filed,
  no other action; author "Schoolcraft"; no fiscal note listed), the introduced text (HTML; PDF sha256
  c3380310c08263e78196fdd162cc80f47c8bbb66fe0ed3e3c83a2e6c0dec6578), Education Code 28.021 (rendered from
  statutes.capitol.texas.gov), and TEA's 2026 All Combined STAAR Results PDF (sha256
  d687548204642a58a9ff8363098e564ffaff3d1139ebb050fdc3b3ba5d8f3922; grade 3 RLA, spring 2026: Approaches 73%, Meets
  49%). The bill's bar is "performs satisfactorily, as determined by the commissioner under Section 39.0241(a)"; we
  believe that is "Approaches Grade Level" today, but no source opened this run says so, so the slide gives both
  numbers and says the commissioner sets the bar; please confirm, and don't read 73% as a pass rate under the bill.
  The exemption list paraphrases new 28.02112(c)(1)-(5) (special education and 504 conditions shortened to "meet its
  conditions"); "summer help" is 28.02112(b)(1) (accelerated instruction under 28.0211 the summer after third grade);
  "a state designation" is 21.3521. Effective Sept. 1, 2027; applies starting with third graders in 2028-29 (Sec. 5(a)).
  Who gains and who pays is our plain reading of the bill's duties; no source gives amounts, and no official
  statement for or against was found, so the post gives the record and asks. Author as TLO lists him, no party.
  Evergreen (a prefiled bill): takes Nov. 29 6:00 p.m., the first free Reel slot that keeps the day's Reel/post turn
  (Nov. 29 6:00 a.m. would put two Reels in a row before the 12:00 p.m. Reel). 6:00 p.m. trial look: changes only
  `position` (bottom) from the baseline, the first trial of that design.
