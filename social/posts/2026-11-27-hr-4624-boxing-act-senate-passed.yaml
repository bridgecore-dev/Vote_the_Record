bills:
- id: H.R. 4624
  title: Muhammad Ali American Boxing Revival Act of 2026
  does: Would set pay, insurance and medical-exam floors for pro boxers, and let private leagues run matches and title belts.
  affects: Professional boxers, promoters, and new unified boxing organizations (UBOs).
  where: Passed the U.S. House of Representatives Mar. 24 and, changed, the U.S. Senate Nov. 19.
  summary:
    text: This bill authorizes the establishment of private-sector Unified Boxing Organizations (UBOs) and otherwise expands
      the regulatory framework for professional boxing.
    title: CRS summary of H.R. 4624
    url: https://api.congress.gov/v3/bill/119/hr/4624/summaries
    retrieved: '2026-11-20'
slides:
- kicker: U.S. Senate · Nov. 19
  big: $200 a round
  head: The U.S. Senate passed a bill to pay every pro boxer at least $200 a round.
  text: By unanimous consent, so there's no tally. It changed the House's version, so it goes back to the U.S. House of Representatives.
- chip: 'Before: current law'
  head: Federal boxing law dates to 1996 and 2000. The House committee's report says it sets no minimum insurance.
  quote:
    label: H. Rept. 119-524 (House Education and Workforce Committee)
    text: The PBSA does not have a minimum insurance coverage requirement, and even ABC's regulatory guidelines require only
      a minimum of $10,000 in coverage.
  text: PBSA is the Professional Boxing Safety Act of 1996. ABC is the Association of Boxing Commissions. The 2000 Muhammad
    Ali Boxing Reform Act added contract and conflict-of-interest rules.
- chip: 'After: every pro boxer'
  head: These would apply to every pro match, whoever promotes it.
  rows:
  - - Pay
    - At least $200 per round
  - - Insurance
    - $50,000 medical and $15,000 death coverage; boxer pays no premium
  - - Brain exam
    - Yearly brain MRI or neurologist exam; MRI and MRA at 40+
  - - Heart exam
    - Yearly electrocardiogram; a stress test at 40+
  - - Drug tests
    - Commissions test every title match; others at random
  - - Doctors
    - Ringside physicians certified within 2 years
- chip: 'After: a new option'
  head: A "unified boxing organization" (UBO), a private league that signs boxers, runs matches and runs its own title belts.
  rows:
  - - Medical
    - 2 ambulances and 2 ringside doctors at each match
  - - Contracts
    - 4 years at most; 3 for a boxer's first contract
  - - Free agency
    - Boxers may talk to rivals in the contract's last 90 days
  - - Work
    - Offer 2 fights a year, or pay at least 10 times the round minimum
  - - Firewall
    - Can't manage its boxers or charge them for rankings
- chip: What the U.S. Senate changed
  head: The Senate's version rewrote the House's in several places.
  rows:
  - - Talk to rivals
    - Last 30 days of a contract → last 90 days
  - - Longest contract
    - 6 years → 4 years (3 for a first contract)
  - - Guaranteed work
    - 1 match every 6 months → 2 offered every 12 months
  - - Fine for UBO staff
    - Up to $20,000 → up to $100,000
  - - Regular promoters
    - The contract limits now cover their contracts too
  text: Substitute by Sen. Ted Cruz (R-TX) and Sen. Jacky Rosen (D-NV); Sen. Kirsten Gillibrand (D-NY) moved its passage.
- chip: The case for
  head: Supporters say a new kind of league means more choices and more money for boxers.
  quote:
    label: Lawrence Epstein, UFC chief operating officer, House testimony, Dec. 4, 2025 (H. Rept. 119-524)
    text: More bidders for boxers' services will lead to higher purses.
  text: The committee's majority wrote that UBOs "would not replace the current system of professional boxing."
- chip: The concerns
  head: The committee's Democrats backed the bill but warned about how much control a league could gain.
  quote:
    label: Additional views, Rep. Robert C. "Bobby" Scott (D-VA), Ranking Member (H. Rept. 119-524)
    text: the risk that a UBO could exert enormous control over boxers' careers and potentially the sport of boxing itself
  text: They also asked for pay tied to inflation and for UBOs to cover insurance deductibles. Neither is in the Senate's version.
- chip: Who gains, who loses, what it costs
  head: Each UBO pays for the protections it must provide, but a boxer still pays any insurance deductible.
  rows:
  - - Gain
    - Boxers get pay, insurance and medical floors
  - - Gain
    - Private leagues get a legal path to run boxing
  - - Risk
    - Critics say a league could gain too much control over careers
  - - Cost
    - The House report says CBO's estimate wasn't ready in time
- chip: What's next
  head: 'Next: the U.S. House of Representatives takes up the Senate''s version.'
  text: The rules would apply to matches starting 240 days after it becomes law. Sponsor, Rep. Brian Jack (R-GA). Which side convinces
    you?
caption: |-
  The U.S. Senate passed the Muhammad Ali American Boxing Revival Act (H.R. 4624) by unanimous consent on Nov. 19. It changed the House's version, so it goes back to the U.S. House of Representatives.

  Before: federal boxing law dates to 1996 and 2000. The House committee's report says it sets no minimum insurance.
  After: every pro boxer would get at least $200 a round, $50,000 in medical and $15,000 in death coverage, and yearly brain and heart exams. A new kind of private league, a "unified boxing organization," could sign boxers and run its own title belts if it meets extra rules: contracts of 4 years at most, a 90-day window to talk to rivals, and 2 fights offered a year.

  Supporters say more leagues mean higher pay. The committee's Democrats backed it but warned a league could gain too much control over careers.

  Which side convinces you?
