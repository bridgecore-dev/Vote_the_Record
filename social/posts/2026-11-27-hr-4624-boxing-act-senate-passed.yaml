notes: 'New: the U.S. Senate passed H.R. 4624 with an amendment by unanimous consent on Nov. 19 (Senate Press Gallery log,
  3:34 p.m.; Congress.gov actions); no post covers it. Every "after" item was checked in the Senate amendment text (EAS, GovInfo);
  the House-vs-Senate changes were checked against the House-passed text (EH): 30 vs 90 days, 6 vs 4 years, "1 boxing match
  every 6 months" vs "not fewer than 2 covered matches" in "each 12-month period", $20,000 vs $100,000, and sec. 21A(f)(3)
  (contract limits applied to all promoter contracts) is only in the Senate text. "Brain MRI or neurologist exam" is the
  under-40 rule ("an MRI of the brain or neurologic examination"); 40+ get an MRI and MRA. Quotes for and against are about
  the House committee''s version (H. Rept. 119-524, filed Feb. 25), not the Senate''s; the report has no dissenting views
  (committee vote 30-4; the names weren''t in the GovInfo text). The "concerns" slide lists only two Democratic requests I
  confirmed are missing from the Senate text (no inflation indexing; sec. 21A(j)(2): the deductible "shall be the financial
  responsibility of the boxer"); the Senate text does add rating disclosures, which touches their ratings request, so that
  one isn''t listed. CBO estimate (cbo.gov/publication/62239, House reported version) returned 403, so no dollar figure.
  The CRS summary is of the House-reported version. Party and state for Cruz, Rosen, Gillibrand and Scott from Congress.gov
  member records; Jack from the bill record. Congress.gov lists Gillibrand and Cruz as SA 7029 sponsors and Rosen as cosponsor;
  the floor log calls it "the Cruz/Rosen substitute amendment". Nov 20 preview fix: shortened source titles and shortened slide 1, cut slide 5''s intro line and its UBO drug-test row (half of matches, sec. 21A(e)(2)) so the source footer fits. The additional views name UFC''s owners and Zuffa Boxing;
  left off the slides as an organization not named in the bill. If the U.S. House acts before the slot, update "where" and
  the last slide.'
