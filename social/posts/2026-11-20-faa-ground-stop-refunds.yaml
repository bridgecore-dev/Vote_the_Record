caption: |-
  On Friday, Nov. 13, the FAA stopped departing flights nationwide at about 3:30 p.m. Eastern. Flights resumed at 8:15 p.m. The FAA says operators canceled about 12,462 flights that day, though not all were directly caused by the stop.

  The FAA says data flooded its telecom network and made old equipment unstable at 17 of its 22 en-route control centers. Its first look points to a radar site in Amarillo, Texas, and a radio site in El Dorado, Arkansas, where L3Harris, the FAA's network service provider, had been doing work that included a new router. The FAA says it found no sign of a cyberattack, and it and L3Harris are still looking for the root cause.

  If your flight was canceled and you didn't take a new flight or a voucher, federal rules say the airline owes you a full refund of the fare, taxes and fees: within 7 business days on a credit card, 20 calendar days otherwise.

  As a precaution, the FAA says it turned off the same router function on about 60 similar routers. What would you ask the FAA about Nov. 13?
