notes: >-
  Owner idea (note only). Fills the empty Nov. 20 story slot (every Nov. 17-19 slot is taken). All ground-stop facts
  are from the FAA's Nov. 15 Q&A, opened this run: "approximately 3:30 p.m. ET", "resumed as of 8:15 p.m.", "17 of
  our 22 Air Route Traffic Control Centers" ("en-route control centers" is our plain wording), "Approximately 3,500
  aircraft safely landed", "approximately 12,462 flights ... While not all cancellations were directly caused by the
  nationwide ground stop", "no indication that this was a cyberattack", the Amarillo and El Dorado sites as the
  "initial investigation indicates", and "The FAA and L3Harris continue to investigate the root cause". The FAA page
  also says its modernization work didn't cause this and credits a "Working Families Tax Cuts" down payment; that
  part is left out (a name for a law, and a claim about a cause we can't check). News reports quote Secretary Duffy
  asking Congress for more money; no official statement or hearing notice was found, so nothing about Congress's
  response is on a slide. Refund facts are from 14 CFR 260.6(a) and the "prompt refund" definition in 260.2,
  opened through the eCFR API (the eCFR web page and transportation.gov returned blocks). Slide 5's "about 60 similar
  routers" is the FAA's "approximately 60".
