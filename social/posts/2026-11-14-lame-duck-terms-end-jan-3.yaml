slides:
- kicker: After Election Day
  big: Jan. 3
  head: Terms in Congress end at noon on Jan. 3. That's when the newly elected members start.
  quote: {label: "U.S. Constitution, Amendment XX, Sec. 1", text: "the terms of Senators and Representatives at noon on the 3d day of January, of the years in which such terms would have ended if this article had not been ratified; and the terms of their successors shall then begin."}
- kicker: Until then
  head: The Congress in office now can keep meeting and voting. That's called a lame-duck session.
  quote: {label: Senate glossary, text: "So called because some of the lawmakers who take part will not be returning for the next Congress."}
- kicker: Why Jan. 3
  big: '1933'
  head: The year the 20th Amendment moved the start of a new Congress to Jan. 3.
  quote: {label: U.S. Senate, text: "The 1933 Amendment changed the convening date for a new Congress to January 3 of odd-numbered years, shortening the time between an election and the beginning of the next Congress to just two months."}
- kicker: What lame-duck sessions take up
  head: In each of the last three listed by the Senate, the topics included nominations, defense authorization and appropriations.
  rows:
  - ['2024', "Nov. 12, 2024 to Jan. 3, 2025"]
  - ['2022', "Nov. 14, 2022 to Jan. 3, 2023"]
  - ['2020', "Nov. 9, 2020 to Jan. 3, 2021"]
caption: |-
  Some of the people voting in Congress right now won't be there in January. The Constitution ends terms in Congress at noon on Jan. 3, and the new members start then.

  Until that day, the current Congress can keep meeting and voting. That stretch is called a lame-duck session.

  The Senate keeps a list of past lame-duck sessions and what they took up. In each of the last three on that list, the topics included nominations, defense authorization and appropriations.
