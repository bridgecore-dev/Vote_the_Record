notes: >-
  Owner request 2026-11-18: explain in plain words what the Nov. 10 vote on H.Res. 1655 meant, because news
  called it "blocked" (Time: "defeat a resolution") and the first Reel (2026-11-14-hegseth-impeachment-referred, posted Nov. 17) said only
  "Yea = for sending it to the Judiciary Committee". The question voted on was Mr. Issa's motion to refer
  (Congressional Record H6132; congress.gov actions "On motion to refer Agreed to by the Yeas and Nays: 211 - 204
  (Roll no. 317)"); Yea = refer. "Blocked" is how news reports describe it and appears only in quotes as their word;
  no outlet is cited because the post rests on the record. Tallies and party totals from roll 317's XML.
  "Simple majority": a motion to refer passes with more Yeas than Nays (the Clerk's record shows it passed 211-204).
  The record ID ends in /explainer so it doesn't collide with the first Reel's roll-call ID. Recheck congress.gov
  actions before it posts.
