caption: |-
  "Blocked" or "defeated," explained. On Nov. 10, the U.S. House of Representatives didn't vote on impeaching Defense Secretary Peter Brian Hegseth. It voted on a motion by Rep. Issa (R-CA) to send H.Res. 1655 to the Judiciary Committee.

  Yea (211) meant: send it to committee, with no impeachment vote that day. Nay (204) meant: keep it on the floor, so the House votes on it. A simple majority decides, so the motion passed.

  The motion passed, so the impeachment push failed that day. That's what news reports mean by "blocked" or "defeated." Now the Judiciary Committee decides what happens next; Congress.gov lists no action since Nov. 10.

  By party, per the House Clerk: Republicans 210 Yea, 1 Nay; Democrats 0 Yea, 203 Nay; the one Independent, Yea.

  How did your representative vote? Roll call 317 is on clerk.house.gov.

  Voice: computer-generated (Kokoro text-to-speech).
