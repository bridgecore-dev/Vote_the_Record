bills:
- id: H.Res. 1655
  does: Would impeach Defense Secretary Peter Brian Hegseth on 8 articles and send the articles to the Senate.
  affects: "Peter Brian Hegseth, Secretary of Defense."
  where: Sent to the House Judiciary Committee by a 211-204 House vote on Nov. 10, 2026. No action since.
  summary:
    text: >-
      Resolved, That Peter Brian Hegseth, Secretary of Defense, also referred to as Secretary of War by the
      Administration, is impeached for high crimes and misdemeanors and that the following articles of
      impeachment be exhibited to the United States Senate
