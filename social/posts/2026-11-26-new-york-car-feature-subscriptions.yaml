slides:
- kicker: New York · New law, Nov. 23, 2026
  big: No fee
  head: Car makers and dealers in New York can't charge a subscription to switch on a feature that's already built into the car.
  text: Signed as Chapter 414 of the Laws of 2026. It takes effect 90 days after signing.
- chip: What the law says
  head: The ban covers features that use parts already in the car and keep working with no ongoing cost to the seller.
  quote: {label: "General Business Law, new section 198-d(b)", text: "utilizes components and hardware already installed on the motor vehicle at the time of purchase or lease by the consumer; and"}
  text: The law's own example of a feature is heated seats.
- chip: Not covered
  head: Features that rely on software services or data networks can still be sold by subscription.
  rows:
  - Navigation updates and infotainment
  - Satellite radio and in-car Wi-Fi
  - Telematics and roadside assistance
  - Driver-assistance and self-driving software
  - Services that run on cellular or data networks
- chip: Before → after
  head: Before, no New York law barred these fees. The section is new.
  rows:
  - [Before, "A maker or dealer could charge monthly to turn on a built-in feature"]
  - [After, "Banned for built-in features with no ongoing cost"]
  - [Penalty, "Up to $250 per point of sale for each violation"]
  - [Rules, "The Department of State may write rules to enforce it"]
- chip: Who gains, who must change
  head: Buyers and lessees keep built-in features without a monthly fee. Sellers lose that way to charge.
  rows:
  - [Buyers and lessees, "No subscription for built-in features covered by the law"]
  - ["Makers, dealers and their agents", "Can't offer those subscriptions in New York"]
  - [The state, "The sponsor's memo lists the fiscal implications as \"None.\""]
- chip: The case for, and the votes
  head: The sponsor, Assemblymember Magnarelli, says buyers pay again for parts already in the car.
  quote: {label: "Sponsor's memo", text: "the components necessary for such features to function are already installed on the vehicle at the time of sale."}
  rows:
  - [New York State Assembly, "138 Yes, 3 No, May 19, 2026"]
  - [Voted No, "Lupardo, Walker, Williams"]
  - [New York State Senate, "Passed June 4, 2026"]
  text: The records we opened give no case against it.
- chip: Your turn
  head: Should a feature built into your car cost extra every month to use?
  text: Tell us what you think.
caption: |-
  New York's governor signed a bill on Nov. 23, 2026 that bars car makers and dealers from charging a subscription to turn on features already built into a car. It is Chapter 414 of the Laws of 2026 and takes effect 90 days after signing; the governor's office gives the date as Feb. 27, 2027.

  Before: no New York law barred these fees. After: no maker, dealer or agent may offer a subscription for a feature that uses parts already installed when the car is bought or leased and works without ongoing cost to the seller. The law's example is heated seats.

  Not covered: navigation updates, infotainment, satellite radio, in-car Wi-Fi, telematics, roadside assistance, driver-assistance or self-driving software, and services that rely on cellular or data networks. Safety-recall software fixes stay free, as federal law already requires.

  Penalty: up to $250 per point of sale for each violation. The sponsor's memo lists the fiscal implications as none.

  The New York State Assembly passed it 138-3 on May 19, 2026, and the New York State Senate passed it June 4, 2026.

  Should a feature built into your car cost extra every month to use?
