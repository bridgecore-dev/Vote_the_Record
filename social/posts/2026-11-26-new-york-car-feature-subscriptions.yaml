notes: >-
  News-first: an official action from today (nyassembly.gov actions, read 2026-11-23: "11/13/2026 delivered to
  governor", "11/23/2026 signed chap.414"). Found through the governor's news page (an official source). No post
  or open pull request covers A10411. Takes the Nov. 26 8:15 p.m. story slot, the first free story slot (Nov. 23-25
  stories are taken), so no post is bumped. Every Reel slot is a trial and can't be bumped, and the first evergreen
  carousel (the Dec. 11 hemp post) would go stale if moved, so this is a story. Everything on the slides is from the
  enrolled text (A10411A): 198-d(a)(5) gives heated seats as the example; (b)(1)-(2) the two conditions; (c)(1) the
  exclusions; (c)(2) safety-recall software fixes stay free (the text cites "Section 573.6 of
  Title 49"); (d) the $250 penalty; (e) Department of State rules. Hands-free driving, which the governor's release
  and the sponsor's memo mention as an industry example, is excluded by (c)(1) ("software-dependent driver
  assistance or driver automation features"), so no slide says it's covered. Effective date: "the ninetieth day
  after it shall have become a law"; 90 days from Nov. 23 counts to Feb. 21, 2027, but the governor's release says
  "February 27, 2027", so the slides say "90 days after signing" and the caption gives the governor's date as the
  governor's office's; please check. "Before, no New York law barred these fees" rests on the text adding a new
  section; we didn't search other New York laws. Assembly vote 138/3 from nyassembly.gov floor votes (No: Lupardo,
  Walker, Williams, as the record spells them; no party is on the record, so none is shown). The Senate tally
  isn't on the Assembly page (nysenate.gov serves a bot challenge), so only the date ("06/04/2026 PASSED SENATE",
  substituted for S9348A, not named: one bill per post). No case against was found in the records opened. The
  governor's quote is left out because it blames a named politician; the case for is the sponsor's memo. Like the
  other New York posts, the slides name the chapter, not the Assembly number (the builder's bill-number check
  doesn't take New York numbers).
