notes: 'New this week: no post covers H.R. 5490. Fills the Nov. 15 1:30 p.m. Reel slot (Nov. 15 had one Reel). The schedule
  says items "may be considered"; if the House votes before the slot, delete or update. The $10 billion and the "pig butchering"
  description are Congress''s findings in the bill (sec. 2), not our figures. Before/after rests on 50 U.S.C. 1701 and the
  bill''s sec. 7(b)(1) ("Notwithstanding the requirements of section 202 of the International Emergency Economic Powers Act").
  CBO posted a cost estimate (https://www.cbo.gov/publication/61971); cbo.gov returned 403 and I didn''t retry, so the post
  gives only what sec. 10 says about funding. No committee report has been filed, so there is no official case for or against
  to quote; the committee vote was 48-0, and the record shows no Judiciary Committee action (it was also referred there).
  Sponsor''s party and state as the bill status lists them; 73 cosponsors counted from the bill status. Two-thirds: House
  Practice ch. 53, "requires a two-thirds vote for adoption". Re-posted 2026-11-15 with a voice (owner: every Reel has audio);
  the silent version was taken down.'
