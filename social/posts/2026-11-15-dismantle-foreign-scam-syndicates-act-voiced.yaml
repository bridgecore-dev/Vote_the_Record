bills:
- id: H.R. 5490
  title: Dismantle Foreign Scam Syndicates Act
  does: Would create a federal task force to shut down overseas scam centers and let the President sanction the people behind
    them.
  affects: Scam operators and officials who enable them; Americans targeted by online scams; people trafficked into scam centers.
  where: Foreign Affairs Committee approved it 48-0 (Dec. 3, 2025). On the House schedule for the week of Nov. 16.
  summary:
    text: This bill establishes an interagency task force to shut down criminal syndicates perpetuating mass online scams.
      This bill also explicitly authorizes sanctions against foreign individuals or entities operating or providing support
      to scam compounds.
    title: Congressional Research Service summary of H.R. 5490 (bill status, GPO)
    url: https://www.govinfo.gov/bulkdata/BILLSTATUS/119/hr/BILLSTATUS-119hr5490.xml
    retrieved: '2026-11-15'
  say: H.R. 5490, the Dismantle Foreign Scam Syndicates Act, would create a federal task force to shut down overseas scam
    centers, and let the President sanction the people behind them.
