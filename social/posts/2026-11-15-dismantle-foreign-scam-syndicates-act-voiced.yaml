caption: |-
  Americans lost at least $10 billion to overseas scam centers in 2024, says a Treasury figure in the findings of H.R. 5490. The House schedule lists it this week.

  Before: to block a foreign person's U.S. assets under the emergency powers law, the President must first declare a national emergency.
  After: the President could block the assets of scam bosses, their backers and officials who knowingly enable them without that step, and bar them from U.S. visas.

  No new money: State would use funds already authorized. The committee vote was 48-0; it needs two-thirds of the House.

  Lost money to a scam? Report it at ic3.gov.

  Voice: computer-generated (Kokoro text-to-speech).
