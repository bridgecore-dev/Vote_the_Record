caption: |-
  Senate Democrats will choose their leader for the 120th Congress by secret ballot. Two senators are running: Chuck Schumer (D-NY) and Chris Van Hollen (D-MD).

  Senators who said whom they back on their own .senate.gov site (alphabetical):
  For Schumer: Tammy Baldwin (D-WI), Richard Blumenthal (D-CT), Angus King (I-ME).
  For Van Hollen: Jeff Merkley (D-OR).

  News counts list more names on each side and don't agree. We list only official statements we could open by Nov. 15.

  The rules: a majority of senators present and voting wins, and the rules say December at the earliest. No official date is posted yet.

  Senate Republicans reelected John Thune (R-SD) on Nov. 10, his office says.

  Your senators: senate.gov/senators/senators-contact.htm
