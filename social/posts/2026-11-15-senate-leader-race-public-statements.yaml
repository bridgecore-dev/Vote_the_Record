slides:
- kicker: "U.S. Senate · Democratic leader race"
  big: "2"
  head: Two senators are running to lead Senate Democrats in the 120th Congress.
  text: What each candidate said, and every senator who said whom they back on their own official site. Alphabetical. Swipe.
- chip: Candidate
  head: Sen. Chuck Schumer (D-NY), the current Senate Democratic Leader
  quote: {label: "Sen. Schumer, Nov. 12, 2026", text: "I have the votes to continue serving as Democratic Leader."}
  text: His statement doesn't name the senators backing him.
- chip: Candidate
  head: Sen. Chris Van Hollen (D-MD)
  quote: {label: "Sen. Van Hollen, Nov. 12, 2026", text: "It’s now on us to meet this moment, and to do that we need new leadership."}
  text: He announced his run for leader the same day.
- chip: Backing Schumer
  head: In their own official statements
  rows:
  - [Sen. Tammy Baldwin (D-WI), "“He earned his position as Majority Leader next Congress” (Nov. 12)"]
  - [Sen. Richard Blumenthal (D-CT), "“I continue to support Senator Schumer for Majority Leader.” (Nov. 12)"]
  - [Sen. Angus King (I-ME), "“I see no reason to change the leadership that helped make that success possible.” (Nov. 12)"]
- chip: Backing Van Hollen
  head: In their own official statements
  rows:
  - [Sen. Jeff Merkley (D-OR), "“He has my full support for Majority Leader.” (Nov. 13)"]
  text: Sen. Merkley's office posted these words from his social media post.
- chip: Why so few names?
  head: News counts list more senators on each side, and the counts don't agree.
  text: "We list only what a senator put on their own .senate.gov site, and only pages we could open by Nov. 15. Others may have said it elsewhere, or since."
- chip: How the vote works
  head: Senate Democrats choose their leader themselves. The full U.S. Senate doesn't vote on it.
  rows:
  - [Who votes, Democratic senators in the conference]
  - [How, "Secret ballot, in person; proxies allowed"]
  - [To win, A majority of those present and voting]
  - [When, "No earlier than December, under the rules; no official date posted as of Nov. 15"]
- chip: The other party
  head: "Senate Republicans voted Nov. 10. Sen. John Thune (R-SD) says his colleagues reelected him as their leader."
  quote: {label: "Sen. Thune, Nov. 10, 2026", text: "I am honored to have their continued trust and support to lead the Senate Republican Conference in the 120th Congress"}
  text: We found no official statement from another candidate. Their rules call for a secret written ballot when a race is contested.
- chip: Your turn
  head: The ballot is secret, so you won't see how each senator votes. You can still ask yours.
