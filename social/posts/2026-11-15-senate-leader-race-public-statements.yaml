notes: >-
  Reed and Schatz added 2026-11-15 from the owner's screenshots of their official pages (both pages returned 403 to our fetch); quotes copied word for word from those pages.
  From an owner idea. Only statements opened on the senators' own sites (Baldwin, Blumenthal, King, Merkley) plus
  each candidate's own statement. Two more official pages exist but answered 403 to us and were not retried:
  Reed (D-RI) "Reed Backs Schumer for Majority Leader"
  (https://www.reed.senate.gov/news/releases/reed-backs-schumer-for-majority-leader) and Schatz (D-HI) "Schatz
  Statement On Senate Democratic Leadership Election"
  (https://www.schatz.senate.gov/news/press-releases/schatz-statement-on-senate-democratic-leadership-election).
  Owner: open them in a browser and, if they say so, add them to the Backing Schumer slide (alphabetical: Baldwin,
  Blumenthal, King, Reed, Schatz). News-only names (Cortez Masto, Rosen, Kaine, Alsobrooks, Whitehouse, Gallego,
  Kelly, Gillibrand, Fetterman, Sen.-elect Brown for Schumer; Sanders, Sens.-elect Flanagan and El-Sayed for Van
  Hollen) are left out on purpose. Party and state as the senate.gov roster lists them (King: I). The date:
  news says Dec. 1; the rules say no earlier than December (waivable by a simple majority); no official notice
  found. Merkley's release reprints his social media post, so slide 5 says so. If the vote happens before this
  posts, hold it. Senate Republicans' race is on slide 8: Thune's own release; news says he ran unopposed, so
  the slide says only that we found no official statement from another candidate.
