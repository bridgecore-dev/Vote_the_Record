caption: |-
  Suing someone from another state? Whether the case can go to federal court depends partly on how much money is at stake. S. 4850 is on the U.S. House of Representatives schedule the week of Nov. 30.

  Before: a federal court can hear a case between citizens of different states when more than $75,000 is at stake. That number was set in 1996.
  After: at least $150,000, adjusted for inflation every 10 years starting in 2030.

  Cases below the new amount could no longer start in federal court for that reason alone, and a defendant sued in state court couldn't move them there either. No CBO estimate is listed.

  The U.S. Senate passed it by unanimous consent Aug. 7, with no recorded vote. Should the amount go up?

