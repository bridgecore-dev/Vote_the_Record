  changes only the palette (charcoal) from the baseline (teal, dark, round, center, captions, sfx, af_heart); no queued
  Reel has used charcoal, so this is its first trial. Records opened 2026-11-27: the floor list, the scheduled text
  (BILLS-119s4850es, the Senate-passed text; sha256 ac778372ca9d1158af81aa4075007610d1fa76959e2471fd14cf2a7c51db77a9),
  congress.gov actions (discharged from Judiciary and passed by unanimous consent Aug. 7, 2026; held at the House desk
  Aug. 10), sponsor and cosponsors (4, none withdrawn), the CRS summary, the Congressional Record S4550-S4551 (Sen. Moreno
  asked unanimous consent; no speeches), 28 U.S.C. 1332 from GPO's 2024 Code ((a) "exceeds ... $75,000"; amendment
  notes: Pub. L. 104-317 (1996) substituted $75,000 for $50,000; Pub. L. 100-702 (1988) $50,000 for $10,000), 28 U.S.C.
  1441(a) (removal only of actions "of which the district courts ... have original jurisdiction"), and House Practice ch.
  53 (two-thirds). "At least" vs "more than": the new text says "not less than $150,000"; the old text says "exceeds".
  "For that reason alone" because other grounds (e.g. federal-question cases, and class actions under 1332(d), which has
  its own $5,000,000 amount) aren't touched; please confirm the wording. The bill has no effective-date clause; the post
  doesn't say whether it reaches pending cases. No CBO estimate is listed on congress.gov (cbo.gov not tried); no
  statement for or against was found, so the post asks. Party and state as congress.gov lists them. If the House votes
  before this posts, the last slide needs the tally.
