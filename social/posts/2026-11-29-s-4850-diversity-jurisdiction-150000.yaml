bills:
- id: S. 4850
  title: Diversity Jurisdiction Inflation Adjustment Act
  does: Would raise the amount at stake a federal court needs to hear a case between citizens of different states, from $75,000 to $150,000.
  affects: Civil cases in federal court between citizens of different states.
  where: "Passed the U.S. Senate by unanimous consent Aug. 7, 2026. On the U.S. House schedule for the week of Nov. 30."
  summary:
    text: >-
      This bill raises the minimum amount in controversy from $75,000 to $150,000 and adjusts the amount for
      inflation every 10 years beginning in 2030.
    title: Congressional Research Service summary of S. 4850
    url: https://api.congress.gov/v3/bill/119/s/4850/summaries
    retrieved: '2026-11-27'
  say: S. 4850 would raise the amount at stake a federal court needs to hear a case between citizens of different
    states, from 75,000 dollars to 150,000 dollars. It passed the United States Senate August 7, 2026.
