caption: |-
  Texas lawmakers filed 1,521 bills and resolutions for the 2027 session in the first five days of filing, Nov. 9 to Nov. 13. Sixty-four of them came on Nov. 13.

  The Legislature convenes at noon on Jan. 12, 2027. To follow a bill, set an alert on Texas Legislature Online under My TLO: it can tell you when a committee or calendar posting includes it.
