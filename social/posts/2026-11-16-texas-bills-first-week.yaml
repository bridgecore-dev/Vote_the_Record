notes: >-
  Follow-up to the Nov. 13 filing post (Nov. 9-12, 1,457), which left out Nov. 13 because filing was still under way.
  The Nov. 13 report (report date 11/14/2026) now lists 64 (41 SB, 22 HB, 1 HJR); Nov. 14 shows none. Review
  because 1,521 is our sum (1,262 + 116 + 0 + 79 + 64), not a figure TLO prints. Fills a story slot (Nov. 15 has
  none, but every Nov. 15 slot is taken, so this takes the next free one).
