notes: 'Weekly recap, drafted by recap.py on 2026-11-21 (first Saturday run), does/affects filled by hand from the CRS
  summaries only. Fixed by hand: the Clerk''s ROLL_300 list stops at roll 326, but roll327.xml (H.R. 4464, Nov. 19,
  401-0) is posted, so the House count is 4, not 3, and H.R. 4464 is listed; roll328.xml has no vote. Senate: 17 votes
  Nov. 16-20 on the vote menu (263-279), of which vote 270 is the only final passage of a bill. H.R. 2347: the CRS
  summary describes the House text, but the U.S. Senate passed its own substitute (SA 6883, Congressional Record Nov.
  10, re-opened this run: divisions on NEPA, the Clean Water Act, the ESA, project certainty, nuclear licensing,
  transmission, energy permitting, historic preservation, and Division C, the Survivor Justice Tax Prevention Act), so
  its `does` and summary come from that text; a managers'' amendment may have changed details after SA 6883 (see the
  Nov. 26 H.R. 2347 post''s notes). Congress.gov actions (api.congress.gov, this run): the four U.S. House bills were
  received in the U.S. Senate; H.R. 9640 is on the Senate calendar (No. 721). Every vote here has, or will have, its
  own post, so record_ids lists only the recap. News first: takes the Nov. 24 9:00 a.m. post slot and moves the
  evergreen Texas HB 1194/SB 404 post (prefiled bills) to Dec. 7 3:00 a.m. (Dec. 6 9:00 a.m. would follow a post
  with no Reel between). If GovInfo posts a law approved Nov. 16-22 before Nov. 24, update the count.'
bills:
- id: H.R. 8483
  does: Would take about 847 acres of federal land in San Diego County into trust for the Barona tribe
  affects: The Barona Band of Mission Indians; gaming is barred on the land
  where: 'U.S. House of Representatives vote Nov. 17, 2026: Passed, 398-0. Next: the U.S. Senate.'
  summary:
    text: This bill takes three parcels of specified federal land (approximately 847 acres) in San Diego County, California,
      into trust for the benefit of the Barona Group of Capitan Grande Band of Mission Indians of the Barona Reservation,
      California.
    title: CRS summary of H.R. 8483
    url: https://www.congress.gov/bill/119th-congress/house-bill/8483
    retrieved: '2026-11-21'
- id: H.R. 9600
  title: Common Sense 250 Act of 2026
  does: Would place the already authorized Thomas Paine monument in Area 1 of the National Mall
  affects: Where the Thomas Paine monument can be built in Washington
  where: 'U.S. House of Representatives vote Nov. 17, 2026: Passed, 365-36. Next: the U.S. Senate.'
  summary:
    text: This bill requires the authorized monument honoring Thomas Paine to be located in Area 1 of the National Mall, which
      is reserved for commemorative works of preeminent historical and lasting significance to the United States.
    title: CRS summary of H.R. 9600
    url: https://www.congress.gov/bill/119th-congress/house-bill/9600
    retrieved: '2026-11-21'
- id: H.R. 9640
  title: Earth MRI Reauthorization Act of 2026
  does: Would renew a USGS mapping program focused on critical minerals through FY2031
  affects: USGS contractors, who must disclose owners; U.S.-owned firms get preference
  where: 'U.S. House of Representatives vote Nov. 18, 2026: Passed, 396-14. Next: the U.S. Senate.'
  summary:
    text: This bill reauthorizes through FY2031 the Earth Mapping Resources Initiative, a U.S. Geological Survey (USGS) program
      charged with integrating and modernizing the mapping of U.S. natural resources, with a focus on critical mineral resources
      such as lithium and titanium.
    title: CRS summary of H.R. 9640
    url: https://www.congress.gov/bill/119th-congress/house-bill/9640
    retrieved: '2026-11-21'
- id: H.R. 4464
  title: Preventive Health Savings Act
  does: Would have CBO, on request, estimate preventive-care savings beyond the 10-year budget window
  affects: Congress and CBO; these estimates can't be used to check budget-rule compliance
  where: 'U.S. House of Representatives vote Nov. 19, 2026: Passed, 401-0. Next: the U.S. Senate.'
  summary:
    text: This bill requires the Congressional Budget Office (CBO), upon receiving a request from Congress, to determine if
      proposed legislation would reduce spending outside of the 10-year budget window through the use of preventive health
      care.
    title: CRS summary of H.R. 4464
    url: https://www.congress.gov/bill/119th-congress/house-bill/4464
    retrieved: '2026-11-21'
- id: H.R. 2347
  does: 'Senate text: rewrites environmental reviews, permits and power-line rules; keeps a tax change'
  affects: Projects needing federal permits; sexual-abuse survivors who receive damages
  where: 'U.S. Senate vote Nov. 19, 2026: Passed as amended, 62-33. Next: the U.S. House of Representatives.'
  summary:
    text: This Act may be cited as the "Bipartisan American Affordability and Jobs Act of 2026".
    title: SA 6883, sec. 1(a), Congressional Record, Nov. 10, 2026
    url: https://www.govinfo.gov/content/pkg/CREC-2026-11-10/html/CREC-2026-11-10-pt1-PgS5417.htm
    retrieved: '2026-11-21'
