rule: 'Counts: every roll-call vote in the House Clerk''s and the Senate''s official lists, and every bill congress.gov shows
  "Signed by President" Nov. 16-22, 2026 (GovInfo had not yet posted them as public laws). Signed bills are counted, not
  listed, since each has its own post. Listed: every final-passage vote on a bill or joint resolution
  (passage, suspend and pass, conference report, agreeing to the other chamber''s amendment, veto override), in date order.
  If the post runs out of room, the list stops in that order and the rest are counted on the last slide.'
