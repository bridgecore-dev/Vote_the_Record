notes: >-
  New: no post covers S. 2887. Congress.gov actions: passed the Senate without amendment by unanimous consent Nov. 12
  (CR S5668), message to the House Nov. 16; the Clerk's Nov. 17 floor summary announces it. No CRS summary exists, so the
  bill's summary quotes Sec. 2 of the engrossed text. "The law today" is the 2024 U.S. Code: 1244(a) "only by Act of
  Congress" and its list (Oregon, Santa Fe, Selma to Montgomery; no Route 66), and 1242(a)(3) for the purpose. Every row
  on "What would change" restates the bill's new paragraph (33)(C)-(I); "within an average of 1/4 mile each side"
  restates the limit in (D)(ii). The 1999 program and "would not require additional federal funding or resources" are
  from the NPS testimony (Cuvelier, July 21, 2026; PDF sha256 bf3efe64f08cd1d42ddd9dcb22dd57e551fbc113a0b30de2b2d91da2b2ae22de);
  the 1999 date is NPS's statement, not checked against the 1999 law. cbo.gov returned 403 (not retried), so no CBO
  figure; the committee reported it "without written report". Who loses isn't stated in any source opened; the slide
  says we found no statement against it. Sponsor and cosponsor parties as congress.gov lists them. Takes the free
  Nov. 22 7:30 p.m. Reel slot (after the 3:00 p.m. post). S. 432, S. 1353 and S. 3493 are left for later runs under
  the same rule (H.R. 2400 was covered Nov. 16).
