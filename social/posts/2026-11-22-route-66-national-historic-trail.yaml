caption: |-
  Route 66 ran about 2,400 miles from Chicago to Santa Monica. Federal law names national historic trails one by one, like the Oregon and Santa Fe trails, and only Congress can add one. Route 66 isn't on the list today.

  S. 2887, which passed the U.S. Senate by unanimous consent on Nov. 12, 2026, would add every route U.S. Highway 66 took from 1926 to 1985, run by the Interior Department. Outside federal areas, land could be bought only with the owner's consent. No eminent domain, no buffer zone, no new permits, and the trail can't hinder energy production or transmission.

  The National Park Service supported it and said trail status "would not require additional federal funding or resources." The U.S. House of Representatives would have to pass it too.

  Have you driven any of Route 66?

