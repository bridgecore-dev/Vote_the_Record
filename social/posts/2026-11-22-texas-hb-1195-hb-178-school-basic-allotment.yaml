notes: >-
  New: HB 1195 filed Nov. 17, 2026; TLO lists HB 178 (filed Nov. 9) as its duplicate, both council document 90R 2662
  AMF-D, and the two introduced texts read the same (checked line by line), so they share a post as twins. Neither is
  in an earlier post. Records opened 2026-11-17: the Nov. 17 filing report, both bill histories (filed, no other action;
  no fiscal note listed), both introduced texts, and Education Code 48.051 and 48.2561 (rendered from
  statutes.capitol.texas.gov). The caption says "and guaranteed yield", but the text only amends 48.051, so the post
  doesn't claim a guaranteed-yield change; please check. "Starting point for most other per-student funding" is our
  plain reading of ch. 48 (many allotments are figured from the basic allotment); drop it if you'd rather not.
  48.051(b) lets the Legislature give a greater amount by appropriation, which the "law today" slide says as "through
  the budget". Authors named as TLO lists them, no party. Takes the Nov. 22 9:00 a.m. post slot (after the 7:30 a.m. Reel).
