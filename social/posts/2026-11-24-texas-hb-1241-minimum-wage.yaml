notes: >-
  New: filed Nov. 18, 2026; no earlier post covers it. Rule: the Nov. 18 filing report's captions; HB 1241 ("Relating to
  the minimum wage") is the only one about the minimum wage (HB 1221, 1222 and 1232 are about unemployment pay and
  unpaid-wage claims). Records opened 2026-11-19: the filing report, the bill history (filed, no other action; author
  listed only as "Ezeonu"), the introduced PDF (HTML not posted yet; sha256
  0a803b11e148302d3903e35ccc2b154f6432734a0a0932d69a387d9904fce910; 3 sections: amends 62.051, repeals 62.151, effective
  Sept. 1, 2027, no two-thirds clause), Labor Code Chapter 62 (rendered from statutes.capitol.texas.gov: 62.051, 62.052,
  62.0515, 62.151, 62.155), and 29 U.S.C. 206 from GPO's 2023 U.S. Code ($7.25). dol.gov returned 403 and wasn't retried;
  please confirm no federal law since 2023 changed $7.25. "Most workers under 18 who haven't finished high school" is our
  short form of 62.155(1) (it also excludes piece-rate farm workers and vocational graduates). The bill doesn't amend
  62.052 (tipped workers follow the federal 3(m) formula) or 62.0515 (the state minimum supersedes city ordinances for
  private jobs); how 3(m) would interact with a $15 state minimum isn't stated in the bill, so the slide says only that
  those sections aren't changed. "Employers would pay the higher wage" restates the bill's "an employer shall pay";
  no source states who gains or loses beyond that, and no official statement for or against was found, so the post
  asks. Takes Nov. 24 7:30 p.m. (Reel after the 3:00 p.m. carousel; Nov. 19-23 base slots are full).
