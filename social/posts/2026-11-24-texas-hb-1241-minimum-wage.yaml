caption: |-
  Today, Texas law sets the state's minimum wage at the federal one: $7.25 an hour. The state law also doesn't apply to workers the federal law already covers.

  HB 1241, filed in the Texas House of Representatives for the 2027 session, would change that. Employers would have to pay at least $15 an hour, or the federal minimum if it is ever higher. The rule that the state law skips workers covered by federal law would be repealed.

  What stays: the state law's exemptions. Most workers under 18 who haven't finished high school, and students under 20, are exempt from the state law, and the bill doesn't change that.

  Employers would pay the higher wage. No cost estimate is posted yet. If passed as filed, it takes effect Sept. 1, 2027.

  Should Texas set its own minimum wage?

