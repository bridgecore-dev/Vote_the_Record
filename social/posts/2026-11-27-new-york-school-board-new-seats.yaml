- chip: What the law says
  head: What Education Law section 1703 now says
  quote: {label: "Chapter 380, section 1", text: "the next annual meeting following the annual meeting at which the number was increased"}
  text: '"The next annual meeting" is new. It replaces "a special meeting" held "not less than thirty nor more than sixty days" after.'
- chip: The trade-off
  head: Districts get more time. The added seats wait longer to be filled.
  text: 'The memo says a board "has a year to fill the new seats, as opposed to the more restrictive current deadline of between thirty and sixty days."'
