  big: Next annual meeting
  head: When voters add seats to some New York school boards, the new seats are now filled at the next annual meeting.
  text: Signed as Chapter 380 of the Laws of 2026. It took effect right away.
- chip: Who it covers
  head: Union free and central school districts.
  text: In these districts, voters at an annual meeting can approve a bigger school board. This law changes when the added members are elected.
- chip: Before → after
  head: The election for the new seats moves from a 30-to-60-day window to the next annual meeting.
  rows:
  - [Before, "A special election 30 to 60 days after the annual meeting"]
  - [The catch, "Notice must go out at least 45 days before an election"]
