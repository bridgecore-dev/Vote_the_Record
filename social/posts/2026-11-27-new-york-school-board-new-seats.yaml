  "the next annual meeting"). The page's text view drops the underscoring; the quoted new words rest on the bracket
  markers and the memo's section 1 description, please confirm against the PDF. "The added seats wait longer" is our
  plain reading of the memo's "has a year to fill"; no source states a downside. The Senate tally isn't on the
