caption: |-
  When voters in some New York school districts vote to make their school board bigger, the new seats are now filled at the next annual meeting, not at a special election weeks later. It was signed Nov. 20, 2026 as Chapter 380 of the Laws of 2026 and took effect right away.

  Who: union free and central school districts.
  Before: the district had to hold a special election 30 to 60 days after the annual meeting. Notice of an election must go out at least 45 days ahead, which left less than a two-week window, the sponsor's memo says.
  Now: the added members are elected at the next annual meeting after the one where voters approved the bigger board. That gives districts about a year, and the new seats wait that long to be filled.

  For: the memo says it matches other school districts and local governments, and will "increase voter participation, save election administration costs." It lists the cost as "To be determined." We found no statement against it.

  The New York State Assembly passed it 141-0 on Feb. 3, 2026, and the New York State Senate passed it March 10, 2026.

  Should new school board seats be filled fast, or at the next regular vote?
