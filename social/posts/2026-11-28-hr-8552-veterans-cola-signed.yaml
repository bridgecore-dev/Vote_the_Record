caption: |-
  On Nov. 23, the President signed H.R. 8552, the Veterans' Compensation Cost-of-Living Adjustment Act of 2026.

  Before: VA disability compensation doesn't get an automatic yearly raise the way Social Security does; Congress passes a new law for it each year. After: on Dec. 1, 2026, VA disability pay, the added pay for dependents, the clothing allowance and survivors' dependency and indemnity compensation all rise by the same percentage as Social Security benefits.

  Congress.gov lists no CBO estimate. Both chambers passed it by voice vote, so there's no list of how each member voted.

  Sponsor: Rep. Morgan Luttrell (R-TX), with Rep. Morgan McGarvey (D-KY).

  Should this raise be automatic?
