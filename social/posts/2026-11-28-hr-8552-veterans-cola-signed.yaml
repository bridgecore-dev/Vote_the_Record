bills:
- id: H.R. 8552
  title: Veterans' Compensation Cost-of-Living Adjustment Act of 2026
  does: "Raises VA disability, dependent, clothing-allowance and survivor payments on Dec. 1, 2026, by Social Security's raise."
  affects: "Veterans paid VA disability compensation, their dependents, and surviving spouses and children paid DIC."
  where: "Signed into law Nov. 23, 2026, as Public Law 119-149."
  summary:
    text: "This bill requires the Department of Veterans Affairs (VA) to increase the amounts payable for wartime disability compensation, additional compensation for dependents, the clothing allowance for certain disabled veterans, and dependency and indemnity compensation for surviving spouses and children."
    title: Congressional Research Service summary of H.R. 8552
    url: https://api.congress.gov/v3/bill/119/hr/8552/summaries
