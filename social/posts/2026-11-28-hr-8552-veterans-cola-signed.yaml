notes: >-
  Updated 2026-11-28 (recheck before posting): congress.gov actions (API, read 2026-11-28) now list "Signed by
  President." and "Became Public Law No: 119-149." on Nov. 23, 2026, so `where` and slide 1 give the Public Law
  number and the actions source's retrieved date is updated; nothing else changed. Original notes: New this run: the White House statement dated Nov. 23, 2026 (whitehouse.gov, read 2026-11-24 UTC / Nov. 23 Central)
  says the President signed H.R. 8552 on Monday, Nov. 23; congress.gov actions (API, read this run) end at "Presented
  to President." on Nov. 17 and list no Public Law yet (GovInfo's newest is P.L. 119-142), so the signing rests on the
  White House statement. No post or open pull request covers H.R. 8552. House: suspension, voice vote, Nov. 9 (the
  Record's online note corrects an earlier printing that showed the yeas and nays ordered); Senate: passed without
  amendment by voice vote, Nov. 11. What goes up and the Dec. 1 date are from the enrolled text secs. 2-3 (GovInfo);
  "four kinds" groups sec. 2(b)'s five items (DIC for spouses and for children counted as one). "Doesn't rise on its
  own" rests on Rep. McGarvey's quoted floor words; Rep. Hamadeh also said "Each year, Congress passes" the act. The
  Social Security percentage isn't on a slide: ssa.gov/cola returned 403 (not retried). CBO: congress.gov lists none.
  Every floor speaker (Hamadeh, McGarvey, Luttrell, Conaway) supported it, so no case against is quoted. Sponsor
  Luttrell's party and state from the bill record; McGarvey (D-KY-3) is a cosponsor (5 cosponsors: 4 D, 1 R; not on a
  slide) and called himself "the Democratic lead" in the Record. Slot: Nov. 28 9:00 p.m., the first free post slot
  (Nov. 28 ends with the 6:00 p.m. Reel). It bumps nothing: every earlier post slot at least 3 hours away holds this
  week's news, or the Nov. 28 3:00 p.m. hemp post, which is tied to its Dec. 11 date; the Nov. 25 9:00 p.m. H.R. 7834
  post (Senate passage Nov. 16) is borderline on the one-week line and still pending presentment, so it was left alone.
