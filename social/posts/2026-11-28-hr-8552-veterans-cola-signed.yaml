slides:
- kicker: "Signed into law · Nov. 23, 2026"
  big: Dec. 1
  head: "VA disability and survivor payments go up Dec. 1, 2026, under the Veterans' Compensation Cost-of-Living Adjustment Act."
  text: "H.R. 8552, now Public Law 119-149. Passed the U.S. House of Representatives and the U.S. Senate by voice vote."
- chip: "Before → after"
  head: "These VA payments don't rise on their own. Congress passes a new law for it every year."
  quote:
    label: "Rep. Morgan McGarvey (D-KY), Congressional Record, Nov. 9, 2026"
    text: "our veterans don't get an automatic cost-of-living adjustment for their pay like somebody on Social Security. Congress must proactively pass this legislation each year to make it happen"
  text: "Before: the amounts in effect Nov. 30, 2026. After: those amounts rise by the same percentage as Social Security benefits on Dec. 1, 2026."
- chip: What goes up
  head: The law raises four kinds of VA payments.
  rows:
  - [Disability pay, "Every rate for veterans with service-connected disabilities"]
  - [Dependents, "The added pay for a veteran's dependents"]
  - [Clothing, "The clothing allowance for certain disabled veterans"]
  - [Survivors, "Dependency and indemnity compensation for spouses and children"]
  text: "The VA must publish the new amounts in the Federal Register."
- chip: How much
  head: "The law doesn't name a number. It ties the raise to Social Security's Dec. 1, 2026 cost-of-living increase."
  quote:
