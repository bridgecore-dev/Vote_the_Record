caption: |-
  In the late 1800s, North America's buffalo fell from tens of millions to about 1,000, the House committee report says. Some estimates now count more than 200,000, with tribes playing a key role in their return, the report says.

  H.R. 7954, on the House schedule this week, directs the Interior Department to back tribal buffalo herds for seven years: contracts, grants and technical help, consultation on Interior plans that affect buffalo (including sick herds), and agreements to move surplus buffalo from Interior land to tribal land, with charges that can be waived.

  The bill names no dollar amount. The committee asked CBO for a cost estimate and had not received it.

  Should Interior take this on? Tell us below.

