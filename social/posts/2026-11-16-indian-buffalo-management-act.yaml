  NPS and the 2022 USDA Census of Agriculture). The bill text has no authorization of appropriations. Cosponsor
  counts by party from congress.gov (8 R, 7 D); Hurd's party and state as the report lists them. If the House votes
  before 7 p.m. Nov. 16, the last slide needs the tally.
