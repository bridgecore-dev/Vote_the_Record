slides:
- kicker: 2027 Texas session · Filed Nov. 9, 2026
  big: HB 427
  head: A Texas House of Representatives bill would widen Texas's election deep fake crime from video to AI-made images, audio and text.
- chip: The law today
  big: 30 days
  head: "Texas makes it a crime to create a deep fake video and publish it within 30 days of an election, to hurt a candidate or sway the result."
  quote: {label: "Election Code 255.004(e): a deep fake video", text: "means a video, created with the intent to deceive, that appears to depict a real person performing an action that did not occur in reality."}
  text: "Video only. A Class A misdemeanor: up to $4,000, a year in jail, or both (Penal Code 12.21)."
- chip: Before → after
  head: "The same crime, for more kinds of media."
  rows: [[Before, "A video that appears to show a real person doing something that didn't happen"],
         [After, "An image, audio (including speech), video, radio broadcast or written text made or changed with AI or other software to deceive"],
         [Unchanged, "Only with intent to hurt a candidate or sway the result, and only if published within 30 days of an election"]]
  text: "The bill doesn't change the penalty."
- chip: Who's exempt
  head: "Satire and parody, and some ads that others only carry."
  text: "Exempt: political ads a broadcaster, website, streaming service, app or online platform is paid to run, and ads shown in real news coverage with a clear notice that their authenticity is in question."
- chip: What's next
  head: The Legislature convenes Jan. 12, 2027.
  text: "Should today's deep fake crime cover fake images, audio and text, not just video? No fiscal note (cost estimate) is posted yet."
caption: |-
  Today, Texas law makes one kind of election deep fake a crime: a fake video, published within 30 days of an election to hurt a candidate or sway the result.

  HB 427, filed in the Texas House of Representatives for the 2027 session by Rep. Mary González, would keep the 30-day window and the intent to hurt a candidate or sway the result, but widen what counts: images, audio, video, radio broadcasts or written text made or changed with AI or other software to deceive.

  Satire, parody, paid ads others only carry, and real news coverage with a clear notice are exempt.

  Should the crime cover more than video?
