bills:
- id: HB 427
  does: Would widen today's 30-day deep fake video crime to AI-made or altered images, audio, video and text.
  affects: Anyone who makes such media to injure a candidate or sway an election. Political satire or parody ads are exempt.
  where: Filed Nov. 9, 2026 by Rep. Mary González; no other action yet. Would take effect Sept. 1, 2027.
  summary:
    text: >-
      an image, an audio recording, including a recording of an
      individual's speech, a video recording, a radio broadcast, or written text created or modified using
      generative artificial intelligence technology or other computer software with the intent to deceive
    title: HB 427 as filed, Sec. 1, defining artificially generated media (Election Code 255.004(e))
    url: https://capitol.texas.gov/tlodocs/90R/billtext/html/HB00427I.htm
