caption: |-
  North Carolina lawmakers return to Raleigh on Monday, Nov. 16, at noon.

  The resolution that set this date also limits what they can take up. The list includes veto override votes, appointments, election laws and districts, and proposed constitutional amendments.

  The House and Senate are set to adjourn Nov. 19 and come back Nov. 30.

  To see who represents you, enter your address at Find Your Legislators on ncleg.gov.
