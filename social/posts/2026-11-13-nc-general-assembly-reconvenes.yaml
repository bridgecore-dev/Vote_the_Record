notes: >-
  Upcoming date from the ratified adjournment resolution (Resolution 2026-6) on ncleg.gov, confirmed by the
  ncleg.gov Legislative Calendar ("Monday, November 16, 2026 / Session Convenes"). A news story pointed here, so
  approval is review. Slide 2 paraphrases part of a longer list (it also covers litigation, impeachment, conference
  reports and concurrence); "The list includes" says it isn't the full list. Worth a check that no later
  resolution changed these dates.
