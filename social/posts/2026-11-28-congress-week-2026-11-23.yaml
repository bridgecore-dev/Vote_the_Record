notes: 'Weekly recap, drafted by recap.py on 2026-11-28 (no earlier Saturday run drafted it), then fixed by hand like the
  Nov. 16-22 recap. GovInfo''s feed (read this run) still ends at PL 119-142, so the draft said "0 new public laws"; congress.gov
  actions (API, read 2026-11-28) list "Signed by President." and "Became Public Law No: 119-147/148/149" on Nov. 23 for
  H.R. 1550, H.R. 4930 and H.R. 8552, so the first row is "Bills signed into law: 3". They are not named (each has its own
  post: H.R. 1550 Nov. 25, H.R. 8552 Nov. 28, H.R. 4930 Nov. 29), so there are no bills entries. Votes: the Clerk''s
  ROLL_300 list ends at roll 327 (Nov. 19) and roll328.xml returns no vote; the Senate vote menu ends at vote 279
  (Nov. 20). The draft''s slide 2 text ("Every roll-call vote counted here was on a nomination...") was wrong with zero
  votes and was replaced. The post does not say why there were no votes (no source opened states a recess). What''s next:
  docs.house.gov, last updated Nov. 27, lists 19 items under suspension and 4 under a rule (the Senate amendment to
  H.R. 2347, H.R. 11142, H.R. 3495, H.R. 5267; the committee reports listed under them aren''t counted). Slot: not news-first
  (the newest action here is from Nov. 23, five days ago), so it takes the first free post slot that keeps the day''s
  Reel/post turn, Dec. 3 9:00 a.m. (Dec. 2 3:00 p.m. would follow the 9:00 a.m. carousel with no Reel between), and bumps
  nothing. That is late for a weekly recap; if you''d rather it run sooner, move it by hand.'
