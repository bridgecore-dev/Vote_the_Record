caption: |-
  The House passed the Major Richard Star Act, 392-18, on Nov. 12, after a motion to discharge (245-175, Nov. 11) and the vote on its rule (271-135).

  After: about 58,000 veterans would get about $1,450 more a month on average, CBO estimates. Cost: $12.75 billion over 2027-2036, with no cuts or new revenue in the bill to pay for it. Not covered: medically retired veterans whose disabilities aren't combat-related, or who served 20+ years.

  All 18 Nay votes were Republicans, per the House Clerk. The "cuts" debate is about a different bill, H.R. 9237.
