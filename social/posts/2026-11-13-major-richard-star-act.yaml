notes: >-
  Reworked 2026-11-14 into before/after/cost/not covered, per the owner, with the party totals and the smaller side's names from roll 323's XML (totals-by-party, recorded-vote). Please double-check:
  (1) CBO numbers come from CBO's estimate as Rep. Bost put it in the Congressional Record (Nov. 12, H6197-H6198);
  cbo.gov showed a bot check and wasn't retried, so compare with the CBO PDF
  (https://www.cbo.gov/system/files/2026-10/hr2102_as_amended_by_hres1247.pdf). Its 10-year direct-spending
  total is $12,750 million; its text rounds this to "$13 billion". The 58,000 is DoD actuary data CBO cites for Sept. 2025.
  (2) Current law (10 U.S.C. 1413a(b)(3), 1414(b); 38 U.S.C. 5305) was checked in the 2024 U.S. Code on govinfo
  (uscode.house.gov returned Page Not Found) and matches CBO's description; the slides quote CBO, so those pages
  aren't listed as sources (the caption was over 2,200 characters). Check that no later law changed 1413a(b)(3) or 1414(b).
  (3) "Not covered" rows: row 1 rests on 10 U.S.C. 1414(b)(2) ("Subsection (a) does not apply to a member retired
  under chapter 61 ... with less than 20 years"), which the bill leaves in place. Rows 2-3 rest on CBO's
  "Previous CBO estimate" paragraph, which lists what the introduced bill did and the passed version doesn't.
  (4) The "Is it true?" slide names H.R. 9237, which passed by voice vote Nov. 11 (bill status: "On passage Passed by voice vote").
  In the H.R. 2102 debate, members' "cut" statements referred to H.R. 9237. The CRS summary quoted is for H.R. 9237
  as introduced, and the engrossed text isn't on govinfo yet. The slide gives no dollar figure for H.R. 9237 because
  its CBO estimate couldn't be opened. H.R. 9237's voice vote isn't in record_ids (kept unchanged as asked); add it if you want
  this post to claim that record. No CRS summary of H.R. 2102 yet; its bills summary quotes CBO's bill summary.
