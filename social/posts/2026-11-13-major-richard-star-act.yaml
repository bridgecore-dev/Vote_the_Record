bills:
- id: H.R. 2102
  title: Major Richard Star Act
  does: "Before: retired pay is cut by the VA disability amount, partly paid back by CRSC. After: no cut, so full retired pay plus VA pay."
  affects: "Veterans medically retired before 20 years with combat-related disabilities: about 58,000 in Sept. 2025 (CBO)."
  where: Passed the House 392-18 on Nov. 12, 2026. Sent to the Senate Armed Services Committee.
  summary:
    text: >-
      H.R. 2102 would permit Chapter 61 retirees--service members who have retired from the armed forces because
      of a disability--with qualifying combat-related disabilities to receive the full amount of both their
      military retired pay and their veterans' disability compensation.
    title: "CBO bill summary, in the Congressional Record, Nov. 12, 2026, p. H6197"
    url: https://www.govinfo.gov/content/pkg/CREC-2026-11-12/html/CREC-2026-11-12-pt1-PgH6194-4.htm
    retrieved: '2026-11-14'
- id: H.R. 9237
  title: Take Care of America's Veterans Act
  does: Would change many VA programs, including letting some combat-disabled retirees get both payments and revising two VA ratings.
  affects: "Veterans and families, including some combat-disabled retirees and veterans rated for sleep apnea or tinnitus."
  where: Passed the House by voice vote (no recorded tally) on Nov. 11, 2026. Next it goes to the Senate.
  summary:
    text: >-
      The bill modifies various compensation programs for veterans, including by (1) allowing concurrent receipt
      of disability compensation and military retired pay for certain retirees with a combat-related disability
    title: "CRS summary of H.R. 9237 as introduced (bill status, GPO)"
    url: https://www.govinfo.gov/bulkdata/BILLSTATUS/119/hr/BILLSTATUS-119hr9237.xml
    retrieved: '2026-11-14'
