notes: >-
  News-first: an official action from the last three days (nyassembly.gov actions, read 2026-11-22: "11/20/2026
  signed chap.396"); found through Open States' action feed (a tip only, not a source). No post covers A10936.
  Takes Nov. 30 9:00 a.m., the first post slot held by an evergreen post (every earlier post slot holds this week's
  votes, passages or signings, or the weekly recap), and moves the prefiled-bill post
  2026-11-30-texas-hb-1257-public-employee-bargaining to 2026-12-19T03:00:00-06:00, the first post slot after the
  last queued post (Dec. 18's only post is at 3:00 a.m., so a later Dec. 18 post slot would put two posts in a row).
  New words are the capitalized text in the bill (sec. 1); § 13-0103 and § 24-0107 (freshwater wetlands "not tidal
  wetlands as defined in subdivision one of section 25-0103") were read on nysenate.gov this run. "Before" rests on
  the old § 25-0103 wording (the bill text with the new words removed) plus § 24-0107; "the Hudson is still tidal
  north of the bridge" is the memo's "wetlands along the Hudson River north of the Mario Cuomo Bridge are influenced
  by tidal action". Whether each such marsh meets § 24-0107's size and vegetation tests is not something the memo
  says, so the slides say they "can be" freshwater wetlands. The memo's summary says "tidal wetlands of the marine
  and coastal district" where the bill says "tidal waters"; the slides quote the bill. Votes: Assembly 127/6 from
  nyassembly.gov floor votes (several members ER); Senate 50-11 (1 absent, 1 excused) from nysenate.gov. Names as
  the records list them (surnames only, no party). No statement against was found; the Senate twin S9479 is not
  named (one bill per post). The builder's bill-number check doesn't take New York Assembly numbers, so, like the
  A8695 post, the slides name the chapter instead. Please check the plain-words line on slide 2.
