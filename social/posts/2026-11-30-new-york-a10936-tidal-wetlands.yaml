slides:
- kicker: New York · New law, Nov. 20, 2026
  big: Which rules?
  head: New York changed which wetlands count as "tidal" in its environmental law.
  text: Signed as Chapter 396 of the Laws of 2026. It took effect right away.
- chip: Plain words
  head: A tidal wetland is a marsh, flat or swamp that the tide moves in and out of.
  text: New York has two sets of wetland rules, one for tidal wetlands and one for freshwater wetlands. A wetland that counts as tidal can't count as freshwater.
- chip: What the law says
  head: The new words added to the definition of tidal wetlands (Environmental Conservation Law § 25-0103)
  quote: {label: "Chapter 396, section 1 (new words)", text: "those areas which border on or lie beneath tidal waters OF THE MARINE AND COASTAL DISTRICT, AS DESCRIBED IN SECTION 13-0103 OF THIS CHAPTER"}
- chip: Where that is
  head: The marine and coastal district stops on the Hudson River at the Mario Cuomo Bridge.
  quote: {label: "Environmental Conservation Law § 13-0103", text: "the waters of the Atlantic Ocean within three nautical miles from the coast line and all other tidal waters within the state, including the Hudson River up to the Governor Mario M. Cuomo bridge"}
- chip: Before → after
  head: The Hudson is still tidal north of the bridge. Those wetlands change rulebooks.
  rows:
  - [Before, "Any area bordering tidal waters was a tidal wetland, so these were not freshwater wetlands under the law"]
  - [After, "Only tidal waters of the marine and coastal district count, so they can be freshwater wetlands instead"]
  - [Who regulates, "The state Department of Environmental Conservation (DEC), under its freshwater wetlands program"]
- chip: The case for
  head: The sponsor says DEC already treats these wetlands as freshwater wetlands.
  quote: {label: "Sponsor's memo", text: "these wetlands are also Class I freshwater wetlands under DEC's regulations, and were previously mapped by DEC, yet they are excluded from the statutory definition of freshwater wetlands"}
  text: The memo says the change lets them "be regulated and protected under DEC's Freshwater Wetlands Regulatory Program." It lists the cost to state and local governments as "None."
- chip: The votes
  head: It passed both chambers. No reason for a no vote is given in the records.
  rows:
  - [New York State Assembly, "127 Yes, 6 No, May 13, 2026"]
  - [New York State Senate, "50 Aye, 11 Nay, June 3, 2026"]
  - [Governor, "Signed Nov. 20, 2026, Chapter 396"]
- chip: Who voted no
  head: Every no vote, as the official records list them
  rows:
  - [Assembly (6), "DiPietro, Friend, Hawley, Manktelow, Molitor, Sempolinski"]
  - [Senate (11), "Borrello, Gallivan, Griffo, Murray, O'Mara, Ortt, Rhoads, Ryan, Tedisco, Walczyk, Weik"]
  text: Neither record lists party, so none is shown.
- chip: Your turn
  head: Should tidal marshes up the Hudson fall under freshwater rules?
  text: The sponsor says it lets DEC protect them under its freshwater program. No one on the record argued against it. Which side convinces you?
caption: |-
  New York changed which wetlands count as "tidal." Tidal wetlands are now only those along tidal waters of the marine and coastal district, which on the Hudson River stops at the Mario Cuomo Bridge. Signed Nov. 20, 2026 as Chapter 396 of the Laws of 2026, in effect right away.

  Before: any area bordering tidal waters was a tidal wetland, so the tidal marshes up the Hudson, north of the bridge, could not be freshwater wetlands under the law.
  Now: they can be, and the sponsor's memo says they will be "regulated and protected under DEC's Freshwater Wetlands Regulatory Program." The memo lists the cost to governments as none.

  The New York State Assembly passed it 127-6 on May 13, and the New York State Senate 50-11 on June 3. No statement against it was found in the records.

  Should tidal marshes up the Hudson fall under freshwater rules?
