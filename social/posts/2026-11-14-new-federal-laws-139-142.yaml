notes: >-
  New since the last new-laws post (119-137/138). Congress.gov lists 119-139 to 119-142, all signed Nov. 10; the
  GovInfo feed returned 522 this run, and the merged weekly recap (Nov. 16 slot) says "New public laws: 0" because
  GovInfo hadn't posted them, so check that recap. CRS summaries are of the introduced bills; H.R. 7730 and 1703
  passed "as amended", and I checked each claim against the enrolled text (7730 and 1703 numbers and the 2028 start
  date match the enrolled text). cbo.gov returned 403, so the CBO estimates for H.R. 997 and 1945 are linked, not
  quoted; congress.gov lists none for 7730 or 1703. The sources don't say who loses under either change, so the
  slides don't claim one. Tallies come from Congress.gov's actions; the only roll call was House roll 85 (2025), 385-0.
