bills:
- id: SB 437
  does: Tolls would stop once a toll road's costs and bonds are paid; no new toll projects or tolled free lanes.
  affects: Texas drivers who use toll roads, and TxDOT, tollway and mobility authorities and counties that run them.
  where: Filed Nov. 19, 2026 by Sen. Hall; no other action yet.
  summary:
    text: >-
      A toll project shall be maintained without tolls in the manner provided by Subsection (c) when the costs of
      acquisition and construction of the project have been paid and: (1) all of the bonds and interest on the bonds
      that are payable from or secured by revenues of the project have been paid
    title: SB 437 as filed (Sec. 12, Transportation Code 372.060(a))
    url: https://capitol.texas.gov/tlodocs/90R/billtext/pdf/SB00437I.pdf
    retrieved: '2026-11-19'
slides:
- kicker: 2027 Texas session · Filed Nov. 19, 2026
  big: No tolls
  head: A Texas Senate bill would make toll roads drop their tolls once they're paid off.
- chip: The law today
  head: Surplus toll money can pay for other roads and projects in the region.
  quote: {label: Texas Transportation Code 228.006(a), text: "The commission shall authorize the use of surplus revenue of a toll project or system to pay the costs of a transportation project, highway project, or air quality project within a region in which any part of the toll project is located.", key: surplus revenue}
  text: "Tollway authorities can use surplus to pay for other toll roads (366.175). Chapter 372, which covers every toll entity, has no rule that tolls stop."
- chip: What would change
  head: Four changes, as filed.
  rows:
  - [Paid off, "Tolls stop once a road's costs, bonds and interest are paid, or the money to pay them is set aside"]
  - [No new toll roads, "Toll entities couldn't build or contract for new toll projects"]
  - [Free lanes stay free, "No turning free highway lanes, HOV or other restricted lanes into toll lanes"]
  - [No surplus, "The surplus-revenue sections, 228.006 and 366.175, are repealed"]
- chip: Before → after
  head: Turning a free highway into a toll road
  rows:
  - [Before, "Allowed in four cases, e.g. if as many free lanes remain after rebuilding (228.201)"]
  - [After, "Not allowed, for contracts made after the law takes effect"]
  text: Contracts and toll designations made before then keep the old rules.
- chip: Who takes over
  head: Once tolls stop, someone else has to pay to keep the road up.
  rows:
  - [The state, "TxDOT maintains it, if the Legislative Budget Board finds the state has the money"]
  - [A county, "If it asks and the Legislative Budget Board approves"]
  - [Otherwise, "The toll entity keeps maintaining it, without tolls"]
- chip: Who gains, who pays
  head: Drivers stop paying tolls on paid-off roads. The road's upkeep and the lost surplus have no price tag yet.
  text: "No fiscal note is posted. The bill orders TxDOT, with the Legislative Budget Board, to report by Sept. 1, 2028 on every toll road, when its tolls would stop, and what upkeep would cost."
- chip: What's next
  big: Sept. 1, 2027
  head: If passed as filed, the bill takes effect on this date, or right away with a two-thirds vote of each chamber.
  text: "How we picked: every bill filed Nov. 19, 2026 whose caption is about eliminating toll roads. SB 437 was the only one. Should paid-off roads go toll-free?"
caption: |-
  Today, Texas law lets surplus toll money pay for other roads and projects in the region (Transportation Code 228.006), and lets tollway authorities use it for other toll roads (366.175). The chapter that covers every toll entity has no rule that tolls stop.

  SB 437, filed in the Texas Senate for the 2027 session, would change that:
  - Tolls stop once a road's costs, bonds and interest are paid.
  - No new toll projects.
  - No turning free highway lanes into toll lanes.
  - The surplus-revenue sections are repealed.

  Once tolls stop, TxDOT would maintain the road if the Legislative Budget Board finds the state has the money, or a county could take it over with the board's approval. Otherwise the toll entity keeps it up, without tolls.

  No fiscal note is posted yet. The bill orders a TxDOT report on the costs by Sept. 1, 2028. If passed as filed, it takes effect Sept. 1, 2027.

  Should paid-off roads go toll-free?
