  New: filed Nov. 19, 2026 (TLO history: filed, received by the Secretary of the Senate; author listed only as "Hall";
  no party listed, so none given). Rule: the Nov. 19 filing report's captions; SB 437 is the only one about
  eliminating toll roads (SB 440, same author, is about toll collection and enforcement, a different subject, and
  isn't named). Records opened 2026-11-19: filing report, history, introduced HTML and PDF (sha256
  7c8daa08c6fad3ec400a571dffb226b1d464f298a95f4f202aa2cad6f3385474), and Transportation Code chapters 228, 366, 372
  (rendered from statutes.capitol.texas.gov: 228.006, 228.051, 228.201, 366.037, 366.175, 372.001, 372.0535).
  Please check: (1) "Chapter 372 has no rule that tolls stop" is from reading all of current Chapter 372; I didn't
  check chapters 284 (counties) or 370 (mobility authorities) for one, so the slide claims only Chapter 372. (2) The
  bill also repeals 228.051 (TxDOT designating state highway lanes as toll projects), 366.037 and 366.071 and others;
  only the two surplus-revenue repeals are named. (3) Applies to contracts for new toll construction only where the
  request for proposals is issued after the effective date (Sec. 16); "No new toll roads" row is shortened. (4) No
  official statement for or against was found, and no fiscal note exists yet, so the post asks. (5) Harris County runs
  toll roads, but the bill names no county, so none is named.
