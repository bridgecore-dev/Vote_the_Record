notes: >-
  News-first window: an official action from the last three days (nyassembly.gov actions, read 2026-11-23:
  "11/13/2026 delivered to governor", "11/20/2026 signed chap.387"). Found through Open States' action feed (a tip only,
  not a source). No post or open pull request covers A8388 (the New York posts so far are A4591, A8695, A10936, S4692).
  Takes Nov. 28 6:00 a.m., a free Reel slot right after the Nov. 28 3:00 a.m. carousel, so no post is bumped (every
  earlier Reel slot is news or a trial). Trial look: changes only the palette (plum) from the baseline (teal, dark,
  round, center, captions, sfx, af_heart); no queued Reel uses plum yet. Everything is from the one Assembly page:
  the new Election Law 3-400(6-a) text (conditions (1)-(4), "full-time" = "at least twelve credit hours per semester"
  at a college in this state; NYC students "in any county therein"), the sponsor's memo (residency exemption,
  shortage quote, several districts in one polling place, older inspectors retiring, "authorizes local boards of
  election to recruit", fiscal implications "None", effective immediately), the actions, and the Assembly floor vote
  (96/44, May 6, 2026; several members excused). "Had to meet the county residency rule" is the memo's description
  ("exempt from the current county residency requirements"); the text of 3-400(6) itself wasn't read (nysenate.gov
  served a bot challenge and elections.ny.gov returned 403, neither retried). Please confirm that wording. The Senate
  tally isn't on the Assembly page, so the Senate line gives only the date (substituted for S1809, not named: one bill
  per post). No party is shown; the Assembly record doesn't list it. The governor isn't named because the action line
  says only "signed chap.387". Like the other New York posts, the slides name the chapter, not the Assembly number,
  because the builder's bill-number check doesn't take New York Assembly numbers.
