caption: |-
  New York has a new election law. Full-time college students can now be certified as election inspectors or poll clerks, the poll workers who run voting sites, in the county where their college is, even if they live somewhere else. In New York City, they can serve in any of its counties. It was signed Nov. 20, 2026 as Chapter 387 of the Laws of 2026 and took effect right away.

  Before: inspectors had to meet the county residency rule, the sponsor's memo says.
  Now: full-time students (at least 12 credit hours a semester at a New York college) are exempt from it. They still must be registered to vote in New York, hold no elected office, not be a candidate in that district or a candidate's spouse, parent or child, and be able to speak, read and write English.

  For: the sponsor's memo says polling places are short of trained staff, which can force several election districts into one polling place, and many inspectors will retire soon. Against: 44 members of the New York State Assembly voted no; the record doesn't give their reasons, and we found no statement against it. The memo lists the cost as none.

  The New York State Assembly passed it 96-44 on May 6, 2026, and the New York State Senate passed it June 1, 2026.

  Should students be able to work the polls where they go to school?

