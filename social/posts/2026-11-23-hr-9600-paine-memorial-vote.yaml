caption: |-
  On Nov. 17, the U.S. House of Representatives passed H.R. 9600, the Common Sense 250 Act, 365-36, with 32 members not voting.

  In 2022, Congress allowed a privately funded memorial to Thomas Paine in Washington, D.C. Paine wrote Common Sense, the 1776 pamphlet that argued for breaking from Britain. D.C. is split into areas for memorials. Area I is kept for subjects of "preeminent historical and lasting significance to the United States," and a memorial there needs Congress's own approval. This bill gives it.

  By party, per the House Clerk: Republicans 163 Yea, 36 Nay; Democrats 202 Yea, 0 Nay; the one Independent didn't vote. All 36 Nay names are in the slides. The roll call doesn't record reasons, and the committee report lists no views against the bill.

  Next it goes to the U.S. Senate. Who belongs in Area I? Tell us below.
