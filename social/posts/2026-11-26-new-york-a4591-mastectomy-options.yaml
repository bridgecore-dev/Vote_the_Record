notes: >-
  News-first: an official action from the last three days (nyassembly.gov actions, read 2026-11-22: "11/20/2026
  signed chap.382"). Found through Open States' action feed (a tip only, not a source). Takes Nov. 26 9:00 p.m., a free
  post slot (Nov. 26 ends with the 6:00 p.m. Reel; every earlier post slot holds this week's news), so no post is
  bumped. Before/after is from the bill text's markup (underscored = new, [brackets] = removed): "aesthetic flat
  closure as such term is defined by the National Cancer Institute" was already in the law (the 2022 version), inside
  the reconstructive-options description; the new words are "options for breast reconstruction", "surgical", the new
  (b) "non-surgical reconstructive options including having an", and ", or using a breast form". The sponsor's memo
  describes the change as adding flat closure, which the markup shows was already there, so the slides follow the
  text, not the memo. "In writing and in advance of obtaining consent" is existing law, unchanged. Effective date:
  "the first of January next succeeding the date on which it shall have become a law", so Jan. 1, 2027. Assembly vote
  140/0 from nyassembly.gov floor votes (several members excused). The Senate tally isn't on the Assembly page and
  nysenate.gov served a bot challenge, so the Senate line gives only the date ("03/05/2026 PASSED SENATE", substituted
  for S1305A, which isn't named: one bill per post). No party is shown; the records don't list it. No case against was
  found (no No votes, no opposing memo opened). The builder's bill-number check doesn't take New York Assembly numbers (A4591), so, like the New Jersey A4835 post, the slides name the chapter instead, and say what it does, who it affects and where it stands.
