notes: >-
  Part of the "One Big Beautiful Bill Act: what changes in 2027" series, the owner's request (2026-11-15). Check:
  (1) The IRS states list is "as of November 13, 2026" and may grow; recheck it before the slot. The IRS page now
  calls the law the "Working Families Tax Cuts"; it is the same law. (2) The $26 billion is JCT's estimate
  (JCX-35-25, July 1, 2025) as CRS R48724 quotes it; jct.gov blocked access, so the JCT table itself wasn't opened.
  No official source in the sheet says how this section is paid for, so the slides don't say. (3) Roll call 358
  was confirmed on senate.gov ("Amendment Rejected (50-50)", majority 1/2); the party rows are my count from its
  member list. The three Republicans who voted Yea were Collins (R-ME), Fischer (R-NE) and Murkowski (R-AK); they
  are not named on the slide for space, but could replace the party rows if you prefer names. (4) Quotes are from
  Cong. Rec. S4063 (vote-a-rama, legislative day June 30; the vote itself was July 1 at 2:19 AM). Cruz and
  Hirono's party/state come from the Senate's member lists. (5) Treasury's proposed rules (FR Doc. 2026-20277,
  Oct. 2, 2026) weren't fully downloaded and aren't used. (6) The 300% test is household income compared with
  "area median gross income," quoted from the law.
