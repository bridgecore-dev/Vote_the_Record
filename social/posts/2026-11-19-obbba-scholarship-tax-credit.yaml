caption: |-
  New in 2027: a federal tax credit of up to $1,700 for cash gifts to groups that give K-12 scholarships. It's section 70411 of the One Big Beautiful Bill Act.

  Before: no federal credit for these gifts. After: up to $1,700 per taxpayer ($3,400 for a married couple filing jointly), cut by any state credit for the same gift. Students must be eligible for public school, with household income at or under 300% of area median, in states that opt in.

  The IRS lists 31 states for 2027, as of Nov. 13, 2026. Texas is one. Donors may live in any state.

  Cost: about $26 billion less federal revenue over fiscal 2025-2034, the Joint Committee on Taxation estimated (per CRS).

  For: Sen. Cruz (R-TX). Against: Sen. Hirono (D-HI), whose amendment to strike it failed 50-50 in the U.S. Senate (roll call 358).

  Check your state's approved groups on the IRS page below.

  Voice: computer-generated (Kokoro text-to-speech).
