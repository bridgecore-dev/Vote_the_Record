caption: |-
  The U.S. Senate passed the Veterans Protection from Fraud Act (S. 4445) by voice vote on Nov. 18.

  Today, federal law adds up to 5 years in prison for certain frauds run by phone, email or text, and up to 10 years if the scam targeted people over 55 or hit 10 or more of them. This bill adds a third case: scams that targeted veterans, of any age. The extra time comes on top of the sentence for the fraud itself.

  It passed without a roll call, so there is no list of how each senator voted. No CBO cost estimate is listed yet. Next it goes to the U.S. House of Representatives (status as of Nov. 19).

  Should scams aimed at veterans carry the same extra time? Tell us below.
