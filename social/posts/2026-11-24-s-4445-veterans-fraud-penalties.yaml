notes: >-
  New: the Senate Press Gallery's Nov. 18 log says "By voice vote, the Senate passed S.4445 - Veterans Protection from
  Fraud Act of 2026", and the engrossed text on GovInfo ends "Passed the Senate November 18, 2026." The bill status
  (GovInfo and api.congress.gov, read Nov. 19) doesn't show the passage yet; its latest action is the Apr. 30 referral
  to Senate Judiciary, so how it left committee isn't stated. No CRS summary exists yet, so the explainer quotes the
  official title of the engrossed text, and the before/after comes from the bill (sec. 2 adds 18 U.S.C. 2326(2)(C),
  "targeted veterans (as such term is defined in section 101 of title 38) of any age") and the 2023 U.S. Code text of
  2325 and 2326 (GPO). The 2023 edition is the latest GPO has; the House's uscode.house.gov page returned 404, so
  please confirm no law since 2023 changed 2326. "Phone, email or text" is the 2325 definition ("interstate telephone
  calls, emails, text messages, or electronic instant messages"). The veteran line paraphrases 38 U.S.C. 101(2):
  "served in the active military, naval, air, or space service, and who was discharged or released therefrom under
  conditions other than dishonorable." Sponsor and cosponsor with party/state as the bill status lists them. The
  identical House bill (bill status relatedBills: "Identical bill", referred to House Judiciary Apr. 30) isn't
  numbered here (one bill per post). No floor debate or for/against statement was found (voice vote; the Nov. 18
  Record isn't on GovInfo yet), so the post asks the reader instead. If the House acts before Nov. 24, update the
  last slide. Nov. 24 3:00 p.m. is the first free post slot that keeps the Reel/post turn (it sits between the 1:30
  p.m. Reel and the next day's slots). Engrossed text sha256 (HTML): d23494793a2a8a05cdcfa41e0e02d79784b16f985f540ecf5fc9e004f2620f3e.
