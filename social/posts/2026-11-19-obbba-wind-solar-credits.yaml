bills:
- id: H.R. 1
  title: One Big Beautiful Bill Act
  does: "A 2025 budget law. Ends wind and solar electricity credits for projects placed in service after 2027, unless begun before July 5, 2026."
  affects: "Wind and solar projects and their owners, and makers of wind energy components."
  where: "Signed into law July 4, 2025, as Public Law 119-21."
  summary:
    text: >-
      Specifically, to receive the CEITC or CEPTC, wind and solar facilities must either (1) have begun construction
      before July 5, 2026, or (2) be placed in service (i.e., begin producing electricity) before January 1, 2028.
    title: "CRS Insight IN12719 (July 27, 2026)"
    url: https://www.congress.gov/crs_external_products/IN/HTML/IN12719.html
    retrieved: '2026-11-15'
