notes: >-
  Part of the "what changes in 2027" series on the One Big Beautiful Bill Act, the owner's request (2026-11-15).
  Cost: no official estimate for secs. 70511-70514 could be opened (the JCT score is on jct.gov, which blocked
  access; cbo.gov showed a captcha), so no cost is on the slides. No official count of affected projects or jobs was
  found either. Please double-check: (1) The Ways and Means quotes (majority and Neal's dissent) are about the House
  version (May 2025); the Senate changed the dates before enactment. Lee's and Wyden's words are from the Senate
  floor on the Senate version (Cong. Rec., June 30, 2025 legislative day, p. S4063; Lee was answering Wyden's motion
  to commit the bill to strike the clean energy cuts). Lee's line is about the energy and natural resources title in
  general. Party and state for Lee and Wyden are from Senate roll call 372's member list; Neal's from House roll call
  190. (2) The "Before" rates (3.0 cents, 30%) are CRS Table 1's figures; CRS notes elsewhere that rates depend on
  prevailing wage and apprenticeship rules. (3) The foreign-entity row is my plain reading of new 26 U.S.C.
  7701(a)(52): the "material assistance cost ratio" (product costs minus those from prohibited foreign entities,
  as a share of the total) must be at least the threshold; check the wording. (4) Forms 3468 and 7211 come from the
  fact sheet; their instructions were not opened. (5) Not on the slides: the U.S. Senate rejected Lee amendment No.
  2745 (an earlier cutoff, 60 days after enactment), 21-79, roll call 360 (Cong. Rec. S4064). (6) Since 2026, IRS
  and Treasury call the law the "Working Families Tax Cuts"; the post uses the enacted short title.
