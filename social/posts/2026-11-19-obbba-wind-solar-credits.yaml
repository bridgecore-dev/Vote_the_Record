caption: |-
  One Big Beautiful Bill Act: what changes in 2027. Wind and solar projects placed in service after Dec. 31, 2027 get no clean electricity tax credit, unless construction began before July 5, 2026.

  Before: the production and investment credits covered any source with zero or negative greenhouse gas emissions, wind and solar included.
  After: wind and solar must start construction before July 5, 2026 or be producing power before Jan. 1, 2028. Other zero-emission sources keep full credits if construction begins before 2034. The wind parts credit ends for parts sold after 2027.

  For: the U.S. House of Representatives Ways and Means Committee majority said the tax code shouldn't favor some energy projects over others; Sen. Mike Lee (R-UT) said the energy title cuts wasteful spending. Against: Sen. Ron Wyden (D-OR) called it "a death sentence for the wind and solar industries"; Ways and Means Democrats said it makes the credits "unworkable."

  Which side convinces you?
