caption: |-
  Asked a Texas government for records and got nothing? You can already send a written complaint to the Texas attorney general. The law sets no deadline for an answer. The attorney general runs a hotline, but no law requires it.

  HB 1277, filed in the Texas House of Representatives for the 2027 session, would put that complaint into law. The government would answer the attorney general's questions within 5 business days, and the attorney general would reply in writing to both sides within 20 business days. A toll-free hotline would be required by law.

  On overcharges for copies, the government's time to answer drops from 10 business days to 5, and the attorney general would decide within 10. Your right to sue doesn't change.

  No cost estimate is posted yet. If passed as filed, it takes effect Sept. 1, 2027.

  Should the state have a deadline to answer?

