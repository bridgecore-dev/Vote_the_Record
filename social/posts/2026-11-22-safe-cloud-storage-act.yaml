notes: >-
  New: the Senate passed H.R. 7834 without amendment by unanimous consent on Nov. 16 (GovInfo bill status, CR S5701;
  the Clerk's Nov. 17 floor log records the Senate's message), so it has cleared Congress; no post covers it. Not yet
  presented to the President as of the Nov. 17 bill status; if it is signed or vetoed before Nov. 22, update the last
  slide or delete this file. The only CRS summary is the reported version; the House passed an amended text, so the
  slides follow the engrossed text (it adds "cloud service provider", Tribal agencies, intimate images of minors
  including digital forgeries, the U.S.-location rule and the 30-day Justice Department notice). The "few vendors" and
  "thumb drives" lines restate H. Rept. 119-804; the report has no minority or dissenting views, so there is no
  official case against to quote. CBO: requested but not received, per the report; congress.gov refused this run
  (403) and cbo.gov wasn't tried. Sponsor named without party: there is no roll call. Fills the Nov. 22 3 p.m. post
  slot (Nov. 18-21 feed slots are full).
