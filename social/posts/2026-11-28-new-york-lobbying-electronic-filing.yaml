notes: >-
  An official action from Nov. 20 (nyassembly.gov actions, read 2026-11-23: "11/13/2026 delivered to governor",
  "11/20/2026 signed chap.379"). Found through Open States' action feed (a tip only, not a source). No post or open
  pull request covers A2330. Rule: picked from the Nov. 20 signings because it changes what the public can see about
  lobbying; a Chapter 380 post (school board seats) is in a separate pull request. Everything is from the one Assembly
  page: the memo (purpose, "many lobbyists and clients file ... via paper", "approximately one thousand paper lobbying
  filings each year", entered "by hand", "not public until they are entered", the "immediately upon submission"
  quote, fiscal "None.", effective "thirtieth day after it shall have become a law") and the text (sec. 1, new
  Legislative Law 1-u, quoted exactly; it renumbers the old 1-u and 1-v as 1-v and 1-w). By our count the 30th day
  after Nov. 20 is Dec. 20, 2026, which is not on a slide; please confirm if you want it added. "The groups that hire
  them" is our plain word for the memo's "clients". "Filers who used paper now have to file online" follows from the
  text; no source states a cost to filers or an argument against. The Senate tally isn't on the Assembly page
  (nysenate.gov served a bot challenge on an earlier run, not retried), so the Senate line gives only the date
  (substituted for S5843, not named: one bill per post). No party is shown; the Assembly record doesn't list it. Names
  the chapter, not the Assembly number, as in the other New York posts. Takes Nov. 28 9:00 a.m., the first free post
  slot that keeps the day's Reel/post turn (after the Nov. 28 6:00 a.m. Reel), so no post is bumped.
