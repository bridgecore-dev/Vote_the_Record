caption: |-
  Every lobbying filing in New York must now be sent online. It was signed Nov. 20, 2026 as Chapter 379 of the Laws of 2026 and takes effect on the 30th day after it became law.

  Before: most lobbyists and their clients already filed online, but the state's Commission on Ethics and Lobbying in Government still got about 1,000 paper filings a year. Staff typed them in by hand, and they weren't public until then, the sponsor's memo says.
  Now: "All statements and reports" under the lobbying law go through the commission's online filing system.

  For: the memo says online filings "are available to the public immediately upon submission," and lists the cost to governments as "None." Filers who used paper have to switch; the memo doesn't say what that costs them. We found no statement against it.

  The New York State Assembly passed it 146-0 on March 4, 2026, and the New York State Senate passed it March 16, 2026.

  Would you look up who is lobbying your state lawmakers?
