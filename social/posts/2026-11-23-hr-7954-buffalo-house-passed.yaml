bills:
- id: H.R. 7954
  title: Don Young Doug LaMalfa Indian Buffalo Management Act
  does: "Would have the Interior Dept. give tribes contracts, grants and help to restore and manage buffalo, for 7 years."
  affects: "Indian tribes and tribal groups with buffalo experience, and surplus buffalo on Interior land."
  where: "Passed the U.S. House of Representatives by voice vote on Nov. 17, 2026. Next: the U.S. Senate."
  summary:
    text: >-
      This bill directs the Department of the Interior to work with Indian Tribes and tribal organizations to
      develop and promote tribal ownership and management of buffalo and buffalo habitat on Indian lands.
    title: Congressional Research Service summary of H.R. 7954
    url: https://api.congress.gov/v3/bill/119/hr/7954/summaries
