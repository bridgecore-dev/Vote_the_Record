  say: "H.R. 7954, the Don Young Doug LaMalfa Indian Buffalo Management Act, would have the Interior Department give tribes contracts, grants and help to restore and manage buffalo, for 7 years. It passed the United States House by voice vote. Next is the United States Senate."
