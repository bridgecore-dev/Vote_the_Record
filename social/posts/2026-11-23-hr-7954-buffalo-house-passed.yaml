notes: >-
  New event: the Clerk's Nov. 17 floor log and congress.gov actions both record "On motion to suspend the rules and
  pass the bill Agreed to by voice vote" (4:16:43 p.m.). Follows the Nov. 16 schedule Reel
  (2026-11-16-indian-buffalo-management-act). The bill passed without "as amended", so the reported text is the
  passed text. Before/after: the Intertribal Buffalo Council facts are from H. Rept. 119-856; "on their own" restates
  the report's "Tribes have been instrumental in facilitating buffalo's successful return". Waiver (sec. 7(c)),
  no-diminishment of laws on diseased or escaped buffalo (sec. 4(b)(2)) and the 7-year sunset (sec. 9) are from the
  bill text, which has no authorization of appropriations. Cosponsors (8 R, 7 D, none withdrawn) and Hurd's party and
  state from congress.gov. The report has no minority views, so there is no official case against to quote. If the
  U.S. Senate acts before Nov. 23, update `where` and the last slide.
