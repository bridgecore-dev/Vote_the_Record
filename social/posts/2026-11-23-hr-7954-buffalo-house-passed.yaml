caption: |-
  On Nov. 17 the U.S. House of Representatives passed H.R. 7954 by voice vote, so there is no list of how each member voted.

  Before: tribes rebuild buffalo herds themselves and through the Intertribal Buffalo Council, which the House committee report says has 90 tribes in 23 states. After: for seven years, the Interior Department must offer tribes and tribal groups contracts, grants and technical help, consult them on plans that affect buffalo (including sick herds), and may send surplus buffalo from its land to tribes, waiving its charges.

  The bill names no dollar amount. The committee asked CBO for a cost estimate and had not received it. Federal and state rules on sick or escaped buffalo stay in place.

  Next it goes to the U.S. Senate. Should Interior take this on?

  Voice: computer-generated (Kokoro text-to-speech).
