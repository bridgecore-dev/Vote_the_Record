caption: |-
  The Massachusetts Senate passed S.3307 on Nov. 25, 2026. It would let students, parents and school staff carry and use sunscreen on school property and at school events without a doctor's note or prescription, as long as the FDA regulates the product for over-the-counter use.

  Before: Chapter 71, Section 54B has the state health department set the rules for giving medications in schools, and names prescription items students may carry (inhalers, epinephrine, enzyme supplements, insulin). It doesn't mention sunscreen. After: sunscreen is not treated as an over-the-counter medication under that section, and no note is needed. School staff would not have to help students apply it. Schools may teach students about sun safety. The bill sets aside no state money.

  Sen. Julian Cyr filed the original version in 2025. The Joint Committee on Education voted 6-0 for it, and the Senate Rules Committee wrote this new draft. Next: the Massachusetts House of Representatives.

  Should students need a note to bring sunscreen to school?
