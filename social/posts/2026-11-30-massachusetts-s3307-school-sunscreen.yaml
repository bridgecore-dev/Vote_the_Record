  fiscal note was found. The "before" is only what 54B says; DPH's school medication rules (105 CMR 210) may already
  address over-the-counter products, but mass.gov returned 403, so they weren't checked and no slide says what they
  require: please check. The history lists no roll call for the Senate passage. No party is shown (the records
  opened don't list it). The Senate's new draft is titled "An Act promoting access to sunscreen in schools" on the bill
  page, though the committee's cover page calls it "An Act relative to youth skin health". Massachusetts has no
  Highlight yet; one could be added.
