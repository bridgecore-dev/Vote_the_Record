notes: >-
  New this run: the Clerk's Nov. 18 floor log (4:27 p.m.) says "The Senate passed H.R. 5254 and H.R. 8454";
  congress.gov actions (API, read 2026-11-19): "Passed Senate without amendment by Unanimous Consent.
  (consideration: CR S5709)" on Nov. 17, and "Message on Senate action sent to the House" Nov. 18. No
  presentment to the President is listed yet; if it is signed or vetoed before the slot, update the last slide,
  `where` and the caption, or delete this file. The Senate committee had ordered a substitute (July 29) but
  reported the bill without amendment (Sept. 17); the reported-in-Senate text matches the House engrossed text
  word for word (checked), and the Senate passed it without amendment. 2.4 million visitors, nearly 30 events,
  the permit/authority gap and the $780,000 projection are as H. Rept. 119-536 states them (the report cites
  NPS, the foundation and Sen. Schmitt's press release for them). CRS summary is of the reported (substitute)
  text, which is the passed text. Party and state for Bell, Wagner and Budzinski as congress.gov lists them.
  No opposing view was found in the record: the House committee approved it by unanimous consent and neither
  chamber recorded a vote, so the post doesn't invent a case against. Pairs with the 12:00 p.m. carousel
  (2026-11-24-hr-8454-ackerson-meadow-swap-cleared), filling the Nov. 24 10:30/12:00 pair.
