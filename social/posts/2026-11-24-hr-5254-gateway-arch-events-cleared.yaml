bills:
- id: H.R. 5254
  title: Gateway Partnership Act
  does: "Lets the Park Service sign one deal, up to 5 years, for the Gateway Arch's nonprofit partner to host private events."
  affects: "Gateway Arch National Park in St. Louis, Missouri, its visitors, and the Gateway Arch Park Foundation."
  where: "Passed the U.S. House of Representatives March 16; the U.S. Senate, unchanged, Nov. 17. Next: the President."
  summary:
    text: >-
      This bill authorizes the National Park Service (NPS) to enter into a one-time agreement with the Gateway
      Arch Park Foundation to host private events at the Gateway Arch National Park and its buildings for a
      period of up to five years.
    title: Congressional Research Service summary of H.R. 5254
    url: https://api.congress.gov/v3/bill/119/hr/5254/summaries
