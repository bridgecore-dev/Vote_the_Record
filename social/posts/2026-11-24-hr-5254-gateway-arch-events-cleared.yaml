caption: |-
  Congress has passed the Gateway Partnership Act. The U.S. Senate passed the House's bill without changes, by unanimous consent, on Nov. 17. The U.S. House of Representatives passed it by voice vote March 16.

  Before: the National Park Service can issue permits for special events at the Gateway Arch in St. Louis, but the House committee report says it lacks clear authority for a formal deal with the Gateway Arch Park Foundation.

  After: one agreement, up to 5 years, for the foundation to host private events in park buildings such as the Arch Visitor Center and the Old Courthouse. Events can't disrupt public use or access. The park must charge a fee for wear and tear and may recover all its costs. The report projects up to $780,000 a year in new revenue; no CBO estimate yet. The authority ends 7 years after it becomes law.

  Sponsor: Rep. Wesley Bell (D-MO). Next it goes to the President (status as of Nov. 19).

  Should national parks host private events?

  Voice: computer-generated (Kokoro text-to-speech).
