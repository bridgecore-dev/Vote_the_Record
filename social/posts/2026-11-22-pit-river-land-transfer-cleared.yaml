bills:
- id: H.R. 2400
  title: Pit River Land Transfer Act of 2026
  does: "Has the U.S. hold about 557 acres of Forest Service land in trust for the Pit River Tribe. No gaming allowed."
  affects: "The Pit River Tribe and the Forest Service land known as Four Corners, in Shasta County, California."
  where: "Cleared Congress Nov. 17, 2026, when the U.S. House of Representatives agreed to the Senate's changes."
  summary:
    text: >-
      This bill takes approximately 557 acres of specified federal land in Shasta County, California, into trust
      for the benefit of the Pit River Tribe. The land, known as the Four Corners Property, is currently
      administered and managed by the Forest Service.
    title: Congressional Research Service summary of H.R. 2400 (as passed by the U.S. Senate)
    url: https://api.congress.gov/v3/bill/119/hr/2400/summaries
    retrieved: '2026-11-17'
