caption: |-
  Congress has passed the Pit River Land Transfer Act. On Nov. 17 the U.S. House of Representatives agreed, by voice vote, to the version the U.S. Senate passed in September.

  Before: the Forest Service runs about 557 acres in Shasta County, California, known as Four Corners. After: the U.S. would hold the land in trust for the Pit River Tribe, as part of its reservation, with no gaming. About 87 acres of roads, highways and rights-of-way are left out. The Senate report says the CBO estimate wasn't in yet.

  Next it goes to the President (status as of Nov. 17).

  Should Congress move federal land this way?
