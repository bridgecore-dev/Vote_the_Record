caption: |-
  Congress has sent the President H.R. 10159. It was presented on Nov. 20.

  Before: about 20 acres on the Fort Bragg Training Area in Harnett County, North Carolina, belong to the Army. After: the Army may give the land to North Carolina, at no price, to build a State home for veterans. North Carolina pays the costs of the transfer. If the land isn't used for a State home, the Army may take it back.

  The sponsor, Rep. Richard Hudson (R-NC), said the State veterans home in Fayetteville closed in 2024. No member spoke against the bill, and neither chamber took a recorded vote.

  Should Congress give federal land to states for veterans' care?
