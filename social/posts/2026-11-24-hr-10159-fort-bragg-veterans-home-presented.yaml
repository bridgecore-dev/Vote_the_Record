bills:
- id: H.R. 10159
  does: "Lets the Army give North Carolina about 20 acres of Fort Bragg, at no price, to build a State home for veterans."
  affects: "North Carolina, its Department of Military and Veterans Affairs, and the veterans a State home serves."
  where: "Passed both chambers with no recorded vote; presented to the President Nov. 20, 2026."
  summary:
    text: >-
      Specifically, the bill authorizes the conveyance of a 20-acre parcel of land situated on the Fort Bragg
      Training Area in Harnett County, North Carolina, that is commonly referred to as Parcel 3B. The State of
      North Carolina must cover all costs to carry out the conveyance.
    title: Congressional Research Service summary of H.R. 10159
    url: https://api.congress.gov/v3/bill/119/hr/10159/summaries
    retrieved: '2026-11-21'
