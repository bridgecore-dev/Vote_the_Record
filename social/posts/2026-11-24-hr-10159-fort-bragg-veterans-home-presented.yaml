notes: >-
  New this run: congress.gov actions (API, read 2026-11-21) list "Presented to President." on Nov. 20, 2026; no
  post or open pull request covers H.R. 10159. House passage (voice vote, Sept. 14, CR H5544) and Senate passage
  (without amendment by unanimous consent, Sept. 29) are from the same actions, so the enrolled text is the House
  text; land, price, costs, reverter and "additional terms" are from the enrolled bill on GovInfo. The State home
  definition is quoted from the CRS summary (it paraphrases 38 U.S.C. 101). No CBO estimate or committee report is
  listed on the bill record. The Fayetteville quote is Rep. Hudson's own words in the Sept. 14 Record; the only
  other speakers (Harrigan, Bell) supported it, so there is no official case against to quote. Cosponsors (9 R,
  4 D, districts 1-8 and 10-14) and Hudson's party and state are as congress.gov lists them. News-first: takes the
  Nov. 24 3:00 p.m. post slot from the evergreen prefiled-bill post on HB 1195/HB 178, moved to Dec. 8 3:00 a.m.
  If the President signs or vetoes it before the slot, update the last slide and `where`.
