caption: |-
  New York will post candidates' financial disclosures online. Candidates for statewide office and for the New York State Legislature already have to file a yearly financial disclosure statement. Starting Jan. 1, 2027, the state's Commission on Ethics and Lobbying in Government must post those forms on its website within 30 days of getting them. It was signed Nov. 20, 2026 as Chapter 378 of the Laws of 2026.

  Before: officeholders' forms were posted, but to see a candidate's, a member of the public had to file a Freedom of Information Law (FOIL) request, the sponsor's memo says.
  Now: the commission posts candidates' forms too.

  The law also counts domestic partners as a "relative" on the form, drops out-of-date questions, and changes the digital assets grid to match its question.

  For: the memo says voters should know about candidates' "conflicts and potential conflicts of interest" before the election, especially with an earlier primary schedule. It lists the cost to governments as none. We found no statement against it.

  The New York State Assembly passed it 141-0 on May 19, 2026, and the New York State Senate passed it June 2, 2026.

  Would you read a candidate's financial disclosure before you vote?
