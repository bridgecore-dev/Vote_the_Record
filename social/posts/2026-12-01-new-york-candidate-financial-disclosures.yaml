notes: >-
  An official action from Nov. 20 (nyassembly.gov actions, read 2026-11-23: "11/13/2026 delivered to governor",
  "11/20/2026 signed chap.378"). Found through Open States' action feed (a tip only, not a source). No post or open
  pull request covers A463. Takes Dec. 1 3:00 a.m., the first free post slot that keeps each day's Reel/post turn (Dec.
  1 starts with the 12:00 a.m. Reel; the free Nov. 28-30 post slots would each follow a post with no Reel between), so
  no post is bumped; the law takes effect Jan. 1, 2027, so the date is still ahead of readers. Everything is from the
  one Assembly page: the memo (purpose, FOIL, JCOPE/COELIG posting, "conflicts and potential conflicts", the primary
  schedule quote, sections 3-5, fiscal implications "None.", effective "January first next succeeding the date on which
  it shall become law" = Jan. 1, 2027), the text (sec. 1, Public Officers Law 73-a(2)(k): posting "within thirty days
  of its receipt"; sec. 2, Executive Law 94(13)(b)(i): the quoted new words), the actions and the Assembly floor vote
  (141/0, May 19, 2026). The page's text view drops the underscoring, so "new words" rests on the memo's section 2
  description ("to require the posting of candidate forms"); please confirm against the PDF. "Officeholders' forms
  were posted" is the memo's ("posted publicly on the JCOPE website"; JCOPE was COELIG's predecessor, which the memo
  doesn't say, so no slide says it). "A yearly form on a person's money and ties" is our plain wording for the "annual
  statement of financial disclosure"; please confirm or cut. The Senate tally isn't on the Assembly page (nysenate.gov
  served a bot challenge, not retried), so the Senate line gives only the date (substituted for S4857C, not named:
  one bill per post). No party is shown; the Assembly record doesn't list it. The slides name the chapter, not the
  Assembly number, as in the other New York posts.
