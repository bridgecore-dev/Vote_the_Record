- kicker: U.S. Senate · Calendar
  big: Nov. 23-27
  head: The Senate's tentative schedule lists Nov. 23-27 as days it expects not to be in session.
  text: Thanksgiving week. Its floor schedule set the next meeting before that for Monday, Nov. 16, at 3:00 p.m.
  quote: {label: Senate tentative schedule, text: "Nov 23 - Nov 27 State Work Period Thanksgiving - Nov 26"}
- kicker: What the Senate does
  head: The president nominates all federal judges. The Senate gives its "advice and consent."
  quote: {label: Senate page About Nominations, text: "The United States Constitution provides that the president \"shall nominate, and by and with the Advice and Consent of the Senate, shall appoint Ambassadors, other public Ministers and Consuls, Judges of the Supreme Court, and all other Officers of the United States, whose Appointments are not herein otherwise provided for.\""}
- kicker: Watch it yourself
  head: You can watch the Senate floor yourself on senate.gov.
  text: "Go to Floor Proceedings, then Floor Webcast. You can search and watch past sessions too."
  quote: {label: senate.gov, text: "Search and watch previous proceedings from present to the 112th Congress, 2nd session."}
caption: |-
  The Senate is back Nov. 16. Its tentative schedule then lists Nov. 23-27, Thanksgiving week, as a state work period: days it expects not to be in session.

  The president nominates all federal judges, and under the Constitution the Senate gives its "advice and consent." You can watch Senate floor proceedings on senate.gov, under Floor Proceedings, then Floor Webcast.
