slides:
- kicker: New Jersey · New law, Nov. 20, 2026
  big: Held until trial
  head: Break a sexual assault, stalking or cyber-harassment protective order in New Jersey, and prosecutors can now ask a judge to hold you in jail until trial.
  text: The new law is P.L.2026, c.109. It took effect right away.
- chip: Two kinds of orders
  head: New Jersey has two main kinds of court orders that keep someone away from a victim.
  rows:
  - [Domestic violence restraining order, "Under the Prevention of Domestic Violence Act of 1991"]
  - [VASPA protective order, "For victims of sexual assault, lewdness, stalking or cyber-harassment who can't get a domestic violence order"]
  quote: {label: "P.L.2023, c.127, sec. 2", text: "or stalking or cyber-harassment, and who is not eligible for a restraining order as a victim of domestic violence"}
- chip: Same crime
  head: Breaking either order is treated the same way.
  rows:
  - [Fourth-degree crime, "If what the person did could also be a crime or offense"]
  - [Disorderly persons offense, "In all other cases"]
- chip: Before → after
  head: Only one of the two could lead to a request for pretrial detention, jail before a trial.
  rows:
  - [Before, "Prosecutors could ask for it for breaking a domestic violence order. The law didn't expressly allow it for a VASPA order."]
  - [After, "They can ask for it for both."]
  quote: {label: Senate Judiciary Committee statement, text: "This bill expands C.2A:162-19 to permit a prosecutor to make a motion for pretrial detention for a violation of an order entered under the provisions of VASPA."}
- chip: Who decides
  head: Asking isn't holding. A judge decides after a hearing.
  rows:
  - [The test, "Clear and convincing evidence that no bail or conditions would make sure the person comes to court, others stay safe, and justice isn't obstructed"]
  - [The person's rights, "A lawyer (appointed if they can't afford one), to testify, and to call and question witnesses"]
  - [Appeal, "Heard quickly; the person stays held while it's decided"]
- chip: Who gains, who loses
  head: Victims with a VASPA order get a tool domestic violence victims already had. People charged can be held before any conviction.
  rows:
  - [People with VASPA orders, "Prosecutors can now ask to keep the person charged with breaking it in jail until trial"]
  - [People charged, "Can face a detention hearing and be held before trial, while still presumed innocent"]
- chip: What it costs
  head: No dollar figure was written for this law.
  quote: {label: Assembly Appropriations Committee, text: "This bill is not certified as requiring a fiscal note."}
- chip: The votes
  head: No member of either chamber voted no.
  rows:
  - [New Jersey General Assembly, "79-0-0, June 11, 2026"]
  - [New Jersey Senate, "39-0, Oct. 22, 2026"]
  by: "Primary sponsors: Assembly members Macurdy, Peterpaul, Sweeney; Sens. Diegnan, Corrado"
- chip: Your turn
  head: Should breaking any protective order carry the same risk of jail before trial?
  text: The records we opened give no argument for or against. Which side convinces you?
caption: |-
  New Jersey prosecutors can now ask a judge to hold someone in jail until trial for breaking a VASPA protective order. The law, P.L.2026, c.109, was approved Nov. 20, 2026 and took effect right away.

  VASPA orders protect victims of sexual assault, lewdness, stalking or cyber-harassment who can't get a domestic violence restraining order.

  Before: breaking either kind of order was the same crime, but only a domestic violence order was expressly listed for a pretrial detention request.
  Now: both are.

  A judge still decides, after a hearing. Detention needs clear and convincing evidence that no bail or conditions would be enough. The person has a lawyer, can testify and call witnesses, and can appeal.

  Cost: the committee says no fiscal note was required. The New Jersey General Assembly passed it 79-0-0 and the New Jersey Senate 39-0.

  Should breaking any protective order carry the same risk? Which side convinces you?
