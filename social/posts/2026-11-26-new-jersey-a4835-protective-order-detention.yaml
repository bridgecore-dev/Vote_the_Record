notes: >-
  News-first: an official action from the last three days (the Legislature's own api/billDetail/billHistory/A4835/2026
  feed, read 2026-11-22: "11/20/2026 Approved P.L.2026, c.109."). Found through Open States' action feed (a tip only,
  not a source). Takes Nov. 26 9:00 a.m., the earliest carousel slot held by an evergreen post (Nov. 22-25 carousels
  are news from Nov. 16-20; Nov. 26 3:00 a.m. is the S1270 news post); this pull request moves the prefiled Texas SB
  444 post to Dec. 13 3:00 a.m. (first post slot after the last queued post that keeps the Reel/post turn). The bill
  was substituted for an identical Senate bill, which isn't named (one bill per post). The first reprint (1R) is the
  version both houses passed (history: Assembly amendments June 8, passed 79-0-0 June 11; Senate committee reported it
  without amendments, passed 39-0 Oct. 22). HTML sha256 600fc35ec8a3c7636e3b86eef18313568a906c7c6d41d35d814a99d14909d805.
  "Two kinds of orders": VASPA scope is from P.L.2023, c.127, sec. 2 (2C:14-14), which added stalking and
  cyber-harassment to the 2015 act's nonconsensual sexual contact, sexual penetration and lewdness; "sexual assault" on
  the slides stands for "nonconsensual sexual contact, sexual penetration" (check the wording). Penalty and before/after
  are from all three committee statements. Hearing rules (clear and convincing evidence, counsel, testify, witnesses,
  expedited appeal while detained) are from C.2A:162-18 and -19 as printed in the 1R text. "Still presumed innocent" is
  our words for "before trial"; check it. The bill text lists sponsors by district, not party, so no party is shown
  (same as the S1270 post). No floor statements or testimony were opened and no official case for or against was
  found. The builder's bill-number check doesn't accept New Jersey's "A" numbers, so the slides name the law by its
  chapter (P.L.2026, c.109) instead of A4835, with what it does, who it affects and where it stands on the slides.
  njcourts.gov returned 403 for its VASPA brochure; not retried. P.L. chapter text isn't on pub.njleg yet.
