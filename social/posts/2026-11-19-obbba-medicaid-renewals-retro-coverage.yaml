notes: >-
  The CBO sec. 71107 figure (-$62.53 billion) was taken off the slides and caption: CRS's table text is scrambled, so confirm it against the PDF before adding it back.
  Part of the "One Big Beautiful Bill Act: what changes in 2027" series, the owner's request (2026-11-15). No case
  for/against slide: the fact sheet found no named official speaker on 6-month renewals or retroactive coverage, and
  the Medicaid quotes it has (Sen. Barrasso, Sen. Hirono, July 30, 2025) are about work requirements and work
  reporting, not eligibility renewals or back coverage, so they don't fit here; add a pair if one turns up in the
  Record. Please double-check: (1) CBO's figure for sec. 71112 is left out: in CRS R48633 Table A-1 the text layout is
  scrambled and the sheet's -$4,206 million may belong to sec. 71111 (the outlays printed nearby are -$4,206, $53 and
  -$13,629 million). The sec. 71107 figure (-$62,530 million outlays) sits in reading order between 71106 (-$7,550)
  and 71108 (-$195), so it's used, but confirm against the PDF (pp. 38-44) or CBO's table (cbo.gov returned 403, not
  retried). (2) CRS R48633's text bullet for sec. 71112 says "all other" applicants are "also limited to the month
  before"; the law text (sec. 71112(a)-(b)) and CRS's own Table A-1 say two months, so the slides follow the law.
  (3) Whether these apply in Texas turns on Medicaid expansion and wasn't confirmed, so Texas isn't named; the
  6-month rule applies only to the expansion group (law: new 1902(e)(14)(L)), while the shorter back coverage
  applies to all Medicaid and CHIP applicants. (4) CMS's SMD letter (03/06/2026) and slide deck on renewals weren't
  read (medicaid.gov blocked). (5) The HealthCare.gov page is linked, not quoted: its wording came through a fetch
  tool and wasn't confirmed. (6) "7.5 million more uninsured in 2034" is for all of the law's Medicaid provisions
  together (CRS R48633 summary), labeled that way. The "what you can do" rows are plain advice drawn from the two
  sections' dates and windows. Not a Reel, so no voice.
  Audit 2026-11-16: added a case for and against from H. Rept. 119-106 (Energy and Commerce majority and minority
  views on House secs. 44108/44122), quotes as supplied word for word by the workflows session from the govinfo pt1
  HTML; both confirmed word for word against the full report (3.18 MB copy), and "Frank Pallone, Jr., Ranking
  Member" signs the Minority Views.
