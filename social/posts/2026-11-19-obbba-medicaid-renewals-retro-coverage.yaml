bills:
- id: H.R. 1
  title: One Big Beautiful Bill Act
  does: "Among many changes, it moves Medicaid renewals for expansion adults to every 6 months and shortens coverage for care before applying."
  affects: "Adults in Medicaid's expansion group, and other Medicaid and CHIP applicants who got care before they applied."
  where: "Signed into law July 4, 2025, as Public Law 119-21. Both changes start Jan. 1, 2027."
  summary:
    text: >-
      Beginning January 1, 2027, Section 71107 requires the 50 states and DC to increase the frequency of eligibility
      redeterminations from once every 12 months to once every 6 months for individuals enrolled in Medicaid through
      the ACA Medicaid expansion pathway
