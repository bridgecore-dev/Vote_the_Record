caption: |-
  One Big Beautiful Bill Act: what changes in 2027.

  Renewals. Before: Medicaid eligibility is renewed once every 12 months. After, for renewals from Jan. 1, 2027: every 6 months for adults in the expansion group. American Indians and Alaska Natives are exempt.

  Back coverage. Before: Medicaid can pay for care up to 3 months before the month you apply, if you'd have qualified then. After, for applications from Jan. 1, 2027: 1 month for expansion adults, 2 months for everyone else, and no more than 2 for CHIP.

  The law's name for the back-coverage section: "Reducing State Medicaid costs."

  For, from the House Energy and Commerce majority: the back-coverage change would "reduce unexpected costs for the federal government and state programs." Against, from the committee's minority: more frequent checks "would decimate health coverage gains." Both were written about the House version, which differed from the final law.

  On Medicaid? Keep your address current with your state agency, and apply as soon as you need care.

  Check if you qualify: healthcare.gov/medicaid-chip/getting-medicaid-chip
