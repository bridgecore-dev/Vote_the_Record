notes: >-
  News first: a dated event in the next three days (the U.S. House's week of Nov. 30 starts Monday; docs.house.gov, last
  updated Nov. 27, lists S. 4631 under suspension). No post or open pull request covers S. 4631. Takes Nov. 30 3:00
  a.m., the earliest post slot at least 3 hours away held by an evergreen post: every earlier post slot holds news (this
  week's House schedule, the Nov. 23-24 signings) or the hemp post tied to Dec. 11; the Nov. 29 3:00 a.m. slot is taken
  by the H.R. 2332 post in its own pull request (#333). The New Jersey S1420 post (approved Nov. 20, more than a week ago
  by Nov. 30) moves to Dec. 28 3:00 a.m., the first post slot after the last queued post (Dec. 27, counting #333), which
  keeps the Reel/post turn. Records opened 2026-11-28: the floor list, the House amendment as scheduled (S4631_SUS,
  "Suspend the Rules and Pass the Bill, S. 4631, With an Amendment", dated Nov. 20, 2026; sha256
  aa1c7c0db195f1b6756c9d2e2c31c58d2db300fa6b2e8305fa0a669988ecd5a8), congress.gov actions (introduced and passed by
  unanimous consent May 21, 2026, CR S2452-2454, not opened; held at the desk in the House), sponsor and cosponsor as
  congress.gov lists them, the CRS summary (which says it is based on the House draft text), and 41 U.S.C. 4712 in the
  2024 Code ((a)(1) protected disclosures, (a)(2) who can receive them, (a)(3)(B) the "non-discretionary directive"
  exception, (c)(7) "may not be waived by any agreement, policy, form, or condition of employment"). The DOD/NASA section
  (10 U.S.C. 4701) gets the same changes per the bill's sec. 2; 10 U.S.C. 4701 itself wasn't opened, so the slides
  describe today's law from 41 U.S.C. 4712. "Would be named as covered" for state, local and tribal governments follows
  the bill's new "protected individual" definition; whether today's law already reaches them wasn't checked, so the
  slides don't say it doesn't. The bill also adds "forum" to the non-waivable rights; not on a slide. "Would vote again"
  is our reading of the House amending a Senate bill; please check that wording. No CBO estimate is listed on
  congress.gov (cbo.gov not tried). No statement for or against was opened; the Senate passed it without objection, so
  there is no case-against slide; the post asks. If the House votes before this posts, the last slide needs the tally.
