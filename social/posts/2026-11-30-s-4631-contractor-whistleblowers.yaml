bills:
- id: S. 4631
  title: Expanding Whistleblower Protections for Contractors Act of 2026
  does: Would protect contractor and grantee workers who refuse an order to break a contract or grant law, and bar waiving it in arbitration.
  affects: Workers for federal contractors and grant recipients, including state, local and tribal governments.
  where: "Passed the Senate by unanimous consent May 21, 2026. On the House schedule, with changes, week of Nov. 30."
  summary:
    text: >-
      This bill expands whistleblower protections for employees of federal contractors and grant recipients to include
      the act of refusing to obey an unlawful order and to apply these protections to other governmental employees.
    title: Congressional Research Service summary of S. 4631
    url: https://api.congress.gov/v3/bill/119/s/4631/summaries
    retrieved: '2026-11-28'
slides:
- kicker: "U.S. House · Week of Nov. 30"
  big: S. 4631
  head: A bill on the U.S. House of Representatives schedule would protect contractor workers who refuse an order to break the law.
  text: "It covers people who work for companies, groups and governments paid through federal contracts and grants."
- chip: The law today
  head: "A contractor or grantee can't fire, demote or punish a worker for reporting what the worker reasonably believes is:"
  rows:
  - [Waste, "Gross mismanagement or gross waste of federal money"]
  - [Abuse, "Abuse of authority on a contract or grant"]
  - [Danger, "A substantial and specific danger to health or safety"]
  - [Law, "A violation of a law tied to a contract or grant"]
  text: "Reports to Congress, an inspector general and others count (41 U.S.C. 4712; 10 U.S.C. 4701 for Defense and NASA)."
- chip: What S. 4631 adds
  head: "Four changes for contractor and grantee workers:"
  rows:
  - [Refusing, "Saying no to an order that would break a contract or grant law"]
  - [Who, "Includes state, local and tribal governments paid by contracts or grants"]
  - [Arbitration, "The rights can't be waived, even by a predispute arbitration agreement"]
  - [Officials, "Agencies could propose discipline for an official who asks for a reprisal"]
- chip: Before → after
  head: "Today a reprisal is banned even if a federal official asks for it, unless it's a \"non-discretionary directive\" within that official's authority."
  quote: {label: "S. 4631, House amendment", text: "it shall not be within the authority of an executive branch official to request that a contractor, subcontractor, grantee, or subgrantee engage in a reprisal"}
- chip: "Who it touches, what it costs"
  head: Workers gain protection for refusing; employers and officials lose room to punish them for it.
  rows:
  - [Workers, "Protected for refusing, not only for reporting"]
  - [Employers, "Can't use an arbitration clause to give up these rights"]
  - [Cost, "Congress.gov lists no CBO estimate"]
- chip: Where it stands
  head: "Sponsor: Sen. Gary Peters (D-MI), with Sen. Chuck Grassley (R-IA). The U.S. Senate passed it by unanimous consent May 21, 2026."
  text: "The House lists it under suspension of the rules, a fast track that needs two-thirds, with its own changes, so the Senate would vote again. Should refusing an unlawful order be protected like reporting one?"
caption: |-
  If you work for a company, nonprofit or local government paid through a federal contract or grant, the law protects you from being fired for reporting waste, abuse or a broken contract law. S. 4631, the Expanding Whistleblower Protections for Contractors Act, is on the U.S. House of Representatives schedule the week of Nov. 30.

  Before: the protection covers reporting, not refusing.

  After: refusing an order that would break a contract or grant law would be protected too. State, local and tribal governments paid this way would be named as covered. Arbitration agreements signed in advance couldn't waive the rights, and agencies could propose discipline for an official who asks for a reprisal.

  Congress.gov lists no CBO estimate. The U.S. Senate passed it by unanimous consent; the House version has changes, so the Senate would vote again.

  Should refusing an unlawful order be protected like reporting one?
