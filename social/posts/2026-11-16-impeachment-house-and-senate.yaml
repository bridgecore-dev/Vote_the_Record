caption: |-
  Impeachment has two steps, in two chambers.

  The House impeaches by adopting articles of impeachment, by simple majority. The Constitution gives it "the sole Power of Impeachment." Impeachment is a set of charges, not a conviction.

  The Senate holds the trial. No one is convicted "without the Concurrence of two thirds of the Members present." When the president is tried, the Chief Justice presides. Conviction removes the official from office; barring them from future office takes a separate majority vote.

  The House has impeached presidents four times: Andrew Johnson (1868), William J. Clinton (1998), and Donald J. Trump (2019 and 2021). The Senate acquitted each time. Per the Senate, about half of all its impeachment trials since 1789 ended in conviction and removal.

  Part 2 of 2. Part 1: Rep. Al Green's plan to force a House vote, and how the last one went.

  Should the House impeach if it is not clear the Senate would convict?
