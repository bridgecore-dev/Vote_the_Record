caption: |-
  The IRS has published the 2027 amounts for the tax cuts the One Big Beautiful Bill Act made permanent. They apply to tax year 2027, on returns filed in 2028.

  Before: the 2017 law's higher standard deduction and $2,000 child tax credit were set to end after 2025. After: permanent, adjusted for inflation each year.

  2027, per the IRS:
  Standard deduction: $33,200 married filing jointly (up $1,000 from 2026), $16,600 single, $24,925 head of household.
  Child tax credit: up to $2,300 per child (up $100), with up to $1,800 refundable.
  Estate exclusion: $15,480,000, up from $15,000,000.

  The tips, overtime, car-loan interest and $6,000 senior deductions stay the same in 2027 and end after 2028.

  For: Rep. Langworthy (R-NY). Against: Rep. McGovern (D-MA). Their words are on the slides.
