notes: >-
  Part of the "One Big Beautiful Bill Act: what changes in 2027" series, the owner's request (2026-11-15). Check:
  (1) All 2027 figures are from IR-2026-133 (Nov. 5, 2026), re-opened 2026-11-15; Rev. Proc. 2026-35 has the same
  numbers. IRS calls the law the "Working Families Tax Cuts" now; same law. (2) "Before" values: only what the
  sheet gives from IRS ("up $1,000 from 2026", "up $100 from 2026", estate "$15,000,000" for 2026). The IRS
  individuals page (re-opened; it redirected to working-families-tax-cuts-individuals-and-workers) shows 2026
  amounts ($32,200 joint, $16,100 single) and IR-2026-133 gives the 2026 gift exclusion ($19,000); I left those
  out per the brief, but they could be added. (3) SALT 2027 cap/threshold ($40,804 / $510,050) left out: my
  arithmetic from the statute, not published by IRS. (4) No official cost or distribution figure: CBO (captcha)
  and JCT (blocked) weren't used, and the slide says so plainly; McGovern's "$3 trillion" and Langworthy's claims
  are their own words. (5) Quotes are from the July 2, 2025 House debate on the rule for the final vote, Cong.
  Rec. H3043; party/state from House roll 190's member list. (6) The senior deduction's
  "65 and older" comes from the IRS individuals page ("individuals age 65 and older may claim an additional $6,000
  deduction", "Effective 2025 through 2028").
  Audit 2026-11-16: Seniors row now includes the phase-out, from P.L. 119-21 sec. 70103 (new IRC 151(d)(5)(C)(iii)):
  "reduced (but not below zero) by 6 percent of so much of the taxpayer's modified adjusted gross income as exceeds
  $75,000 ($150,000 in the case of a joint return)", confirmed by the workflows session against the full law text.
