notes: >-
  News first: a dated event in the next three days (the U.S. House's week of Nov. 30 starts Monday; docs.house.gov lists
  H.R. 3100 under suspension "as amended"). Post slots before it hold news (this week's signings and House-schedule
  posts) or the Nov. 28 3:00 p.m. hemp post, which is tied to Dec. 11 and can't move past it, so nothing is bumped; it
  takes Nov. 29 9:00 a.m., the first free post slot (after the 6:00 a.m. S. 4850 Reel in its own pull request). No post
  or open pull request covers H.R. 3100. Records opened 2026-11-27: the floor list, the scheduled text (H3100_RH, the
  reported text; sha256 8be854abfa27b7b9f92e519eff08daadce8cb02dff2246c5a2e6456d8eb4f0f3; it matches the amendment printed
  in the report), congress.gov actions (ordered reported 23-0 July 15, 2026; reported Nov. 5, H. Rept. 119-873), sponsor
  and cosponsors (Moskowitz D-FL, Lee R-FL, Schmidt R-KS, Nehls R-TX; none withdrawn), the CRS summary (reported
  version), H. Rept. 119-873 (background, the 2018 quote, "Changes in Existing Law" showing 40104(9)(B)(i)-(ii) today, the
  23-0 committee vote, and "requested but not received" a CBO estimate), and House Practice ch. 53 (two-thirds). The
  fingerprints/signed statement and appeal lines are the report's description of 34 U.S.C. 40102 (the statute itself
  wasn't opened). "Care groups" shortens "qualified entity" (a business or organization that provides care or care
  placement services, including one that licenses or certifies others). The summary quote stops mid-sentence at the
  300-character limit. No statement for or against was found and the committee vote had no Nays, so no case-against
  slide; the post asks. Party and state as congress.gov lists them. If the House votes before this posts, the last slide
  needs the tally.
