bills:
- id: SB 31
  does: Texas Medicaid would cover adults the Affordable Care Act's expansion covers, from Jan. 1, 2028.
  affects: Adults 19 to 64 earning up to 133% of the poverty line.
  where: Filed Nov. 9, 2026 by Sen. Zaffirini; no other action yet. Needs voter approval of an amendment.
  summary:
    text: >-
      the commission shall provide medical assistance to all individuals who apply for that assistance and for whom
      federal matching funds are available under the Patient Protection and Affordable Care Act
    title: SB 31 as filed
    url: https://capitol.texas.gov/tlodocs/90R/billtext/pdf/SB00031I.pdf
    retrieved: '2026-11-19'
