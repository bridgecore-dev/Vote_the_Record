caption: |-
  Today, Texas Medicaid's family programs don't list adults 19 to 64 who aren't parents, caretakers or pregnant. These bills would add those earning up to 133% of the poverty line. Federal law pays 90% of their medical costs, and the federal work requirement would apply. Two more Texas House of Representatives bills have the same text. Should Texas expand Medicaid?

