notes: >-
  New this run: a fourth copy of this text (HB 1247, Reynolds) was filed Nov. 19, 2026; no earlier post covers any of
  the four. Rule: the first Senate and House filings TLO lists as "Identical" (SB 31 lists HB 101, HB 855 and HB 1247 as
  Identical; HB 101 lists HB 855 and HB 1247 as Duplicate). HB 101 is picked over HB 855 (both Nov. 9) as the lower
  number; HB 855 (Anchía) and HB 1247 (Reynolds) are described without numbers (one bill per post) and their record IDs
  are listed so they don't post separately. All four introduced PDFs were downloaded and compared word for word: they
  differ only in the bill number and author line (Council document 90R 613). sha256: SB00031I
  edd79bed566567e54ce53461bcfac58697dad5c8ceca685e08e0fd824835c676, HB00101I
  c5eef4bd6079f0b4fe18af4cf90ed4feb98098ecdb40dc614dbe91ed3cc831fb. Each takes effect Jan. 1, 2028 "only if the
  constitutional amendment ... is approved by the voters" (Sec. 4); SB 31 is enabling legislation for SJR 6 and HB 101
  for HJR 21, both set for the Nov. 2, 2027 election (checked in both PDFs); neither joint resolution is named.
  Please double-check: (1) "the adults the Affordable Care Act's expansion covers" is our reading of "all individuals
  ... for whom federal matching funds are available under the [ACA]": that is the 42 U.S.C. 1396a(a)(10)(A)(i)(VIII)
  group (under 65, not pregnant, not on Medicare, income up to 133% of the poverty line), and 1396d(y) sets 90% federal
  share for "newly eligible" adults 19 and up. "About $21,200" is our arithmetic: 133% x $15,960 (2026 HHS guideline,
  one person, 48 states) = $21,227; the 5% income disregard in 1396a(e)(14) isn't shown. GPO's 2023 U.S. Code was used;
  Public Law 119-21 sec. 71114 changed only the extra incentive in 1396d(ii), not the 90% in (y). (2) "The law today"
  is the Texas Works Handbook A-240 list (Rev. 16-4) of who can be certified for its medical programs; Texas's separate
  programs for people 65+ and people with disabilities aren't described, and medicaid.gov returned 403 (not retried),
  so no CMS statement that Texas hasn't expanded is cited. (3) Work requirement: P.L. 119-21 sec. 71119 (new 1396a(xx));
  "applicable individual" includes the (VIII) group; start "not later than the first day of the first quarter that
  begins after December 31, 2026"; exemptions quoted in short form from (xx)(9)(A)(ii). (4) No fiscal note is listed
  on either bill page, and no official statement for or against was found, so the post ends with a question. "Unpaid
  care" is our short form of the bill's "charity care and uncompensated care costs for hospitals". Slot: the first
  Reel slot that keeps the Reel/post turn (Nov. 19-24 base and pair slots are full; Nov. 25 has a 9:00 a.m. post).
