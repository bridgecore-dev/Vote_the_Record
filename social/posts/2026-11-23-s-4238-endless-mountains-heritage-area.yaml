caption: |-
  On Nov. 19, the U.S. Senate passed S. 4238, the Endless Mountains National Heritage Area Act, by unanimous consent.

  Before: the Endless Mountains region isn't a National Heritage Area. A heritage area isn't a national park: a local group runs it, with help from the Interior Department.

  After: Bradford, Sullivan, Susquehanna and Wyoming counties become one, plus any parts of other Pennsylvania counties named in the area's feasibility study, run by the Endless Mountains Heritage Region, Inc. Up to $10 million in federal money in all, at most $1 million a year, if Congress provides it. Federal money pays at most half of any project and can't buy land. Property owners don't have to take part, and local land rules stay the same.

  Sponsor: Sen. David McCormick (R-PA). Cosponsor: Sen. John Fetterman (D-PA).

  Should Congress name more heritage areas?

  Voice: computer-generated (Kokoro text-to-speech).
