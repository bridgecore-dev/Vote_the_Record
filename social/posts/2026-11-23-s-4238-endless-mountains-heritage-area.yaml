notes: >-
  New this run: the Senate floor activity page for Nov. 19 lists S. 4238 "Passed Senate without amendment by
  Unanimous Consent"; the engrossed text on GovInfo matches the introduced text word for word. No CRS summary, so the
  explainer quotes sec. 2(a). "Parts of other counties" is the bill's "any portions of other counties in the State of
  Pennsylvania identified in the feasibility study ... the specific boundaries of which shall be established by the
  Secretary based on that feasibility study"; the study itself wasn't opened.
  wording for where the four named counties are (not in the bill text); please confirm or cut. The bill adds
  paragraph (14) to Dingell Act sec. 6001(a), so the rules in sec. 6001 apply (P.L. 116-9, opened on GovInfo): (b)(3)
  no federal funds to buy real property; (e) owners not required to participate or allow public access, land use
  rules unaltered, no regulatory authority to the entity, state fish and wildlife authority not diminished; (g)(1)
  "$10,000,000, of which not more than $1,000,000 may be made available in any fiscal year" (authorized); (g)(3)
  federal share "not more than 50 percent". "Not a national park" is 54 U.S.C. 120102(c)(2)(A) (P.L. 117-339). I found
  no later change to sec. 6001(g); please confirm. S. 1288 (Finger Lakes) also adds a paragraph "(14)"; not raised on
  a slide. cbo.gov returned 403 earlier this run (estimate: cbo.gov/publication/62796), not retried. A Senate National
  Parks subcommittee hearing was held July 21, 2026 (congress.gov actions); the testimony wasn't opened. No statement
  for or against was found and it passed by unanimous consent, so no case-against slide. Paired with the S. 1288 Reel,
  same layout; meant to be merged together. Sponsor and cosponsor party and state as congress.gov lists them. News
  first: takes the Nov. 23 6:00 a.m. Reel slot from the evergreen prefiled-bill post
  2026-11-21-texas-hb-1162-homeless-id-fees, which moves to 2026-12-01T00:00:00-06:00 (Nov. 30 would put two Reels in
  a row if the S. 1288 pull request merges).
