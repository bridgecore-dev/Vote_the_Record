caption: |-
  Today, a Texas city council can lower the speed limit on a two-lane, undivided city street if it finds the limit unsafe, but not below 25 mph. Cities that do it post a yearly count of tickets and speed-related crashes on those streets.

  HB 1194 (Texas House of Representatives) and SB 404 (Texas Senate), filed Nov. 17 for the 2027 session and listed as identical, would lower that floor to 20 mph. No engineering or traffic study would be needed on a street in a residence district, signs would be needed at an entrance to the district rather than at each end of each block, and the yearly report for these streets would end.

  No cost estimate is posted yet. If passed, they take effect Sept. 1, 2027. Should cities be able to set 20 mph?
