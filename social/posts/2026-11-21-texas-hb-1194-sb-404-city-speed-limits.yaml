notes: >-
  New: filed Nov. 17, 2026; no earlier post covers either bill. Rule: the Nov. 17 filing report's captions; HB 1194 and
  SB 404 are the only two about speed limits. Twins: SB 404's text isn't on TLO yet, so "identical" rests on both TLO
  histories ("Companion: ... Identical") and the shared council document 90R 3284 JAM-F; SB 404's summary quotes its
  history page. Please compare SB 404's text once posted. Records opened 2026-11-17: the Nov. 17 filing report, both
  histories (filed, no other action; no fiscal note), HB 1194's introduced HTML (underlines and brackets read as
  added and struck text), and Transportation Code 541.102 and ch. 545 (rendered from statutes.capitol.texas.gov).
  (b-1) applies only to two-lane, undivided streets ((b-2), not amended). Current (b-1) already needs only the
  council's finding, not a study; the bill adds the explicit no-study line for residence districts, so the slide says
  "none required" without claiming one is required today. The report change: the bill strikes "(b-1) or" from (d).
  No source says who gains or loses money, so the slides say only who gets the choice and what ends. Takes Nov. 21
  9:00 p.m. (post after the 7:30 p.m. Reel), the first free feed-post slot.
