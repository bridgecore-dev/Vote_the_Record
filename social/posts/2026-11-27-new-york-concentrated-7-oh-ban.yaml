notes: >-
  News-first: an official action from today (nyassembly.gov actions for S8925A, read 2026-11-23: "11/13/2026
  DELIVERED TO GOVERNOR", "11/23/2026 SIGNED CHAP.415"). Found through the governor's news page (an official
  source). No post or open pull request covers S8925 or 7-OH. Takes the Nov. 27 8:15 p.m. story slot, the first
  free story slot after the Nov. 26 one taken by the Chapter 414 pull request, so no post is bumped. The slides
  follow the enacted text (new General Business Law 392-l): subd. 1 the limit, subd. 3 who can't sell ("online
  platform" is in the text), subd. 4 the penalties and the fund; sec. 2, 90 days. "Kratom stays legal for adults"
  is our reading: the law reaches only products over the limit, and the governor's release says kratom sales to
  under-21s were banned in 2025 (the 2025 laws themselves weren't opened; the Before row rests on the release).
  "Acts like an opioid" and "13 times more potent than morphine" are the Assembly sponsor's memo (A9156B, Steck);
  the memo text breaks "concen- tration" across a line and is quoted as printed. The Senate sponsor is Sen. C. Ryan;
  the Assembly bill A9156B was the same-as bill (Senate S8925A was substituted and is the one that passed), so the
  sponsor's memo is from the Assembly version. Senate tally isn't on the Assembly page (nysenate.gov serves a bot
  challenge), so only the date. Assembly 132/0. No case against was found in the records opened; "Stores lose
  sales" and "Products over the limit come off New York shelves" are our plain reading of the ban. No party shown;
  the records don't list it. The governor's release mentions a named death; left out. Slides name the chapter,
  not the bill number, as in the other New York posts. Shortened the source titles and slide 5 text so the
  sources footer fits (the first preview clipped it).
