caption: |-
  New York's governor signed a bill on Nov. 23, 2026 that bans selling products with concentrated 7-OH (7-hydroxymitragynine), a compound found in kratom that acts like an opioid. It is Chapter 415 of the Laws of 2026 and takes effect 90 days after signing.

  Before: 2025 laws already barred selling kratom to anyone under 21 and required ingredient lists and warning labels, the governor's office says. After: no business, including online platforms, may knowingly sell, offer or deliver a product with 7-OH above 2% of total alkaloids or 1 milligram per serving.

  Penalty: up to $500 for a first violation and $1,000 for each one after, recovered by the attorney general. Fines go to the New York State Drug Treatment and Public Education Fund.

  The New York State Senate passed it June 2, 2026, and the New York State Assembly passed it 132-0 on June 5, 2026.

  Should states set limits on products sold at gas stations and smoke shops?
