caption: |-
  Milk trucks with seven axles can now get a Pennsylvania permit to weigh up to 117,000 pounds. Act 119 of 2026 takes effect in 60 days.

  Before: a milk truck on a permit could weigh up to 95,000 pounds, whatever its axles.
  After: 5 axles, 95,000 pounds. 6 axles, 107,000. 7 axles, 117,000. Still no more than 21,000 pounds on any axle but the steering axle, and still no permit trips in bad weather.

  The 6- and 7-axle trucks must name their route, and PennDOT or the local authority must find the route can take the weight. Cost to the state: $0, says the House fiscal note.

  The bill began as a plan to let milk trucks drive through storms and emergency travel bans. The Pennsylvania House of Representatives rewrote it. Final votes: Pennsylvania House of Representatives 203-0, Pennsylvania Senate 48-0.

  Which side convinces you?
