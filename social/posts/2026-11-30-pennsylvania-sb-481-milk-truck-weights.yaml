bills:
- id: SB 481
  title: Milk hauling permits (Act 119 of 2026)
  does: Raises permit weight limits for milk trucks to 107,000 pounds with 6 axles and 117,000 with 7, on routes found able to carry them
  affects: Haulers of bulk milk to or from milk plants and dairy farms, and PennDOT and local road authorities
  where: Approved by the Governor Nov. 23, 2026 as Act 119 of 2026; takes effect in 60 days.
  summary:
    text: "Raises milk transportation weight limits."
    title: House Appropriations Committee fiscal note summary of SB 481 (PN 2020)
