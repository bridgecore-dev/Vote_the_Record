- kicker: Pennsylvania · New law, Nov. 23, 2026
  big: 117,000 lb
  head: Milk trucks with seven axles can now get a permit to weigh up to 117,000 pounds in Pennsylvania.
  text: SB 481 became Act 119 of 2026. It takes effect 60 days after it was signed.
- chip: The law today
  head: A milk truck on a special permit can weigh up to 95,000 pounds, however many axles it has.
  rows:
  - [Who, "Trucks hauling milk to or from a manufacturer"]
  - [When, "24 hours a day, 7 days a week, except in bad weather as PennDOT defines it"]
  - [Axles, "No axle other than the steering axle over 21,000 pounds"]
  quote: {label: "75 Pa.C.S. § 4968(a.2)(4)", text: "if the gross weight does not exceed 95,000 pounds and the weight of any nonsteering axle does not exceed 21,000 pounds"}
- chip: Before → after
  head: The limit now depends on how many axles the truck has.
  rows:
  - [5 axles, "Up to 95,000 pounds, the same as before"]
  - [6 axles, "Up to 107,000 pounds (before: 95,000)"]
  - [7 axles, "Up to 117,000 pounds (before: 95,000)"]
  - [Every axle, "Still no more than 21,000 pounds on any axle but the steering axle"]
  - [Bad weather, "Still not allowed, as before"]
- chip: Before → after
  head: Heavier trucks need a route the road owner says can take the weight.
