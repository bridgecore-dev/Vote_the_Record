notes: >-
  News first: an official action from the last three days (palegis.us bill history, read 2026-11-25: "Approved by
  the Governor, Nov. 23, 2026", "Act No. 119 of 2026"). Found through Open States' action feed (a tip only, not a
  source); no post or open pull request covers it. Takes the Nov. 30 3:00 p.m. post slot from the evergreen Texas HB
  1284 post (a prefiled bill), moved to Dec. 24 3:00 a.m., the first post slot after the last queued post (Dec. 23
  3:00 a.m.). Every earlier post slot holds news from the last week or a dated event (hemp, Dec. 11); Nov. 29 9:00
  a.m. is free but would follow the 3:00 a.m. carousel with no Reel between. PN 2020 is the House-amended text the
  Senate concurred in (PDF sha256 26e533aab7939bdbbce1becbb8af5b5a50a8e71571eb28cfb8383f397166ad72); the PDF's
  strike-through shows the House struck the whole bad-weather section (new 4910) that PN 439 and PN 1819 carried, and
  the fiscal note (sha256 980312fd33f9e39a6269fb9f2a29a51e4378894478701acbc04f87814ff36a88) describes only the
  weight changes, which agrees. "The law today" is 75 Pa.C.S. 4968(a.2)(4) from the palegis.us consolidated statute
  PDF (sha256 5ff76073b9c36a030b1abd8e20a3aca14e4c018ccf39a5466c28db9fdb81c8d5). Please check: (1) "except for raw
  milk" before vs. "5-axle trucks at 95,000 pounds don't" after: the new (iii) exempts a five-axle combination
  hauling bulk milk up to 95,000 lb, and bulk milk now includes raw milk; (2) "Eligible interstate highways as
  determined by the department" replaces "a permit may be issued ... upon an interstate highway"; not on a slide.
  The new "bulk milk" definition (liquid milk in bulk for processing, incl. raw and skim milk, cream, whey) and
  "manufacturer" becoming "milk plant or dairy farm" are left off the slides for length. Senate roll 618 (concurrence, Nov. 17, 48-0-2) and
  House roll 1535 (final passage, Oct. 19, 203-0) were counted from each roll call page's member list; party as
  those pages list it (D, R). Didn't vote in the Senate: Sen. Patty Kim (D, District 15), Sen. Nick Miller (D,
  District 14); not named on a slide, as in the SB 1273 post. The May 7, 2025 Senate vote (36-14) was on the
  bad-weather version (PN 439); its remarks (Senate Journal p. 381) weren't opened, so no case for or against that
  version is quoted. No official statement on the final version was found. "Takes effect in 60 days" is Section 2.
  The Governor isn't named because no record opened names him.
