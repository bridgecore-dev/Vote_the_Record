caption: |-
  Three days to apply for a mail ballot in Harris County's Dec. 12 runoff.

  The ballot has one contest: Harris Central Appraisal District Director, At-Large, Place 3. The application must reach the Harris County Clerk's elections office by Dec. 1. Texas law counts it as submitted when the clerk receives it, not when you send it.

  You can mail it, send it by carrier, or fax or email a signed scan. If you fax or email it, the original must also arrive by mail within four business days.

  Sign it, and include your Texas DPS license or ID number or the last four digits of your Social Security number. The number has to match your voter registration.

  Mail voting is open to voters 65 or older, voters who are sick or disabled or expecting to give birth within three weeks of Election Day, voters out of the county, and some voters confined in jail. Everyone else can vote early in person Nov. 30 to Dec. 8, or on Dec. 12.

  Forms and addresses: harrisvotes.com.
