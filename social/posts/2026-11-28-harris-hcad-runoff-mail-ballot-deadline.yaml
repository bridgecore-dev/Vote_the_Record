notes: >-
  New this run: the Nov. 28 8:15 p.m. story slot was empty. harrisvotes.com (Harris County Clerk's elections site; .com,
  so review), read 2026-11-24, lists the Dec. 12 HCAD runoff with "Deadline to apply for a ballot by mail: DEC 1" and
  "Early Voting: NOV 30 - DEC 8". Election Code 84.007(c) sets the deadline at the 11th day before Election Day (Dec.
  12 - 11 = Dec. 1, a Tuesday) at "the close of regular business in the early voting clerk's office or 12 noon,
  whichever is later"; the slides don't give a clock time because the county page doesn't. 84.007(d) is quoted.
  Delivery methods, addresses and the 4-business-day rule for fax and email are from the county's Vote by Mail page and
  84.007(b), (b-1). The signature and ID-number tips and the annual-application line ("receive a mail ballot for all
  elections held during a calendar year", for voters 65+ or disabled) are from the same page. Eligibility rows
  shorten Election Code 82.001-82.004; 82.008 (civil commitment) is left out for space, and "otherwise eligible" in the
  jail row stands for 82.004's conditions. The Nov. 25 story (2026-11-25-harris-hcad-runoff-early-voting) mentions the
  Dec. 1 date in one row; this one is about how to meet it. No candidates named beyond the contest; no party (the
  ballot lists none).
