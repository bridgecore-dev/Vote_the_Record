notes: >-
  New this run: no post covers SB 177. Lead came from a web search summary of North Carolina lame-duck news (no
  single story confirmed it mentioned SB 177, so no found_via); every fact is from ncleg.gov. Bill history (read
  2026-11-22): conference report adopted 11/17 in the House (66-49, roll #806) and Senate (26-19, roll #704),
  ratified 11/18, "Pres. To Gov." 11/19, no later action. Party totals counted from the roll call transcripts, which
  group names by party (House Ayes: 61 R, 3 D, 2 Unaffiliated; Noes 44 D, 5 R; not voting 3 R; excused 2 R. Senate:
  Ayes 26 R; Noes 19 D; excused 4 R, 1 D). House Nays (49) are over the ~40-name limit, so linked. Selection rule:
  the four largest new appropriations in the ratified text (sec. 2.17 $46,375,508 recurring from the General Fund
  beginning 2027-28; sec. 2.15 $40,000,000; sec. 2.35 $31,000,000; sec. 2.1(3) $25,000,000; the last three from
  the Stabilization and Inflation Reserve). Larger figures in the text ($706.1M Helene Fund, $515M/$450M NCEM, the
  $75M Global TransPark loan authority, the $20M-$30M reallocations) rewrite earlier appropriations or are loan
  authority, not new money; please confirm. "One-time savings account" is our plain wording for a reserve funded
  with nonrecurring money; check it. "92 sections" counts SECTION 1.1-1.28 (no 1.5), 2.1-2.63 plus 2.37A, 3.1-3.2 in the ratified text;
  sec. 3.1 adjusts "the totals of Part II of S.L. 2026-41, as amended by S.L. 2026-42, 2026-58, and 2026-61". 10-day rule: Art. II, Sec. 22(7) applies because the
  General Assembly isn't adjourned more than 30 days (the Legislative Calendar shows both chambers convening Nov. 30).
  The post doesn't compute the deadline date (10 days after Nov. 19). No floor statements for or against were
  opened (House audio is archived on ncleg.gov), so no case-for/against slide. RECHECK THE BILL PAGE BEFORE THE
  SLOT: if the Governor signed or vetoed it, update slide 1, `where`, the caption and record_ids. Takes the Nov. 28
  3:00 a.m. post slot, the first free post slot (after the Nov. 28 12:00 a.m. Reel), so nothing is bumped.
