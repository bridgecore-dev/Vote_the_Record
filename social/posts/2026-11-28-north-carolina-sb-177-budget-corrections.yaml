- kicker: North Carolina House of Representatives · Nov. 17, 2026
  head: The North Carolina House of Representatives adopted the same conference report, 66-49.
  vote: {yea: 66, nay: 49, not_voting: 3}
  text: 2 members had excused absences.
- chip: North Carolina House · By party
  head: Totals by party, as the roll call lists them
  rows:
  - [Republican, "61 Yea · 5 Nay · 3 didn't vote · 2 excused"]
  - [Democrat, "3 Yea · 44 Nay"]
  - [Unaffiliated, "2 Yea · 0 Nay"]
  text: All 115 votes by name are in House roll call #806 at ncleg.gov.
- chip: What's in it
  head: The four largest new spending items, by dollar amount
  rows:
  - [$46.4 million a year, 'UNC enrollment: one-time 2026-27 money becomes yearly from 2027-28']
  - [$40 million, School bus fuel costs above what the transportation allotment covers]
  - [$31 million, More for the Film and Entertainment Grant Fund]
  - [$25 million, Court system technology and operations]
  text: The UNC money comes from the General Fund. The other three come from the Stabilization and Inflation Reserve, a one-time savings account.
- chip: Before → after
  head: Most of the bill rewrites laws and budget lines passed earlier.
  rows:
  - [Before, "Spending set in S.L. 2026-41, a 2026 law, and three later laws that changed it"]
  - [After, '92 sections: some new money, money moved to new uses, deadlines and rules revised']
  text: Part I changes state laws. Part II revises the budget. Part III adjusts the spending totals in S.L. 2026-41.
- chip: What the Governor can do
  head: Sign it, veto it, or let it become law without signing.
  quote: {label: "North Carolina Constitution, Art. II, Sec. 22(7)", text: "If any bill shall not be returned by the Governor within 10 days after it shall have been presented to him, the same shall be a law in like manner as if he had signed it"}
  text: A veto goes back to the North Carolina Senate first. Overriding it takes three-fifths of members present and voting in each chamber.
- chip: Your turn
  head: Which of these changes matters most to you?
  text: Read the bill and the staff summary under Senate Bill 177 at ncleg.gov. Lawmakers return Nov. 30.
caption: |-
  North Carolina lawmakers sent Gov. Josh Stein Senate Bill 177 on Nov. 19: 62 pages of budget corrections and law changes. He has 10 days to sign or veto it; if he does neither, it becomes law (N.C. Constitution, Art. II, Sec. 22).

  Votes on the final version, Nov. 17:
  North Carolina Senate, 26-19: Republican 26-0, Democrat 0-19.
  North Carolina House of Representatives, 66-49: Republican 61-5, Democrat 3-44, Unaffiliated 2-0.

  Largest new spending: $46.4 million a year for UNC enrollment from 2027-28, $40 million for school bus fuel, $31 million for film grants, $25 million for court technology.

  Which of these changes matters most to you?
