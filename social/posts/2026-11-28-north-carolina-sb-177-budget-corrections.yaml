slides:
- kicker: North Carolina · On the Governor's desk
  big: 10 days
  head: North Carolina lawmakers sent Gov. Josh Stein SB 177, a 62-page bill of budget corrections and law changes, on Nov. 19.
  text: Under the state constitution, he has 10 days to sign it or veto it. If he does neither, it becomes law.
- kicker: North Carolina Senate · Nov. 17, 2026
