notes: >-
  New: roll call 327 (Nov. 19, 9:43 a.m. ET, "On Motion to Suspend the Rules and Pass", 2/3 yea-and-nay) wasn't
  covered. The Nov. 15 Reel (2026-11-15-preventive-health-savings-act) covered H.R. 4464 only as a scheduled bill.
  Tally and party totals are from the Clerk's roll XML. The text passed is the reported version (docs.house.gov's
  week-of-Nov.-16 list links h4464_rh; the report says "without amendment"). New since Nov. 15: H. Rept. 119-882
  (filed Nov. 17) prints CBO's estimate: "less than $500,000 over the 2027-2031 period; any related spending would be
  subject to the availability of appropriated funds", and says CBO already gives information past 10 years "when
  committees request it and identify it as a priority" and checks deficit increases over 40 more years. So "Now" isn't
  "never past 10 years" (the Nov. 15 post said savings past year 10 "aren't in the estimate"; this one is more exact).
  The report has no minority or dissenting views, and the vote had no Nays, so there's no case-against slide; the
  floor debate (Nov. 18) wasn't opened. Cosponsor party counts (17 R, 8 D) from congress.gov; sponsor's party and state
  as the bill record lists them. Congress.gov actions (read this run) end at the Nov. 18 postponed vote. Takes the
  Nov. 22 10:30 a.m. Reel slot; pair with the 12:00 p.m. carousel on H.R. 7934 (meant to be merged together).
