caption: |-
  On Nov. 19, the U.S. House of Representatives passed H.R. 4464, the Preventive Health Savings Act, 401-0, with 32 members not voting.

  Before: CBO, Congress's budget office, usually estimates a bill's cost over 10 years. It looks further out only when a committee asks and calls it a priority.
  After: when the chair and ranking member of the Budget Committee and of the committee in charge of a bill ask, CBO must check whether a preventive health bill cuts spending in years 11 through 30, and show any savings with its reasons. That longer number is extra information only: it can't be used to meet budget rules.

  CBO says the bill would cost under $500,000 over 2027-2031, paid from its yearly funding if Congress provides it. The committee report lists no views against it.

  By party, per the House Clerk: Republicans 197 Yea, 0 Nay; Democrats 204 Yea, 0 Nay; the one Independent didn't vote.

  Next it goes to the U.S. Senate. Should long-term health savings count? Tell us below.

  Voice: computer-generated (Kokoro text-to-speech).
