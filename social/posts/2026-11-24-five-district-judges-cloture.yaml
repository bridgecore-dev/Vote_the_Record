caption: |-
  On Nov. 20, 2026, the U.S. Senate held five cloture votes in a row, each one to end debate on a nominee for U.S. District Judge. All five passed.

  Vote 275, Kyle Frederick Reardon (District of Alaska): 55-31.
  Vote 276, Daniel Lewis Ballou (Eastern District of Kentucky): 48-36.
  Vote 277, Robert E. Long, Jr. (Middle District of Florida): 47-35.
  Vote 278, Peter M. Mansfield (Eastern District of Louisiana): 48-31.
  Vote 279, Jesus A. Osete (Western District of Missouri): 45-33.

  Totals by party for each vote are on the slides, as the U.S. Senate records them.

  Cloture is a vote to end debate. For nominations it takes a simple majority. Each nominee would fill a seat a judge has left or is leaving.

  The U.S. Senate is out until Nov. 30, apart from short pro forma sessions. Reardon's confirmation vote is ordered for 5:30 p.m. ET on Nov. 30; the other four come no earlier than that day.

  51 votes or 60 to end debate on a judge: what do you think?
