notes: >-
  New this run: Senate votes 275-279 (Nov. 20, 3:38-4:49 p.m. ET, each "Cloture Motion Agreed to", "1/2"), not in any
  post or open pull request. Tallies and party counts were counted from each vote's XML (vote_119_2_00275.xml through
  00279.xml); party as the Senate lists it (R, D, I). Every vote's smaller side (31-36 Nays) is under the ~40-name
  limit, but five lists don't fit one carousel, so every vote gets the same treatment: totals by party and a link to
  senate.gov. If you'd rather list names, split this into five posts. The Press Gallery log names the Democrats who
  voted Yea on 275 (Cortez Masto, Fetterman, Hirono, Kaine, Rosen, Shaheen) and 278 (Fetterman, Hirono); not on a
  slide, for the same reason. "Vice ..." lines, PN1272-3/-7/-8/-10/-13, and the unanimous consent agreement (Reardon
  confirmation at 5:30 p.m. Nov. 30; the other four "no earlier than Monday, November 30, 2026" at a time set by the
  Majority Leader in consultation with the Democratic Leader) are from xcalv.pdf, which was already the Nov. 24 issue
  when read on Nov. 20 (it is replaced each issue). Adjournment to Nov. 30 and the Nov. 24 / Nov. 27 pro forma
  sessions are from the Senate Daily Press floor log (5:13 p.m., Nov. 20). No floor statements for or against were
  opened (the Nov. 20 Congressional Record isn't on GovInfo yet), so no case for/against slide. This post goes out
  before the Nov. 30 votes; the next post on these nominees should carry the confirmation roll calls. News first:
  takes the Nov. 24 3:00 a.m. post slot, the first post slot at least 3 hours away held by an evergreen post (every
  earlier post slot holds this week's votes and passages), and moves the evergreen 2026-11-21-texas-hb-1186-marriage-age
  (a prefiled bill) to 2026-12-06T03:00:00-06:00, the first post slot after the last queued post that keeps the
  Reel/post turn (Dec. 5 9:00 a.m. would follow the Dec. 5 3:00 a.m. carousel with no Reel between).
