slides:
- kicker: Campaign money, explained
  big: $3,500
  head: The most one person can give a federal candidate's campaign, per election, in 2025-2026.
  text: "A primary, a general election and a runoff each get their own limit."
  quote: {label: "FEC limits chart, 2025-2026", text: "Individual $3,500* per election"}
- kicker: Groups that give to candidates
  big: $5,000
  head: The most a multicandidate PAC can give a candidate's campaign, per election.
  quote: {label: "FEC limits chart, 2025-2026", text: "PAC: multicandidate $5,000 per election"}
- kicker: Super PACs
  head: Committees that only make independent expenditures have no limit on what they can take in.
  quote: {label: fec.gov, text: "Independent-expenditure-only political committees (sometimes called “Super PACs”) may accept unlimited contributions, including from corporations and labor organizations."}
- kicker: What an independent expenditure is
  head: An ad for or against a candidate that isn't made with the candidate or a party.
  quote: {label: fec.gov, text: "Expressly advocates the election or defeat of a clearly identified candidate; and Is not made in consultation or cooperation with, or at the request or suggestion of any candidate, or his or her authorized committees or agents, or a political party committee or its agents."}
- kicker: Look it up yourself
  head: fec.gov/data shows who gives to federal candidates and committees, and how they spend it.
  quote: {label: fec.gov, text: "See how candidates and committees raise and spend money in federal elections."}
caption: |-
  Who can give how much to someone running for Congress? The Federal Election Commission sets it out.

  One person can give a candidate's campaign up to $3,500 per election in 2025-2026. A multicandidate PAC can give up to $5,000 per election.

  Super PACs are different. These committees only make independent expenditures, and they can take in unlimited money. An independent expenditure is an ad for or against a candidate that isn't made with the candidate or a party.

  You can search any federal candidate or committee at fec.gov/data.
