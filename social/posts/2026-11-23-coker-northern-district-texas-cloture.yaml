caption: |-
  On Nov. 20, 2026, the U.S. Senate voted 49-43 to end debate (cloture) on the nomination of Courtney Leigh Coker, of Texas, to be a U.S. District Judge for the Northern District of Texas (vote 273).

  Republican: 49 Yea, 0 Nay, 4 didn't vote.
  Democratic: 0 Yea, 41 Nay, 4 didn't vote.
  Independent: 0 Yea, 2 Nay.

  Cloture is a vote to end debate. For nominations it takes a simple majority.

  Later on Nov. 20, the U.S. Senate confirmed her, 49-41 (vote 274).
  Republican: 49 Yea, 0 Nay, 4 didn't vote.
  Democratic: 0 Yea, 39 Nay, 6 didn't vote.
  Independent: 0 Yea, 2 Nay.

  The Northern District of Texas has seven divisions, including Dallas, Fort Worth, Lubbock and Amarillo. Coker is nominated to the seat of Judge David C. Godbey, who retired. Federal law sets 12 judgeships there, and district judges have no set term.

  51 votes or 60 to end debate on a judge: what do you think?
