notes: >-
  New this run: Senate vote 271 (Nov. 19, 10:07 p.m. ET), not in any post. Tally, "1/2" majority requirement,
  party counts and the six not-voting names (Cassidy, Cornyn, Curtis, McConnell, Tuberville R; Murphy D) were counted
  from vote_119_2_00271.xml; party as the Senate lists it. The Senate Press Gallery's Nov. 19 log says "49-46" with
  five not voting (no Curtis); the Senate's own XML and vote page say 48-46, and the post follows the Senate record.
  46 Nays are over the ~40-name limit, so totals and a link. "Vice Andrew S. Hanen, retired", PN1272-4 and the Nov. 20
  11 a.m. order are from the Nov. 20 Executive Calendar (xcalv.pdf is replaced daily; reported by Mr. Grassley, Nov. 10,
  "without printed report"). Divisions and 19 judgeships are from GPO's 2023 U.S. Code (28 U.S.C. 124(b), 133(a));
  please confirm no later law changed them. The confirmation vote (11 a.m. ET Nov. 20) wasn't on senate.gov's vote
  list when this was written, after waiting about 90 minutes: BEFORE THIS POSTS, the next run should add the
  confirmation roll call's tally (and its record ID) or replace slide 4. congress.gov's API lists PN1272 as a different
  nominee (a partitioned nomination), so it wasn't used. No floor statements for or against were opened (the Nov. 19
  Congressional Record isn't on GovInfo yet), so no case for/against slide. News first: takes the Nov. 21 3:00 a.m.
  post slot (the Nov. 20 3:00 p.m. and 9:00 p.m. post slots hold this week's news) and moves the evergreen
  2026-11-18-criminal-history-access-act (presented to the President Nov. 12, more than a week ago) to
