caption: |-
  On Nov. 19, 2026, the U.S. Senate voted 48-46 to end debate (cloture) on the nomination of Richard Wesley Bennett, of Texas, to be a U.S. District Judge for the Southern District of Texas (vote 271).

  Republican: 48 Yea, 0 Nay, 5 didn't vote.
  Democratic: 0 Yea, 44 Nay, 1 didn't vote.
  Independent: 0 Yea, 2 Nay.

  Cloture is a vote to end debate. For nominations it takes a simple majority. A second vote, on confirmation, was set for Nov. 20.

  The Southern District of Texas includes Harris County. Bennett would fill the seat of Judge Andrew S. Hanen, who retired. Federal law sets 19 judgeships there, and district judges have no set term.

  51 votes or 60 to end debate on a judge: what do you think?
