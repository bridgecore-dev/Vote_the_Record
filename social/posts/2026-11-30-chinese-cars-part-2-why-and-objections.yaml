notes: >-
  Owner idea (part 2 of 3; parts 1 and 3 are their own pull requests and are meant to be merged together). Every quote
  is from the final rule as published (GovInfo copy of FR doc 2025-00592; federalregister.gov's full text returned its
  "request access" page and was not retried). The two risks: sec. on the risk assessment ("could enable those foreign
  adversaries to ..."). "China's and Russia's laws can require companies there to help" restates the rule's
  discussion ("PRC laws compel compliance with government requests", as commenters agreed, and the Russian-law
  section); please check that line. The test example is the rule's citation of Upstream's 2024 report (a researchers'
  simulated jailbreak of "an OEM's VCS"); the rule doesn't name the carmaker or say it was Chinese, which the slide
  says. Comments: "BIS received 101 comments on the NPRM"; "Many commenters agreed with BIS's risk assessment"; the
  concerns quote and "significant economic impact" / timeline are the next sentences. Changes: the commercial market
  removed (the 10,000 pound limit in the definition; the rule says BIS intends a separate rule for commercial vehicles,
  hence "for now"; please confirm) and the legacy code exclusion ("before a date that is one year from the effective
  date", i.e. March 17, 2026). The 2027 and 2030 dates: 791.308 as now on eCFR; the rule says "many commenters
  raised issues with the specific model years" (the proposed rule was not opened, so no slide says the dates changed
  or stayed). "Trucks and buses" on slide 5's head is our plain word for commercial
  vehicles over 10,000 pounds. Slot: Nov. 30 midnight, a free Reel slot before the 3:00 a.m. post; bumps nothing.
