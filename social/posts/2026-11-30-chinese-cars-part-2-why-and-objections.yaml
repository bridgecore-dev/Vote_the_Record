caption: |-
  Part 2 of 3: why the U.S. Commerce Department banned Chinese and Russian connected-car tech, in its own words, and what commenters objected to.

  The department says the tech "could enable those foreign adversaries to (1) exfiltrate sensitive data collected by connected vehicles and (2) allow remote access and manipulation of connected vehicles driven by U.S. persons." It cites a test where researchers hacked one carmaker's connection system and unlocked acceleration and heated seats. That example isn't about a Chinese car.

  The other side: 101 public comments. Many agreed with the risk; the main concerns were its broad scope and its "potentially onerous and disruptive" paperwork, and some warned of "significant economic impact." The final rule dropped vehicles over 10,000 pounds for now and exempted older code; it set model years 2027 and 2030 as the start dates.

  Which side convinces you?

