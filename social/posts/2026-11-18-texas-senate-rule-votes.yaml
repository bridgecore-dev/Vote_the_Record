caption: |-
  The Texas Senate has lowered the vote needed to take up a bill out of its calendar order twice, each time by a recorded vote on its own rules. The Senate Journal lists every senator by name (not party).

  Jan. 13, 2021, three-fifths to five-ninths: 18 Yea, 13 Nay.
  Yea: Bettencourt, Birdwell, Buckingham, Campbell, Creighton, Hall, Hancock, Huffman, Hughes, Kolkhorst, Nelson, Nichols, Paxton, Perry, Schwertner, Seliger, Springer, Taylor.
  Nay: Alvarado, Blanco, Eckhardt, Gutierrez, Hinojosa, Johnson, Lucio, Menéndez, Miles, Powell, West, Whitmire, Zaffirini.

  Jan. 21, 2015, two-thirds to three-fifths: 20 Yea, 10 Nay, 1 Present.
  Yea: Bettencourt, Birdwell, Burton, Campbell, Creighton, Eltife, Fraser, Hall, Hancock, Huffines, Huffman, Kolkhorst, Lucio, Nelson, Nichols, Perry, Schwertner, Seliger, L. Taylor, V. Taylor.
  Nay: Ellis, Garcia, Hinojosa, Rodríguez, Uresti, Van de Putte, Watson, West, Whitmire, Zaffirini. Present, not voting: Estes.

  With all 31 senators present, that's 21 votes before 2015, 19 from 2015, and 18 since 2021. Did your senator vote on it?

  Part 2 of 2. Part 1: how the rule works, and the case for and against.
