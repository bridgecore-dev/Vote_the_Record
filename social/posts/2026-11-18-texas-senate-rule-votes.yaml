notes: >-
  Part 2 of 2 from an owner idea (part 1 is the Reel at 4:30 p.m.); merge them together. Tallies and names are
  exactly as the Senate Journal prints them: 2021, p. 35 of the journal (PDF p. 21), Section 4 divided out and
  adopted 18-13; 2015, p. 54 (PDF p. 10), Section 5 divided out and adopted 20-10, 1 present-not-voting. Those
  sections hold the threshold changes (Rule 5.13 among them). The journal lists no party, so no party slide.
  21 (two-thirds) and 18 (five-ninths) at 31 present are the Senate's vote chart; 19 (three-fifths) is the number
  Sen. Eltife gave in the 2015 debate ("requiring 19 Members ... versus 21"). Both votes are in one post because
  they are two steps of the same rule; the resolutions are not named on the slides. "Van de Putte" is printed
  "VanideiPutte" by pdftotext (the journal's spacing glyphs). Lucio voted Yea in 2015 and Nay in 2021, as recorded.
