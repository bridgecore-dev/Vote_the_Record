slides:
- kicker: 2027 Texas session · Filed Nov. 9, 2026
  big: SB 46
  head: A Texas Senate bill would make it an offense to run a political ad with a fake image, audio or video of a candidate unless the ad says so.
- chip: The law today
  big: 30 days
  head: "Texas makes it a crime to create a deep fake video and publish it within 30 days of an election, to hurt a candidate or sway the result."
  quote: {label: "Election Code 255.004(e): a deep fake video", text: "means a video, created with the intent to deceive, that appears to depict a real person performing an action that did not occur in reality."}
  text: "Video only. A Class A misdemeanor: up to $4,000, a year in jail, or both (Penal Code 12.21)."
- chip: Before → after
  head: "Today's 30-day video crime stays. SB 46 adds a new rule for political ads."
  rows: [[Covers, "A fake image, audio or video of a candidate's or officeholder's looks, speech or conduct, AI-made or not"],
         [When, "Any ad meant to influence an election; the bill text sets no 30-day window"],
         [Allowed if, "The ad says it did not happen, or an image or video was only edited for color, brightness and the like"]]
  text: "The Texas Ethics Commission would set the label's font, size and color."
- chip: The penalty
  head: "First and second offense: a fine of up to $3,000. Third or later: a Class A misdemeanor."
  quote: {label: "SB 46 as filed, new Election Code 255.0015(d)", text: "An offense under this section is punishable by a fine of not more than $3,000, except that the offense is a Class A misdemeanor if it is shown on the trial of the offense that the defendant has been previously convicted under this section two or more times."}
  text: "A Class A misdemeanor: up to $4,000, a year in jail, or both (Penal Code 12.21)."
- chip: Who it covers
  head: "Candidates, officeholders, political committees, people who spend over $100 in a reporting period on political ads, and people paid to run them."
  text: "Not liable for someone else's ad: online services, internet providers, broadcasters, billboard owners. No fiscal note (cost estimate) is posted yet."
- chip: What's next
  head: The Legislature convenes Jan. 12, 2027.
  text: "If passed as filed, it takes effect Sept. 1, 2027. Should a fake image, audio or video of a candidate be allowed in an ad as long as the ad says it's fake? And should a first offense mean a fine, or jail time?"
caption: |-
  Today, Texas law makes one kind of election deep fake a crime: a fake video, published within 30 days of an election to hurt a candidate or sway the result.

  SB 46, filed in the Texas Senate for the 2027 session, would keep that rule and add another: a political ad with a fake image, audio or video of a candidate, unless the ad says it didn't happen.

  The penalty: a fine of up to $3,000 for a first or second offense. A third would be a Class A misdemeanor: up to $4,000, a year in jail, or both. If passed, it takes effect Sept. 1, 2027.

  Should a label be enough?
