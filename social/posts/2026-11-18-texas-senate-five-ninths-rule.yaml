caption: |-
  Before the Texas Senate can take up a bill out of its calendar order, five-ninths of the senators present have to agree. With all 31 there, that's 18 (Senate Rule 5.13 and the Senate's vote chart).

  Why it matters: by tradition the Senate keeps a "blocker bill" at the top of its calendar, so other bills come up only by that vote.

  The bar has dropped twice, each time by a recorded Senate vote on its rules: two-thirds to three-fifths in 2015, and three-fifths to five-ninths in 2021. In the 2015 debate, Sen. Eltife, who offered the change, said the Senate needed rules to "complete our work in a timely manner." Sen. Rodríguez, voting no, wrote that the old rule "fosters civility, a willingness to compromise, and a spirit of bipartisanship."

  The 90th Legislature convenes Jan. 12, 2027. A majority of all senators, 16 of 31, can amend the Senate's rules. Should it take 18 to bring up a bill?

  Part 1 of 2. Part 2: who voted for each change, from the Senate Journal.

