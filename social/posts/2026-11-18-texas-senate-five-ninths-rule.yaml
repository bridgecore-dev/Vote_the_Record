  Part 1 of 2 from an owner idea (part 2 is the Senate Journal vote carousel at 6:00 p.m.); they fill the Nov. 18
  4:30/6:00 p.m. pair and are meant to be merged together. "18 of 31" is the Senate's own vote chart (5/9ths, 31
  present = 18); 16 is the chart's "Majority of Membership (16)" for amending rules (Rule 22.01). The history rests on
  the bracketed text in each rules resolution as printed in the Senate Journal (2015: three-fifths [two-thirds];
  2021: five-ninths [three-fifths]). Both quotes are from the 2015 debate on the same rule; the 2021 journal prints
  no remarks. The "say" drops the accent in "Rodriguez" for the voice only. Check the doc slide's highlight renders
  on page 39 of the rules PDF. Not covered, for lack of an official record opened in this run: the Senate's
  makeup after the Nov. 3, 2026 election (not yet canvassed) and calls for a special session on the rules.
