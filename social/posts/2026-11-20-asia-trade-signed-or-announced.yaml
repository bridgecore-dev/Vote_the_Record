notes: >-
  Both official documents were downloaded from whitehouse.gov on 2026-11-19 and every quote was checked against
  the page text. News reports led here (found_via) and are not sources. The fact sheet doesn't say whose tariffs
  the "99 percent of goods" refers to, so the post quotes it exactly and doesn't explain it. Neither document gives
  current tariff rates, a cost estimate, an implementation date, or the agreement's text, so the post says none of
  those. Philippines and Southeast Asia items are summarized only by direct quotes; the fact sheet's dollar totals
  and job counts are labeled as the White House's own figures.
