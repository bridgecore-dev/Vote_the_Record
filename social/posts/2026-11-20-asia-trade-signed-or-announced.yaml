caption: |-
  Signed or announced? On Nov. 17, 2026, in Manila, President Donald J. Trump and Prime Minister Anutin Charnvirakul of Thailand signed a joint statement. It says the two countries "have reached substantial conclusion in their negotiations" on an Agreement on Reciprocal Trade (ART).

  What was signed: the statement. It says both countries "will now begin their respective necessary internal processes to prepare the ART for signature and entry into force." The agreement itself is not signed yet.

  What the White House says it would do: a Nov. 18 fact sheet says: "The trade deal, once signed, will eliminate tariffs on 99 percent of goods" and remove non-tariff barriers on American vehicles, medical devices, pharmaceuticals, ethanol and poultry.

  Who gains, who pays: the fact sheet says the deal gives "American workers, manufacturers, farmers, ranchers, and businesses unprecedented access to Thailand's market." Neither document gives a cost or names anyone who loses.

  Also announced: Thailand "intends to commit up to $123 million" toward HIMARS rocket systems; the White House counts "over $17 billion" in deals and investments from the trip. Several items are described as intentions or negotiations, not final agreements.

