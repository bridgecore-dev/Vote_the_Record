slides:
- kicker: How to reach Congress
  big: (202) 224-3121
  head: This is the U.S. Capitol Switchboard.
  text: An operator can connect you to your senator's office. The same number is listed on house.gov for the House.
  quote: {label: senate.gov, text: "A U.S. Capitol Switchboard operator can also connect you directly with the Senate office at (202) 224-3121."}
- kicker: Not sure who represents you?
  head: Your ZIP code finds your House member.
  text: The Find Your Representative page on house.gov matches your ZIP code to your congressional district, with links to your member's website and contact page.
- kicker: Your senators
  head: Pick your state on senate.gov to see your senators.
  text: The Contacting U.S. Senators page lists each senator, with phone numbers on each state's page or the senator's own website.
caption: |-
  One phone number reaches Congress: (202) 224-3121, the U.S. Capitol Switchboard. Senate.gov says an operator can connect you directly with a senator's office. House.gov lists the same number for the House.

  Not sure who represents you? House.gov can match your ZIP code to your congressional district. Senate.gov lists the senators for each state and how to reach them.
