notes: >-
  New this run: GovInfo's public-law feed posted P.L. 119-132 on Nov. 23, 2026 (approved Oct. 20, 2026, [H.R. 4467]);
  no post or open pull request covers it. Evergreen (signed more than a week ago), so it takes the empty Dec. 1
  6:00 p.m. Reel slot (after the 3:00 p.m. carousel; no bump). That is a design-trial slot: one change from the
  baseline, font sans (every alternate voice has already been tried). Facts: law text sec. 2; congress.gov actions
  (committee UC Nov. 20, 2025; House voice vote under suspension Mar. 16; Senate UC without amendment Sept. 22;
  signed Oct. 20). Battle dates, "turning point ... control of the Mississippi River", 400,000 visitors in 2022,
  "outdated" facilities and the interpretive center are as H. Rept. 119-452 states them; the report cites the
  National Park Foundation, the American Battlefield Trust, WJTV and the Magnolia Tribune for them (none opened).
  The $80 million / $10 million figures rest on that news story, and the slide and caption say so; please check
  you're comfortable with that. The report says CBO's estimate was "requested but not received"; congress.gov lists
  no CBO estimate, so no cost is given. "For free" restates "without consideration". The CRS summary is of the
  reported bill and matches the enacted text. No opposing view in the record (UC, voice vote, UC), so no case
  against is invented. Parties and states as congress.gov lists them; cosponsors alphabetical.
