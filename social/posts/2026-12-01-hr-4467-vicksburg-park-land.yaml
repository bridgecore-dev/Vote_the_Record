caption: |-
  About 7 acres of Vicksburg National Military Park in Mississippi are going to the State of Mississippi, for free. The President signed H.R. 4467, the Vicksburg National Military Park Boundary Modification Act, on Oct. 20, 2026; GovInfo posted it as Public Law 119-132 on Nov. 23.

  Before: two federal parcels inside the park, about 1.69 and 5.74 acres.

  After: the Interior Department gives both to Mississippi with no payment and moves the park boundary to leave them out. The land must help the public reach the park and improve visits, must not harm park resources or the visitor experience, and stays under any limits the Interior Secretary sets.

  Why: the U.S. House committee report says the park's facilities, including its visitor center, are outdated, and Mississippi plans a new interpretive center there. Citing a news story, the report puts the center at $80 million, with $10 million appropriated by Mississippi in 2023. No Congressional Budget Office estimate was printed.

  It passed the U.S. House of Representatives by voice vote and the U.S. Senate by unanimous consent. Sponsor: Rep. Bennie Thompson (D-MS).

  Should park land go to a state for this?

