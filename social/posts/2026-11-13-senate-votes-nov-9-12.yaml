caption: |-
  The Senate held 6 roll-call votes from Nov. 9 to Nov. 12. Two were on H.R. 2347, a House bill on the tax treatment of certain damages. Four were on judicial nominations, including the confirmation of Gregory Carl Cook to a federal district court in Alabama, 49-27.

  Swipe for every vote and its official tally. The House is next in session Nov. 17 at noon.
