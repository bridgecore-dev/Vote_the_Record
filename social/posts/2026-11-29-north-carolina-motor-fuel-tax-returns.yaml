bills:
- id: HB 3
  title: Relief at the Pump
  does: Set North Carolina's motor fuel tax at 0 cents a gallon from Oct. 10 through Nov. 30, 2026, paid for from a state reserve.
  affects: Fuel suppliers and importers, who mainly pay the tax, and buyers, whose price the law says should reflect it.
  where: Became law Oct. 9, 2026 as Session Law 2026-62. The pause ends Nov. 30.
  summary:
    text: "Notwithstanding G.S. 105-449.80, the motor fuel excise tax is suspended for a period beginning the day after this act becomes law through November 30, 2026. Therefore, the tax rate for this period is zero cents (0¢) per gallon."
