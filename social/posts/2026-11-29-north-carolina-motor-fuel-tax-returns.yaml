notes: >-
  New this run: no post covers HB 3 (2026 First Extra Session, session code 2025E1 on ncleg.gov). Found through
  WUNC's Nov. 17 story that lawmakers left without extending the pause (a tip only; the post doesn't say
  whether anyone will try to extend it). Every fact is from ncleg.gov, read 2026-11-25. Ratified text (H3v3.pdf,
  sha256 b3703db59b5c177bf999f0ee9ce8b171e1cdef94baae27f07fedcecf9641c1e1): Sec. 1(a) suspends the tax "beginning
  the day after this act becomes law through November 30, 2026"; approved Oct. 9, 2026, so the pause began Oct. 10
  (the fiscal note assumes the same). "41.0 cents" is the fiscal note's "In 2026, the motor fuels tax rate is 41.0
  cents per gallon"; after Nov. 30 the suspension no longer applies, so the G.S. 105-449.80 rate does, which is why
  the slides say "41.0 cents again, unless lawmakers change the law". $362.3 million, the hold-harmless transfer,
  $518.4 million and $156.1 million are from the fiscal note (HFN3v1.pdf, sha256
  d640b26d1d05393dbbac3d16f77a40d3842e227369f205ef82a3873f41d0f823), written for the First Edition; Sec. 1(a) and the
  long title read the same in the First Edition and the ratified text. Farm diesel: Sec. 2 and 3. "Both chambers
  ... Nov. 30 at noon" is the Legislative Calendar ("12:00 PM House: Session Convenes", same for the Senate). No
  vote tally on the slides (the bill page lists House roll calls 5 and 6 and Senate roll call 2), so there is no
  party slide. No official statement for or against an extension was opened, so the post ends with a question.
  Takes the free Nov. 29 8:15 p.m. story slot (no story is queued that day); nothing is bumped. RECHECK BEFORE THE
  SLOT: the calendar shows no session Nov. 25-29; if the General Assembly changes the tax before this posts, update
  slide 2 and the caption.
