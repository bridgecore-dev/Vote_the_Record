caption: |-
  North Carolina's pause on its motor fuel tax ends Nov. 30.

  House Bill 3, now Session Law 2026-62, set the tax at 0 cents a gallon starting Oct. 10. Before that, the 2026 rate was 41.0 cents a gallon. Unless lawmakers change the law, that rate applies again from Dec. 1.

  The legislature's Fiscal Research Division estimated the pause at $362.3 million in tax not collected. The law pays the road funds and other accounts back from the Stabilization and Inflation Reserve, which the division estimated would leave about $156.1 million unspent in that reserve.

  Separate farm diesel rules in the same law run through Dec. 31.

  The General Assembly is scheduled to meet again Nov. 30 at noon. Should the state pause the tax again, or keep the reserve?
