bills:
- id: S. 921
  title: Tyler's Law
  does: Would have HHS study how often emergency rooms test overdose patients for fentanyl, then issue guidance on whether to make it routine.
  affects: Hospital emergency departments, including freestanding ones, and patients treated there for an overdose.
  where: "Passed the U.S. Senate Mar. 23, 2026. On the U.S. House suspension list, week of Nov. 30, with a change."
  summary:
    text: >-
      This bill requires the Substance Abuse and Mental Health Services Administration (SAMHSA) to complete a study
      and issue guidance on hospital emergency departments testing for fentanyl or fentanyl-related substances when a
      patient is experiencing an overdose.
    title: Congressional Research Service summary of S. 921
    url: https://api.congress.gov/v3/bill/119/s/921/summaries
    retrieved: '2026-11-27'
  say: S. 921 would have Health and Human Services study how often emergency rooms test overdose patients for fentanyl,
    then issue guidance on whether to make it routine. It passed the United States Senate in March.
