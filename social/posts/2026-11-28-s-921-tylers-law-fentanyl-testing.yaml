notes: >-
  News first: a dated event in the next three days (the House's week of Nov. 30 begins Monday; docs.house.gov lists S. 921
  under suspension). Takes the Nov. 28 12:00 a.m. Reel slot, the earliest Reel slot at least 3 hours away held by an
  evergreen post (Nov. 27 6:00 p.m. goes to the H.R. 2347 Reel in PR #331), and moves the prefiled Texas HB 1241 Reel
  (filed Nov. 18, no design, so not a design trial) to Dec. 27 12:00 a.m. That's the first Reel slot after the last
  queued post that can't put two Reels in a row whether or not #331 merges: #331 puts the HB 1184 Reel at Dec. 26 6:00 a.m.,
  and without it the last queued post is the Dec. 26 3:00 a.m. carousel. No post or open pull request covers S. 921.
  Rule check: the other items on the list are H.R. 2332 (FBI background checks for licensing compacts), H.R. 9503 (Secret
  Service Police name), S. 4394 (police leadership training), S. 494 (epilepsy plan), S. 162 (foster care), H.R. 1669
  (trafficking training), H.R. 4449 (SEC small business offices), S. 4631 (contractor whistleblowers), and bills already
  posted (S. 3296, H.R. 4624, H.R. 3514, H.R. 3100, S. 4850, S. 1157, H.R. 1520) or medals and coins (S. 645, H.R. 4382,
  H.R. 1628), from their CRS summaries or titles; none is about overdoses. Records opened 2026-11-27: the floor list,
  the suspension text ("Suspend the Rules and Pass the Bill, S. 921, With an Amendment", dated Nov. 12, 2026; sha256
  2dcf76751fa77b8b07194a0cb8f36a2e4939cc07e2f147e8debe0e00c917b03e), the Senate-passed text on GovInfo, congress.gov
  actions, summary and bill record. A word-by-word comparison found one change: sec. 2(a) "3 years" → "2 years"; please
  confirm. "Health and Human Services, through its mental health and substance use office" shortens "the Secretary of
  Health and Human Services, acting through the Assistant Secretary for Mental Health and Substance Use"; the CRS summary
  says SAMHSA. "It doesn't require hospitals to test" is our reading: sec. 2 directs only a study and guidance. Who
  Tyler was isn't in any record opened, so the post doesn't say. Suspension (two-thirds of members voting, 40 minutes,
  the motion "may not be separately amended") and the return to the Senate (agree, conference, or further amend) are from
  How Our Laws Are Made (House Parliamentarian, H. Doc. 110-49), parts on the motion to suspend and XVI. CBO's estimate
  (Apr. 8, 2026, "As passed by the Senate") is listed on congress.gov; cbo.gov returned 403 this run, so it's linked,
  not quoted. No statement for or against was opened; it passed the Senate by unanimous consent, so no case-against
  slide. Sponsor Sen. Banks (R-IN) per congress.gov, not named on the slides. If the House votes before this posts
  (it can't: the House returns Nov. 30), the last slide needs the tally.
