caption: |-
  Should emergency rooms test every overdose patient for fentanyl? S. 921, Tyler's Law, is on the U.S. House of Representatives schedule for the week of Nov. 30.

  What it does: Health and Human Services studies how often ERs test overdose patients for fentanyl, what it costs, its benefits and risks, and patient privacy. Within 9 months after the study, it issues guidance on whether testing should be routine.

  It doesn't require hospitals to test.

  The U.S. Senate passed it by unanimous consent on March 23, with the study due within 3 years. The House text makes it 2 years. It comes up under suspension of the rules and needs two-thirds of members voting. If it passes, the bill goes back to the U.S. Senate.

