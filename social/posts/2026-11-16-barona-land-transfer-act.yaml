notes: >-
  Split from the three-bill post (2026-11-16-federal-land-transfers-three-bills) at the owner's request: one
  bill per post, so similar bills aren't mistaken for each other. H.R. 2400 gets a carousel, H.R. 10136 a Reel.
  847 = 164 (Parcel 1, BLM) + 683 (Parcels 2 and 3, Forest Service), all "approximately" in the reported text
  (H. Rept. 119-858), so the caption says "about". Conditions, the 1931 reservoir sale and "between the Barona
  and the Capitan Grande Reservations" are from H. Rept. 119-858. CBO: the report says the estimate was requested
  but not received. Sponsor's party and state as the report lists them. Check for a House vote before 10:30 a.m.
  Nov. 17; if it passed Nov. 16, the last slide needs the tally.
