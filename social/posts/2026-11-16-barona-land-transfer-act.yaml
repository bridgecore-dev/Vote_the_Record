caption: |-
  A bill on the U.S. House of Representatives schedule this week would move about 847 acres of federal land in San Diego County, California.

  Before: the Bureau of Land Management runs 164 acres and the Forest Service runs 683. After: the U.S. would hold all of it in trust for the Barona Band, as part of the band's reservation. No gaming; the public keeps access to recreation, roads and trails; the band maintains the fuel break.

  The committee report says the land lies between the band's reservation and its first one, Capitan Grande, part of which San Diego bought in 1931 for a reservoir. The CBO estimate wasn't in yet.

  Should Congress move federal land this way?

  Voice: computer-generated (Kokoro text-to-speech).
