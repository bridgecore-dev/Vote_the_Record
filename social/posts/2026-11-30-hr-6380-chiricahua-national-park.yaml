caption: |-
  Chiricahua National Monument in southeastern Arizona is now Chiricahua National Park. The President signed H.R. 6380, the Chiricahua National Park Act, on Oct. 20, 2026; GovInfo posted it as Public Law 119-133 on Nov. 24.

  Before: a national monument since 1924, about 12,000 acres, run by the National Park Service.

  After: the same boundaries, funds and rules under a new name. The Congressional Budget Office said the change "would not change the ownership or management of the area." The law also has the Park Service protect tribal cultural and religious sites, give tribal members access, and, if a Tribe asks, close small areas to the public for the shortest time needed.

  Cost: less than $500,000 over 2026-2031, CBO estimated, subject to appropriations. The House committee report says supporters expect more visitors and help for nearby towns.

  It passed the U.S. House of Representatives by voice vote and the U.S. Senate by unanimous consent. Sponsor: Rep. Juan Ciscomani (R-AZ). Cosponsor: Rep. Greg Stanton (D-AZ).

  Does the word "park" matter to you?

  Voice: computer-generated (Kokoro text-to-speech).
