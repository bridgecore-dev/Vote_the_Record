notes: >-
  New this run: GovInfo's public-law feed posted P.L. 119-133 on Nov. 24, 2026 (approved Oct. 20, 2026, [H.R. 6380]);
  no post or open pull request covers it. Evergreen (signed more than a week ago), so it takes the first free Reel
  slot that keeps the Reel/post turn: Nov. 30 6:00 p.m. (Nov. 29 6:00 a.m. or 9:00 a.m. alone would put two of a kind
  in a row). That is a design-trial slot: one change from the baseline, palette forest. Facts: law text (sections 2-3);
  congress.gov actions (House voice vote under suspension Mar. 16; Senate committee discharged and bill passed
  without amendment by UC Sept. 30; signed Oct. 20); 1924/Coolidge, 12,000 acres, "over 85 percent" wilderness,
  hoodoos and the supporters' view are as H. Rept. 119-543 states them (it cites NPS pages and news for them). The
  proclamations are 1692 and 2288 as the law cites them (no years on the slides). CBO's "less than $500,000 over the 2026-2031 period" and "would not change the ownership or management"
  are from the CBO estimate printed in the report (Feb. 2026, as ordered reported by the House committee); a later
  CBO estimate (cbo.gov/publication/62648, Senate committee) wasn't opened. The report's "64th national park" isn't
  used, since the count may have changed since March. CRS summary is of the introduced bill and still matches the
  enacted sections 2-3. "Visitors: some areas may close briefly" is our reading of sec. 3(b)(1)(B)-(2); please check.
  No opposing view in the record (committee unanimous consent, voice vote, Senate UC), so no case against is
  invented. Parties and states as congress.gov lists them.
