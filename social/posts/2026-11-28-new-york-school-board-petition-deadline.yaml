notes: >-
  An official action from Nov. 20 (nyassembly.gov actions, read 2026-11-23: "11/13/2026 delivered to governor",
  "11/20/2026 signed chap.381"). Found through Open States' action feed (a tip only, not a source). No post or open
  pull request covers A4384. Rule: picked from the Nov. 20 signings because it changes a ballot-access deadline; the
  Chapter 380 post (new school board seats) is a separate post with the same layout. Everything is from the one
  Assembly page: the text (sec. 1, Education Law 2608(1): bracketed "twentieth" replaced by "thirtieth day preceding
  the day of the annual election"; "signed by at least one hundred persons qualified to vote at school elections";
  sec. 3: "take effect on the first of July next succeeding the date on which it shall have become a law", so July 1,
  2027 is our count from the Nov. 20 signing, please confirm), the memo (purpose "thirty days ... rather than twenty",
  the quoted justification, the 5-day objection, 5-day review and next-day ballot sequence, fiscal "To be
  determined."), the actions and the Assembly floor vote (141/0, March 30, 2026). "Small city" is the summary's and
  memo's word; sec. 2608 itself says "city school district"; no source opened defines which cities count, so no
  population figure is on a slide. "Must have their signatures 10 days sooner" is our plain reading of the date change; no
  source states a downside. The Senate tally isn't on the Assembly page (nysenate.gov returned 403 this run, not
  retried), so the Senate line gives only the date (substituted for S7150B, not named: one bill per post). No party is
  shown; the Assembly record doesn't list it. Names the chapter, not the Assembly number, like the other New York
  posts. Takes Nov. 28 12:00 p.m., a free Reel slot after the Nov. 28 9:00 a.m. carousel, so no post is bumped.
