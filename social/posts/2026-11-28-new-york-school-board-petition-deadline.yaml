caption: |-
  New York changed a ballot deadline for school board races in its small city school districts. Candidates must now file their nominating petitions, the signed forms that put them on the ballot, at least 30 days before the annual election instead of 20. It was signed Nov. 20, 2026 as Chapter 381 of the Laws of 2026 and takes effect July 1, 2027.

  Before: petitions were due the 20th day before the election.
  Now: the 30th day. A petition still needs the signatures of at least 100 people qualified to vote in the district.

  For: the sponsor's memo says the old timing "deprives residents of small city school districts the right to object to the sufficiency of the petitions." The new timing allows 5 days for the public to object, 5 days for the board to review objections, and a final ballot the next day.
  The trade-off: candidates must have their signatures in 10 days sooner. The memo lists the cost as "To be determined." We found no statement against it.

  The New York State Assembly passed it 141-0 on March 30, 2026, and the New York State Senate passed it June 2, 2026.

  Is 30 days the right deadline for school board petitions?

