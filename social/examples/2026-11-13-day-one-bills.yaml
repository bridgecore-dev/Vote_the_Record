caption: |-
  1,262 bills and resolutions were filed in Texas on Nov. 9, the first day lawmakers could file for the 2027 session. Here's the first House bill filed on each of 10 topics, from health care to water.

  How we picked: for each topic, the lowest-numbered House bill filed Nov. 9 whose official caption is mainly about it, one per lawmaker. Bill captions are quoted from Texas Legislature Online.

  Which topic should we follow next? Tell us below.
