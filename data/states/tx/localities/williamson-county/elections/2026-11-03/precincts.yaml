- id: tx/localities/williamson-county/elections/2026-11-03/precincts#S-01
  headline: Williamson County voter precincts (2026)
  statement: Williamson County's GIS layer "Current Voter Precincts" (177 precincts), published by Williamson County GIS, gives each precinct's number, outline, and commissioner precinct.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://gis.wilco.org/arcgis/rest/services/public/county_elections/MapServer/2
  source_title: 'Williamson County GIS: Current Voter Precincts'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-15'
  retrieved: '2026-10-15'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read from https://gis.wilco.org/arcgis/rest/services/public/county_elections/MapServer/2 on 2026-10-15; SHA-256 of the downloaded query responses: 60da98107f73c053945a7ae264903c17754ba74a174a16739ef44e081ee59c2d. Each precinct''s districts were assigned by overlaying the district maps named in precincts#S-05. The county publishes commissioner, constable and justice of the peace precincts as a single layer ("Commissioner, Constable, JP Precincts"), so each precinct''s JP precinct is its commissioner precinct.'
- id: tx/localities/williamson-county/elections/2026-11-03/precincts#S-02
  headline: The 2025 congressional map (plan C2333) is in use for 2026
  statement: On December 4, 2025, the U.S. Supreme Court granted Texas's application to stay the November 18, 2025 district court order that had blocked the new congressional map, allowing it to be used.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  source_title: 'Supreme Court of the United States: Abbott v. LULAC, No. 25A608, order of December 4, 2025'
  source_kind: document
  sha256: 980b35bc80a5e7fd33e109ea783ecf60135405f71014a6d2cecb3adf92b6f3bc
  archive_url: https://web.archive.org/web/20260930221333/https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  event_date: '2026-10-15'
  retrieved: '2026-10-15'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: Congressional districts come from the Texas Legislative Council's PLANC2333 shapefile rather than the county's own congressional layer, so the 2025 map is used.
