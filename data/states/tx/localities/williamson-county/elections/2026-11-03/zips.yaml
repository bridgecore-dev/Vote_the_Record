  event_date: '2026-10-15'
  retrieved: '2026-10-15'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-15; SHA-256 of the downloaded query responses: fddeec2a2dfce0f3aead64171d363563ef1bcd2ab2dddf3601715e3c682bbca0. ZIP-to-district links were computed by overlaying these areas on the county precinct layer on a 0.001-degree grid; a precinct counts for a ZIP when it covers at least 1% of the ZIP''s grid cells in Williamson County. Results are approximate; the precinct lookup is exact.'
- id: tx/localities/williamson-county/elections/2026-11-03/zips#S-02
  headline: Williamson County voter precincts (2026)
  statement: Williamson County's GIS layer "Current Voter Precincts" (177 precincts), published by Williamson County GIS, gives each precinct's number, outline, and commissioner precinct.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://gis.wilco.org/arcgis/rest/services/public/county_elections/MapServer/2
  source_title: 'Williamson County GIS: Current Voter Precincts'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-15'
  retrieved: '2026-10-15'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read from https://gis.wilco.org/arcgis/rest/services/public/county_elections/MapServer/2 on 2026-10-15; SHA-256 of the downloaded query responses: 60da98107f73c053945a7ae264903c17754ba74a174a16739ef44e081ee59c2d. Each precinct''s districts were assigned by overlaying the district maps named in precincts#S-05. The county publishes commissioner, constable and justice of the peace precincts as a single layer ("Commissioner, Constable, JP Precincts"), so each precinct''s JP precinct is its commissioner precinct.'
