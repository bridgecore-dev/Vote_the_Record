  event_date: '2026-10-20'
  retrieved: '2026-10-20'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-20; SHA-256 of the downloaded query responses: bab1edb00a26f69ecd518f8fcd1461427c8dd51ca779c38c127e2430d20a9bb8. ZIP-to-district links were computed by overlaying these areas on the county precinct layer on a 0.001-degree grid; a precinct counts for a ZIP when it covers at least 1% of the ZIP''s grid cells in Bell County, or when at least 50% of the precinct lies in the ZIP. Results are approximate; the precinct lookup is exact.'
