  headline: Voted yes on the 2026 county property tax rate (2026)
  result: Passed the Commissioners Court 4-1.
  statement: 'As Commissioner for Precinct 2 on the Bell County Commissioners Court, voted yes on Minute Order #208/26, adopting the FY2027 Bell County tax rate. The minutes record the motion "I move that the property tax rate be increased by the adoption of a tax rate of $0.3463, which is below the proposed tax rate" ($0.2995 for Bell County and $0.0468 for the Bell County Road District, per $100 assessed value) and that "The matter passed in a vote of four (4) in favor - County Judge David Blackburn, Commissioner Russell Schneider, Commissioner Bobby Whitson, and Commissioner Greg Reynolds; and one (1) opposed - Commissioner Louie Minor." The vote was at the August 24, 2026 special session.'
