  headline: Voted yes on a motion to lower the 2026 tax rate (2026)
  result: Failed in the Commissioners Court 2-3.
  statement: 'As Commissioner for Precinct 2 on the Bell County Commissioners Court, voted yes on an amendment, during Minute Order #208/26, to a motion for a tax rate of $0.3635 (the proposed rate). The minutes record that Commissioner Bobby Whitson "moved to amend said motion to lower the tax rate with the intent of taking the loss of revenue from the General Fund reserve, to include a budgeted transfer out of the General Fund to Road and Bridge and putting the matter on the ballot next year for voters to decide" and that "This amended motion failed in a vote of two (2) in favor - County Judge David Blackburn and Commissioner Bobby Whitson; and three (3) opposed - Commissioner Russell Schneider, Commissioner Greg Reynolds and Commissioner Louie Minor." The minutes give no rate for the amendment. The vote was at the August 24, 2026 special session.'
