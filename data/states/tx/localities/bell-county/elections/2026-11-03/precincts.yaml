  reviewer: null
  notes: 'Read on 2026-10-20; SHA-256 of the downloaded query responses: 73b126f86f27e3eb04d5054ab5b7b960f48549d5706c6e1e44014206008b73ad. Areas used: bartlett-isd (layer 14, GEOID 4809540), city-of-killeen (layer 28, GEOID 4839148), city-of-nolanville (layer 28, GEOID 4851708), city-of-temple (layer 28, GEOID 4872176), copperas-cove-isd (layer 14, GEOID 4815240), florence-isd (layer 14, GEOID 4819320), holland-isd (layer 14, GEOID 4823370). A precinct or ZIP code at least 99% inside an area counts as inside it; one at least 1% inside, or holding at least 1% of the area, is marked as depending on the address. The address lookup uses the outlines directly.'
