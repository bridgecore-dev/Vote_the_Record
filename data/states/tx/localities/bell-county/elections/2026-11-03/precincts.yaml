- id: tx/localities/bell-county/elections/2026-11-03/precincts#S-05
  headline: District maps used to assign each precinct its districts
  statement: 'The Bell County precinct layer lists precinct numbers only, so each precinct was assigned the district that covers most of it on these official maps: Texas Legislative Council: PLANC2333 (congressional districts enacted 2025, 89th Legislature, 2nd C.S.) (https://data.capitol.texas.gov/dataset/748c952b-e926-4f44-8d01-a738884b3ec8/resource/5712ebe1-d777-4d4a-b836-0534e17bca01/download/planc2333.zip); Texas Legislative Council: PLANH2316 (State House districts, 2023-2026) (https://data.capitol.texas.gov/dataset/71af633c-21bf-42cf-ad48-4fe95593a897/resource/a4d3230f-47f2-4253-85f3-51a6c3c9ad0a/download/planh2316.zip); Bell County GIS: Commissioners Precincts (https://services3.arcgis.com/jjDKBbyoUNyhuTYf/arcgis/rest/services/Commissioners_Shapefiles/FeatureServer/0); Bell County GIS: Justice of the Peace Districts (https://services3.arcgis.com/jjDKBbyoUNyhuTYf/arcgis/rest/services/Bell_County_Justice_of_the_Peace_Districts/FeatureServer/0).'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://data.capitol.texas.gov/dataset/748c952b-e926-4f44-8d01-a738884b3ec8/resource/5712ebe1-d777-4d4a-b836-0534e17bca01/download/planc2333.zip
  source_title: Texas Legislative Council and county district maps
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-20'
  retrieved: '2026-10-20'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-20; SHA-256 of the downloaded files: 9c552b6ae409c2b57021e017d6c570dd76004de86adae8a0e0c36907a2f62e2f. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): none.'
- id: tx/localities/bell-county/elections/2026-11-03/precincts#S-06
  headline: Ballot styles settle city and school district membership
  statement: 'Bell County prints one ballot style for each part of a precinct that votes on different local contests
    (styles such as 110CW and 110KIL). Where the Census outlines disagreed with the styles, the styles were followed: a
    precinct is in a city or school district when every one of its styles carries that body''s contests, split when only
    some do, and outside it when none do. Precincts 110, 117, 118, 211, 217, 319, 402, 409, 413 were corrected to match the ballot styles: 110: city-of-killeen none -> part; 110: city-of-temple part -> none; 117: city-of-killeen none -> full; 118: city-of-temple part -> none; 211: city-of-killeen full -> part; 217: city-of-killeen part -> full; 319: city-of-temple part -> full; 402: copperas-cove-isd part -> none; 409: florence-isd part -> none; 413: city-of-killeen part -> full.'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.bellcountytx.com/departments/elections/ballot_samples.php
  source_title: 'Bell County Elections Department: Ballots by Voting Precinct, November 3, 2026 General Election'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-11-03'
  retrieved: '2026-10-20'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: The styles are scanned PDFs read with OCR (each style's text searched for the body's name). Within a split
    precinct, the address lookup still uses the Census outline to place an address.
