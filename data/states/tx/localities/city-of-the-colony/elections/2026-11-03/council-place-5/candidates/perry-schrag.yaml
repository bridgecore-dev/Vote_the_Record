  statement: As a member of The Colony City Council, voted yes on September 1, 2026 on the ordinance adopting a tax rate for fiscal year 2027 (Ordinance No. 2026-2659). The item as listed set a total rate of $0.630000 per $100 of taxable value, the same as the current rate; the motion, made by Mayor Pro Tem Joel Marks and seconded by Councilmember Brian R. Wade, was "to approve with a quarter cent reduction to the current tax rate." The minutes record that it carried with Councilmember Judy Ensweiler and Deputy Mayor Pro Tem Robyn Holtz voting no. The minutes do not state the resulting rate.
