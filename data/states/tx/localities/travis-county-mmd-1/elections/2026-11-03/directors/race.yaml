- id: tx/localities/travis-county-mmd-1/elections/2026-11-03/directors/race#S-HOLDER
  headline: Who holds this office now
  statement: 'The official page (Order Calling an Operation and Maintenance Tax Election ... and a Permanent Directors Election for Travis County Municipal Management District No. 1), checked on October 30, 2026, lists the current members: Mickey Jamail, Daniel Kavelman, Felicity Maxwell, Casey Paulson and Ryan Puzycki. Of the candidates in this race, Casey Paulson, Daniel Kavelman, Felicity Maxwell, Mickey Jamail and Ryan Puzycki are among them. It reads: "The ballots used in the election for the permanent directors shall have the names of five initial directors appointed by the Commission, or their replacements as follows: ( ) Mickey Jamail ( ) Daniel Kavelman ( ) Felicity Maxwell ( ) Casey Paulson ( ) Ryan Puzycki"'
