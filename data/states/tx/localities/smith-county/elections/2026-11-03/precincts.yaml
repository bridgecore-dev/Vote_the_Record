- id: tx/localities/smith-county/elections/2026-11-03/precincts#S-02
  headline: The 2025 congressional map (plan C2333) is in use for 2026
  statement: On December 4, 2025, the U.S. Supreme Court granted Texas's application to stay the November 18, 2025 district court order that had blocked the new congressional map, allowing it to be used.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  source_title: 'Supreme Court of the United States: Abbott v. LULAC, No. 25A608, order of December 4, 2025'
  source_kind: document
  sha256: 980b35bc80a5e7fd33e109ea783ecf60135405f71014a6d2cecb3adf92b6f3bc
  archive_url: https://web.archive.org/web/20260930221333/https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  event_date: '2026-10-20'
  retrieved: '2026-10-20'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: The whole county is in Congressional District 1, State Senate District 1 and SBOE District 9 (the county layer and the Texas Legislative Council's district table agree).
- id: tx/localities/smith-county/elections/2026-11-03/precincts#S-05
  headline: District maps used to assign each precinct its districts
  statement: 'The Smith County precinct layer lists precinct numbers only, so each precinct was assigned the district that covers most of it on these official maps: Smith County Elections: Voting Districts (State House) (https://services3.arcgis.com/dPuMck04cWB2fx4h/arcgis/rest/services/FallElectionDistricts_20261103b_WFL1/FeatureServer/3); Smith County Elections: Voting Districts (Commissioner) (https://services3.arcgis.com/dPuMck04cWB2fx4h/arcgis/rest/services/FallElectionDistricts_20261103b_WFL1/FeatureServer/3); Smith County Elections: Voting Districts (Justice of the Peace) (https://services3.arcgis.com/dPuMck04cWB2fx4h/arcgis/rest/services/FallElectionDistricts_20261103b_WFL1/FeatureServer/3); Smith County Elections: Voting Districts (ESD fire districts) (https://services3.arcgis.com/dPuMck04cWB2fx4h/arcgis/rest/services/FallElectionDistricts_20261103b_WFL1/FeatureServer/3); Smith County Elections: Voting Districts (City) (https://services3.arcgis.com/dPuMck04cWB2fx4h/arcgis/rest/services/FallElectionDistricts_20261103b_WFL1/FeatureServer/3).'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://services3.arcgis.com/dPuMck04cWB2fx4h/arcgis/rest/services/FallElectionDistricts_20261103b_WFL1/FeatureServer/3
  source_title: Texas Legislative Council and county district maps
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-20'
  retrieved: '2026-10-20'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-20; SHA-256 of the downloaded files: 1af9e55e1231accaaaf4b1c2ca7ae8a9a6af1d803e3e26645ae44a401e934f28. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): precinct 109: esd 2/district-1 covers 65%; precinct 239: esd 2/district-3 covers 87%; precinct 324: esd 2/district-3 covers 93%; precinct 333: esd 1/district-2 covers 69%; precinct 336: esd 1/district-3 covers 86%; precinct 339: esd 1/district-1 covers 64%; precinct 345: esd 2/district-2 covers 45%; precinct 421: esd 2/district-2 covers 75%; precinct 427: esd 2/district-1 covers 91%; precinct 442: esd 2/district-2 covers 84%; precinct 445: esd 2/district-1 covers 95%; precinct 448: esd 2/district-1 covers 36%; precinct 451: esd 1/district-2 covers 56%; precinct 454: esd 2/district-1 covers 32%; precinct 242: city city-of-arp covers 3%.'
- id: tx/localities/smith-county/elections/2026-11-03/precincts#S-07
  headline: Per-precinct ballots settle ESD fire-district membership
  statement: 'Smith County posts a sample ballot for each piece of a precinct that votes on different contests, labeled by
    precinct and ESD district (for example "Pct 333 ESD 1 District 5" and "Pct 333 County"). Where the map disagreed, the
    ballots were followed: 109: ESD-2 District 5 (part); 118: ESD-2 District 5 (part); 124: ESD-2 District 5 (part); 127: ESD-2 District 5 (part); 133: ESD-2 District 5 (part); 139: ESD-2 District 5 (part); 142: ESD-2 District 5 (part); 342: ESD-1 District 5 (part); 345: ESD-1 District 3 and ESD-1 District 5 (part); 442: no ESD district.'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.smith-county.com/396/Current-Sample-Ballots
  source_title: 'Smith County Elections: Current Sample Ballots (November 3, 2026)'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-11-03'
  retrieved: '2026-10-20'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: Each ESD district ballot carries only that district's commissioner place. The link labeled "Pct 451 ESD 1 District
    3" (Laserfiche document 9904) opens the District 2 (Place 2) ballot, so precinct 451 keeps the map's Districts 2 and
    3. Within a split precinct, the address lookup uses the county map to place an address.
