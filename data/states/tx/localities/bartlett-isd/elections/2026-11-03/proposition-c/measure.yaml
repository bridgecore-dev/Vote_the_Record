# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Bartlett ISD, Proposition C
election_date: '2026-11-03'
kind: bond
ballot_text: THIS IS A PROPERTY TAX INCREASE. The issuance of not to exceed $1,000,000 of Bartlett Independent School District refunding bonds for the purpose of refunding all or a portion of the principal, interest, and redemption premium on previously issued time warrants of the District styled "Bartlett Independent School District Time Warrants, Series 2024, dated March 1, 2024" and the levying of a tax sufficient to pay the principal and interest on the bonds and the cost of any credit agreements executed in connection with the Bonds.
choices:
- For
- Against
