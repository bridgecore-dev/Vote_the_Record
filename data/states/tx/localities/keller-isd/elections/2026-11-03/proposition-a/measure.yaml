# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Keller ISD, Proposition A
election_date: '2026-11-03'
kind: bond
ballot_text: THIS IS A PROPERTY TAX INCREASE; the issuance of $756,300,896 of bonds by the Keller Independent School District for the purpose of designing, constructing, renovating, improving, upgrading, updating, modernizing, acquiring and equipping school facilities (and any necessary or related removal of existing facilities), including districtwide safety and security upgrades, capital improvements, replacement of mechanical, electrical, plumbing and HVAC systems and technology network, infrastructure and equipment, and the levy of taxes sufficient to pay the principal of and interest on the bonds.
choices:
- For
- Against
