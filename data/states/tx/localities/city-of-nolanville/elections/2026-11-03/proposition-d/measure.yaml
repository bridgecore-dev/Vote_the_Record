# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Nolanville, Proposition D
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Shall Section 3.08 - Vacancies; Forfeiture of Office; Filling of Vacancies of the Nolanville Charter be amended to clarify the process for determining whether three consecutive absences from regular City Council meetings are excused or unexcused prior to any forfeiture of office? If approved, the sections will read: SECTION 3.08 - Vacancies; Forfeiture of Office; Filling of Vacancies Fails to attend three consecutive regular meetings of the Council. Upon such occurrence, the matter shall be presented to the Council, which may, at its discretion, determine whether the absences are excused or unexcused and take appropriate action, including forfeiture of office.'
choices:
- FOR
- AGAINST
