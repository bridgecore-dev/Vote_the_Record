# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Nolanville, Proposition F
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Shall Section 3.08 - Vacancies; Forfeiture of Office; Filling of Vacancies of the Nolanville Charter be amended to require the City Council to fill a vacancy in the office of Mayor or City Council within ninety (90) days and provide that the appointee shall serve until the next regular November municipal election, at which time a successor shall be elected to serve the remainder of the unexpired term, if any? If approved, this section will read: SECTION 3.08 - Vacancies; Forfeiture of Office; Filling of Vacancies When a vacancy occurs in the office of Mayor or City Council, the remaining members of the City Council shall appoint a qualified person to fill such vacancy within ninety (90) days of the occurrence of the vacancy. The appointee shall serve until the next regular municipal election held in November, at which time a successor shall be elected to serve the remainder of the unexpired term, if any. For purposes of this section, a vacancy shall be deemed to occur on the date the office is declared vacant in accordance with this Charter.'
choices:
- FOR
- AGAINST
