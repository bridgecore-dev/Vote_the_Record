# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Nolanville, Proposition I
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Shall Section 9.13 - Referendum; Petition; Procedure; Effect Prior to Election of the Nolanville Charter be amended to revise the timeframe for the City Council to repeal or submit a referendum ordinance to the qualified voters from thirty (30) days to sixty (60) days, consistent with other provisions of the Charter? If approved, this section will read: SECTION 9.13 - Referendum; Petition; Procedure; Effect Prior to Election City Council shall either repeal the referendum ordinance or submit the referendum ordinance to the qualified voters of the City within sixty (60) days after the date the petition was finally determined sufficient, or at the next uniform election date, if a uniform election date does not exist within sixty (60) days after the petition is finally determined sufficient.'
choices:
- FOR
- AGAINST
