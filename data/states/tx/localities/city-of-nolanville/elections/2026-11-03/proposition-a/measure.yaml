# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Nolanville, Proposition A
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Shall Section 1.05 - Wards of the Nolanville Charter be deleted to remove provisions authorizing the creation of council wards and ward boundaries? If approved, this section will be deleted: 1. SECTION 1.05 - Wards The city council shall have the power to create wards or change the boundaries of wards so created, designating and describing same by metes and bounds or other adequate means, provided that at no time shall there be greater than four (4) wards and when created, each ward shall have as nearly as possible the same number of residents residing therein. The city council may, at its discretion, appoint a commission of citizens of the City to set and/or review the ward boundaries in order to maintain a substantial equality of residents in each district.'
choices:
- FOR
- AGAINST
