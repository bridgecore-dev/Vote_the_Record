name: City of Nolanville, Proposition H
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Shall Section 8.03 - Franchises of the Nolanville Charter be amended to remove the Charter requirement for publication of franchise ordinances in the City''s official newspaper before such ordinances take effect? If approved, this section will read: SECTION 8.03 - Franchises Any ordinance granting, renewing or extending franchises shall not take effect until at least thirty (30) days after its passage.'
