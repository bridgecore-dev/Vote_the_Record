# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Nolanville, Proposition C
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Shall Section 3.06 of the Nolanville Home Rule Charter be amended to remove the provision authorizing the Mayor, with the advice and consent of the City Council, to appoint members of citizen advisory boards and commissions in order to eliminate conflicting language within the Charter? If approved, Section 3.06 will read: SECTION 3.06 - Mayor The Mayor shall be the presiding officer of the City Council and shall be recognized as the head of the City government for all ceremonial purposes, for emergency management purposes, and by the governor for purposes of military law. The Mayor may debate and discuss any matters before the City Council and shall only vote on issues resulting in a tie by the City Council. The Mayor shall, when authorized as necessary by the City Council, sign all official documents. The Mayor shall have no veto power.'
choices:
- FOR
- AGAINST
