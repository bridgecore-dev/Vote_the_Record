ballot_text: 'Shall Section 3.08 - Vacancies; Forfeiture of Office; Filling of Vacancies of the Nolanville Charter be amended to provide that the City Council shall be the final authority in determining whether a forfeiture of office has occurred and the effective date of that forfeiture? If approved, the sections will read: SECTION 3.08 - Vacancies; Forfeiture of Office; Filling of Vacancies The City Council shall be the final authroity in determining whether a forfeiture of office has occurred, including the effective date of such forfeiture.'
