ballot_text: 'Shall Section 3.03 - Qualifications of the Nolanville Charter be amended to require that candidates for Mayor or City Council have resided continuously within the corporate limits of the City for twelve (12) months immediately preceding the filing deadline for office, rather than the date of the election or appointment? If approved, Section 3.03 will read: SECTION 3.03 - Qualifications Have resided continuously in the corporate limits of the City for twelve (12) months immediately preceding the filing deadline.'
