# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Nolanville, Proposition G
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Shall Section 3.09 - Prohibitions of the Nolanville Charter be amended to revise the term limit provisions by limiting an individual to four (4) two-year terms in any one elective office regardless of whether the terms are consecutive, while retaining separate term limits for each elective office? If approved, this section will read: SECTION 3.09 - Prohibitions Term Limits. No person shall serve for more than four (4) two (2) year terms in any one office. For purposes of this section: a. Service by appointment to fill a vacancy shall not be counted toward the term limits established herein. b. Term limits shall apply separately to each elective office. Service in one office shall not be counted toward the term limits of another office.'
choices:
- FOR
- AGAINST
