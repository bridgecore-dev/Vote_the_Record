ballot_text: THIS IS A PROPERTY TAX INCREASE "The issuance of bonds in the amount of $20,000,000 of Eagle Mountain-Saginaw Independent School District for the purpose of refunding all or a portion of the principal and/or interest on certain previously issued maintenance tax obligations of the District styled "Eagle Mountain-Saginaw Independent School District Maintenance Tax Notes, Series 2026", and the levying of a tax sufficient to pay the principal of and interest on the bonds."
