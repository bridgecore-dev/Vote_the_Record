name: City of Odessa, Proposition OO
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Referendum: Shall Section 87 of the City of Odessa Home Rule Charter be amended to reduce the minimum amount of signatures on referendum petition, removing out-of-date language, requiring the city secretary to review and process a petition within a reasonable time period, and clarifying that submission of referendum petition to the voters shall be at the next uniform municipal election date in accordance with state law?'
