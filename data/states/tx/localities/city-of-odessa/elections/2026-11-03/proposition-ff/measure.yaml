ballot_text: 'Emergency measures defined: Shall Section 62 of the City of Odessa Home Rule Charter defining the term ''emergency measures'' as used in section 61 be removed if the voters approve the amendment of section 61 of the City Charter to eliminate the requirement that an ordinance be presented to City Council twice before such adoption unless such ordinance is declared an emergency measure?'
