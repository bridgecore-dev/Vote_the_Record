# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Odessa, Proposition A
election_date: '2026-11-03'
kind: tax-rate
ballot_text: THIS IS A TAX INCREASE Authorizing the City of Odessa, Texas, to designate a venue project and provide for the financing, planning, design, acquisition, construction, development, improvement, operation, and maintenance of the following venue project, a new multipurpose sports venue facility in the City known as the Odessa Sports Complex and related infrastructure and facilities, a venue project of the type described in and as authorized by Chapter 334 of the Texas Local Government Code and as designated and described by the City of Odessa City Council Resolution No. 2026R-42 dated April 14, 2026 (the "Resolution"), and to impose a new and an additional hotel occupancy tax at the maximum rate of 2.0% for the purpose of financing the Odessa Sports Complex venue project and approving the Resolution. If approved, the maximum hotel occupancy tax rate imposed from all sources in the City of Odessa would be 17.0% of the price paid for a room in a hotel.
choices:
- FOR
- AGAINST
explained: []
