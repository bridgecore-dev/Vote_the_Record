  notes: 'Read on 2026-10-17; SHA-256 of the downloaded query responses: 7cb61f5c2c67a2bcb25810f0b0b1139766efb87f1f689662dae8a79c591eda76. Areas used: city-of-benbrook (layer 28, GEOID 4807552), city-of-forest-hill (layer 28, GEOID 4826544), city-of-north-richland-hills (layer 28, GEOID 4852356), city-of-river-oaks (layer 28, GEOID 4862384), city-of-white-settlement (layer 28, GEOID 4878544), eagle-mountain-saginaw-isd (layer 14, GEOID 4817700), keller-isd (layer 14, GEOID 4825260), town-of-flower-mound (layer 28, GEOID 4826232). A precinct or ZIP code at least 99% inside an area counts as inside it; one at least 1% inside, or holding at least 1% of the area, is marked as depending on the address. The address lookup uses the outlines directly.'
- id: tx/localities/tarrant-county/elections/2026-11-03/precincts#S-04
  headline: Checked against the official sample ballot for each ballot style
  statement: Tarrant County Elections Administration's Find My Ballot service gives the sample ballot for each voting sub-precinct. Comparing those 788 ballot styles with the precinct layer showed 34 precincts whose parts get different U.S. House, State House, State Senate, commissioner or justice of the peace contests; for those, the districts are listed as depending on the address.
  label: official_record
  claim_status: documented
