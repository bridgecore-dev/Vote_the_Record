- id: tx/localities/tarrant-county/elections/2026-11-03/precincts#S-01
  headline: Tarrant County voting precincts and their districts (2026)
  statement: Tarrant County's GIS layer "Voting Precincts" (707 precincts), published by Tarrant County, lists each precinct's congressional, State Senate, State House, State Board of Education, Commissioners Court and justice of the peace districts.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://mapit.tarrantcounty.com/arcgis/rest/services/Dynamic/VotingPrecinct/MapServer/0
  source_title: 'Tarrant County GIS: Voting Precincts'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-17'
  retrieved: '2026-10-17'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read from https://mapit.tarrantcounty.com/arcgis/rest/services/Dynamic/VotingPrecinct/MapServer/0 on 2026-10-17; SHA-256 of the downloaded query responses: 6c55262491f55d07950652a841587fd83091f7b8a54b29f794c9da6a8add4def. Only precinct numbers, outlines and district numbers from the layer are used. Its congressional districts (6, 12, 24, 25, 30) are the ones Tarrant County Elections lists for the November 3, 2026 election ("Districts in Election").'
- id: tx/localities/tarrant-county/elections/2026-11-03/precincts#S-02
  headline: The 2025 congressional map (plan C2333) is in use for 2026
  statement: On December 4, 2025, the U.S. Supreme Court granted Texas's application to stay the November 18, 2025 district court order that had blocked the new congressional map, allowing it to be used.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  source_title: 'Supreme Court of the United States: Abbott v. LULAC, No. 25A608, order of December 4, 2025'
  source_kind: document
  sha256: 980b35bc80a5e7fd33e109ea783ecf60135405f71014a6d2cecb3adf92b6f3bc
  archive_url: https://web.archive.org/web/20260930221333/https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  event_date: '2026-10-17'
  retrieved: '2026-10-17'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: The layer's Congress field gives the districts listed for this election under the 2025 map.
