- id: tx/localities/ector-county/elections/2026-11-03/precincts#S-05
  headline: District maps used to assign each precinct its districts
  statement: 'The Ector County precinct layer lists precinct numbers only, so each precinct was assigned the district that covers most of it on these official maps: City of Odessa GIS: County Commissioner Precinct District (https://services6.arcgis.com/96XBo0KviQ3nV6zg/arcgis/rest/services/County_District_view/FeatureServer/183); City of Odessa GIS: City Council districts (Local District) (https://services6.arcgis.com/96XBo0KviQ3nV6zg/arcgis/rest/services/Local_District1/FeatureServer/5).'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://services6.arcgis.com/96XBo0KviQ3nV6zg/arcgis/rest/services/County_District_view/FeatureServer/183
  source_title: Texas Legislative Council and county district maps
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-11-03'
  retrieved: '2026-11-03'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-11-03; SHA-256 of the downloaded files: d8e5e178be37ddf4bb40ec7113ef60e2a15c06c68a650a82b47d4df8aaccf11a. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): precinct 403: council 5 covers 34%; precinct 407: council 5 covers 6%; precinct 406: council 5 covers 90%; precinct 311: council 5 covers 51%.'
