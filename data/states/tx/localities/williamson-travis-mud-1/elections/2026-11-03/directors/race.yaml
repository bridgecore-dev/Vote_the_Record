  notes: 'District''s own site (saved pages_c/wtcmud1_board.html). Terms ending November 2026: Beth Jones, Hanoi Avila, and one vacant seat (three seats on the ballot). Not current directors: David Flores, Kimberly Massaro, Linda Fabre, Stephen Bodnarchuk Jr., Thomas Vacek. The Comptroller SPDPID 2026 filing (March 13, 2026) listed ''David Flores - Asst. Secretary''; the website now shows that Assistant Secretary seat (term Nov 2026) as vacant, so ballot candidate David Flores appears to be a former director - owner may want to confirm.'
