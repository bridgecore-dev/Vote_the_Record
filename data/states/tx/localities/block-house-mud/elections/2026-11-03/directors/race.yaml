  notes: 'District''s own site (page modified 2026-10-22; saved pages_c/blockhouse.html). Terms ending November 2026: David Johnson and Robert Young (neither is on the ballot). Sandy Martin is listed with no term shown; matched to ballot ''Sandra Martin'' as a nickname (Sandy/Sandra) - owner should confirm. Not current directors: Ashley Musso, Jaden Tipton, Matt Sanner, Nancy Winston, Ryan Poppe, Terri L. Hutton, Tina Reckaway. The Comptroller SPDPID 2026 filing (March 2026) listed David Shoemaker as Vice President and did not list Sandy Martin, so the board changed during 2026; the website is the more recent source.'
