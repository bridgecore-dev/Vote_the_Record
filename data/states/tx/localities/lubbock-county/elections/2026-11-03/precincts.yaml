- id: tx/localities/lubbock-county/elections/2026-11-03/precincts#S-01
  headline: Lubbock County ballot styles and their precincts
  statement: The county's November 2026 sample ballot page lists 13 ballot styles and the precincts each covers (precincts with a suffix such as "035-LCSD" are the part of a precinct inside Lubbock-Cooper
    ISD, "041-LRZ" inside Lorenzo ISD). Each precinct's areas are the contests on its style's sample ballot.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://votelubbock.gov/november-2026-general-and-special-election-sample-ballots/
