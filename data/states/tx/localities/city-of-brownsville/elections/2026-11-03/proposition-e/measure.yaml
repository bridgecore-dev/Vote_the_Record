# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Brownsville, Proposition E
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall the City Charter of the City of Brownsville be amended by adding section 21-B to Article V, providing for the appointment of a City Secretary and defining the duties and powers of the Office of the City Secretary, including the obligation to attend all meetings of the City Commission and keep accurate minutes of its proceedings; engross and enroll all laws, resolutions and ordinances of the City Commission; preserve and keep in order all books, papers, documents, records and files of the City Commission of the executive departments; and keep a record of all commissions and licenses issued and shall countersign the same; appoint such assistants and staff as may be approved in the adopted budget of the City; have custody of the seal of the City and shall affix sample to such documents and, obligations of the City as he/she may be legally authorized to do?
choices:
- For
- Against
