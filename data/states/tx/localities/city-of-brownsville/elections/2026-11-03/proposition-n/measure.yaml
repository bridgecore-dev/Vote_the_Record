# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Brownsville, Proposition N
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall the City Charter of the City of Brownsville be amended by adding Section 35 to Article V, to be entitled the “Brownsville First Jobs & Contracts Policy,” to establish requirements and guidelines for City-funded contracts, including provisions related to contractor compliance with applicable laws, safety training, documentation of good-faith efforts to hire local workers, preferences permitted by state law for small and local businesses, creation of a Local Jobs & Business Access Program, transparency measures, and periodic review and reporting, all as set forth in the proposed amendment?
choices:
- For
- Against
