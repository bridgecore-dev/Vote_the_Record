# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Brownsville, Proposition F
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall the City Charter of the City of Brownsville be amended by adding section 21-C to Article V, providing for the appointment and removal of a City Auditor and defining the duties and powers of the Office of the City Auditor, including the obligation to conduct, or cause to be conducted, financial, fiscal compliance, and financial procedure audits, as well as performance, investigative, and other audits, of all city departments, offices, agencies, created entities, corporations, and programs; serve as an advisor to the Audit and Oversight Committee and report to them administrative and operational functions of the Office of the City Auditor?
choices:
- For
- Against
