# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Brownsville, Proposition J
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: 'Shall Article V of the City Charter of the City of Brownsville be amended to add Section 35, Municipal Campaign Finance, to require the City Commission to enact new laws, consistent with federal and state law, that regulate campaign finances for locally elected City office by: (1) requiring candidates and candidate committees to disclose campaign contribution amounts, donor information, campaign expenditures, and financial obligations; and (2) establishing limits on campaign contributions and expenditures for candidates for locally elected City office, together with public access to required disclosures and penalties for violations as permitted by federal and state law?'
choices:
- For
- Against
