# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Brownsville, Proposition B
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall Article V, Section 3 of the City Charter of the City of Brownsville be amended to state that if the Mayor or a City Commission Member is convicted of any criminal offense other than a felony or Class C Misdemeanor, the City Attorney shall file a petition for Declaratory Judgment with the District Courts of Cameron County for a determination on whether the crime is one involving moral turpitude; and if it is determined by the District Court Judge that the Mayor or Commission Member was convicted of a crime involving moral turpitude, then the City Commission shall automatically order a recall election at the next allowable election date under the Texas Election Code and dispense of the certified recall petition required under Section 5(a) of the City Charter?
choices:
- For
- Against
explained: []
