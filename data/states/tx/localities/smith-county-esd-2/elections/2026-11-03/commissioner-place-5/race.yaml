  notes: 'The county''s "2026-11 Publication Sample Ballot" on its Current Sample Ballots page (https://www.smith-county.com/396/Current-Sample-Ballots), served from the county''s Laserfiche portal: one ballot carrying every contest on any Smith County ballot (per-precinct ballots are posted beside it). Names and wording are from the PDF''s text layer, kept as printed (English text only). The ESD''s commissioner places are voted on by district: the county''s per-precinct sample ballots labeled "ESD 2 District 5" carry only this place, and the county''s election district layer gives each precinct piece its ESD fire district.'
