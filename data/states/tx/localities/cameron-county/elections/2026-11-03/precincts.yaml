- id: tx/localities/cameron-county/elections/2026-11-03/precincts#S-05
  headline: District maps used to assign each precinct its districts
  statement: 'The Cameron County precinct layer lists precinct numbers only, so each precinct was assigned the district that covers most of it on these official maps: Texas Legislative Council: PLANC2333 (congressional districts enacted 2025, 89th Legislature, 2nd C.S.) (https://data.capitol.texas.gov/dataset/748c952b-e926-4f44-8d01-a738884b3ec8/resource/5712ebe1-d777-4d4a-b836-0534e17bca01/download/planc2333.zip); Texas Legislative Council: PLANH2316 (State House districts, 2023-2026) (https://data.capitol.texas.gov/dataset/71af633c-21bf-42cf-ad48-4fe95593a897/resource/a4d3230f-47f2-4253-85f3-51a6c3c9ad0a/download/planh2316.zip); Cameron County GIS: Commissioner Precincts (2022) (https://services5.arcgis.com/p65BQlkv8na0Y5l9/arcgis/rest/services/CC_CommPcts_2022_/FeatureServer/0); Cameron County GIS: Justice of the Peace and Constable Precincts (2022) (https://services5.arcgis.com/p65BQlkv8na0Y5l9/arcgis/rest/services/JP_Constables/FeatureServer/0).'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://data.capitol.texas.gov/dataset/748c952b-e926-4f44-8d01-a738884b3ec8/resource/5712ebe1-d777-4d4a-b836-0534e17bca01/download/planc2333.zip
  source_title: Texas Legislative Council and county district maps
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-20'
  retrieved: '2026-10-20'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-20; SHA-256 of the downloaded files: 1efd8d5b2b0c0b0fb1966826d53e33a1b1b0048a744414eee2526443d9644359. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): precinct 52: commissioner Precinct 1 covers 60%; precinct 14: commissioner Precinct 1 covers 87%; precinct 52: jp PCT 1 covers 60%; precinct 14: jp PCT 1 covers 87%.'
