- id: tx/localities/cameron-county/elections/2026-11-03/zips#S-01
  headline: Census ZIP Code Tabulation Areas (approximate ZIP codes)
  statement: The U.S. Census Bureau's TIGERweb service publishes 2020 Census ZIP Code Tabulation Areas, which approximate U.S. Postal Service ZIP code areas.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/2
  source_title: 'U.S. Census Bureau TIGERweb: 2020 Census ZIP Code Tabulation Areas'
  source_kind: page
  sha256: null
  archive_url: https://web.archive.org/web/20260930221535/https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/2
  event_date: '2026-10-20'
  retrieved: '2026-10-20'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-20; SHA-256 of the downloaded query responses: 23269978d5749d5478ef0b008062a235be004635e1be22525d2a8b012dcb2973. ZIP-to-district links were computed by overlaying these areas on the county precinct layer on a 0.001-degree grid; a precinct counts for a ZIP when it covers at least 1% of the ZIP''s grid cells in Cameron County, or when at least 50% of the precinct lies in the ZIP. Results are approximate; the precinct lookup is exact.'
- id: tx/localities/cameron-county/elections/2026-11-03/zips#S-02
  headline: Cameron County voting precincts (2026)
  statement: The Texas Legislative Council's "2026 Primary Election Voting Precincts" shapefile, compiled from county election officials and the Secretary of State, gives Cameron County's 102 precincts (0001-0102) and their outlines, matching the county elections office's 2026 precinct layer.
