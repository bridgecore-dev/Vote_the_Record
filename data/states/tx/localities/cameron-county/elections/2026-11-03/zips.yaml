  notes: 'Read on 2026-10-20; SHA-256 of the downloaded query responses: c9f978e9a263d2e46095b8f24854ee894824ef1b6816746b9b8ffb769132df13. Areas used: brownsville-isd (layer 14, GEOID 4811680), city-of-brownsville (layer 28, GEOID 4810768), city-of-los-fresnos (layer 28, GEOID 4844116), city-of-south-padre-island (layer 28, GEOID 4869140), la-feria-isd (layer 14, GEOID 4826040), los-fresnos-cisd (layer 14, GEOID 4828290), santa-maria-isd (layer 14, GEOID 4839330). A precinct or ZIP code at least 99% inside an area counts as inside it; one at least 1% inside, or holding at least 1% of the area, is marked as depending on the address. The address lookup uses the outlines directly.'
