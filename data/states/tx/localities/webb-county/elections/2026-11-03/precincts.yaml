# Each precinct's areas from Webb County's per-precinct sample ballots. Unverified.
# A nested list means only part of the precinct is in that area (a precinct split between ballots).
sources:
- id: tx/localities/webb-county/elections/2026-11-03/precincts#S-01
  headline: Webb County sample ballots by precinct
  statement: The county's Paper Sample Ballots page posts one sample ballot for each precinct split (128 in all, e.g. "PCT 154 01"). Each precinct's areas are the contests on its ballots; a precinct split
    across several ballots gets the contests found on only some of them as partial areas.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.webbcountytx.gov/714/Paper-Sample-Ballots
  source_title: 'Webb County: Paper Sample Ballots'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-11-03'
  retrieved: '2026-11-02'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Sample ballots saved in the owner''s browser on November 2, 2026. They are scans with a "SAMPLE BALLOT" watermark: each ballot''s contests were found by OCR (candidate names and headings), checked
    against the ballot''s own rules (one state house district, one justice of the peace precinct, at most one council district and one school district), and 33 ballots were read by eye, including every
    one that broke a rule.'
everywhere: ["court-of-appeals-4", "state-senate-21", "us-house-28"]
