- id: tx/localities/brazoria-county/elections/2026-11-03/precincts#S-01
  headline: Brazoria County precinct sample ballots
  statement: The Brazoria County Clerk posts one sample ballot per voting precinct (1-83; precinct 14 only as "14-SISD"), with separate ballots for the parts of precincts 7, 8, 17 and 20 inside the City
    of Freeport ("-FPT") and of precincts 32 and 33 inside Sweeny ISD ("-SISD"). Each precinct's areas are the contests on its ballot.
  label: official_record
  claim_status: documented
