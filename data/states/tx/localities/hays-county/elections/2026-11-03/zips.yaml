  event_date: '2026-11-03'
  retrieved: '2026-11-03'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-11-03; SHA-256 of the downloaded query responses: 1fe7a335b0d4ff5a072d998fba52b1de6c59be32d4bd5e82c6f668390a4081a5. ZIP-to-district links were computed by overlaying these areas on the county precinct layer on a 0.001-degree grid; a precinct counts for a ZIP when it covers at least 1% of the ZIP''s grid cells in Hays County, or when at least 50% of the precinct lies in the ZIP. Results are approximate; the precinct lookup is exact.'
