  notes: 'Read on 2026-11-03; SHA-256 of the downloaded query responses: afe3031a4f2d444ba82ef270710d25410915f602aca0848ce6a80c365f6f0f2c. Areas used: city-of-austin (layer 28, GEOID 4805000), city-of-buda (layer 28, GEOID 4811080), city-of-kyle (layer 28, GEOID 4839952), city-of-san-marcos (layer 28, GEOID 4865600), city-of-woodcreek (layer 28, GEOID 4880058), comal-isd (layer 14, GEOID 4814730), village-of-bear-creek (layer 28, GEOID 4806242). A precinct or ZIP code at least 99% inside an area counts as inside it; one at least 1% inside, or holding at least 1% of the area, is marked as depending on the address. The address lookup uses the outlines directly.'
