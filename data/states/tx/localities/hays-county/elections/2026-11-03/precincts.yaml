  notes: 'Read on 2026-11-03; SHA-256 of the downloaded files: 05b27659359e420b5fe726d885eaa460aeb1a6ecf1cd0cbcbc71afe5d0779a7e. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): precinct 426: buda C covers 22%; precinct 432: buda A covers 3%; precinct 422: buda C covers 52%; precinct 435: buda A covers 85%; precinct 423: buda A covers 48%; precinct 254: buda B covers 53%; precinct 228: buda B covers 5%; precinct 227: buda B covers 47%.'
