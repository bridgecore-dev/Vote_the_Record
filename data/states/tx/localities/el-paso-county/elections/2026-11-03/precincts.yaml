  reviewer: null
  notes: 'Read on 2026-10-19; SHA-256 of the downloaded query responses: 62dbe56fd80a784fe34f2e02469bd804440d04039a8a9f6e6856d73ef3ab0d8e. Areas used: canutillo-isd (layer 14, GEOID 4812780), fabens-isd (layer 14, GEOID 4818900), socorro-isd (layer 14, GEOID 4840710), tornillo-isd (layer 14, GEOID 4842990), village-of-vinton (layer 28, GEOID 4875668), ysleta-isd (layer 14, GEOID 4846680). A precinct or ZIP code at least 99% inside an area counts as inside it; one at least 1% inside, or holding at least 1% of the area, is marked as depending on the address. The address lookup uses the outlines directly.'
