- id: tx/localities/el-paso-county/elections/2026-11-03/precincts#S-05
  headline: District maps used to assign each precinct its districts
  statement: 'The El Paso County precinct layer lists precinct numbers only, so each precinct was assigned the district that covers most of it on these official maps: Texas Legislative Council: PLANC2333 (congressional districts enacted 2025, 89th Legislature, 2nd C.S.) (https://data.capitol.texas.gov/dataset/748c952b-e926-4f44-8d01-a738884b3ec8/resource/5712ebe1-d777-4d4a-b836-0534e17bca01/download/planc2333.zip); Texas Legislative Council: PLANH2316 (State House districts, 2023-2026) (https://data.capitol.texas.gov/dataset/71af633c-21bf-42cf-ad48-4fe95593a897/resource/a4d3230f-47f2-4253-85f3-51a6c3c9ad0a/download/planh2316.zip); El Paso County GIS: Commissioner Precincts (https://maps.epcounty.com/arcgis/rest/services/Infrastructure_Map/MapServer/8); El Paso County GIS: Justice of the Peace Precincts (https://maps.epcounty.com/arcgis/rest/services/Infrastructure_Map/MapServer/9); City of El Paso GIS: Representative Districts (https://gis.elpasotexas.gov/arcgis/rest/services/RepresentativeDistricts/MapServer/0).'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://data.capitol.texas.gov/dataset/748c952b-e926-4f44-8d01-a738884b3ec8/resource/5712ebe1-d777-4d4a-b836-0534e17bca01/download/planc2333.zip
  source_title: Texas Legislative Council and county district maps
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-19'
  retrieved: '2026-10-19'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-19; SHA-256 of the downloaded files: 54651b51db0fe0c209a7539207c918c091cc6c02e7c0ad42e6fb42dc4442110d. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): precinct 45: us-house 16 covers 93%; precinct 183: jp 6 covers 5%; precinct 183: council 7 covers 94%; precinct 184: council 4 covers 9%; precinct 210: council 6 covers 1%; precinct 128: council 5 covers 85%; precinct 182: council 5 covers 75%; precinct 115: council 5 covers 82%; precinct 88: council 2 covers 2%; precinct 131: council 6 covers 89%.'
