  notes: Downloaded on 2026-10-19; filtered to El Paso County. Only precinct numbers and outlines are used; each precinct's districts were assigned by overlaying the district maps named in precincts#S-05.
- id: tx/localities/el-paso-county/elections/2026-11-03/precincts#S-02
  headline: The 2025 congressional map (plan C2333) is in use for 2026
  statement: On December 4, 2025, the U.S. Supreme Court granted Texas's application to stay the November 18, 2025 district court order that had blocked the new congressional map, allowing it to be used.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  source_title: 'Supreme Court of the United States: Abbott v. LULAC, No. 25A608, order of December 4, 2025'
  source_kind: document
  sha256: 980b35bc80a5e7fd33e109ea783ecf60135405f71014a6d2cecb3adf92b6f3bc
  archive_url: https://web.archive.org/web/20260930221333/https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  event_date: '2026-10-19'
  retrieved: '2026-10-19'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: The City of El Paso's congressional layer still shows the pre-2025 districts, so congressional districts come from the Texas Legislative Council's PLANC2333 shapefile.
