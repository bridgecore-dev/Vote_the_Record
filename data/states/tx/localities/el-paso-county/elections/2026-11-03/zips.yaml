- id: tx/localities/el-paso-county/elections/2026-11-03/zips#S-01
  headline: Census ZIP Code Tabulation Areas (approximate ZIP codes)
  statement: The U.S. Census Bureau's TIGERweb service publishes 2020 Census ZIP Code Tabulation Areas, which approximate U.S. Postal Service ZIP code areas.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/2
  source_title: 'U.S. Census Bureau TIGERweb: 2020 Census ZIP Code Tabulation Areas'
  source_kind: page
  sha256: null
  archive_url: https://web.archive.org/web/20260930221535/https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/2
  event_date: '2026-10-19'
  retrieved: '2026-10-19'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-19; SHA-256 of the downloaded query responses: 5088b9433edf8c065d2e877d863f36026bb03d69715d8f6db0c33f36a898b5a2. ZIP-to-district links were computed by overlaying these areas on the county precinct layer on a 0.001-degree grid; a precinct counts for a ZIP when it covers at least 1% of the ZIP''s grid cells in El Paso County, or when at least 50% of the precinct lies in the ZIP. Results are approximate; the precinct lookup is exact.'
- id: tx/localities/el-paso-county/elections/2026-11-03/zips#S-02
  headline: El Paso County voting precincts (2026)
  statement: The Texas Legislative Council's "2026 Primary Election Voting Precincts" shapefile, compiled from county election officials and the Secretary of State, gives El Paso County's 236 precincts (0001-0236) and their outlines, matching the county's 2026 precinct map.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://data.capitol.texas.gov/dataset/d04c72b9-16c4-4ab2-8c6d-c666d41e04b7/resource/33ec5b30-ee4d-424f-9769-57b87cb5e311/download/precincts26p.zip
  source_title: 'Texas Legislative Council: 2026 Primary Election Voting Precincts (precincts26p.zip)'
  source_kind: document
  sha256: 70a67743d55a218ba5ce6057816563376f61cf0bc531a77d1edc98644c310107
  archive_url: null
  event_date: '2026-10-19'
  retrieved: '2026-10-19'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: Downloaded on 2026-10-19; filtered to El Paso County. Only precinct numbers and outlines are used; each precinct's districts were assigned by overlaying the district maps named in precincts#S-05.
- id: tx/localities/el-paso-county/elections/2026-11-03/zips#S-03
  headline: Census boundaries of cities and school districts
  statement: The U.S. Census Bureau's TIGERweb service publishes the current boundaries of incorporated places (cities) and unified school districts.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer
  source_title: 'U.S. Census Bureau TIGERweb: Incorporated Places (layer 28) and Unified School Districts (layer 14)'
  source_kind: page
  sha256: null
  archive_url: https://web.archive.org/web/20260930223321/https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer
  event_date: '2026-10-19'
  retrieved: '2026-10-19'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-19; SHA-256 of the downloaded query responses: 62dbe56fd80a784fe34f2e02469bd804440d04039a8a9f6e6856d73ef3ab0d8e. Areas used: canutillo-isd (layer 14, GEOID 4812780), fabens-isd (layer 14, GEOID 4818900), socorro-isd (layer 14, GEOID 4840710), tornillo-isd (layer 14, GEOID 4842990), village-of-vinton (layer 28, GEOID 4875668), ysleta-isd (layer 14, GEOID 4846680). A precinct or ZIP code at least 99% inside an area counts as inside it; one at least 1% inside, or holding at least 1% of the area, is marked as depending on the address. The address lookup uses the outlines directly.'
- id: tx/localities/el-paso-county/elections/2026-11-03/zips#S-04
  headline: TCEQ water district boundaries
