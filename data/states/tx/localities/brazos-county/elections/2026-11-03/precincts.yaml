- id: tx/localities/brazos-county/elections/2026-11-03/precincts#S-05
  headline: District maps used to assign each precinct its districts
  statement: 'The Brazos County precinct layer lists precinct numbers only, so each precinct was assigned the district that covers most of it on these official maps: Texas Legislative Council: PLANH2316 (State House districts, 2023-2026) (https://data.capitol.texas.gov/dataset/71af633c-21bf-42cf-ad48-4fe95593a897/resource/a4d3230f-47f2-4253-85f3-51a6c3c9ad0a/download/planh2316.zip); Brazos County GIS: Commissioners Court Precincts (https://services5.arcgis.com/s91b2wxhO15FkWh5/arcgis/rest/services/BRAZOS_COUNTY_COMMISSIONERS_COURT_PRECINCTS/FeatureServer/0); Brazos County GIS: Justice of the Peace Precincts (https://services5.arcgis.com/s91b2wxhO15FkWh5/arcgis/rest/services/BRAZS_COUNTY_JP_PRECINCTS/FeatureServer/0).'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://data.capitol.texas.gov/dataset/71af633c-21bf-42cf-ad48-4fe95593a897/resource/a4d3230f-47f2-4253-85f3-51a6c3c9ad0a/download/planh2316.zip
  source_title: Texas Legislative Council and county district maps
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-11-03'
  retrieved: '2026-11-03'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-11-03; SHA-256 of the downloaded files: d2f835e346adc70710a65d2c7cf5181e6df002c6526c4f3658fd58acf987f98c. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): precinct 33: commissioner 4 covers 78%; precinct 33: jp 3 covers 61%.'
