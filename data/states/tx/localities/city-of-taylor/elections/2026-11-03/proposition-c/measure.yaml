name: City of Taylor, Proposition C
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall Section 4.4 of the Charter of the City of Taylor be amended to provide that, if a vacancy on the City Council occurs with twelve (12) months or less remaining in the unexpired term, the City Council may, by majority vote of the remaining members, fill the vacancy at the next regularly scheduled election?
