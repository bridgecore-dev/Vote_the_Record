# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Taylor, Proposition D
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall the Charter of the City of Taylor be amended by adding Section 4.6 to impose term limits on the offices of Mayor and City Councilmember providing that no person may serve more than four terms in any combination of the office of Mayor or City Councilmember and that a person who has served four terms be permanently and for life ineligible to seek election or appointment to either office?
choices:
- For
- Against
