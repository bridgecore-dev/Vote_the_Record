name: City of Forest Hill, Proposition A
election_date: '2026-11-03'
kind: other
ballot_text: Whether or not to reauthorize the local sales and use tax in the City of Forest Hill at the rate of one- fourth of one percent sales and use tax to continue providing revenue for maintenance and repair of municipal streets. The tax expires on the fourth anniversary of the date of this election unless the imposition of the tax is reauthorized.
