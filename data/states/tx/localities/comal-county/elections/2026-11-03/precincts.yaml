  headline: Comal County sample ballots and their precincts
  statement: The county's Elections page posts 12 sample ballots for the November 3, 2026 General Election; each ballot's header lists the precincts it covers (some precincts are on several ballots, split
    by school district, city, or utility district). Each precinct's areas are the contests on its ballots.
  label: official_record
  claim_status: documented
