name: Highline School District No. 401, Proposition 2
election_date: '2026-11-03'
kind: tax-rate
ballot_text: 'The Board of Directors of Highline School District No. 401 adopted Resolution No. 12-26, concerning educational technology and capital improvements to maintain student learning. This proposition would fund districtwide technology, programs and staff and other capital improvements not funded by the State, including cybersecurity protections, reliable internet, technology operations and infrastructure, and student/staff technology access, and authorize the District to levy the following excess taxes on all taxable property within the District: [table as printed: Collection Year | Approximate Levy Rate/$1,000 Assessed Value | Levy Amount: 2028 | $1.95 | $104,700,000; 2029 | $1.93 | $111,100,000; 2030 | $1.88 | $115,700,000; 2031 | $1.84 | $121,400,000] all as provided in Resolution No. 12-26. Should this proposition be approved?'
choices:
- 'Yes'
- 'No'
