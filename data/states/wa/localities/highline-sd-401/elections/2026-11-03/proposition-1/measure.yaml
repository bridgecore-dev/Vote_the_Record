# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Highline School District No. 401, Proposition 1
election_date: '2026-11-03'
kind: bond
ballot_text: 'The Board of Directors of Highline School District No. 401 adopted Resolution No. 11- 26, concerning neighborhood school improvements and safety upgrades. This proposition would authorize the District to: replace or rebuild four deteriorating schools (Cascade, Chinook, Sylvester, CHOICE Academy), including new career/technical learning spaces, secure entrances, security camera upgrades; make critical districtwide core building system upgrades, including heating, roofing, electrical, plumbing; implement districtwide health, security, fire system and earthquake safety upgrades; issue $595,400,000 of general obligation bonds maturing within 21 years; and levy annual excess property taxes to repay the bonds, all as provided in Resolution No. 11-26. Should this proposition be:'
choices:
- Approved
- Rejected
