# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of SeaTac, Proposition 1
election_date: '2026-11-03'
kind: tax-rate
ballot_text: The City Council of the City of SeaTac passed Ordinance No. 26-1017 concerning funding for public safety and other City services. If approved, this proposition would increase the City’s sales and use tax rate by 1/10th of 1% (0.1%) to provide funding for public safety services, including but not limited to, fire protection, fire prevention and emergency medical response; law enforcement support and staffing and retention; criminal justice purposes; public safety operations, maintenance and capital; and other public safety operations and services authorized under RCW 82.14.450. Should this proposition be approved?
choices:
- 'Yes'
- 'No'
