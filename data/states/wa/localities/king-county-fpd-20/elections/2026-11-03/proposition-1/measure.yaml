# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: King County Fire Protection District No. 20, Proposition 1
election_date: '2026-11-03'
kind: bond
ballot_text: 'The Board of Fire Commissioners of King County Fire Protection District No. 20 adopted Resolution No. 2026-002, concerning emergency response facilities to protect public health, life and property. This proposition would authorize the District to: improve emergency response support facilities and infrastructure on two sites owned by the District; renovate and modernize the existing fire station; acquire firefighting and emergency response apparatus; issue no more than $16,000,000 of general obligation bonds maturing within 20 years; and levy annual excess property taxes to repay the bonds, all as provided in Resolution No. 2026-002. Should this proposition be:'
choices:
- Approved
- Rejected
