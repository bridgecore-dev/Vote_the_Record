# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Kenmore, Proposition 1
election_date: '2026-11-03'
kind: tax-rate
ballot_text: Kenmore City Council passed Ordinance 26-0644 regarding funding for programing and services. To fund Climate & Environmental Stewardship, Affordable Housing, and Human Services, this proposition increases Kenmore’s maximum regular property tax levy rate to $1.25/$1,000 for collection in 2027; sets the limit factor for Kenmore’s regular property tax levy increases in 2028-2032 to 6%; authorizes the 2032 levy amount as the basis to calculate subsequent levies (RCW 84.55); and exempts qualifying seniors, veterans, and others (RCW 84.36). Should this proposition be approved?
choices:
- 'Yes'
- 'No'
