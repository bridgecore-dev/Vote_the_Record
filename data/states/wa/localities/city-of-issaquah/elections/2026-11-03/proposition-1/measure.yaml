# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Issaquah, Proposition 1
election_date: '2026-11-03'
kind: bond
ballot_text: 'The Issaquah City Council adopted Ordinance No. 3142, concerning bonds for parks, trails, and recreation projects. If approved, this proposition would authorize the City to: complete various projects, including sports fields and courts, new trails, trailhead improvements, restoration of Confluence Park’s Ek House, playground improvements, a new dog park, and related capital improvements; issue no more than $18,000,000 of general obligation bonds maturing within 20 years; and levy annual excess property taxes to pay and retire such bonds, all as provided in Ordinance No. 3142. Should this proposition be approved?'
choices:
- 'Yes'
- 'No'
