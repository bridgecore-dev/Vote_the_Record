# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Auburn School District No. 408, Proposition 1
election_date: '2026-11-03'
kind: bond
ballot_text: 'The Board of Directors of Auburn School District No. 408 has approved Resolution No. 1426, concerning a proposition to finance construction of new and replacement schools. This proposition would authorize the District to provide funds to construct a new Middle School and replace Cascade Middle School and Alpac Elementary, to increase capacity and reduce class sizes, modernize technology and learning environments, improve safety and security, and renovate playfields for student and community use, by issuing up to $491,000,000 of general obligation bonds maturing within 20 years, and levying annual excess property taxes to repay the bonds, as the resolution provides. Should this proposition be:'
choices:
- Approved
- Rejected
