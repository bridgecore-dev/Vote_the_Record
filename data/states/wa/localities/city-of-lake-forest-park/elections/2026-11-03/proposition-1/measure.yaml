# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Lake Forest Park, Proposition 1
election_date: '2026-11-03'
kind: tax-rate
ballot_text: The City Council of the City of Lake Forest Park adopted Resolution No. 26-2084 to fund Public Safety Services. This proposition would fund Public Safety Services per the Resolution including police services, safety equipment, 911 dispatch, emergency management services, jail services, and mental health crisis response by temporarily setting the maximum total regular levy rate at $0.88920/$1,000 for collection in 2027, with annual increases for five years based on inflation (Seattle region CPI-U). Qualifying low-income seniors, disabled veterans, and other disabled persons are exempt under RCW 84.36.381. Should this proposition be approved?
choices:
- 'Yes'
- 'No'
