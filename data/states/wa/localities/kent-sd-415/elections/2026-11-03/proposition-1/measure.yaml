# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Kent School District No. 415, Proposition 1
election_date: '2026-11-03'
kind: tax-rate
ballot_text: The Board of Directors of Kent School District No. 415 adopted Resolution No. 1718 concerning a proposition to support educational programs and operations expenses. If approved, this proposition would authorize the District to levy the following excess taxes, replacing an expiring levy, on all taxable property within the District, to support educational programs and operations not funded by the State’s statutory program of basic education. Should this proposition be approved?
choices:
- 'Yes'
- 'No'
