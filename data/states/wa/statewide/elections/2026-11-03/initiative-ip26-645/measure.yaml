# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Initiative Measure No. IP26-645
election_date: '2026-11-03'
kind: other
ballot_text: Initiative Measure No. IP26-645 concerns state and local taxes. This measure would repeal a 9.9% tax on annual individual income over $1,000,000; prohibit taxes measured by individual income and taxes on individual income or the receipt of individual income; and define “income.” This measure would decrease funding for public K-12 education, higher education (including universities and community colleges), and human services (primarily healthcare). Should this measure be enacted into law?
choices:
- 'Yes'
- 'No'
