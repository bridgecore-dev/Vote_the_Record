  headline: Who holds this office now
  statement: A Washington State Courts press release of September 11, 2025 says "A new justice will be appointed by Governor Ferguson for Supreme Court position 1" after Justice Mary I. Yu's retirement. A release of January 15, 2026 says Colleen M. Melody "was appointed to the Court by Gov. Bob Ferguson following the retirement of Justice Mary I. Yu at the end of 2025." The court's justices page, checked on October 18, 2026, lists Justice Colleen M. Melody. On that basis, Colleen M. Melody, a candidate in this race, is shown here as the current holder.
