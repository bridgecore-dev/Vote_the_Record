  headline: Who holds this office now
  statement: Official results for the November 8, 2022 general election (Washington Secretary of State) show Barbara Madsen won Supreme Court Justice Position 5. A Washington State Courts press release of May 15, 2026 says Theodore J. Angelis was "appointed to the Court by Governor Bob Ferguson to fill the remaining term of Justice Barbara Madsen, who retired in April." The court's justices page, checked on October 18, 2026, lists Justice Angelis. On that basis, Theodore J. (Theo) Angelis, a candidate in this race, is shown here as the current holder.
