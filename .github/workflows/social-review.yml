name: social post review

# On each pull request that adds or changes social/posts/*.yaml: check and build the posts, and comment with
# previews. A pull request from a social/... branch that touches only post files is merged here once the checks
# pass, approval: review included (owner's decision, 2026-11-14: no post missed while the owner is away). The
# owner reads the preview comment and stops a post before its slot by deleting its file on main. build.py still
# refuses approval: auto unless every source is on a .gov, .us or .mil site. See social/README.md.
#
# Setup (one time), in the repo's Settings → Secrets and variables → Actions:
#   secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY; variables R2_BUCKET, R2_PUBLIC_URL.
#   Without them the posts are still checked and built, and the images are kept as the run's artifacts.

on:
  pull_request:
    paths: ["social/posts/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: social-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements-social.txt -r requirements-reel.txt
      # Motion Reels (src/social/reel.py): headless Chromium for frame capture, Kokoro voice model (hash-checked)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements-reel.txt') }}
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vtr-kokoro
          key: kokoro-v1.0-7d5df8ec
      - uses: actions/cache@v4  # faster-whisper's model: when each caption word is heard (captions Reels)
        with:
          path: ~/.cache/huggingface
          key: whisper-base.en-v1
      - run: python src/social/reel.py --download-model

      - name: Which posts changed
        id: posts
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'social/posts/*.yaml' | tr '\n' ' ')
          for f in $files; do
            # file names come from the pull request: only the documented pattern gets anywhere near a shell
            echo "$f" | grep -Eq '^social/posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.yaml$' \
              || { echo "::error::Post file names must look like social/posts/YYYY-MM-DD-slug.yaml: $f"; exit 1; }
          done
          if [ -n "$files" ] && [ "${HEAD_REF#social/}" = "$HEAD_REF" ]; then
            # anything in social/posts/ on main gets published, so posts arrive only through their own pull request
            echo "::error::Post files must come in a pull request from a social/... branch, not $HEAD_REF"; exit 1
          fi
          others=$(git diff --name-only "$BASE"...HEAD | grep -v '^social/posts/' || true)
          # a post whose only change is its publish_after was previewed in its own pull request: check it, but
          # don't render it again (a catch-up reorder can move dozens of posts at once)
          render=""
          for f in $files; do
            if git diff -U0 "$BASE"...HEAD -- "$f" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -qvE '^[+-]publish_after: '; then
              render="$render $f"
            fi
          done
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "only_posts=$([ -z "$others" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Check
        if: steps.posts.outputs.files != ''
        env:
          FILES: ${{ steps.posts.outputs.files }}
        run: python src/social/build.py --check $FILES

      - name: Build and preview
        if: steps.posts.outputs.files != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}  # Workers AI, for ai_image (src/social/reel.py)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          FILES: ${{ steps.posts.outputs.render }}
          MOVED: ${{ steps.posts.outputs.files }}
        run: |
          if [ -n "$(echo $FILES)" ]; then
            python src/social/publish.py --preview $FILES > comment.md
          else
            mkdir -p social/out
            { echo "Schedule changes only (publish_after); the posts' previews are unchanged from their own pull requests:"
              for f in $MOVED; do echo "- \`$f\`"; done; } > comment.md
          fi

      - uses: actions/upload-artifact@v4
        if: steps.posts.outputs.files != ''
        with:
          name: social-previews
          path: social/out/

      - name: Comment
        if: steps.posts.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file comment.md

      - name: Merge posts
        if: >-
          steps.posts.outputs.files != '' && steps.posts.outputs.only_posts == 'true' &&
          startsWith(github.head_ref, 'social/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FILES: ${{ steps.posts.outputs.files }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # merge only once every other check on this commit has passed (CLAUDE.md rule 3b): never with one failing
          # or still running. This job is "review" itself, so it's left out.
          for i in $(seq 1 50); do
            states=$(gh pr checks "$PR" --json name,bucket --jq '.[] | select(.name != "review") | .bucket' | sort | uniq -c)
            echo "$states"
            if echo "$states" | grep -qE ' (fail|cancel)$'; then echo "::error::A check failed; not merging."; exit 1; fi
            if [ -n "$states" ] && ! echo "$states" | grep -qE ' pending$'; then
              gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA"; exit 0
            fi
            sleep 30
          done
          echo "::error::Other checks still running after 25 minutes; not merging. Merge by hand once they pass."; exit 1
