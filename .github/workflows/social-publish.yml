name: social publish

# Every 30 minutes from 5:00 a.m. to 10:30 p.m. Central standard time: publish merged posts that are due
# (src/social/publish.py). Nothing runs on the schedule until the repo variable SOCIAL_PUBLISH is "true".
#
# Setup (one time), in the repo's Settings → Secrets and variables → Actions:
#   secrets IG_USER_ID, IG_ACCESS_TOKEN, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY;
#   variables R2_BUCKET, R2_PUBLIC_URL, SOCIAL_PUBLISH=true, and optionally IG_GRAPH_HOST, IG_GRAPH_VERSION.

on:
  schedule:
    # every 10 minutes at off-peak minutes: GitHub often drops scheduled runs set for :00 and :30, and a run with
    # nothing due finishes quickly. UTC; 5:00 a.m.-10:50 p.m. CST (an hour later in daylight time).
    - cron: "4,14,24,34,44,54 11-23,0-4 * * *"
  workflow_dispatch:
    inputs:
      take_down:
        description: "Take down instead of publishing: the post's file name in social/posts/, without .yaml"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.SOCIAL_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements-social.txt -r requirements-reel.txt
      # Motion Reels (src/social/reel.py): headless Chromium for frame capture, Kokoro voice model (hash-checked)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements-reel.txt') }}
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vtr-kokoro
          key: kokoro-v1.0-7d5df8ec
      - run: python src/social/reel.py --download-model
      - run: python src/social/publish.py --take-down "$TAKE_DOWN"
        if: inputs.take_down != ''
        env:
          TAKE_DOWN: ${{ inputs.take_down }}  # through env, never pasted into the script
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_DELETE_TOKEN: ${{ secrets.IG_DELETE_TOKEN }}  # deletes only (see src/social/publish.py)
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      - run: python src/social/publish.py --write
        if: inputs.take_down == ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
